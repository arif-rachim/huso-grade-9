<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" role="img"><title>Antibody and antigen</title><desc>A Y-shaped antibody whose binding sites fit one specific antigen shape only.</desc><rect x="0" y="0" width="480" height="310" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><path d="M210 150 L170 72 M210 150 L250 72 M210 150 V230" stroke="#16a34a" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M210 150 L170 72 M210 150 L250 72 M210 150 V230" stroke="#bbe5c8" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M155 40 L185 40 L170 64Z" fill="#111827"/><path d="M235 40 L265 40 L250 64Z" fill="#111827"/><circle cx="385" cy="145" r="14" fill="#111827"/><rect x="390" y="80" width="26" height="26" fill="#6b7280"/><line x1="210" y1="270" x2="210" y2="235" stroke="#6b7280" stroke-width="1.5"/><circle cx="210" cy="235" r="2.5" fill="#111827"/><g data-label="antibody"><text x="210" y="285" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">antibody (Y-shaped protein)</text></g><line x1="114" y1="96" x2="160" y2="85" stroke="#6b7280" stroke-width="1.5"/><circle cx="160" cy="85" r="2.5" fill="#111827"/><g data-label="binding site"><text x="110" y="100" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="end" font-weight="bold">binding site</text></g><line x1="340" y1="34" x2="268" y2="46" stroke="#6b7280" stroke-width="1.5"/><circle cx="268" cy="46" r="2.5" fill="#111827"/><g data-label="antigen"><text x="340" y="30" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">antigen</text></g><text x="385" y="190" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="385" dy="0">other antigens:</tspan><tspan x="385" dy="16">no fit, no binding</tspan></text></svg>
