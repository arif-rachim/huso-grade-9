<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img"><title>Bacteria shapes</title><desc>Cocci, bacilli and spirilla.</desc><rect x="0" y="0" width="520" height="200" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><circle cx="80" cy="80" r="24" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><circle cx="130" cy="80" r="24" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><text x="105" y="135" font-family="sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">Cocci</text><text x="105" y="153" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">spheres</text><rect x="215" y="62" width="85" height="36" rx="18" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><text x="257" y="135" font-family="sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">Bacilli</text><text x="257" y="153" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">rods</text><path d="M370 85 q15 -30 30 0 t30 0 t30 0" fill="none" stroke="#16a34a" stroke-width="14" stroke-linecap="round"/><path d="M370 85 q15 -30 30 0 t30 0 t30 0" fill="none" stroke="#bbe5c8" stroke-width="8" stroke-linecap="round"/><text x="415" y="135" font-family="sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">Spirilla</text><text x="415" y="153" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">spirals</text><text x="260" y="20" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Three common bacterial shapes</text><text x="260" y="185" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">All are prokaryotes: no nucleus, no membrane-bound organelles</text></svg>
