<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 276" role="img"><title>Biomolecules</title><desc>Four classes of biomolecules, their building blocks and jobs.</desc><rect x="0" y="0" width="530" height="276" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="10" y="10" width="510" height="30" fill="#16a34a"/><text x="18" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Class</text><text x="138" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Building block</text><text x="278" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Elements</text><text x="388" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Job</text><rect x="10" y="40" width="510" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Carbohydrates</text><text x="138" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="138" dy="0">simple sugars</tspan><tspan x="138" dy="17">(e.g. glucose)</tspan></text><text x="278" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">C, H, O</text><text x="388" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="388" dy="0">quick energy;</tspan><tspan x="388" dy="17">starch, cellulose</tspan></text><rect x="10" y="90" width="510" height="50" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Lipids</text><text x="138" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="138" dy="0">glycerol +</tspan><tspan x="138" dy="17">fatty acids</tspan></text><text x="278" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">C, H, O</text><text x="388" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="388" dy="0">energy store,</tspan><tspan x="388" dy="17">membranes</tspan></text><rect x="10" y="140" width="510" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Proteins</text><text x="138" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">amino acids</text><text x="278" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">C, H, O, N</text><text x="388" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="388" dy="0">enzymes,</tspan><tspan x="388" dy="17">structure</tspan></text><rect x="10" y="190" width="510" height="50" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Nucleic acids</text><text x="138" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">nucleotides</text><text x="278" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">C, H, O, N, P</text><text x="388" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="388" dy="0">store and carry</tspan><tspan x="388" dy="17">genetic code</tspan></text><text x="10" y="260" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Carbon forms 4 bonds, so it can build long chains and rings.</text></svg>
