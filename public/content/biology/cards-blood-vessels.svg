<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 226" role="img"><title>Blood vessels</title><desc>Arteries, veins and capillaries.</desc><rect x="0" y="0" width="530" height="226" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="10" y="10" width="510" height="30" fill="#16a34a"/><text x="18" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Vessel</text><text x="108" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Carries blood</text><text x="238" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Wall</text><text x="368" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Extra</text><rect x="10" y="40" width="510" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Artery</text><text x="108" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="108" dy="0">away from the</tspan><tspan x="108" dy="17">heart</tspan></text><text x="238" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="238" dy="0">thick, muscular,</tspan><tspan x="238" dy="17">elastic</tspan></text><text x="368" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="368" dy="0">high pressure; narrow</tspan><tspan x="368" dy="17">lumen; pulse</tspan></text><rect x="10" y="90" width="510" height="50" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Vein</text><text x="108" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">to the heart</text><text x="238" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">thin</text><text x="368" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="368" dy="0">valves stop</tspan><tspan x="368" dy="17">backflow</tspan></text><rect x="10" y="140" width="510" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Capillary</text><text x="108" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="108" dy="0">between artery</tspan><tspan x="108" dy="17">and vein</tspan></text><text x="238" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">one cell thick</text><text x="368" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="368" dy="0">exchange of gases,</tspan><tspan x="368" dy="17">food, wastes</tspan></text><text x="10" y="210" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Exception: pulmonary artery = oxygen-poor, pulmonary vein = oxygen-rich.</text></svg>
