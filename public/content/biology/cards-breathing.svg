<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 270" role="img"><title>Breathing mechanism</title><desc>Inhalation and exhalation: ribs, diaphragm, chest volume and pressure.</desc><rect x="0" y="0" width="570" height="270" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="40" y="40" width="190" height="130" rx="20" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><ellipse cx="135" cy="100" rx="62" ry="48" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><path d="M40 172 Q135 182 230 172" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round"/><line x1="35" y1="100" x2="15" y2="100" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/><line x1="235" y1="100" x2="255" y2="100" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/><line x1="135" y1="28" x2="135" y2="50" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/><text x="135" y="205" font-family="sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">Breathing in</text><text x="135" y="224" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle"><tspan x="135" dy="0">ribs up and out</tspan><tspan x="135" dy="16">diaphragm contracts (flattens)</tspan></text><text x="135" y="258" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">chest volume ↑ · pressure ↓ → air rushes in</text><rect x="320" y="40" width="190" height="130" rx="20" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><ellipse cx="415" cy="106" rx="50" ry="38" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><path d="M320 172 Q415 140 510 172" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round"/><line x1="295" y1="100" x2="315" y2="100" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/><line x1="535" y1="100" x2="515" y2="100" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/><line x1="415" y1="50" x2="415" y2="22" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/><text x="415" y="205" font-family="sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">Breathing out</text><text x="415" y="224" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle"><tspan x="415" dy="0">ribs down and in</tspan><tspan x="415" dy="16">diaphragm relaxes (dome)</tspan></text><text x="415" y="258" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">chest volume ↓ · pressure ↑ → air pushed out</text></svg>
