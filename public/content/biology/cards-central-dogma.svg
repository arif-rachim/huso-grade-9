<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 225" role="img"><title>Central dogma</title><desc>DNA is transcribed to RNA and RNA is translated to protein; DNA is copied by replication.</desc><rect x="0" y="0" width="640" height="225" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="20" y="70" width="160" height="80" rx="8" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="3"/><text x="100" y="100" font-family="sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="bold">DNA</text><text x="100" y="124" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle"><tspan x="100" dy="0">stores the code</tspan><tspan x="100" dy="16">(in the nucleus)</tspan></text><rect x="240" y="70" width="160" height="80" rx="8" fill="#16a34a" fill-opacity="0.35" stroke="#16a34a" stroke-width="3"/><text x="320" y="100" font-family="sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="bold">RNA</text><text x="320" y="124" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle"><tspan x="320" dy="0">mRNA: a working copy</tspan><tspan x="320" dy="16">of one gene</tspan></text><rect x="460" y="70" width="160" height="80" rx="8" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="3"/><text x="540" y="100" font-family="sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="bold">Protein</text><text x="540" y="124" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle"><tspan x="540" dy="0">does the jobs</tspan><tspan x="540" dy="16">(made at a ribosome)</tspan></text><line x1="182" y1="110" x2="238" y2="110" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/><line x1="402" y1="110" x2="458" y2="110" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/><text x="210" y="62" font-family="sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">transcription</text><text x="430" y="62" font-family="sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">translation</text><path d="M60 70 C60 20 140 20 140 70" fill="none" stroke="#111827" stroke-width="2.5" marker-end="url(#ar)"/><text x="100" y="18" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">replication</text><text x="310" y="190" font-family="sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold">DNA → RNA → protein</text><text x="310" y="212" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Information flows one way: from DNA to RNA to protein</text></svg>
