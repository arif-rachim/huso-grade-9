<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 266" role="img"><title>Connective tissues</title><desc>Bone, cartilage, blood, ligament and tendon.</desc><rect x="0" y="0" width="520" height="266" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="10" y="10" width="500" height="30" fill="#16a34a"/><text x="18" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Tissue</text><text x="118" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">What it is like</text><text x="288" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Where / job</text><rect x="10" y="40" width="500" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Bone</text><text x="118" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">hard, with calcium</text><text x="288" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="288" dy="0">skeleton: support,</tspan><tspan x="288" dy="17">protect organs</tspan></text><rect x="10" y="90" width="500" height="50" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Cartilage</text><text x="118" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">firm but flexible</text><text x="288" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="288" dy="0">ear, nose, ends of bones:</tspan><tspan x="288" dy="17">cushion and shape</tspan></text><rect x="10" y="140" width="500" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Blood</text><text x="118" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">liquid tissue</text><text x="288" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="288" dy="0">transports gases, food,</tspan><tspan x="288" dy="17">wastes; defends</tspan></text><rect x="10" y="190" width="500" height="33" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Ligament</text><text x="118" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">tough, elastic cords</text><text x="288" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">joins bone to bone</text><rect x="10" y="223" width="500" height="33" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="244" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Tendon</text><text x="118" y="244" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">tough, not stretchy</text><text x="288" y="244" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">joins muscle to bone</text></svg>
