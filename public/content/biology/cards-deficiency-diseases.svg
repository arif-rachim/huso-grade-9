<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 281" role="img"><title>Deficiency diseases</title><desc>Missing nutrient and the disease it causes.</desc><rect x="0" y="0" width="520" height="281" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="10" y="10" width="500" height="30" fill="#16a34a"/><text x="18" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Missing</text><text x="128" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Disease</text><text x="268" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Sign</text><rect x="10" y="40" width="500" height="33" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Vitamin A</text><text x="128" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">night blindness</text><text x="268" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">poor sight in dim light</text><rect x="10" y="73" width="500" height="33" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="94" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Vitamin C</text><text x="128" y="94" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">scurvy</text><text x="268" y="94" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">bleeding gums, slow healing</text><rect x="10" y="106" width="500" height="33" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="127" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Vitamin D</text><text x="128" y="127" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">rickets</text><text x="268" y="127" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">soft, bent bones</text><rect x="10" y="139" width="500" height="33" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="160" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Vitamin B1</text><text x="128" y="160" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">beriberi</text><text x="268" y="160" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">weak muscles, nerve damage</text><rect x="10" y="172" width="500" height="33" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="193" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Iron</text><text x="128" y="193" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">anemia</text><text x="268" y="193" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">tired, pale (few red cells)</text><rect x="10" y="205" width="500" height="33" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="226" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Iodine</text><text x="128" y="226" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">goiter</text><text x="268" y="226" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">swollen thyroid in the neck</text><rect x="10" y="238" width="500" height="33" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="259" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Protein</text><text x="128" y="259" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">kwashiorkor</text><text x="268" y="259" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">swollen belly, thin limbs</text></svg>
