<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" role="img"><title>Digestive glands</title><desc>Gland, secretion and what it does.</desc><rect x="0" y="0" width="540" height="300" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="10" y="10" width="520" height="30" fill="#16a34a"/><text x="18" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Gland</text><text x="148" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Secretion</text><text x="338" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Action</text><rect x="10" y="40" width="520" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Salivary glands</text><text x="148" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">saliva (amylase)</text><text x="338" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="338" dy="0">starts breaking starch</tspan><tspan x="338" dy="17">down to sugar</tspan></text><rect x="10" y="90" width="520" height="50" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold"><tspan x="18" dy="0">Gastric glands</tspan><tspan x="18" dy="17">(stomach wall)</tspan></text><text x="148" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">HCl + pepsin</text><text x="338" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="338" dy="0">acid kills germs;</tspan><tspan x="338" dy="17">pepsin digests protein</tspan></text><rect x="10" y="140" width="520" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Liver</text><text x="148" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="148" dy="0">bile</tspan><tspan x="148" dy="17">(stored in gall bladder)</tspan></text><text x="338" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="338" dy="0">emulsifies fat</tspan><tspan x="338" dy="17">(not an enzyme)</tspan></text><rect x="10" y="190" width="520" height="50" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Pancreas</text><text x="148" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="148" dy="0">pancreatic juice</tspan><tspan x="148" dy="17">(amylase, trypsin, lipase)</tspan></text><text x="338" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="338" dy="0">digests starch, protein</tspan><tspan x="338" dy="17">and fat</tspan></text><rect x="10" y="240" width="520" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="261" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Intestinal wall</text><text x="148" y="261" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">intestinal juice</text><text x="338" y="261" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="338" dy="0">finishes digestion;</tspan><tspan x="338" dy="17">absorbs food</tspan></text></svg>
