<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img"><title>DNA structure</title><desc>Ladder model of DNA: two sugar-phosphate backbones joined by base pairs A-T and G-C held by hydrogen bonds.</desc><rect x="0" y="0" width="520" height="340" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><path d="M150 20 V320 M290 20 V320" stroke="#16a34a" stroke-width="9"/><rect x="150" y="38" width="36" height="24" rx="4" fill="#16a34a" fill-opacity="0.45"/><rect x="254" y="38" width="36" height="24" rx="4" fill="#16a34a" fill-opacity="0.2"/><text x="168" y="55" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">A</text><text x="272" y="55" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">T</text><path d="M190 50 H250" stroke="#111827" stroke-width="2" stroke-dasharray="4 4"/><rect x="150" y="93" width="36" height="24" rx="4" fill="#16a34a" fill-opacity="0.45"/><rect x="254" y="93" width="36" height="24" rx="4" fill="#16a34a" fill-opacity="0.2"/><text x="168" y="110" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">G</text><text x="272" y="110" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">C</text><path d="M190 100 H250 M190 105 H250 M190 110 H250" stroke="#111827" stroke-width="2" stroke-dasharray="4 4"/><rect x="150" y="148" width="36" height="24" rx="4" fill="#16a34a" fill-opacity="0.45"/><rect x="254" y="148" width="36" height="24" rx="4" fill="#16a34a" fill-opacity="0.2"/><text x="168" y="165" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">T</text><text x="272" y="165" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">A</text><path d="M190 160 H250" stroke="#111827" stroke-width="2" stroke-dasharray="4 4"/><rect x="150" y="203" width="36" height="24" rx="4" fill="#16a34a" fill-opacity="0.45"/><rect x="254" y="203" width="36" height="24" rx="4" fill="#16a34a" fill-opacity="0.2"/><text x="168" y="220" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">C</text><text x="272" y="220" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">G</text><path d="M190 210 H250 M190 215 H250 M190 220 H250" stroke="#111827" stroke-width="2" stroke-dasharray="4 4"/><rect x="150" y="258" width="36" height="24" rx="4" fill="#16a34a" fill-opacity="0.45"/><rect x="254" y="258" width="36" height="24" rx="4" fill="#16a34a" fill-opacity="0.2"/><text x="168" y="275" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">A</text><text x="272" y="275" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">T</text><path d="M190 270 H250" stroke="#111827" stroke-width="2" stroke-dasharray="4 4"/><rect x="136" y="24" width="168" height="52" rx="8" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="129" y1="156" x2="146" y2="160" stroke="#6b7280" stroke-width="1.5"/><circle cx="146" cy="160" r="2.5" fill="#111827"/><g data-label="sugar-phosphate backbone"><text x="125" y="160" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="end" font-weight="bold"><tspan x="125" dy="0">sugar-phosphate</tspan><tspan x="125" dy="17">backbone</tspan></text></g><line x1="326" y1="101" x2="220" y2="105" stroke="#6b7280" stroke-width="1.5"/><circle cx="220" cy="105" r="2.5" fill="#111827"/><g data-label="base pair"><text x="330" y="105" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">base pair</text></g><line x1="326" y1="211" x2="220" y2="215" stroke="#6b7280" stroke-width="1.5"/><circle cx="220" cy="215" r="2.5" fill="#111827"/><g data-label="hydrogen bonds"><text x="330" y="215" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">hydrogen bonds</text></g><line x1="326" y1="24" x2="304" y2="40" stroke="#6b7280" stroke-width="1.5"/><circle cx="304" cy="40" r="2.5" fill="#111827"/><g data-label="nucleotide"><text x="330" y="28" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">nucleotide</text></g><text x="330" y="250" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="330" dy="0">A pairs with T (2 bonds)</tspan><tspan x="330" dy="16">G pairs with C (3 bonds)</tspan></text></svg>
