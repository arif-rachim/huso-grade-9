<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 335" role="img"><title>Double circulation</title><desc>Blood passes through the heart twice per round trip: right heart to lungs and back, left heart to body and back.</desc><rect x="0" y="0" width="540" height="335" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="210" y="20" width="140" height="50" rx="8" fill="#16a34a" fill-opacity="0.35" stroke="#16a34a" stroke-width="3"/><text x="280" y="50" font-family="sans-serif" font-size="16" fill="#111827" text-anchor="middle" font-weight="bold">LUNGS</text><rect x="210" y="270" width="140" height="50" rx="8" fill="#d1d5db" stroke="#111827" stroke-width="3"/><text x="280" y="300" font-family="sans-serif" font-size="16" fill="#111827" text-anchor="middle" font-weight="bold">BODY</text><rect x="200" y="125" width="80" height="90" rx="10" fill="#d1d5db" stroke="#111827" stroke-width="2"/><rect x="280" y="125" width="80" height="90" rx="10" fill="#16a34a" fill-opacity="0.4" stroke="#111827" stroke-width="2"/><text x="240" y="165" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold"><tspan x="240" dy="0">right</tspan><tspan x="240" dy="17">heart</tspan></text><text x="320" y="165" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold"><tspan x="320" dy="0">left</tspan><tspan x="320" dy="17">heart</tspan></text><line x1="230" y1="125" x2="230" y2="74" stroke="#111827" stroke-width="3" marker-end="url(#ar)"/><line x1="330" y1="74" x2="330" y2="123" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/><line x1="330" y1="217" x2="330" y2="268" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/><line x1="230" y1="268" x2="230" y2="219" stroke="#111827" stroke-width="3" marker-end="url(#ar)"/><text x="215" y="100" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="end" font-weight="bold"><tspan x="215" dy="0">pulmonary</tspan><tspan x="215" dy="16">artery</tspan></text><text x="345" y="100" font-family="sans-serif" font-size="12" fill="#16a34a" text-anchor="start" font-weight="bold"><tspan x="345" dy="0">pulmonary</tspan><tspan x="345" dy="16">veins</tspan></text><text x="345" y="245" font-family="sans-serif" font-size="12" fill="#16a34a" text-anchor="start" font-weight="bold">aorta</text><text x="215" y="245" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="end" font-weight="bold">vena cava</text><text x="20" y="95" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="20" dy="0">Pulmonary circuit:</tspan><tspan x="20" dy="16">heart → lungs → heart</tspan><tspan x="20" dy="16">(picks up O₂)</tspan></text><text x="400" y="205" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="400" dy="0">Systemic circuit:</tspan><tspan x="400" dy="16">heart → body → heart</tspan><tspan x="400" dy="16">(delivers O₂)</tspan></text><rect x="20" y="20" width="14" height="14" fill="#d1d5db" stroke="#111827"/><text x="40" y="32" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">oxygen-poor</text><rect x="20" y="40" width="14" height="14" fill="#16a34a" fill-opacity="0.4" stroke="#111827"/><text x="40" y="52" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">oxygen-rich</text></svg>
