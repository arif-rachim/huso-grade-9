<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 233" role="img"><title>Endocrine glands</title><desc>Gland, location, hormone and function.</desc><rect x="0" y="0" width="520" height="233" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="10" y="10" width="500" height="30" fill="#16a34a"/><text x="18" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Gland</text><text x="108" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Location</text><text x="238" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Hormone</text><text x="368" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Main job</text><rect x="10" y="40" width="500" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Pituitary</text><text x="108" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">base of the brain</text><text x="238" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="238" dy="0">growth hormone,</tspan><tspan x="238" dy="17">others</tspan></text><text x="368" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="368" dy="0">'master gland';</tspan><tspan x="368" dy="17">controls other glands</tspan></text><rect x="10" y="90" width="500" height="33" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Thyroid</text><text x="108" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">front of the neck</text><text x="238" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">thyroxine</text><text x="368" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">sets metabolic rate</text><rect x="10" y="123" width="500" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="144" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Adrenal</text><text x="108" y="144" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="108" dy="0">on top of each</tspan><tspan x="108" dy="17">kidney</tspan></text><text x="238" y="144" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">adrenaline</text><text x="368" y="144" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="368" dy="0">'fight or flight':</tspan><tspan x="368" dy="17">faster heart rate</tspan></text><rect x="10" y="173" width="500" height="50" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="194" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Pancreas</text><text x="108" y="194" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="108" dy="0">behind the</tspan><tspan x="108" dy="17">stomach</tspan></text><text x="238" y="194" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="238" dy="0">insulin,</tspan><tspan x="238" dy="17">glucagon</tspan></text><text x="368" y="194" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="368" dy="0">control blood</tspan><tspan x="368" dy="17">sugar level</tspan></text></svg>
