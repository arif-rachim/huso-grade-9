<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 300" role="img"><title>Five kingdoms</title><desc>The five kingdoms with cell type, nutrition and an example.</desc><rect x="0" y="0" width="550" height="300" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="10" y="10" width="530" height="30" fill="#16a34a"/><text x="18" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Kingdom</text><text x="118" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Cells</text><text x="278" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Food</text><text x="438" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Example</text><rect x="10" y="40" width="530" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Monera</text><text x="118" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="118" dy="0">prokaryote</tspan><tspan x="118" dy="17">unicellular</tspan></text><text x="278" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="278" dy="0">varied (many</tspan><tspan x="278" dy="17">absorb or make)</tspan></text><text x="438" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">bacteria</text><rect x="10" y="90" width="530" height="50" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Protista</text><text x="118" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="118" dy="0">eukaryote</tspan><tspan x="118" dy="17">usually unicellular</tspan></text><text x="278" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">varied</text><text x="438" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">Amoeba</text><rect x="10" y="140" width="530" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Fungi</text><text x="118" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="118" dy="0">eukaryote; cell</tspan><tspan x="118" dy="17">wall of chitin</tspan></text><text x="278" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="278" dy="0">absorb from</tspan><tspan x="278" dy="17">dead matter</tspan></text><text x="438" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">bread mould</text><rect x="10" y="190" width="530" height="50" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Plantae</text><text x="118" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="118" dy="0">eukaryote; cell</tspan><tspan x="118" dy="17">wall of cellulose</tspan></text><text x="278" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="278" dy="0">make their own</tspan><tspan x="278" dy="17">(photosynthesis)</tspan></text><text x="438" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">mango tree</text><rect x="10" y="240" width="530" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="261" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Animalia</text><text x="118" y="261" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="118" dy="0">eukaryote;</tspan><tspan x="118" dy="17">no cell wall</tspan></text><text x="278" y="261" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="278" dy="0">eat other</tspan><tspan x="278" dy="17">organisms</tspan></text><text x="438" y="261" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">fish, insect</text></svg>
