<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 182" role="img"><title>Food tests</title><desc>Reagent and positive result for each food class.</desc><rect x="0" y="0" width="590" height="182" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="10" y="10" width="570" height="30" fill="#16a34a"/><text x="18" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Food class</text><text x="148" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Test</text><text x="338" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Positive result</text><rect x="10" y="40" width="570" height="33" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Starch</text><text x="148" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">iodine solution</text><text x="338" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">yellow-brown → blue-black</text><rect x="10" y="73" width="570" height="33" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="94" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Reducing sugar</text><text x="148" y="94" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">Benedict's, heat</text><text x="338" y="94" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">blue → green/orange/brick red</text><rect x="10" y="106" width="570" height="33" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="127" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Protein</text><text x="148" y="127" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">biuret (NaOH + CuSO₄)</text><text x="338" y="127" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">blue → violet/purple</text><rect x="10" y="139" width="570" height="33" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="160" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Fat (lipid)</text><text x="148" y="160" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">rub on paper</text><text x="338" y="160" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">translucent grease spot</text></svg>
