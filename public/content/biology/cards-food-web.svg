<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img"><title>Food web</title><desc>Grass feeds grasshopper, mouse and rabbit; frog, snake and hawk are higher consumers. Arrows point to the eater.</desc><rect x="0" y="0" width="560" height="400" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><line x1="240.4" y1="301.3" x2="139.6" y2="253.7" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><line x1="280.0" y1="299.0" x2="280.0" y2="256.0" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><line x1="319.6" y1="301.3" x2="420.4" y2="253.7" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><line x1="100.0" y1="214.0" x2="100.0" y2="166.0" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><line x1="280.0" y1="214.0" x2="280.0" y2="166.0" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><line x1="156.0" y1="145.0" x2="224.0" y2="145.0" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><line x1="299.8" y1="125.2" x2="350.2" y2="74.8" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><line x1="449.7" y1="214.4" x2="380.3" y2="75.6" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><rect x="228.0" y="303.0" width="104" height="34" rx="8" fill="#16a34a" fill-opacity="1" stroke="#16a34a" stroke-width="2"/><text x="280" y="325" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">grass</text><rect x="48.0" y="218.0" width="104" height="34" rx="8" fill="#ffffff" fill-opacity="1" stroke="#16a34a" stroke-width="2"/><text x="100" y="240" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">grasshopper</text><rect x="228.0" y="218.0" width="104" height="34" rx="8" fill="#ffffff" fill-opacity="1" stroke="#16a34a" stroke-width="2"/><text x="280" y="240" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">mouse</text><rect x="408.0" y="218.0" width="104" height="34" rx="8" fill="#ffffff" fill-opacity="1" stroke="#16a34a" stroke-width="2"/><text x="460" y="240" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">rabbit</text><rect x="48.0" y="128.0" width="104" height="34" rx="8" fill="#ffffff" fill-opacity="1" stroke="#16a34a" stroke-width="2"/><text x="100" y="150" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">frog</text><rect x="228.0" y="128.0" width="104" height="34" rx="8" fill="#ffffff" fill-opacity="1" stroke="#16a34a" stroke-width="2"/><text x="280" y="150" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">snake</text><rect x="318.0" y="38.0" width="104" height="34" rx="8" fill="#ffffff" fill-opacity="1" stroke="#16a34a" stroke-width="2"/><text x="370" y="60" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">hawk</text><rect x="40" y="358" width="480" height="30" rx="8" fill="#d1d5db" stroke="#6b7280" stroke-width="1.5"/><text x="280" y="378" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle">decomposers (fungi, bacteria) break down dead organisms</text><text x="500" y="100" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="500" dy="0">Arrows point to</tspan><tspan x="500" dy="16">the eater:</tspan><tspan x="500" dy="16">energy flows</tspan><tspan x="500" dy="16">in that direction</tspan></text><text x="70" y="330" font-family="sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">producer: grass</text></svg>
