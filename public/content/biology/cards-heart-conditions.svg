<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 226" role="img"><title>Heart conditions</title><desc>Palpitations, cardiac arrest and hypertension.</desc><rect x="0" y="0" width="460" height="226" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="10" y="10" width="440" height="30" fill="#16a34a"/><text x="18" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Condition</text><text x="138" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">What happens</text><rect x="10" y="40" width="440" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Palpitations</text><text x="138" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="138" dy="0">you feel a fast, pounding or</tspan><tspan x="138" dy="17">irregular heartbeat; often harmless</tspan></text><rect x="10" y="90" width="440" height="50" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Cardiac arrest</text><text x="138" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="138" dy="0">the heart suddenly stops pumping;</tspan><tspan x="138" dy="17">no blood reaches the brain; CPR + shock</tspan></text><rect x="10" y="140" width="440" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Hypertension</text><text x="138" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="138" dy="0">blood pressure stays too high</tspan><tspan x="138" dy="17">(normal is about 120/80 mmHg)</tspan></text><text x="10" y="210" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">A heart attack is different: a blocked coronary artery.</text></svg>
