<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 335" role="img"><title>Human heart</title><desc>Schematic front view of the heart: four chambers, two valves, septum and the great vessels. Grey is oxygen-poor, green is oxygen-rich.</desc><rect x="0" y="0" width="520" height="335" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="205" y="50" width="30" height="62" fill="#d1d5db" stroke="#111827" stroke-width="1.5"/><rect x="340" y="62" width="22" height="50" fill="#16a34a" fill-opacity="0.4" stroke="#111827" stroke-width="1.5"/><rect x="258" y="62" width="22" height="140" fill="#d1d5db" stroke="#111827" stroke-width="1.5"/><path d="M294 202 V72 Q294 50 322 50" fill="none" stroke="#111827" stroke-width="22" stroke-linecap="butt"/><path d="M294 202 V72 Q294 50 322 50" fill="none" stroke="#bbe5c8" stroke-width="19"/><rect x="190" y="112" width="65" height="83" rx="12" fill="#d1d5db" stroke="#111827" stroke-width="1.5"/><rect x="305" y="112" width="65" height="83" rx="12" fill="#16a34a" fill-opacity="0.4" stroke="#111827" stroke-width="1.5"/><rect x="190" y="200" width="88" height="100" rx="14" fill="#d1d5db" stroke="#111827" stroke-width="1.5"/><rect x="282" y="200" width="88" height="100" rx="14" fill="#16a34a" fill-opacity="0.4" stroke="#111827" stroke-width="1.5"/><rect x="277" y="200" width="6" height="100" fill="#111827"/><path d="M205 197 H250 M205 197 l8 -10 M250 197 l-8 -10" stroke="#111827" stroke-width="4"/><path d="M318 197 H360 M318 197 l8 -10 M360 197 l-8 -10" stroke="#111827" stroke-width="4"/><line x1="184" y1="66" x2="208" y2="80" stroke="#6b7280" stroke-width="1.5"/><circle cx="208" cy="80" r="2.5" fill="#111827"/><g data-label="vena cava"><text x="180" y="70" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="end" font-weight="bold">vena cava</text></g><line x1="184" y1="146" x2="200" y2="150" stroke="#6b7280" stroke-width="1.5"/><circle cx="200" cy="150" r="2.5" fill="#111827"/><g data-label="right atrium"><text x="180" y="150" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="end" font-weight="bold">right atrium</text></g><line x1="184" y1="201" x2="215" y2="197" stroke="#6b7280" stroke-width="1.5"/><circle cx="215" cy="197" r="2.5" fill="#111827"/><g data-label="tricuspid valve"><text x="180" y="205" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="end" font-weight="bold">tricuspid valve</text></g><line x1="184" y1="266" x2="200" y2="260" stroke="#6b7280" stroke-width="1.5"/><circle cx="200" cy="260" r="2.5" fill="#111827"/><g data-label="right ventricle"><text x="180" y="270" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="end" font-weight="bold">right ventricle</text></g><line x1="255" y1="32" x2="269" y2="66" stroke="#6b7280" stroke-width="1.5"/><circle cx="269" cy="66" r="2.5" fill="#111827"/><g data-label="pulmonary artery"><text x="255" y="28" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">pulmonary artery</text></g><line x1="396" y1="44" x2="332" y2="50" stroke="#6b7280" stroke-width="1.5"/><circle cx="332" cy="50" r="2.5" fill="#111827"/><g data-label="aorta"><text x="400" y="48" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">aorta</text></g><line x1="396" y1="86" x2="358" y2="90" stroke="#6b7280" stroke-width="1.5"/><circle cx="358" cy="90" r="2.5" fill="#111827"/><g data-label="pulmonary vein"><text x="400" y="90" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">pulmonary vein</text></g><line x1="396" y1="146" x2="366" y2="150" stroke="#6b7280" stroke-width="1.5"/><circle cx="366" cy="150" r="2.5" fill="#111827"/><g data-label="left atrium"><text x="400" y="150" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">left atrium</text></g><line x1="396" y1="201" x2="358" y2="197" stroke="#6b7280" stroke-width="1.5"/><circle cx="358" cy="197" r="2.5" fill="#111827"/><g data-label="bicuspid valve"><text x="400" y="205" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">bicuspid valve</text></g><line x1="396" y1="266" x2="366" y2="260" stroke="#6b7280" stroke-width="1.5"/><circle cx="366" cy="260" r="2.5" fill="#111827"/><g data-label="left ventricle"><text x="400" y="270" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">left ventricle</text></g><line x1="280" y1="307" x2="280" y2="298" stroke="#6b7280" stroke-width="1.5"/><circle cx="280" cy="298" r="2.5" fill="#111827"/><g data-label="septum"><text x="280" y="322" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">septum</text></g><rect x="20" y="20" width="14" height="14" fill="#d1d5db" stroke="#111827" stroke-width="1.5"/><text x="40" y="32" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">oxygen-poor</text><rect x="20" y="40" width="14" height="14" fill="#16a34a" fill-opacity="0.4" stroke="#111827" stroke-width="1.5"/><text x="40" y="52" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">oxygen-rich</text></svg>
