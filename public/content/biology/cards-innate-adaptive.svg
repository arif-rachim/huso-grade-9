<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 216" role="img"><title>Innate vs adaptive immunity</title><desc>Comparison of innate and adaptive immunity.</desc><rect x="0" y="0" width="510" height="216" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="10" y="10" width="490" height="30" fill="#16a34a"/><text x="18" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold"></text><text x="118" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Innate</text><text x="318" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Adaptive</text><rect x="10" y="40" width="490" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Speed</text><text x="118" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">immediate, fast</text><text x="318" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="318" dy="0">slower first time</tspan><tspan x="318" dy="17">(days)</tspan></text><rect x="10" y="90" width="490" height="33" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Target</text><text x="118" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">general: any germ</text><text x="318" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">specific to one antigen</text><rect x="10" y="123" width="490" height="33" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="144" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Memory</text><text x="118" y="144" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">none</text><text x="318" y="144" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">yes (memory cells)</text><rect x="10" y="156" width="490" height="50" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="177" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Examples</text><text x="118" y="177" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="118" dy="0">skin, mucus, stomach acid,</tspan><tspan x="118" dy="17">phagocytes</tspan></text><text x="318" y="177" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="318" dy="0">B cells (antibodies),</tspan><tspan x="318" dy="17">T cells</tspan></text></svg>
