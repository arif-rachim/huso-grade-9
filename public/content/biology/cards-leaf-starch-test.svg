<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 645 225" role="img"><title>Leaf starch test</title><desc>Five steps to test a leaf for starch with iodine.</desc><rect x="0" y="0" width="645" height="225" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="8" y="40" width="116" height="120" rx="8" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><text x="66" y="64" font-family="sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">1. Destarch</text><text x="66" y="90" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle"><tspan x="66" dy="0">keep the plant</tspan><tspan x="66" dy="16">in the dark</tspan><tspan x="66" dy="16">24-48 h</tspan></text><line x1="126" y1="100" x2="135" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><rect x="136" y="40" width="116" height="120" rx="8" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><text x="194" y="64" font-family="sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">2. Light</text><text x="194" y="90" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle"><tspan x="194" dy="0">expose the leaf</tspan><tspan x="194" dy="16">(part covered</tspan><tspan x="194" dy="16">with foil)</tspan></text><line x1="254" y1="100" x2="263" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><rect x="264" y="40" width="116" height="120" rx="8" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><text x="322" y="64" font-family="sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">3. Boil</text><text x="322" y="90" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle"><tspan x="322" dy="0">dip the leaf in</tspan><tspan x="322" dy="16">boiling water</tspan><tspan x="322" dy="16">(kills, softens)</tspan></text><line x1="382" y1="100" x2="391" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><rect x="392" y="40" width="116" height="120" rx="8" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><text x="450" y="64" font-family="sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">4. Ethanol</text><text x="450" y="90" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle"><tspan x="450" dy="0">warm in ethanol</tspan><tspan x="450" dy="16">in a water bath</tspan><tspan x="450" dy="16">(removes green)</tspan></text><line x1="510" y1="100" x2="519" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><rect x="520" y="40" width="116" height="120" rx="8" fill="#16a34a" fill-opacity="0.35" stroke="#16a34a" stroke-width="2"/><text x="578" y="64" font-family="sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">5. Iodine</text><text x="578" y="90" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle"><tspan x="578" dy="0">rinse, add iodine:</tspan><tspan x="578" dy="16">blue-black =</tspan><tspan x="578" dy="16">starch present</tspan></text><text x="320" y="22" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Testing a leaf for starch (evidence that photosynthesis happened)</text><text x="320" y="190" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle">Covered part (no light) stays brown: no photosynthesis, no starch.</text><text x="320" y="210" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Safety: ethanol is flammable, so heat it only in a hot-water bath.</text></svg>
