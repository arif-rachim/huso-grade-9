<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 295" role="img"><title>Limiting factors graph</title><desc>Rate of photosynthesis rises with light intensity then levels off; adding CO2 raises the plateau.</desc><rect x="0" y="0" width="540" height="295" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><path d="M60 20 V250 H440" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M60 250 V20" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><path d="M60 250 C120 160 170 108 230 102 H420" fill="none" stroke="#16a34a" stroke-width="3"/><path d="M60 250 C140 130 220 62 300 54 H420" fill="none" stroke="#111827" stroke-width="3" stroke-dasharray="7 4"/><text x="250" y="278" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">light intensity →</text><text x="20" y="150" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle" transform="rotate(-90 20 150)">rate of photosynthesis</text><text x="190" y="205" font-family="sans-serif" font-size="12" fill="#16a34a" text-anchor="start" font-weight="bold"><tspan x="190" dy="0">light is the</tspan><tspan x="190" dy="16">limiting factor</tspan></text><text x="300" y="130" font-family="sans-serif" font-size="12" fill="#16a34a" text-anchor="start" font-weight="bold"><tspan x="300" dy="0">plateau: more light does not help;</tspan><tspan x="300" dy="16">CO₂ or temperature limits</tspan></text><text x="300" y="40" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="bold">more CO₂ → higher plateau</text></svg>
