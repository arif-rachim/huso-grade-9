<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 305" role="img"><title>Meiosis</title><desc>One diploid cell divides twice to give four haploid cells.</desc><rect x="0" y="0" width="640" height="305" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><circle cx="95" cy="150" r="66" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><path d="M69.4 114 L82.6 136 M82.6 114 L69.4 136" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M87.4 114 L100.6 136 M100.6 114 L87.4 136" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M101.4 159 L114.6 181 M114.6 159 L101.4 181" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M119.4 159 L132.6 181 M132.6 159 L119.4 181" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round" fill="none"/><text x="95" y="245" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">Parent cell (2n)</text><text x="95" y="262" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">DNA already copied</text><circle cx="300" cy="80" r="46" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><path d="M278.4 69 L291.6 91 M291.6 69 L278.4 91" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M308.4 69 L321.6 91 M321.6 69 L308.4 91" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round" fill="none"/><circle cx="300" cy="220" r="46" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><path d="M278.4 209 L291.6 231 M291.6 209 L278.4 231" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M308.4 209 L321.6 231 M321.6 209 L308.4 231" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" fill="none"/><line x1="155" y1="120" x2="252" y2="90" stroke="#111827" stroke-width="2.5" marker-end="url(#ar)"/><line x1="155" y1="180" x2="252" y2="210" stroke="#111827" stroke-width="2.5" marker-end="url(#ar)"/><text x="205" y="125" font-family="sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">Meiosis I</text><text x="300" y="150" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="300" dy="0">homologous pairs</tspan><tspan x="300" dy="16">separate</tspan></text><text x="300" y="280" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">2 cells (n)</text><circle cx="520" cy="35" r="30" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><path d="M510 24 V46" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/><path d="M530 24 V46" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round"/><circle cx="520" cy="105" r="30" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><path d="M510 94 V116" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/><path d="M530 94 V116" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round"/><circle cx="520" cy="175" r="30" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><path d="M510 164 V186" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round"/><path d="M530 164 V186" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/><circle cx="520" cy="245" r="30" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><path d="M510 234 V256" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round"/><path d="M530 234 V256" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/><line x1="346" y1="70" x2="488" y2="35" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><line x1="346" y1="90" x2="488" y2="105" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><line x1="346" y1="210" x2="488" y2="175" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><line x1="346" y1="230" x2="488" y2="245" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><text x="420" y="150" font-family="sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">Meiosis II</text><text x="420" y="168" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="420" dy="0">sister chromatids</tspan><tspan x="420" dy="16">separate</tspan></text><text x="520" y="292" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">4 cells (n), all different</text><text x="300" y="18" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Meiosis: 1 cell becomes 4 cells with half the chromosomes (gametes)</text></svg>
