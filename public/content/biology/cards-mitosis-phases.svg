<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 275" role="img"><title>Phases of mitosis</title><desc>Interphase, prophase, metaphase, anaphase, telophase drawn as five cells.</desc><rect x="0" y="0" width="650" height="275" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><circle cx="65" cy="105" r="52" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><circle cx="65" cy="105" r="30" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><path d="M47 99 q8 -12 14 0 t14 0 M47 113 q8 -12 14 0 t14 0" stroke="#16a34a" stroke-width="2" fill="none"/><text x="65" y="192" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Interphase</text><text x="65" y="210" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">DNA is copied</text><line x1="121" y1="105" x2="134" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="190" cy="105" r="52" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><circle cx="190" cy="105" r="32" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M171.4 84 L184.6 106 M184.6 84 L171.4 106" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M193.4 80 L206.6 102 M206.6 80 L193.4 102" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M175.4 106 L188.6 128 M188.6 106 L175.4 128" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M197.4 104 L210.6 126 M210.6 104 L197.4 126" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" fill="none"/><text x="190" y="192" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Prophase</text><text x="190" y="210" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="190" dy="0">chromosomes</tspan><tspan x="190" dy="16">condense</tspan></text><line x1="246" y1="105" x2="259" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="315" cy="105" r="52" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><path d="M315 55 L285 105 M315 55 L345 105 M315 155 L285 105 M315 155 L345 105" stroke="#6b7280" stroke-width="1" fill="none"/><path d="M285.6 96 L296.4 114 M296.4 96 L285.6 114" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M301.6 96 L312.4 114 M312.4 96 L301.6 114" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M317.6 96 L328.4 114 M328.4 96 L317.6 114" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M333.6 96 L344.4 114 M344.4 96 L333.6 114" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round" fill="none"/><text x="315" y="192" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Metaphase</text><text x="315" y="210" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="315" dy="0">line up in</tspan><tspan x="315" dy="16">the middle</tspan></text><line x1="371" y1="105" x2="384" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="440" cy="105" r="52" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><path d="M440 55 V155" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/><path d="M410 88 L416 79 L422 88" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M410 122 L416 131 L422 122" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M426 88 L432 79 L438 88" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M426 122 L432 131 L438 122" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M442 88 L448 79 L454 88" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M442 122 L448 131 L454 122" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M458 88 L464 79 L470 88" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M458 122 L464 131 L470 122" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="440" y="192" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Anaphase</text><text x="440" y="210" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="440" dy="0">chromatids</tspan><tspan x="440" dy="16">pulled apart</tspan></text><line x1="496" y1="105" x2="509" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="565" cy="78" r="30" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><circle cx="565" cy="132" r="30" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><circle cx="565" cy="78" r="15" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><circle cx="565" cy="132" r="15" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="565" y="192" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Telophase</text><text x="565" y="210" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="565" dy="0">two nuclei form,</tspan><tspan x="565" dy="16">cell splits</tspan></text><text x="325" y="20" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Mitosis: 1 cell becomes 2 identical cells (same chromosome number)</text><text x="325" y="262" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Green and grey = chromosomes from the two parents</text></svg>
