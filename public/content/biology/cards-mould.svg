<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" role="img"><title>Bread mould</title><desc>Rhizopus bread mould: hyphae on food, rhizoids into it, sporangiophores carrying sporangia full of spores.</desc><rect x="0" y="0" width="500" height="300" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="20" y="205" width="440" height="70" rx="6" fill="#d1d5db" fill-opacity="0.6" stroke="#6b7280" stroke-width="1.5"/><text x="30" y="290" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">food (bread)</text><path d="M60 205 H430" stroke="#16a34a" stroke-width="5"/><path d="M100 205 V150" stroke="#16a34a" stroke-width="3"/><circle cx="100" cy="130" r="22" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><circle cx="92" cy="124" r="2.5" fill="#111827"/><circle cx="106" cy="122" r="2.5" fill="#111827"/><circle cx="100" cy="134" r="2.5" fill="#111827"/><circle cx="90" cy="138" r="2.5" fill="#111827"/><circle cx="109" cy="137" r="2.5" fill="#111827"/><path d="M210 205 V150" stroke="#16a34a" stroke-width="3"/><circle cx="210" cy="130" r="22" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><circle cx="202" cy="124" r="2.5" fill="#111827"/><circle cx="216" cy="122" r="2.5" fill="#111827"/><circle cx="210" cy="134" r="2.5" fill="#111827"/><circle cx="200" cy="138" r="2.5" fill="#111827"/><circle cx="219" cy="137" r="2.5" fill="#111827"/><path d="M330 205 V150" stroke="#16a34a" stroke-width="3"/><circle cx="330" cy="130" r="22" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><circle cx="322" cy="124" r="2.5" fill="#111827"/><circle cx="336" cy="122" r="2.5" fill="#111827"/><circle cx="330" cy="134" r="2.5" fill="#111827"/><