<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 255" role="img"><title>Photosynthesis and respiration</title><desc>Equations of photosynthesis and respiration side by side, each making the other's inputs.</desc><rect x="0" y="0" width="560" height="255" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="15" y="40" width="235" height="150" rx="8" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="3"/><rect x="310" y="40" width="235" height="150" rx="8" fill="#d1d5db" stroke="#111827" stroke-width="3"/><text x="132" y="66" font-family="sans-serif" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="bold">Photosynthesis</text><text x="427" y="66" font-family="sans-serif" font-size="16" fill="#111827" text-anchor="middle" font-weight="bold">Respiration</text><text x="132" y="100" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle"><tspan x="132" dy="0">6 CO₂ + 6 H₂O</tspan><tspan x="132" dy="18">+ light energy</tspan><tspan x="132" dy="18">→ C₆H₁₂O₆ + 6 O₂</tspan></text><text x="427" y="100" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle"><tspan x="427" dy="0">C₆H₁₂O₆ + 6 O₂</tspan><tspan x="427" dy="18">→ 6 CO₂ + 6 H₂O</tspan><tspan x="427" dy="18">+ energy (ATP)</tspan></text><text x="132" y="172" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">chloroplasts · light needed</text><text x="427" y="172" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">mitochondria · day and night</text><path d="M252 95 C275 80 290 80 308 95" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/><text x="280" y="58" font-family="sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold"><tspan x="280" dy="0">glucose</tspan><tspan x="280" dy="16">O₂</tspan></text><path d="M308 140 C290 160 275 160 254 140" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#ar)"/><text x="280" y="178" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold"><tspan x="280" dy="0">CO₂</tspan><tspan x="280" dy="16">H₂O</tspan></text><text x="280" y="20" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Each process makes what the other one uses</text><text x="280" y="220" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle">Photosynthesis stores energy in glucose.  Respiration releases it.</text><text x="280" y="242" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Plants do both; animals only respire.</text></svg>
