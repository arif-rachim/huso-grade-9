<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 283" role="img"><title>Prokaryote vs eukaryote</title><desc>Comparison of prokaryotic and eukaryotic cells.</desc><rect x="0" y="0" width="520" height="283" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="10" y="10" width="500" height="30" fill="#16a34a"/><text x="18" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Feature</text><text x="138" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Prokaryote</text><text x="328" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Eukaryote</text><rect x="10" y="40" width="500" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">DNA</text><text x="138" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="138" dy="0">free in cytoplasm</tspan><tspan x="138" dy="17">(nucleoid)</tspan></text><text x="328" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="328" dy="0">inside a nucleus</tspan><tspan x="328" dy="17">(with envelope)</tspan></text><rect x="10" y="90" width="500" height="50" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Organelles</text><text x="138" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="138" dy="0">no membrane-bound</tspan><tspan x="138" dy="17">organelles</tspan></text><text x="328" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="328" dy="0">mitochondria, ER,</tspan><tspan x="328" dy="17">Golgi, ...</tspan></text><rect x="10" y="140" width="500" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Size</text><text x="138" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="138" dy="0">small (about</tspan><tspan x="138" dy="17">1-10 µm)</tspan></text><text x="328" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="328" dy="0">larger (about</tspan><tspan x="328" dy="17">10-100 µm)</tspan></text><rect x="10" y="190" width="500" height="33" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Ribosomes</text><text x="138" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">yes (smaller)</text><text x="328" y="211" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">yes (larger)</text><rect x="10" y="223" width="500" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="244" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Examples</text><text x="138" y="244" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">bacteria</text><text x="328" y="244" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="328" dy="0">animals, plants,</tspan><tspan x="328" dy="17">fungi, protists</tspan></text></svg>
