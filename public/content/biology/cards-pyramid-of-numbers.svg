<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img"><title>Pyramid of numbers</title><desc>A pyramid of numbers for a grassland: 10 000 grass plants, 1000 grasshoppers, 100 frogs, 10 snakes.</desc><rect x="0" y="0" width="620" height="320" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><polygon points="215,30 215,30 276.25,88 153.75,88" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><text x="215" y="76" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">snakes: 10</text><text x="440" y="68" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">tertiary consumers</text><polygon points="153.75,92 276.25,92 322.5,150 107.5,150" fill="#16a34a" fill-opacity="0.30" stroke="#16a34a" stroke-width="2"/><text x="215" y="130" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">frogs: 100</text><text x="440" y="130" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">secondary consumers</text><polygon points="107.5,154 322.5,154 368.75,212 61.25,212" fill="#16a34a" fill-opacity="0.45" stroke="#16a34a" stroke-width="2"/><text x="215" y="192" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">grasshoppers: 1000</text><text x="440" y="192" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">primary consumers</text><polygon points="61.25,216 368.75,216 415.0,274 15.0,274" fill="#16a34a" fill-opacity="0.60" stroke="#16a34a" stroke-width="2"/><text x="215" y="254" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">grass plants: 10 000</text><text x="440" y="254" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">producers</text><text x="300" y="295" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"></text><text x="310" y="290" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">Pyramid of numbers (example numbers): fewer organisms at each higher level</text><text x="310" y="308" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Exception: one big tree feeds thousands of insects, so that pyramid is upside down.</text></svg>
