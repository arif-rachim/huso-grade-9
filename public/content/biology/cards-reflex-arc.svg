<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img"><title>Reflex arc</title><desc>Reflex arc: receptor, sensory neuron, spinal cord, motor neuron, effector.</desc><rect x="0" y="0" width="560" height="340" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="10" y="60" width="90" height="40" rx="8" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><circle cx="55" cy="80" r="9" fill="#16a34a"/><ellipse cx="270" cy="150" rx="62" ry="48" fill="#d1d5db" stroke="#111827" stroke-width="2"/><path d="M270 110 V190 M230 150 H310" stroke="#ffffff" stroke-width="3"/><path d="M62 90 C120 110 160 150 205 150" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/><path d="M335 150 C390 160 420 210 460 235" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/><ellipse cx="480" cy="255" rx="42" ry="20" fill="#16a34a" fill-opacity="0.35" stroke="#16a34a" stroke-width="2"/><path d="M205 150 H335" stroke="#111827" stroke-width="3" stroke-dasharray="2 4"/><line x1="55" y1="34" x2="55" y2="72" stroke="#6b7280" stroke-width="1.5"/><circle cx="55" cy="72" r="2.5" fill="#111827"/><g data-label="receptor"><text x="55" y="30" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">receptor</text></g><line x1="96" y1="166" x2="135" y2="120" stroke="#6b7280" stroke-width="1.5"/><circle cx="135" cy="120" r="2.5" fill="#111827"/><g data-label="sensory neuron"><text x="100" y="170" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">sensory neuron</text></g><line x1="270" y1="230" x2="270" y2="195" stroke="#6b7280" stroke-width="1.5"/><circle cx="270" cy="195" r="2.5" fill="#111827"/><g data-label="spinal cord"><text x="270" y="245" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">spinal cord</text></g><line x1="396" y1="136" x2="395" y2="187" stroke="#6b7280" stroke-width="1.5"/><circle cx="395" cy="187" r="2.5" fill="#111827"/><g data-label="motor neuron"><text x="400" y="140" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">motor neuron</text></g><line x1="470" y1="290" x2="480" y2="275" stroke="#6b7280" stroke-width="1.5"/><circle cx="480" cy="275" r="2.5" fill="#111827"/><g data-label="effector"><text x="470" y="305" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">effector (muscle)</text></g><text x="10" y="125" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="10" dy="0">Stimulus:</tspan><tspan x="10" dy="16">hot pan</tspan></text><text x="330" y="255" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="end"><tspan x="330" dy="0">Response:</tspan><tspan x="330" dy="16">hand pulls away</tspan></text><text x="270" y="20" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Signals travel one way, through the spinal cord (not the brain first)</text></svg>
