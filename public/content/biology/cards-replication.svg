<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" role="img"><title>DNA replication</title><desc>The double helix is unzipped and each old strand is paired with a new strand: two identical DNA molecules.</desc><rect x="0" y="0" width="560" height="290" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><path d="M20 140 L170 140" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/><path d="M20 160 L170 160" stroke="#111827" stroke-width="5" stroke-linecap="round"/><line x1="35" y1="142" x2="35" y2="158" stroke="#6b7280" stroke-width="1.5"/><line x1="55" y1="142" x2="55" y2="158" stroke="#6b7280" stroke-width="1.5"/><line x1="75" y1="142" x2="75" y2="158" stroke="#6b7280" stroke-width="1.5"/><line x1="95" y1="142" x2="95" y2="158" stroke="#6b7280" stroke-width="1.5"/><line x1="115" y1="142" x2="115" y2="158" stroke="#6b7280" stroke-width="1.5"/><line x1="135" y1="142" x2="135" y2="158" stroke="#6b7280" stroke-width="1.5"/><line x1="155" y1="142" x2="155" y2="158" stroke="#6b7280" stroke-width="1.5"/><path d="M170 140 L260 80" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/><path d="M260 80 L520 80" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/><path d="M170 160 L260 220" stroke="#111827" stroke-width="5" stroke-linecap="round"/><path d="M260 220 L520 220" stroke="#111827" stroke-width="5" stroke-linecap="round"/><path d="M300 105 L520 105" stroke="#d1d5db" stroke-width="5" stroke-linecap="round"/><path d="M300 195 L520 195" stroke="#d1d5db" stroke-width="5" stroke-linecap="round"/><line x1="310" y1="84" x2="310" y2="101" stroke="#6b7280" stroke-width="1.5"/><line x1="310" y1="199" x2="310" y2="216" stroke="#6b7280" stroke-width="1.5"/><line x1="330" y1="84" x2="330" y2="101" stroke="#6b7280" stroke-width="1.5"/><line x1="330" y1="199" x2="330" y2="216" stroke="#6b7280" stroke-width="1.5"/><line x1="350" y1="84" x2="350" y2="101" stroke="#6b7280" stroke-width="1.5"/><line x1="350" y1="199" x2="350" y2="216" stroke="#6b7280" stroke-width="1.5"/><line x1="370" y1="84" x2="370" y2="101" stroke="#6b7280" stroke-width="1.5"/><line x1="370" y1="199" x2="370" y2="216" stroke="#6b7280" stroke-width="1.5"/><line x1="390" y1="84" x2="390" y2="101" stroke="#6b7280" stroke-width="1.5"/><line x1="390" y1="199" x2="390" y2="216" stroke="#6b7280" stroke-width="1.5"/><line x1="410" y1="84" x2="410" y2="101" stroke="#6b7280" stroke-width="1.5"/><line x1="410" y1="199" x2="410" y2="216" stroke="#6b7280" stroke-width="1.5"/><line x1="430" y1="84" x2="430" y2="101" stroke="#6b7280" stroke-width="1.5"/><line x1="430" y1="199" x2="430" y2="216" stroke="#6b7280" stroke-width="1.5"/><line x1="450" y1="84" x2="450" y2="101" stroke="#6b7280" stroke-width="1.5"/><line x1="450" y1="199" x2="450" y2="216" stroke="#6b7280" stroke-width="1.5"/><line x1="470" y1="84" x2="470" y2="101" stroke="#6b7280" stroke-width="1.5"/><line x1="470" y1="199" x2="470" y2="216" stroke="#6b7280" stroke-width="1.5"/><line x1="490" y1="84" x2="490" y2="101" stroke="#6b7280" stroke-width="1.5"/><line x1="490" y1="199" x2="490" y2="216" stroke="#6b7280" stroke-width="1.5"/><line x1="510" y1="84" x2="510" y2="101" stroke="#6b7280" stroke-width="1.5"/><line x1="510" y1="199" x2="510" y2="216" stroke="#6b7280" stroke-width="1.5"/><text x="100" y="120" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">parent DNA</text><text x="215" y="150" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="215" dy="0">helicase</tspan><tspan x="215" dy="16">unzips</tspan></text><text x="410" y="62" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">old strand + NEW strand</text><text x="410" y="245" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">old strand + NEW strand</text><text x="410" y="150" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="410" dy="0">DNA polymerase adds</tspan><tspan x="410" dy="16">matching bases (A-T, G-C)</tspan></text><rect x="20" y="268" width="14" height="6" fill="#16a34a"/><rect x="95" y="268" width="14" height="6" fill="#111827"/><rect x="170" y="268" width="14" height="6" fill="#d1d5db"/><text x="38" y="276" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">old</text><text x="113" y="276" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">old</text><text x="188" y="276" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">new</text><text x="280" y="258" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">Semi-conservative: each copy = 1 old + 1 new strand</text></svg>
