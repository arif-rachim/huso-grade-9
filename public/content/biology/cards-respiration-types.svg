<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 226" role="img"><title>Types of respiration</title><desc>Aerobic and anaerobic respiration compared.</desc><rect x="0" y="0" width="520" height="226" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="10" y="10" width="500" height="30" fill="#16a34a"/><text x="18" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Type</text><text x="128" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Equation in words</text><text x="358" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Energy</text><rect x="10" y="40" width="500" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold"><tspan x="18" dy="0">Aerobic</tspan><tspan x="18" dy="17">(needs O₂)</tspan></text><text x="128" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="128" dy="0">glucose + oxygen →</tspan><tspan x="128" dy="17">carbon dioxide + water</tspan></text><text x="358" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">lots (about 30 ATP)</text><rect x="10" y="90" width="500" height="50" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold"><tspan x="18" dy="0">Anaerobic</tspan><tspan x="18" dy="17">in yeast</tspan></text><text x="128" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start"><tspan x="128" dy="0">glucose → ethanol +</tspan><tspan x="128" dy="17">carbon dioxide</tspan></text><text x="358" y="111" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">little (2 ATP)</text><rect x="10" y="140" width="500" height="50" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold"><tspan x="18" dy="0">Anaerobic</tspan><tspan x="18" dy="17">in muscle</tspan></text><text x="128" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">glucose → lactic acid</text><text x="358" y="161" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">little (2 ATP)</text><text x="10" y="210" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Yeast fermentation makes bread rise (CO₂) and beer/wine (ethanol).</text></svg>
