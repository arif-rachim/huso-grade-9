<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 275" role="img"><title>RNA processing</title><desc>Pre-mRNA with exons and introns is capped, tailed and spliced into mature mRNA.</desc><rect x="0" y="0" width="600" height="275" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><text x="300" y="20" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">RNA processing (eukaryotes, in the nucleus)</text><rect x="60" y="55" width="70" height="28" fill="#16a34a" stroke="#111827" stroke-width="1"/><text x="95.0" y="74" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">exon</text><rect x="130" y="55" width="60" height="28" fill="#d1d5db" stroke="#111827" stroke-width="1"/><text x="160.0" y="74" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">intron</text><rect x="190" y="55" width="90" height="28" fill="#16a34a" stroke="#111827" stroke-width="1"/><text x="235.0" y="74" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">exon</text><rect x="280" y="55" width="50" height="28" fill="#d1d5db" stroke="#111827" stroke-width="1"/><text x="305.0" y="74" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">intron</text><rect x="330" y="55" width="70" height="28" fill="#16a34a" stroke="#111827" stroke-width="1"/><text x="365.0" y="74" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">exon</text><circle cx="52" cy="69" r="8" fill="#111827"/><text x="52" y="105" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">5′ cap</text><text x="445" y="74" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">AAAAA</text><text x="445" y="105" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">poly-A tail</text><text x="300" y="125" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">pre-mRNA (first copy of the gene)</text><line x1="300" y1="135" x2="300" y2="168" stroke="#111827" stroke-width="3" marker-end="url(#ar)"/><text x="320" y="156" font-family="sans-serif" font-size="12" fill="#16a34a" text-anchor="start" font-weight="bold">splicing: introns cut out</text><circle cx="122" cy="199" r="8" fill="#111827"/><rect x="130" y="185" width="70" height="28" fill="#16a34a" stroke="#111827" stroke-width="1"/><text x="165.0" y="204" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">exon</text><rect x="200" y="185" width="90" height="28" fill="#16a34a" stroke="#111827" stroke-width="1"/><text x="245.0" y="204" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">exon</text><rect x="290" y="185" width="70" height="28" fill="#16a34a" stroke="#111827" stroke-width="1"/><text x="325.0" y="204" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">exon</text><text x="405" y="204" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">AAAAA</text><text x="300" y="240" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">mature mRNA → leaves the nucleus → translation</text><text x="300" y="262" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">Exons are expressed; introns are removed</text></svg>
