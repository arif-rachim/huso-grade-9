<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 208" role="img"><title>Symbiosis, parasitism, predation</title><desc>Kinds of interactions between species.</desc><rect x="0" y="0" width="490" height="208" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><rect x="10" y="10" width="470" height="30" fill="#16a34a"/><text x="18" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Relationship</text><text x="148" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">A</text><text x="208" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">B</text><text x="268" y="30" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Example</text><rect x="10" y="40" width="470" height="33" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Mutualism</text><text x="148" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">+</text><text x="208" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">+</text><text x="268" y="61" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">bee and flower</text><rect x="10" y="73" width="470" height="33" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="94" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Commensalism</text><text x="148" y="94" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">+</text><text x="208" y="94" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">0</text><text x="268" y="94" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">barnacle on a whale</text><rect x="10" y="106" width="470" height="33" fill="#ffffff" stroke="#d1d5db"/><text x="18" y="127" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Parasitism</text><text x="148" y="127" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">+</text><text x="208" y="127" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">−</text><text x="268" y="127" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">tapeworm in a human</text><rect x="10" y="139" width="470" height="33" fill="#f0fdf4" stroke="#d1d5db"/><text x="18" y="160" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Predation</text><text x="148" y="160" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">+</text><text x="208" y="160" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">−</text><text x="268" y="160" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">hawk eats a rabbit</text><text x="10" y="192" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">+ benefits, 0 no effect, − harmed. A parasite lives on or in its host.</text></svg>
