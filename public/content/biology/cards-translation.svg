<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" role="img"><title>Translation</title><desc>A ribosome reads mRNA codons while tRNA anticodons bring amino acids; the amino acids join into a chain.</desc><rect x="0" y="0" width="660" height="260" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><ellipse cx="215" cy="125" rx="125" ry="62" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2"/><text x="318" y="125" font-family="sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">ribosome</text><rect x="120" y="190" width="60" height="30" fill="#ffffff" stroke="#111827" stroke-width="1.5"/><text x="150" y="211" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">AUG</text><rect x="185" y="190" width="60" height="30" fill="#ffffff" stroke="#111827" stroke-width="1.5"/><text x="215" y="211" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">CCU</text><rect x="250" y="190" width="60" height="30" fill="#ffffff" stroke="#111827" stroke-width="1.5"/><text x="280" y="211" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">GAA</text><rect x="315" y="190" width="60" height="30" fill="#ffffff" stroke="#111827" stroke-width="1.5"/><text x="345" y="211" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">UAA</text><path d="M105 205 H120 M375 205 H400" stroke="#111827" stroke-width="3"/><text x="250" y="245" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">mRNA read in codons (3 bases)</text><path d="M150 100 V150" stroke="#111827" stroke-width="3"/><circle cx="150" cy="88" r="14" fill="#16a34a"/><text x="150" y="93" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Met</text><rect x="125" y="150" width="50" height="26" fill="#d1d5db" stroke="#111827" stroke-width="1.5"/><text x="150" y="168" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">UAC</text><path d="M215 100 V150" stroke="#111827" stroke-width="3"/><circle cx="215" cy="88" r="14" fill="#16a34a"/><text x="215" y="93" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Pro</text><rect x="190" y="150" width="50" height="26" fill="#d1d5db" stroke="#111827" stroke-width="1.5"/><text x="215" y="168" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">GGA</text><path d="M165 88 H201" stroke="#16a34a" stroke-width="4"/><text x="100" y="140" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="end" font-weight="bold">tRNA</text><text x="118" y="177" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="end">anticodon</text><text x="110" y="90" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="end">amino acid</text><text x="430" y="100" font-family="sans-serif" font-size="12" fill="#111827" text-anchor="start"><tspan x="430" dy="0">Codon AUG (start)</tspan><tspan x="430" dy="16">pairs with anticodon UAC:</tspan><tspan x="430" dy="16">A-U, U-A, G-C</tspan></text><text x="430" y="170" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="430" dy="0">UAA is a stop codon:</tspan><tspan x="430" dy="16">no tRNA, the chain is released</tspan></text><text x="300" y="20" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Translation: mRNA codons → chain of amino acids</text></svg>
