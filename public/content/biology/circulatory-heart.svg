<g data-label="right atrium">
<text x="178" y="191" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >Right atrium</text>
</g>
<g data-label="left atrium">
<text x="350" y="191" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >Left atrium</text>
</g>
<g data-label="right ventricle">
<text x="186" y="362" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >Right ventricle</text>
</g>
<g data-label="left ventricle">
<text x="336" y="372" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >Left ventricle</text>
</g>
<g data-label="pulmonary valve">
<text x="172" y="238" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold" >Pulmonary valve</text>
<text x="172" y="252" font-size="12" text-anchor="middle" fill="#15803d" >(semilunar)</text>
<line x1="214" y1="244" x2="222" y2="244" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
</g>
<g data-label="aortic valve">
<text x="351" y="238" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold" >Aortic valve</text>
<text x="351" y="252" font-size="12" text-anchor="middle" fill="#15803d" >(semilunar)</text>
<line x1="303" y1="244" x2="298" y2="244" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
</g>
<g data-label="tricuspid valve">
<text x="186" y="318" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold" >Tricuspid valve</text>
<text x="186" y="332" font-size="12" text-anchor="middle" fill="#15803d" >(3 flaps)</text>
</g>
<g data-label="bicuspid valve">
<text x="336" y="318" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold" >Bicuspid (mitral)</text>
<text x="336" y="332" font-size="12" text-anchor="middle" fill="#15803d" >valve (2 flaps)</text>
</g>
<g data-label="septum">
<text x="267" y="326" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold" transform="rotate(-90 267 326)">Septum</text>
</g>
<g data-label="vena cava">
<text x="130" y="108" font-size="12" text-anchor="end" fill="#2563eb" font-weight="bold" >Vena cava</text>
<text x="130" y="122" font-size="12" text-anchor="end" fill="#2563eb" >(upper body)</text>
<text x="96" y="472" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold" >Vena cava</text>
<text x="96" y="486" font-size="12" text-anchor="middle" fill="#2563eb" >(lower body)</text>
</g>
<g data-label="pulmonary trunk">
<text x="234" y="64" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold" >Pulmonary trunk</text>
<text x="234" y="78" font-size="12" text-anchor="middle" fill="#2563eb" >(to the lungs)</text>
</g>
<g data-label="aorta">
<text x="444" y="138" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold" >Aorta</text>
<text x="444" y="152" font-size="12" text-anchor="start" fill="#dc2626" >(to the body)</text>
</g>
<g data-label="pulmonary veins">
<text x="480" y="198" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold" >Pulmonary</text>
<text x="480" y="212" font-size="12" text-anchor="start" fill="#dc2626" >veins (from</text>
<text x="480" y="226" font-size="12" text-anchor="start" fill="#dc2626" >the lungs)</text>
</g>
<g data-label="coronary artery">
<text x="446" y="322" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold" >Coronary artery</text>
<text x="446" y="336" font-size="12" text-anchor="start" fill="#dc2626" >(feeds the heart)</text>
</g>
<g data-label="coronary vein">
<text x="446" y="364" font-size="12" text-anchor="start" fill="#2563eb" font-weight="bold" >Coronary vein</text>
<text x="446" y="378" font-size="12" text-anchor="start" fill="#2563eb" >(drains the heart)</text>
</g>
<text x="446" y="414" font-size="12" text-anchor="start" fill="#111827" font-weight="bold" >Thickest wall:</text>
<text x="446" y="428" font-size="12" text-anchor="start" fill="#111827" >pumps to the body</text>
<line x1="442" y1="414" x2="410" y2="402" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
<text x="186" y="442" font-size="12" text-anchor="middle" fill="#6b7280" >thin wall: pumps to the lungs</text>
<line x1="186" y1="428" x2="186" y2="410" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
<rect x="40" y="496" width="520" height="28" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
<text x="300" y="514" font-size="12" text-anchor="middle" fill="#111827" >Blue = deoxygenated blood (low O₂)   ·   Red = oxygenated blood (high O₂)   ·   Green = valves</text>

</g>
</svg>
