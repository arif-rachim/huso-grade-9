<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 385" role="img">
<title>Lymphatic system as a parallel circulation</title>
<desc>Blood capillary leaks fluid into tissue; most returns to the blood, the rest enters a closed-ended lymph capillary, passes a lymph node and a valve, and joins a vein near the collarbone that carries it to the heart.</desc>
<defs><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="620" height="385" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="310" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" >The lymphatic system: a one-way drain that runs alongside the blood vessels</text>
<defs><linearGradient id="gc" gradientUnits="userSpaceOnUse" x1="30" x2="330" y1="0" y2="0"><stop offset="0" stop-color="#dc2626" stop-opacity="0.45"/><stop offset="1" stop-color="#2563eb" stop-opacity="0.45"/></linearGradient></defs>
<path d="M30,70 L330,70" fill="none" stroke="#6b7280" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" />
<path d="M30,70 L330,70" fill="none" stroke="#ffffff" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" />
<path d="M30,70 L330,70" fill="none" stroke="url(#gc)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" />
<path d="M330,70 L580,70" fill="none" stroke="#2563eb" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" />
<path d="M330,70 L580,70" fill="none" stroke="#dbeafe" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" />
<line x1="40" y1="70" x2="300" y2="70" stroke="#111827" stroke-width="2" marker-end="url(#aK)" stroke-linecap="round"/>
<text x="36" y="44" font-size="13" text-anchor="start" fill="#111827" font-weight="bold" >Blood capillary</text>
<text x="580" y="44" font-size="13" text-anchor="end" fill="#2563eb" font-weight="bold" >Vein: carries the blood to the heart</text>
<rect x="60" y="128" width="60" height="44" rx="12" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5" />
<rect x="140" y="128" width="60" height="44" rx="12" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5" />
<rect x="220" y="128" width="60" height="44" rx="12" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5" />
<rect x="300" y="128" width="60" height="44" rx="12" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5" />
<text x="180" y="152" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >body cells</text>
<text x="250" y="194" font-size="12" text-anchor="middle" fill="#6b7280" >surrounded by tissue fluid</text>
<line x1="70" y1="86" x2="70" y2="122" stroke="#6b7280" stroke-width="2" marker-end="url(#aY)" stroke-linecap="round"/>
<line x1="110" y1="86" x2="110" y2="122" stroke="#6b7280" stroke-width="2" marker-end="url(#aY)" stroke-linecap="round"/>
<line x1="300" y1="122" x2="300" y2="86" stroke="#6b7280" stroke-width="2" marker-end="url(#aY)" stroke-linecap="round"/>
<line x1="340" y1="122" x2="340" y2="86" stroke="#6b7280" stroke-width="2" marker-end="url(#aY)" stroke-linecap="round"/>
<text x="125" y="112" font-size="12" text-anchor="start" fill="#6b7280" >fluid leaks out</text>
<text x="352" y="112" font-size="12" text-anchor="start" fill="#6b7280" >most of it returns</text>
<path d="M70,236 L330,236" fill="none" stroke="#16a34a" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" />
<path d="M70,236 L330,236" fill="none" stroke="#dcfce7" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="70" cy="236" r="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<line x1="160" y1="200" x2="160" y2="224" stroke="#16a34a" stroke-width="2" marker-end="url(#aG)" stroke-linecap="round"/>
<line x1="230" y1="200" x2="230" y2="224" stroke="#16a34a" stroke-width="2" marker-end="url(#aG)" stroke-linecap="round"/>
<text x="46" y="268" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold" >Lymph capillary: closed at one end</text>
<text x="46" y="284" font-size="12" text-anchor="start" fill="#15803d" >takes up the extra fluid</text>
<path d="M330,236 L520,236 L520,86" fill="none" stroke="#16a34a" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" />
<path d="M330,236 L520,236 L520,86" fill="none" stroke="#dcfce7" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" />
<line x1="436" y1="236" x2="458" y2="236" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
<line x1="520" y1="226" x2="520" y2="100" stroke="#16a34a" stroke-width="2" marker-end="url(#aG)" stroke-linecap="round"/>
<ellipse cx="400" cy="236" rx="34" ry="22" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5" />
<text x="400" y="276" font-size="13" text-anchor="middle" fill="#15803d" font-weight="bold" >Lymph node</text>
<text x="400" y="292" font-size="12" text-anchor="middle" fill="#111827" >filters the lymph;</text>
<text x="400" y="306" font-size="12" text-anchor="middle" fill="#111827" >has white blood cells</text>
<polygon points="470,226 470,246 488,236" fill="#16a34a"/>
<text x="478" y="264" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold" >valve</text>
<text x="500" y="160" font-size="12" text-anchor="end" fill="#15803d" font-weight="bold" >joins the vein</text>
<text x="500" y="176" font-size="12" text-anchor="end" fill="#15803d" >near the collarbone</text>
<rect x="30" y="320" width="550" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
<text x="305" y="340" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >Lymph = tissue fluid inside lymph vessels. It flows one way, toward the heart.</text>
<text x="305" y="358" font-size="12" text-anchor="middle" fill="#111827" >No pump: moving muscles squeeze the vessels and valves stop backflow.</text>

</g>
</svg>
