<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 368" role="img" aria-labelledby="t d">
  <title id="t">Mitosis versus meiosis</title>
  <desc id="d">Mitosis: one diploid cell makes two identical diploid cells, used for growth and repair. Meiosis: one diploid cell makes four different haploid cells, the gametes.</desc>
  <defs><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="440" height="368" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Mitosis vs meiosis at a glance</text>
    <rect x="20" y="40" width="190" height="30" rx="8" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.4"/>
    <text x="115" y="60" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">MITOSIS</text>
    <text x="115" y="86" font-size="12" text-anchor="middle" fill="#6b7280">growth and repair</text>
    <rect x="230" y="40" width="190" height="30" rx="8" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.4"/>
    <text x="325" y="60" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">MEIOSIS</text>
    <text x="325" y="86" font-size="12" text-anchor="middle" fill="#6b7280">making egg and sperm cells</text>
    <circle cx="115" cy="125" r="22" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="2"/>
    <text x="115" y="130" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">2n</text>
    <line x1="115" y1="149" x2="115" y2="171" stroke="#111827" stroke-width="2" stroke-linecap="round" marker-end="url(#arK)"/>
    <text x="125" y="164" font-size="12" text-anchor="start" fill="#6b7280">1 division</text>
    <circle cx="85" cy="196" r="22" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="2"/>
    <text x="85" y="201" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">2n</text>
    <circle cx="145" cy="196" r="22" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="2"/>
    <text x="145" y="201" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">2n</text>
    <text x="115" y="270" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">2 identical cells</text>
    <circle cx="325" cy="125" r="22" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="2"/>
    <text x="325" y="130" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">2n</text>
    <line x1="325" y1="149" x2="325" y2="166" stroke="#111827" stroke-width="2" stroke-linecap="round" marker-end="url(#arK)"/>
    <text x="335" y="162" font-size="12" text-anchor="start" fill="#6b7280">division 1</text>
    <circle cx="279" cy="190" r="18" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="2"/>
    <text x="279" y="195" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">n</text>
    <circle cx="371" cy="190" r="18" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="2"/>
    <text x="371" y="195" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">n</text>
    <text x="325" y="195" font-size="12" text-anchor="middle" fill="#6b7280">division 2</text>
    <line x1="273" y1="210" x2="265" y2="226" stroke="#111827" stroke-width="2" stroke-linecap="round" marker-end="url(#arK)"/>
    <line x1="285" y1="210" x2="293" y2="226" stroke="#111827" stroke-width="2" stroke-linecap="round" marker-end="url(#arK)"/>
    <circle cx="263" cy="244" r="12" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="2"/>
    <text x="263" y="249" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">n</text>
    <circle cx="295" cy="244" r="12" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="2"/>
    <text x="295" y="249" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">n</text>
    <line x1="365" y1="210" x2="357" y2="226" stroke="#111827" stroke-width="2" stroke-linecap="round" marker-end="url(#arK)"/>
    <line x1="377" y1="210" x2="385" y2="226" stroke="#111827" stroke-width="2" stroke-linecap="round" marker-end="url(#arK)"/>
    <circle cx="355" cy="244" r="12" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="2"/>
    <text x="355" y="249" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">n</text>
    <circle cx="387" cy="244" r="12" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="2"/>
    <text x="387" y="249" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">n</text>
    <text x="325" y="270" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">4 different cells</text>
    <rect x="30" y="284" width="380" height="70" rx="8" fill="#ffffff" stroke="18" stroke-width="1.2"/>
    <text x="220" y="304" font-size="12" text-anchor="middle" fill="#111827">2n = diploid (two sets, like 46 in a human body cell)</text>
    <text x="220" y="322" font-size="12" text-anchor="middle" fill="#111827">n = haploid (one set, like 23 in a human egg or sperm)</text>
    <text x="220" y="340" font-size="12" text-anchor="middle" fill="#6b7280">DNA is copied once before both.</text>
  </g>
</svg>
