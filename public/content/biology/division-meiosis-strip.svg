<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 368" role="img" aria-labelledby="t d">
  <title id="t">Meiosis in six pictures</title>
  <desc id="d">A cell with 2n equals 4: DNA is copied, in meiosis I homologous pairs line up and swap pieces by crossing over, the pairs separate into two cells, in meiosis II sister chromatids separate, giving four different cells with 2 chromosomes each.</desc>
