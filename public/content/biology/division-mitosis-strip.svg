    <path d="M68,93 q4,-8 8,0 q4,8 8,0" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="152" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">1  Interphase</text>
    <text x="75" y="168" font-size="12" text-anchor="middle" fill="#111827">DNA is copied first</text>
    <text x="75" y="184" font-size="12" text-anchor="middle" fill="#6b7280">4 chromosomes</text>
