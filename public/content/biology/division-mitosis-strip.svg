<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 368" role="img" aria-labelledby="t d">
  <title id="t">Mitosis in six pictures</title>
  <desc id="d">A cell with 2n equals 4 chromosomes: interphase copies the DNA, prophase condenses the chromosomes, metaphase lines them up in the middle, anaphase pulls the sister chromatids apart, telophase and cytokinesis make two identical cells with 4 chromosomes each.</desc>
