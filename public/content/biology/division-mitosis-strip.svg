  <rect x="0" y="0" width="440" height="368" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Mitosis: one cell → two identical cells</text>
