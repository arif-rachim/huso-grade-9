<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="ewt ewd">
  <title id="ewt">A pond food web</title>
  <desc id="ewd">Arrows point from the food to the eater. Algae are eaten by tadpoles and water fleas, which are eaten by dragonfly nymphs and small fish, which are eaten by a heron. Decomposers break down dead remains.</desc>
  <defs>
    <marker id="ewa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="ewg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="20" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Pond food web: arrows point to the EATER</text>
    <line x1="300.0" y1="273.0" x2="204.5" y2="224.3" stroke="#111827" stroke-width="1.8" marker-end="url(#ewa)"/>
    <line x1="300.0" y1="273.0" x2="385.6" y2="224.5" stroke="#111827" stroke-width="1.8" marker-end="url(#ewa)"/>
    <line x1="200.0" y1="188.0" x2="200.0" y2="142.0" stroke="#111827" stroke-width="1.8" marker-end="url(#ewa)"/>
    <line x1="200.0" y1="188.0" x2="385.2" y2="138.3" stroke="#111827" stroke-width="1.8" marker-end="url(#ewa)"/>
    <line x1="390.0" y1="188.0" x2="204.8" y2="138.3" stroke="#111827" stroke-width="1.8" marker-end="url(#ewa)"/>
    <line x1="390.0" y1="188.0" x2="390.0" y2="142.0" stroke="#111827" stroke-width="1.8" marker-end="url(#ewa)"/>
    <line x1="200.0" y1="103.0" x2="290.3" y2="70.7" stroke="#111827" stroke-width="1.8" marker-end="url(#ewa)"/>
    <line x1="390.0" y1="103.0" x2="299.7" y2="70.7" stroke="#111827" stroke-width="1.8" marker-end="url(#ewa)"/>
    <g data-label="algae"><rect x="242.0" y="273.0" width="116" height="34" rx="9" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><text x="300" y="295" font-size="13" text-anchor="middle" font-weight="bold">Algae</text></g>
    <g data-label="tadpole"><rect x="142.0" y="188.0" width="116" height="34" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="200" y="210" font-size="13" text-anchor="middle" font-weight="bold">Tadpole</text></g>
    <g data-label="water flea"><rect x="332.0" y="188.0" width="116" height="34" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="390" y="210" font-size="13" text-anchor="middle" font-weight="bold">Water flea</text></g>
    <g data-label="dragonfly nymph"><rect x="142.0" y="103.0" width="116" height="34" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="200" y="125" font-size="13" text-anchor="middle" font-weight="bold">Dragonfly nymph</text></g>
    <g data-label="small fish"><rect x="332.0" y="103.0" width="116" height="34" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="390" y="125" font-size="13" text-anchor="middle" font-weight="bold">Small fish</text></g>
    <g data-label="heron"><rect x="237.0" y="35.0" width="116" height="34" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="295" y="57" font-size="13" text-anchor="middle" font-weight="bold">Heron</text></g>
    <text x="10" y="288" font-size="13" text-anchor="start" fill="#16a34a" font-weight="bold">Producer</text>
    <text x="10" y="303" font-size="12" text-anchor="start" fill="#6b7280">(makes food)</text>
    <text x="10" y="203" font-size="13" text-anchor="start" fill="#16a34a" font-weight="bold">Primary</text>
    <text x="10" y="218" font-size="12" text-anchor="start" fill="#6b7280">consumer</text>
    <text x="10" y="118" font-size="13" text-anchor="start" fill="#16a34a" font-weight="bold">Secondary</text>
    <text x="10" y="133" font-size="12" text-anchor="start" fill="#6b7280">consumer</text>
    <text x="10" y="50" font-size="13" text-anchor="start" fill="#16a34a" font-weight="bold">Tertiary</text>
    <text x="10" y="65" font-size="12" text-anchor="start" fill="#6b7280">consumer</text>
    <circle cx="440" cy="290" r="0" />
    <text x="300" y="338" font-size="12" text-anchor="middle" fill="#6b7280">Sunlight gives the energy, so the energy chain starts at the algae.</text>
    <rect x="15" y="352" width="450" height="38" rx="9" fill="#f3f4f6" stroke="#d1d5db"/>
    <g data-label="decomposers"><text x="240" y="368" font-size="13" text-anchor="middle" font-weight="bold">Decomposers: bacteria and fungi</text>
    <text x="240" y="384" font-size="12" text-anchor="middle">break down dead remains of ALL of them and return nutrients to the water</text></g>
  </g>
</svg>
