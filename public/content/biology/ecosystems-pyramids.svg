<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="ept epd">
  <title id="ept">Pyramids of numbers</title>
  <desc id="epd">Left: a grassland pyramid, upright: 1000 grass plants, 100 grasshoppers, 10 frogs, 1 snake (suppose). Right: a tree pyramid with a narrow base: 1 tree, 500 caterpillars, 10 birds (suppose). Bar width is on a log scale.</desc>
  <defs>
    <marker id="epa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="epg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="360" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="20" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Pyramid of numbers: how many organisms at each level</text>
    <text x="120" y="56" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">Grassland: upright</text>
    <rect x="102.0" y="70" width="36.0" height="44" fill="#16a34a" fill-opacity="0.22" stroke="#16a34a" stroke-width="2"/>
    <text x="120" y="89" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">snake</text>
    <text x="120" y="105" font-size="12" text-anchor="middle" fill="#111827">1</text>
    <rect x="80.0" y="118" width="80.0" height="44" fill="#16a34a" fill-opacity="0.22" stroke="#16a34a" stroke-width="2"/>
    <text x="120" y="137" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">frog</text>
    <text x="120" y="153" font-size="12" text-anchor="middle" fill="#111827">10</text>
    <rect x="58.0" y="166" width="124.0" height="44" fill="#16a34a" fill-opacity="0.22" stroke="#16a34a" stroke-width="2"/>
    <text x="120" y="185" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">grasshopper</text>
    <text x="120" y="201" font-size="12" text-anchor="middle" fill="#111827">100</text>
    <rect x="36.0" y="214" width="168.0" height="44" fill="#16a34a" fill-opacity="0.22" stroke="#16a34a" stroke-width="2"/>
    <text x="120" y="233" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">grass plant</text>
    <text x="120" y="249" font-size="12" text-anchor="middle" fill="#111827">1,000</text>
    <text x="360" y="104" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">One big tree: narrow base</text>
    <rect x="320.0" y="118" width="80.0" height="44" fill="#16a34a" fill-opacity="0.22" stroke="#16a34a" stroke-width="2"/>
    <text x="360" y="137" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">bird</text>
    <text x="360" y="153" font-size="12" text-anchor="middle" fill="#111827">10</text>
    <rect x="282.6" y="166" width="154.8" height="44" fill="#16a34a" fill-opacity="0.22" stroke="#16a34a" stroke-width="2"/>
    <text x="360" y="185" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">caterpillar</text>
    <text x="360" y="201" font-size="12" text-anchor="middle" fill="#111827">500</text>
    <rect x="342.0" y="214" width="36.0" height="44" fill="#16a34a" fill-opacity="0.22" stroke="#16a34a" stroke-width="2"/>
    <text x="360" y="233" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">tree</text>
    <text x="360" y="249" font-size="12" text-anchor="middle" fill="#111827">1</text>
    <text x="120" y="288" font-size="12" text-anchor="middle" fill="#6b7280">top = last consumer (fewest)</text>
    <text x="120" y="304" font-size="12" text-anchor="middle" fill="#6b7280">bottom = producers (most)</text>
    <text x="360" y="288" font-size="12" text-anchor="middle" fill="#6b7280">1 producer feeds MANY insects:</text>
    <text x="360" y="304" font-size="12" text-anchor="middle" fill="#6b7280">the base is narrower than the level above</text>
    <text x="240" y="336" font-size="12" text-anchor="middle" fill="#6b7280">Numbers are made up. Widths use a log scale. Count organisms only, not their size.</text>
  </g>
</svg>
