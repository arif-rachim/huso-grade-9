<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" role="img">
  <title>Three excretion routes and what each removes</title>
  <desc>The lungs remove carbon dioxide and water vapor. The skin sweat glands remove water, salts and a little urea in sweat. The kidneys remove urea, extra water and extra salts in urine.</desc>
  <defs>
    <marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14532d"/></marker>
  </defs>
  <rect width="580" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="290" y="22" font-size="16" font-weight="bold" text-anchor="middle">Excretion: three exits for waste your cells make</text>
    <!-- person -->
    <g fill="#f3f4f6" stroke="#6b7280" stroke-width="2">
      <circle cx="120" cy="66" r="27"/>
      <rect x="82" y="98" width="76" height="150" rx="26"/>
      <rect x="60" y="102" width="18" height="96" rx="9"/>
      <rect x="162" y="102" width="18" height="96" rx="9"/>
      <rect x="88" y="240" width="30" height="120" rx="13"/>
      <rect x="122" y="240" width="30" height="120" rx="13"/>
    </g>
    <g data-label="lungs" fill="#86efac" stroke="#14532d" stroke-width="1.8">
      <ellipse cx="104" cy="135" rx="14" ry="28"/><ellipse cx="136" cy="135" rx="14" ry="28"/>
    </g>
    <g data-label="kidneys" fill="#16a34a" stroke="#14532d" stroke-width="1.5">
      <ellipse cx="102" cy="190" rx="7" ry="12"/><ellipse cx="138" cy="186" rx="7" ry="12"/>
    </g>
    <g fill="#bbf7d0" stroke="#14532d" stroke-width="1.5"><circle cx="120" cy="226" r="9"/></g>
    <!-- sweat drops on arm -->
    <g fill="#16a34a"><path d="M171,126 q-4,6 0,8 q4,-2 0,-8 z"/><path d="M171,150 q-4,6 0,8 q4,-2 0,-8 z"/><path d="M171,174 q-4,6 0,8 q4,-2 0,-8 z"/></g>
    <!-- arrows -->
    <g stroke="#14532d" stroke-width="2.5" fill="none" marker-end="url(#arG)">
      <path d="M152,128 C190,110 210,106 262,104"/>
      <path d="M184,150 C210,170 230,196 262,204"/>
      <path d="M146,196 C190,260 220,298 262,304"/>
    </g>
    <!-- boxes -->
    <g>
      <rect x="266" y="62" width="300" height="84" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
      <text x="282" y="86" font-size="15" font-weight="bold" fill="#14532d">Lungs</text>
      <text x="282" y="106" font-size="13">remove <tspan font-weight="bold">carbon dioxide (CO₂)</tspan></text>
      <text x="282" y="124" font-size="13">and <tspan font-weight="bold">water vapor</tspan>, breathed out</text>
      <rect x="266" y="162" width="300" height="84" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
      <text x="282" y="186" font-size="15" font-weight="bold" fill="#14532d">Skin: sweat glands</text>
      <text x="282" y="206" font-size="13">remove <tspan font-weight="bold">water, salts</tspan> and a little urea</text>
      <text x="282" y="224" font-size="13">in <tspan font-weight="bold">sweat</tspan> (also cools you down)</text>
      <rect x="266" y="262" width="300" height="84" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
      <text x="282" y="286" font-size="15" font-weight="bold" fill="#14532d">Kidneys</text>
      <text x="282" y="306" font-size="13">remove <tspan font-weight="bold">urea</tspan>, extra <tspan font-weight="bold">water</tspan> and extra</text>
      <text x="282" y="324" font-size="13"><tspan font-weight="bold">salts</tspan> in <tspan font-weight="bold">urine</tspan> (the main route)</text>
    </g>
    <rect x="266" y="358" width="300" height="32" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="416" y="379" font-size="13" text-anchor="middle" fill="#6b7280">Not excretion: feces (undigested food)</text>
  </g>
</svg>
