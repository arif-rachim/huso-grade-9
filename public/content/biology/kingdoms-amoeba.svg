<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-labelledby="kat kad">
  <title id="kat">Amoeba structure and fission</title>
  <desc id="kad">Left: an Amoeba with cell membrane, cytoplasm, nucleus, pseudopodia, food vacuole and contractile vacuole. Right: binary fission, one cell splits into two. Below: multiple fission inside a cyst gives many small amoebae.</desc>
  <defs>
    <marker id="kaa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="kag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="380" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="20" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Amoeba: a single-celled protist</text>
    <path d="M110,70 C140,40 190,60 200,95 C230,100 245,130 225,165 C240,195 205,230 170,222 C150,245 100,240 90,208 C60,205 40,170 60,145 C40,120 70,90 110,70 z" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2.5"/>
    <path d="M200,95 C225,80 240,70 248,52" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <g data-label="nucleus"><circle cx="140" cy="140" r="20" fill="#16a34a" fill-opacity="0.45" stroke="#16a34a" stroke-width="2"/><circle cx="140" cy="140" r="5" fill="#16a34a"/></g>
    <g data-label="food vacuole"><circle cx="185" cy="185" r="12" fill="#ffffff" stroke="#111827" stroke-width="1.5"/><circle cx="185" cy="185" r="4" fill="#6b7280"/></g>
    <g data-label="contractile vacuole"><circle cx="100" cy="195" r="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3 2"/></g>
    <g data-label="pseudopodia"><path d="M60,145 C40,140 28,128 22,112" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/></g>
    <text x="18" y="100" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">pseudopodia</text>
    <text x="18" y="116" font-size="11" text-anchor="start" fill="#6b7280">(false feet)</text>
    <text x="250" y="150" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">nucleus</text>
    <line x1="162" y1="140" x2="246" y2="146" stroke="#6b7280"/>
    <text x="250" y="196" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">food vacuole</text>
    <line x1="198" y1="188" x2="246" y2="192" stroke="#6b7280"/>
    <text x="18" y="238" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">contractile vacuole</text>
    <line x1="60" y1="228" x2="95" y2="205" stroke="#6b7280"/>
    <text x="122" y="262" font-size="11" text-anchor="middle" fill="#6b7280">cell membrane (outline) and cytoplasm (inside)</text>
    <text x="390" y="60" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">Binary fission</text>
    <circle cx="340" cy="100" r="20" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/>
    <circle cx="340" cy="100" r="5" fill="#16a34a"/>
    <line x1="364" y1="100" x2="384" y2="100" stroke="#111827" stroke-width="1.8" marker-end="url(#kaa)"/>
    <ellipse cx="420" cy="100" rx="30" ry="20" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/><circle cx="406" cy="100" r="5" fill="#16a34a"/><circle cx="434" cy="100" r="5" fill="#16a34a"/><line x1="420" y1="82" x2="420" y2="118" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="420" y1="124" x2="420" y2="142" stroke="#111827" stroke-width="1.8" marker-end="url(#kaa)"/>
    <circle cx="395" cy="170" r="18" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/>
    <circle cx="395" cy="170" r="5" fill="#16a34a"/>
    <circle cx="445" cy="170" r="18" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/>
    <circle cx="445" cy="170" r="5" fill="#16a34a"/>
    <text x="390" y="206" font-size="12" text-anchor="middle" fill="#111827">1 cell becomes 2</text>
    <text x="390" y="222" font-size="11" text-anchor="middle" fill="#6b7280">(nucleus divides first)</text>
    <rect x="15" y="280" width="450" height="90" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="240" y="300" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">Multiple fission (bad conditions)</text>
    <circle cx="70" cy="333" r="22" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/><circle cx="70" cy="333" r="5" fill="#16a34a"/>
    <text x="70" y="368" font-size="11" text-anchor="middle" fill="#6b7280">amoeba</text>
    <line x1="98" y1="333" x2="128" y2="333" stroke="#111827" stroke-width="1.8" marker-end="url(#kaa)"/>
    <circle cx="170" cy="333" r="26" fill="#ffffff" stroke="#111827" stroke-width="2.5"/><circle cx="170" cy="333" r="22" fill="none" stroke="#111827" stroke-width="1"/>
    <circle cx="161" cy="325" r="4" fill="#16a34a"/>
    <circle cx="176" cy="323" r="4" fill="#16a34a"/>
    <circle cx="166" cy="339" r="4" fill="#16a34a"/>
    <circle cx="180" cy="337" r="4" fill="#16a34a"/>
    <circle cx="158" cy="336" r="4" fill="#16a34a"/>
    <text x="170" y="371" font-size="11" text-anchor="middle" fill="#6b7280">cyst: many nuclei</text>
    <line x1="202" y1="333" x2="232" y2="333" stroke="#111827" stroke-width="1.8" marker-end="url(#kaa)"/>
    <circle cx="250" cy="323" r="9" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/><circle cx="250" cy="323" r="2.5" fill="#16a34a"/>
    <circle cx="274" cy="339" r="9" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/><circle cx="274" cy="339" r="2.5" fill="#16a34a"/>
    <circle cx="298" cy="325" r="9" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/><circle cx="298" cy="325" r="2.5" fill="#16a34a"/>
    <circle cx="322" cy="341" r="9" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/><circle cx="322" cy="341" r="2.5" fill="#16a34a"/>
    <circle cx="346" cy="327" r="9" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/><circle cx="346" cy="327" r="2.5" fill="#16a34a"/>
    <text x="300" y="371" font-size="11" text-anchor="middle" fill="#6b7280">many small amoebae come out</text>
    <text x="430" y="326" font-size="11" text-anchor="middle" fill="#111827">many</text>
    <text x="430" y="340" font-size="11" text-anchor="middle" fill="#111827">daughters</text>
  </g>
</svg>
