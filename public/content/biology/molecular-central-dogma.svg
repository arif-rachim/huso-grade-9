<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 396" role="img" aria-labelledby="t d">
  <title id="t">The central dogma</title>
  <desc id="d">DNA is copied into mRNA by transcription in the nucleus, the mRNA is processed, and then the ribosome translates it into a protein. DNA can also copy itself by replication.</desc>
  <defs><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="440" height="396" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Central dogma: DNA → RNA → protein</text>
    <rect x="8" y="36" width="424" height="192" rx="14" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="424" y="220" font-size="12" text-anchor="end" fill="#6b7280">nucleus</text>
    <rect x="30" y="46" width="150" height="46" rx="10" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="1.8"/>
    <text x="105" y="67" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">DNA</text>
    <text x="105" y="84" font-size="12" text-anchor="middle" fill="#6b7280">master cookbook</text>
    <rect x="30" y="122" width="150" height="46" rx="10" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="1.8"/>
    <text x="105" y="143" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">pre-mRNA</text>
    <text x="105" y="160" font-size="12" text-anchor="middle" fill="#6b7280">raw photocopy</text>
    <rect x="30" y="240" width="150" height="46" rx="10" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="1.8"/>
    <text x="105" y="261" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">mRNA</text>
    <text x="105" y="278" font-size="12" text-anchor="middle" fill="#6b7280">finished copy</text>
    <rect x="30" y="330" width="150" height="46" rx="10" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="1.8"/>
    <text x="105" y="351" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Protein</text>
    <text x="105" y="368" font-size="12" text-anchor="middle" fill="#6b7280">the dish</text>
    <line x1="105" y1="92" x2="105" y2="120" stroke="#111827" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arK)"/>
    <text x="195" y="105.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">1  transcription</text>
    <text x="195" y="121.0" font-size="12" text-anchor="start" fill="#6b7280">DNA → RNA, in the nucleus</text>
    <line x1="105" y1="168" x2="105" y2="238" stroke="#111827" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arK)"/>
    <text x="195" y="202.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">2  RNA processing</text>
    <text x="195" y="218.0" font-size="12" text-anchor="start" fill="#6b7280">cap, tail, cut out introns</text>
    <line x1="105" y1="286" x2="105" y2="328" stroke="#111827" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arK)"/>
    <text x="195" y="306.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">3  translation</text>
    <text x="195" y="322.0" font-size="12" text-anchor="start" fill="#6b7280">RNA → protein, at a ribosome</text>
    <path d="M182,58 C250,40 250,88 184,82" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arG)"/>
    <text x="262" y="66" font-size="13" text-anchor="start" fill="#16a34a" font-weight="bold">replication</text>
    <text x="262" y="82" font-size="12" text-anchor="start" fill="#6b7280">DNA → DNA copy</text>
    <text x="220" y="384" font-size="12" text-anchor="middle" fill="#6b7280">Eukaryotes: steps 1–2 in the nucleus, step 3 in the cytoplasm.</text>
  </g>
</svg>
