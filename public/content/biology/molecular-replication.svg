<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 296" role="img" aria-labelledby="t d">
  <title id="t">DNA replication is semiconservative</title>
  <desc id="d">A parent double helix is unzipped by helicase. DNA polymerase adds new matching nucleotides to each old strand. The result is two DNA molecules, each with one old strand and one new strand.</desc>
  <defs><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="440" height="296" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Replication: each new DNA keeps one old strand</text>
    <line x1="40.0" y1="142" x2="40.0" y2="158" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="60.0" y1="142" x2="60.0" y2="158" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="80.0" y1="142" x2="80.0" y2="158" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="100.0" y1="142" x2="100.0" y2="158" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="120.0" y1="142" x2="120.0" y2="158" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="140.0" y1="142" x2="140.0" y2="158" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="142" x2="150" y2="142" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="158" x2="150" y2="158" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
    <text x="90" y="184" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">parent DNA</text>
    <text x="90" y="200" font-size="12" text-anchor="middle" fill="#6b7280">(both strands old)</text>
    <path d="M150,142 C190,142 190,92 240,92 L410,92" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150,158 C190,158 190,228 240,228 L410,228" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="240" y1="112" x2="410" y2="112" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    <line x1="240" y1="208" x2="410" y2="208" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    <line x1="260.0" y1="92" x2="260.0" y2="112" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="280.0" y1="92" x2="280.0" y2="112" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="300.0" y1="92" x2="300.0" y2="112" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="320.0" y1="92" x2="320.0" y2="112" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="340.0" y1="92" x2="340.0" y2="112" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="360.0" y1="92" x2="360.0" y2="112" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="380.0" y1="92" x2="380.0" y2="112" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="400.0" y1="92" x2="400.0" y2="112" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="260.0" y1="208" x2="260.0" y2="228" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="280.0" y1="208" x2="280.0" y2="228" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="300.0" y1="208" x2="300.0" y2="228" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="320.0" y1="208" x2="320.0" y2="228" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="340.0" y1="208" x2="340.0" y2="228" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="360.0" y1="208" x2="360.0" y2="228" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="380.0" y1="208" x2="380.0" y2="228" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <line x1="400.0" y1="208" x2="400.0" y2="228" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <circle cx="168" cy="150" r="12" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <text x="168" y="154" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">H</text>
    <text x="100" y="112" font-size="12" text-anchor="middle" fill="#111827">helicase unzips</text>
    <line x1="130" y1="118" x2="158" y2="142" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arM)"/>
    <text x="325" y="70" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">daughter DNA 1</text>
    <text x="325" y="86" font-size="12" text-anchor="middle" fill="#6b7280">old (black) + new (green)</text>
    <text x="325" y="262" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">daughter DNA 2</text>
    <text x="325" y="278" font-size="12" text-anchor="middle" fill="#6b7280">old (black) + new (green)</text>
    <text x="325" y="155" font-size="12" text-anchor="middle" fill="#111827">DNA polymerase adds</text>
    <text x="325" y="171" font-size="12" text-anchor="middle" fill="#111827">matching new bases</text>
    <line x1="325" y1="142" x2="325" y2="120" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arM)"/>
    <line x1="325" y1="180" x2="325" y2="200" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arM)"/>
  </g>
</svg>
