<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 308" role="img" aria-labelledby="t d">
  <title id="t">RNA processing in the nucleus</title>
  <desc id="d">The pre-mRNA has a 5 prime cap, exons and introns, and a poly-A tail. Splicing cuts out the introns and joins the exons, giving a shorter mature mRNA.</desc>
  <defs><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="440" height="308" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Splicing: introns out, exons stay</text>
    <rect x="10" y="90" width="30" height="28" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <text x="25" y="109" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">cap</text>
    <rect x="45" y="90" width="50.0" height="28" rx="0" fill="#16a34a" fill-opacity="0.35" stroke="#16a34a" stroke-width="1.6"/>
    <text x="70.0" y="109" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">exon</text>
    <text x="70.0" y="138" font-size="12" text-anchor="middle" fill="#6b7280">50 nt</text>
    <rect x="95.0" y="90" width="60.0" height="28" rx="0" fill="#d1d5db" fill-opacity="0.5" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="125.0" y="109" font-size="12" text-anchor="middle" fill="#111827">intron</text>
    <text x="125.0" y="138" font-size="12" text-anchor="middle" fill="#6b7280">60 nt</text>
    <rect x="155.0" y="90" width="60.0" height="28" rx="0" fill="#16a34a" fill-opacity="0.35" stroke="#16a34a" stroke-width="1.6"/>
    <text x="185.0" y="109" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">exon</text>
    <text x="185.0" y="138" font-size="12" text-anchor="middle" fill="#6b7280">60 nt</text>
    <rect x="215.0" y="90" width="90.0" height="28" rx="0" fill="#d1d5db" fill-opacity="0.5" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="260.0" y="109" font-size="12" text-anchor="middle" fill="#111827">intron</text>
    <text x="260.0" y="138" font-size="12" text-anchor="middle" fill="#6b7280">90 nt</text>
    <rect x="305.0" y="90" width="40.0" height="28" rx="0" fill="#16a34a" fill-opacity="0.35" stroke="#16a34a" stroke-width="1.6"/>
    <text x="325.0" y="109" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">exon</text>
    <text x="325.0" y="138" font-size="12" text-anchor="middle" fill="#6b7280">40 nt</text>
    <rect x="347.0" y="90" width="42" height="28" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <text x="368.0" y="109" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">AAAA</text>
    <text x="220" y="66" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">pre-mRNA (300 nucleotides without cap and tail)</text>
    <line x1="220" y1="158" x2="220" y2="190" stroke="#111827" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arK)"/>
    <text x="236" y="178" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">splicing: introns out</text>
    <rect x="10" y="210" width="30" height="28" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <text x="25" y="229" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">cap</text>
    <rect x="45" y="210" width="50.0" height="28" rx="0" fill="#16a34a" fill-opacity="0.35" stroke="#16a34a" stroke-width="1.6"/>
    <text x="70.0" y="229" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">exon</text>
    <text x="70.0" y="258" font-size="12" text-anchor="middle" fill="#6b7280">50 nt</text>
    <rect x="95.0" y="210" width="60.0" height="28" rx="0" fill="#16a34a" fill-opacity="0.35" stroke="#16a34a" stroke-width="1.6"/>
    <text x="125.0" y="229" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">exon</text>
    <text x="125.0" y="258" font-size="12" text-anchor="middle" fill="#6b7280">60 nt</text>
    <rect x="155.0" y="210" width="40.0" height="28" rx="0" fill="#16a34a" fill-opacity="0.35" stroke="#16a34a" stroke-width="1.6"/>
    <text x="175.0" y="229" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">exon</text>
    <text x="175.0" y="258" font-size="12" text-anchor="middle" fill="#6b7280">40 nt</text>
    <rect x="197.0" y="210" width="42" height="28" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <text x="218.0" y="229" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">AAAA</text>
    <text x="120" y="188" font-size="12" text-anchor="middle" fill="#111827"></text>
    <text x="290" y="222" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">mature mRNA</text>
    <text x="290" y="240" font-size="12" text-anchor="start" fill="#6b7280">150 nt of message</text>
    <text x="220" y="292" font-size="12" text-anchor="middle" fill="#111827">50 + 60 + 40 = 150 nt  →  leaves the nucleus</text>
  </g>
</svg>
