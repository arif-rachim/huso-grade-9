<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-labelledby="t d">
  <title id="t">Carbon makes four bonds</title>
  <desc id="d">Carbon forms four bonds. Methane CH4 has four hydrogens. Carbon atoms link in chains and rings, with single or double bonds, which gives the many shapes of life molecules.</desc>
  <defs><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="440" height="330" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Carbon: four bonds, endless shapes</text>
    <circle cx="80" cy="120" r="17" fill="#16a34a" fill-opacity="0.3" stroke="#16a34a" stroke-width="1.8"/>
    <text x="80" y="125" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <line x1="80.0" y1="102.72" x2="80.0" y2="82.56" stroke="#111827" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="80" cy="72" r="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="80" y="76" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">H</text>
    <line x1="80.0" y1="137.28" x2="80.0" y2="157.44" stroke="#111827" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="80" cy="168" r="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="80" y="172" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">H</text>
    <line x1="62.72" y1="120.0" x2="42.56" y2="120.0" stroke="#111827" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="32" cy="120" r="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="32" y="124" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">H</text>
    <line x1="97.28" y1="120.0" x2="117.44" y2="120.0" stroke="#111827" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="128" cy="120" r="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="128" y="124" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">H</text>
    <text x="80" y="196" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">methane CH₄</text>
    <text x="80" y="214" font-size="12" text-anchor="middle" fill="#6b7280">4 bonds = 4 partners</text>
    <line x1="170" y1="102" x2="212" y2="138" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="212" y1="138" x2="254" y2="102" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="254" y1="102" x2="296" y2="138" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="296" y1="138" x2="338" y2="102" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="170" cy="102" r="12" fill="#16a34a" fill-opacity="0.3" stroke="#16a34a" stroke-width="1.6"/>
    <text x="170" y="106" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <line x1="164" y1="90" x2="160" y2="74" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="176" y1="90" x2="180" y2="74" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="212" cy="138" r="12" fill="#16a34a" fill-opacity="0.3" stroke="#16a34a" stroke-width="1.6"/>
    <text x="212" y="142" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <line x1="206" y1="150" x2="202" y2="166" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="218" y1="150" x2="222" y2="166" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="254" cy="102" r="12" fill="#16a34a" fill-opacity="0.3" stroke="#16a34a" stroke-width="1.6"/>
    <text x="254" y="106" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <line x1="248" y1="90" x2="244" y2="74" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="260" y1="90" x2="264" y2="74" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="296" cy="138" r="12" fill="#16a34a" fill-opacity="0.3" stroke="#16a34a" stroke-width="1.6"/>
    <text x="296" y="142" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <line x1="290" y1="150" x2="286" y2="166" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="302" y1="150" x2="306" y2="166" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="338" cy="102" r="12" fill="#16a34a" fill-opacity="0.3" stroke="#16a34a" stroke-width="1.6"/>
    <text x="338" y="106" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <line x1="332" y1="90" x2="328" y2="74" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="344" y1="90" x2="348" y2="74" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
    <text x="272" y="186" font-size="12" text-anchor="middle" fill="#111827">chain: C–C–C–C–C (H on every free bond)</text>
    <path d="M414.0,125.0 L397.0,154.4 L363.0,154.4 L346.0,125.0 L363.0,95.6 L397.0,95.6 Z" fill="none" stroke="#111827" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="414.0" cy="125.0" r="8" fill="#16a34a" fill-opacity="0.3" stroke="#16a34a" stroke-width="1.4"/>
    <circle cx="397.0" cy="154.44486372867092" r="8" fill="#16a34a" fill-opacity="0.3" stroke="#16a34a" stroke-width="1.4"/>
    <circle cx="363.0" cy="154.44486372867092" r="8" fill="#16a34a" fill-opacity="0.3" stroke="#16a34a" stroke-width="1.4"/>
    <circle cx="346.0" cy="125.0" r="8" fill="#16a34a" fill-opacity="0.3" stroke="#16a34a" stroke-width="1.4"/>
    <circle cx="363.0" cy="95.5551362713291" r="8" fill="#16a34a" fill-opacity="0.3" stroke="#16a34a" stroke-width="1.4"/>
    <circle cx="397.0" cy="95.55513627132909" r="8" fill="#16a34a" fill-opacity="0.3" stroke="#16a34a" stroke-width="1.4"/>
    <text x="380" y="191" font-size="12" text-anchor="middle" fill="#111827">ring (like glucose,</text>
    <text x="380" y="207" font-size="12" text-anchor="middle" fill="#111827">which has C₆)</text>
    <text x="220" y="246" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Carbon chains and rings are the backbone of all four classes:</text>
    <rect x="14" y="262" width="96" height="34" rx="8" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.4"/>
    <text x="62" y="284" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">sugars</text>
    <rect x="119" y="262" width="96" height="34" rx="8" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.4"/>
    <text x="167" y="284" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">fats</text>
    <rect x="224" y="262" width="96" height="34" rx="8" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.4"/>
    <text x="272" y="284" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">proteins</text>
    <rect x="329" y="262" width="96" height="34" rx="8" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.4"/>
    <text x="377" y="284" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">DNA / RNA</text>
    <text x="220" y="320" font-size="12" text-anchor="middle" fill="#6b7280">Bonds can be single (C–C) or double (C=C), which changes the shape.</text>
  </g>
</svg>
