<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-labelledby="t d">
  <title id="t">The four biomolecule classes</title>
  <desc id="d">Four rows. Carbohydrates: glucose units join into starch, glycogen or cellulose (C H O). Lipids: glycerol plus three fatty acids make a fat (C H O). Proteins: amino acids join into a polypeptide (C H O N, some S). Nucleic acids: nucleotides join into DNA or RNA (C H O N P).</desc>
  <defs><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="440" height="440" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Four classes: small building blocks, big molecules</text>
    <text x="150" y="50" font-size="12" text-anchor="middle" fill="#6b7280">building block</text>
    <text x="342" y="50" font-size="12" text-anchor="middle" fill="#6b7280">big molecule</text>
    <rect x="8" y="62" width="424" height="84" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
    <text x="16" y="92" font-size="14" text-anchor="start" fill="#16a34a" font-weight="bold">Carbohydrates</text>
    <text x="16" y="110" font-size="12" text-anchor="start" fill="#111827">C, H, O</text>
    <rect x="8" y="152" width="424" height="84" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
    <text x="16" y="182" font-size="14" text-anchor="start" fill="#16a34a" font-weight="bold">Lipids</text>
    <text x="16" y="200" font-size="12" text-anchor="start" fill="#111827">C, H, O (P)</text>
    <rect x="8" y="242" width="424" height="84" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
    <text x="16" y="272" font-size="14" text-anchor="start" fill="#16a34a" font-weight="bold">Proteins</text>
    <text x="16" y="290" font-size="12" text-anchor="start" fill="#111827">C, H, O, N (S)</text>
    <rect x="8" y="332" width="424" height="84" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
    <text x="16" y="362" font-size="14" text-anchor="start" fill="#16a34a" font-weight="bold">Nucleic acids</text>
    <text x="16" y="380" font-size="12" text-anchor="start" fill="#111827">C, H, O, N, P</text>
