<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 385" role="img">
<title>Photosynthesis equation</title>
<desc>A leaf cell chloroplast takes in carbon dioxide, water and light and makes glucose and oxygen: 6CO2 + 6H2O gives C6H12O6 + 6O2.</desc>
<defs><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="580" height="385" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="280" y="26" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold" >Photosynthesis: the plant makes its own food</text>
<ellipse cx="285" cy="150" rx="118" ry="72" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="3" />
<rect x="213" y="126" width="44" height="7" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="213" y="135" width="44" height="7" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="213" y="144" width="44" height="7" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="268" y="154" width="44" height="7" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="268" y="163" width="44" height="7" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="268" y="172" width="44" height="7" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="318" y="120" width="44" height="7" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="318" y="129" width="44" height="7" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="318" y="138" width="44" height="7" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<text x="235" y="250" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold" >Chloroplast (chlorophyll makes it green)</text>
<text x="285" y="122" font-size="12" text-anchor="middle" fill="#6b7280" >leaf cell</text>
<text x="62" y="100" font-size="17" text-anchor="middle" fill="#111827" font-weight="bold" >CO₂</text>
<text x="62" y="118" font-size="12" text-anchor="middle" fill="#6b7280" >from the air</text>
<line x1="105" y1="112" x2="168" y2="132" stroke="#111827" stroke-width="2.5" marker-end="url(#aK)" stroke-linecap="round"/>
<text x="62" y="190" font-size="17" text-anchor="middle" fill="#111827" font-weight="bold" >H₂O</text>
<text x="62" y="208" font-size="12" text-anchor="middle" fill="#6b7280" >from the soil</text>
<line x1="105" y1="190" x2="168" y2="172" stroke="#111827" stroke-width="2.5" marker-end="url(#aK)" stroke-linecap="round"/>
<circle cx="470" cy="72" r="16" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
<line x1="493.0" y1="72.0" x2="502.0" y2="72.0" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<line x1="486.3" y1="88.3" x2="492.6" y2="94.6" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<line x1="470.0" y1="95.0" x2="470.0" y2="104.0" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<line x1="453.7" y1="88.3" x2="447.4" y2="94.6" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<line x1="447.0" y1="72.0" x2="438.0" y2="72.0" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<line x1="453.7" y1="55.7" x2="447.4" y2="49.4" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<line x1="470.0" y1="49.0" x2="470.0" y2="40.0" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<line x1="486.3" y1="55.7" x2="492.6" y2="49.4" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<text x="470" y="122" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" >Light</text>
<line x1="445" y1="92" x2="370" y2="118" stroke="#111827" stroke-width="2.5" marker-end="url(#aK)" stroke-linecap="round"/>
<line x1="398" y1="168" x2="455" y2="184" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aG)" stroke-linecap="round"/>
<text x="500" y="190" font-size="17" text-anchor="middle" fill="#111827" font-weight="bold" >O₂</text>
<text x="500" y="208" font-size="12" text-anchor="middle" fill="#6b7280" >to the air</text>
<line x1="350" y1="212" x2="420" y2="254" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aG)" stroke-linecap="round"/>
<text x="488" y="262" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" >Glucose C₆H₁₂O₆</text>
<text x="488" y="280" font-size="12" text-anchor="middle" fill="#6b7280" >food, stored as starch</text>
<rect x="30" y="300" width="520" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" />
<text x="290" y="326" font-size="19" text-anchor="middle" fill="#111827" font-weight="bold" >6CO₂ + 6H₂O  →  C₆H₁₂O₆ + 6O₂</text>
<text x="290" y="345" font-size="13" text-anchor="middle" fill="#6b7280" >(needs light energy and chlorophyll)</text>
<text x="290" y="362" font-size="13" text-anchor="middle" fill="#15803d" font-weight="bold" >Atoms balance: C 6 = 6, H 12 = 12, O 18 = 18</text>

</g>
</svg>
