<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 402" role="img">
<title>Aerobic and anaerobic respiration</title>
<desc>Three cards: aerobic respiration (glucose + oxygen gives carbon dioxide, water and a lot of energy), anaerobic respiration in yeast and plants (ethanol and carbon dioxide) and in muscles (lactic acid).</desc>
<defs><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="640" height="402" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="320" y="24" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold" >Respiration: releasing the energy stored in food</text>
<rect x="12" y="40" width="196" height="330" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" />
<text x="110" y="62" font-size="16" text-anchor="middle" fill="#15803d" font-weight="bold" >Aerobic</text>
<text x="110" y="80" font-size="12" text-anchor="middle" fill="#6b7280" >(with oxygen)</text>
<ellipse cx="110" cy="140" rx="52" ry="28" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2.5" />
<path d="M72,140 l8,-14 l8,28 l8,-28 l8,28 l8,-28 l8,28 l8,-14" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />
<text x="110" y="184" font-size="12" text-anchor="middle" fill="#6b7280" >mitochondrion</text>
<text x="110" y="210" font-size="12" text-anchor="middle" fill="#6b7280" >Where:</text>
<text x="110" y="226" font-size="13" text-anchor="middle" fill="#111827" >all living cells</text>
<line x1="32" y1="236" x2="188" y2="236" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
<text x="110" y="258" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" >C₆H₁₂O₆ + 6O₂</text>
<text x="110" y="278" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" >→ 6CO₂ + 6H₂O</text>
<text x="110" y="298" font-size="13" text-anchor="middle" fill="#111827" >+ energy</text>
<line x1="32" y1="312" x2="188" y2="312" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
<text x="110" y="333" font-size="14" text-anchor="middle" fill="#15803d" font-weight="bold" >A lot of energy</text>
<text x="110" y="350" font-size="13" text-anchor="middle" fill="#111827" >about 30–32 ATP</text>
<rect x="222" y="40" width="196" height="330" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" />
<text x="320" y="62" font-size="16" text-anchor="middle" fill="#15803d" font-weight="bold" >Anaerobic</text>
<text x="320" y="80" font-size="12" text-anchor="middle" fill="#6b7280" >(no oxygen): yeast, plants</text>
<circle cx="306" cy="140" r="22" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2.5"/>
<circle cx="336" cy="134" r="12" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2"/>
<circle cx="324" cy="110" r="5" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<circle cx="340" cy="102" r="5" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<circle cx="356" cy="112" r="5" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text x="320" y="184" font-size="12" text-anchor="middle" fill="#6b7280" >yeast cell + CO₂ bubbles</text>
<text x="320" y="210" font-size="12" text-anchor="middle" fill="#6b7280" >Where:</text>
<text x="320" y="226" font-size="13" text-anchor="middle" fill="#111827" >yeast, plant roots in wet soil</text>
<line x1="242" y1="236" x2="398" y2="236" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
<text x="320" y="258" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" >C₆H₁₂O₆</text>
<text x="320" y="278" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" >→ 2C₂H₅OH + 2CO₂</text>
<text x="320" y="298" font-size="13" text-anchor="middle" fill="#111827" >+ a little energy</text>
<line x1="242" y1="312" x2="398" y2="312" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
<text x="320" y="333" font-size="14" text-anchor="middle" fill="#15803d" font-weight="bold" >A little energy</text>
<text x="320" y="350" font-size="13" text-anchor="middle" fill="#111827" >2 ATP</text>
<rect x="432" y="40" width="196" height="330" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" />
<text x="530" y="62" font-size="16" text-anchor="middle" fill="#15803d" font-weight="bold" >Anaerobic</text>
<text x="530" y="80" font-size="12" text-anchor="middle" fill="#6b7280" >(no oxygen): muscles</text>
<rect x="478" y="118" width="104" height="44" rx="22" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2.5" />
<line x1="491" y1="126" x2="491" y2="154" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
<line x1="504" y1="126" x2="504" y2="154" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
<line x1="517" y1="126" x2="517" y2="154" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
<line x1="530" y1="126" x2="530" y2="154" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
<line x1="543" y1="126" x2="543" y2="154" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
<line x1="556" y1="126" x2="556" y2="154" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
<line x1="569" y1="126" x2="569" y2="154" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
<text x="530" y="184" font-size="12" text-anchor="middle" fill="#6b7280" >muscle fibers</text>
<text x="530" y="210" font-size="12" text-anchor="middle" fill="#6b7280" >Where:</text>
<text x="530" y="226" font-size="13" text-anchor="middle" fill="#111827" >your muscles in a hard sprint</text>
<line x1="452" y1="236" x2="608" y2="236" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
<text x="530" y="258" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" >C₆H₁₂O₆</text>
<text x="530" y="278" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" >→ 2C₃H₆O₃</text>
<text x="530" y="298" font-size="13" text-anchor="middle" fill="#111827" >+ a little energy</text>
<line x1="452" y1="312" x2="608" y2="312" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
<text x="530" y="333" font-size="14" text-anchor="middle" fill="#15803d" font-weight="bold" >A little energy</text>
<text x="530" y="350" font-size="13" text-anchor="middle" fill="#111827" >2 ATP</text>
<text x="320" y="390" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >Respiration is NOT breathing: it happens inside every living cell, all the time.</text>

</g>
</svg>
