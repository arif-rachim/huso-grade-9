<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 345" role="img">
<title>Photosynthesis and respiration</title>
<desc>Chloroplast takes in light, carbon dioxide and water and makes glucose and oxygen; mitochondrion uses glucose and oxygen and releases energy, carbon dioxide and water.</desc>
<defs><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="600" height="345" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="300" y="24" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold" >Two opposite-looking processes that feed each other</text>
<rect x="20" y="60" width="210" height="170" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" />
<text x="125" y="84" font-size="16" text-anchor="middle" fill="#15803d" font-weight="bold" >Photosynthesis</text>
<text x="125" y="102" font-size="12" text-anchor="middle" fill="#6b7280" >in chloroplasts · only in light</text>
<ellipse cx="125" cy="160" rx="70" ry="38" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2.5" />
<rect x="83" y="144" width="24" height="6" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="83" y="152" width="24" height="6" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="83" y="160" width="24" height="6" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="113" y="144" width="24" height="6" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="113" y="152" width="24" height="6" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="113" y="160" width="24" height="6" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="143" y="144" width="24" height="6" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="143" y="152" width="24" height="6" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<rect x="143" y="160" width="24" height="6" rx="3" fill="#16a34a" fill-opacity="0.55" stroke="#16a34a" stroke-width="1" />
<text x="125" y="214" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >stores energy</text>
<rect x="370" y="60" width="210" height="170" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
<text x="475" y="84" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold" >Respiration</text>
<text x="475" y="102" font-size="12" text-anchor="middle" fill="#6b7280" >in mitochondria · all the time</text>
<ellipse cx="475" cy="160" rx="70" ry="38" fill="#6b7280" fill-opacity="0.12" stroke="#111827" stroke-width="2.5" />
<path d="M425,160 l10,-18 l10,36 l10,-36 l10,36 l10,-36 l10,36 l10,-36 l10,36 l10,-18" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<text x="475" y="214" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >releases energy</text>
<line x1="232" y1="126" x2="368" y2="126" stroke="#16a34a" stroke-width="3" marker-end="url(#aG)" stroke-linecap="round"/>
<text x="300" y="118" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >glucose + O₂</text>
<line x1="368" y1="184" x2="232" y2="184" stroke="#111827" stroke-width="3" marker-end="url(#aK)" stroke-linecap="round"/>
<text x="300" y="206" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >CO₂ + H₂O</text>
<circle cx="70" cy="276" r="16" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
<line x1="93.0" y1="276.0" x2="102.0" y2="276.0" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<line x1="86.3" y1="292.3" x2="92.6" y2="298.6" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<line x1="70.0" y1="299.0" x2="70.0" y2="308.0" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<line x1="53.7" y1="292.3" x2="47.4" y2="298.6" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<line x1="47.0" y1="276.0" x2="38.0" y2="276.0" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<line x1="53.7" y1="259.7" x2="47.4" y2="253.4" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<line x1="70.0" y1="253.0" x2="70.0" y2="244.0" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<line x1="86.3" y1="259.7" x2="92.6" y2="253.4" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<text x="70" y="326" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >light energy</text>
<line x1="100" y1="262" x2="142" y2="234" stroke="#111827" stroke-width="2.5" marker-end="url(#aK)" stroke-linecap="round"/>
<line x1="475" y1="236" x2="475" y2="282" stroke="#111827" stroke-width="2.5" marker-end="url(#aK)" stroke-linecap="round"/>
<text x="475" y="300" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >ATP for cell work</text>
<text x="475" y="318" font-size="13" text-anchor="middle" fill="#111827" >+ some heat</text>
<rect x="120" y="262" width="230" height="60" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" />
<text x="235" y="284" font-size="12" text-anchor="middle" fill="#111827" >Photosynthesis makes the food and</text>
<text x="235" y="300" font-size="12" text-anchor="middle" fill="#111827" >O₂ that respiration uses, and respiration</text>
<text x="235" y="316" font-size="12" text-anchor="middle" fill="#111827" >makes the CO₂ and H₂O it uses.</text>

</g>
</svg>
