<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" role="img">
  <title>Gas exchange in an alveolus</title>
  <desc>An air sac (alveolus) with a very thin wall. A capillary wraps around it. Oxygen diffuses from the air in the alveolus into the blood, and carbon dioxide diffuses from the blood into the air to be breathed out.</desc>
  <defs>
    <marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14532d"/></marker>
    <marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect width="580" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="290" y="22" font-size="16" font-weight="bold" text-anchor="middle">Alveolus: where gas exchange happens</text>
    <!-- bronchiole -->
    <rect x="10" y="176" width="86" height="48" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
    <!-- capillary -->
    <g data-label="capillary">
      <path d="M248.7,89.6 A125,125 0 0 1 228.6,318.9" fill="none" stroke="#6b7280" stroke-width="32" stroke-linecap="round"/>
      <path d="M248.7,89.6 A125,125 0 0 1 228.6,318.9" fill="none" stroke="#f3f4f6" stroke-width="28" stroke-linecap="round"/>
      <ellipse cx="278.4" cy="111.6" rx="7" ry="4.5" transform="rotate(45 278.4 111.6)" fill="#d1d5db" stroke="#6b7280" stroke-width="1"/><ellipse cx="307.5" cy="157.2" rx="7" ry="4.5" transform="rotate(70 307.5 157.2)" fill="#d1d5db" stroke="#6b7280" stroke-width="1"/><ellipse cx="314.5" cy="210.9" rx="7" ry="4.5" transform="rotate(95 314.5 210.9)" fill="#d1d5db" stroke="#6b7280" stroke-width="1"/><ellipse cx="298.3" cy="262.5" rx="7" ry="4.5" transform="rotate(120 298.3 262.5)" fill="#d1d5db" stroke="#6b7280" stroke-width="1"/><ellipse cx="261.7" cy="302.4" rx="7" ry="4.5" transform="rotate(145 261.7 302.4)" fill="#d1d5db" stroke="#6b7280" stroke-width="1"/>
    </g>
    <!-- alveolus -->
    <g data-label="alveolus"><circle cx="190" cy="200" r="110" fill="#ecfdf5" stroke="#16a34a" stroke-width="5"/></g>
    <text x="50" y="246" font-size="12" text-anchor="middle" fill="#14532d">bronchiole</text>
    <text x="150" y="205" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">AIR</text>
    <text x="150" y="221" font-size="12" text-anchor="middle" fill="#14532d">(inside the sac)</text>
    <!-- gas arrows -->
    <line x1="205" y1="150" x2="316" y2="150" stroke="#14532d" stroke-width="4" marker-end="url(#arG)"/>
    <text x="238" y="141" font-size="15" font-weight="bold" fill="#14532d">O₂ in</text>
    <line x1="316" y1="256" x2="205" y2="256" stroke="#6b7280" stroke-width="4" marker-end="url(#arK)"/>
    <text x="222" y="247" font-size="15" font-weight="bold" fill="#6b7280">CO₂ out</text>
    <!-- labels right -->
    <g stroke="#6b7280" stroke-width="1.2" fill="none"><path d="M284,142 L372,98"/><path d="M335,318 L372,332"/></g>
    <text x="376" y="90" font-size="14" font-weight="bold" fill="#14532d">Thin, moist wall</text>
    <text x="376" y="106" font-size="12">one cell thick, so gases</text>
    <text x="376" y="121" font-size="12">pass through easily</text>
    <text x="376" y="338" font-size="14" font-weight="bold" fill="#14532d">Capillary</text>
    <text x="376" y="354" font-size="12">a tiny blood vessel hugging</text>
    <text x="376" y="369" font-size="12">the sac: a huge blood supply</text>
    <rect x="376" y="150" width="190" height="104" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="388" y="172" font-size="13" font-weight="bold">Diffusion</text>
    <text x="388" y="190" font-size="12">Gas moves from where there</text>
    <text x="388" y="205" font-size="12">is MORE of it to where there</text>
    <text x="388" y="220" font-size="12">is LESS. No energy needed.</text>
    <text x="388" y="240" font-size="12" fill="#14532d" font-weight="bold">Blood in: low O₂, high CO₂</text>
  </g>
</svg>
