<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-labelledby="t d">
  <title id="t">Animal cell, labeled</title>
  <desc id="d">An animal cell with nucleus, nucleolus, rough ER, Golgi, mitochondrion, lysosome, peroxisome, centrioles, a small vacuole, free ribosomes, cytoskeleton and cytoplasm inside the cell membrane. No cell wall and no chloroplasts.</desc>
