<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 394" role="img" aria-labelledby="t d">
  <title id="t">Plant cell, labeled</title>
  <desc id="d">A plant cell with a cell wall outside the cell membrane, a large central vacuole, chloroplasts, nucleus, mitochondrion, rough ER, Golgi, peroxisome, free ribosomes, cytoskeleton and cytoplasm. No centrioles and, usually, no lysosomes.</desc>
