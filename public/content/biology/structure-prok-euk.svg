<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 368" role="img" aria-labelledby="t d">
  <title id="t">Prokaryotic and eukaryotic cell</title>
  <desc id="d">A small bacterial cell with a cell wall, a membrane, a nucleoid with circular DNA, ribosomes and a flagellum, and no nucleus. Next to it a much bigger eukaryotic cell with a nucleus and membrane-bound organelles.</desc>
  <defs><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="440" height="368" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Prokaryote vs eukaryote</text>
    <rect x="26" y="100" width="150" height="70" rx="35" fill="#ffffff" stroke="#6b7280" stroke-width="5"/>
    <rect x="31" y="105" width="140" height="60" rx="30" fill="#16a34a" fill-opacity="0.08" stroke="#16a34a" stroke-width="1.8"/>
    <path d="M60,135 q8,-22 20,-8 q14,16 28,-6 q10,-12 18,6 q6,14 -8,18 q-16,6 -28,-2 q-14,-8 -30,-8" fill="none" stroke="#111827" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="52" cy="118" r="2.6" fill="#111827" stroke="#111827" stroke-width="1"/>
    <circle cx="142" cy="122" r="2.6" fill="#111827" stroke="#111827" stroke-width="1"/>
    <circle cx="150" cy="148" r="2.6" fill="#111827" stroke="#111827" stroke-width="1"/>
    <circle cx="70" cy="152" r="2.6" fill="#111827" stroke="#111827" stroke-width="1"/>
    <circle cx="120" cy="156" r="2.6" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="101" y="78" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Prokaryote (bacterium)</text>
    <text x="101" y="196" font-size="12" text-anchor="middle" fill="#111827">DNA loose in the nucleoid</text>
    <text x="101" y="212" font-size="12" text-anchor="middle" fill="#111827">(no nucleus)</text>
    <text x="101" y="232" font-size="12" text-anchor="middle" fill="#111827">no membrane-bound organelles</text>
    <text x="101" y="252" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">about 0.1–5 µm</text>
    <circle cx="325" cy="138" r="66" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="2.4"/>
    <circle cx="313" cy="130" r="24" fill="#16a34a" fill-opacity="0.3" stroke="#16a34a" stroke-width="2"/>
    <circle cx="313" cy="130" r="24" fill="none" stroke="#111827" stroke-width="1.8"/>
    <g transform="translate(355,168) rotate(-20)">
    <ellipse cx="0" cy="0" rx="23" ry="11" fill="#16a34a" fill-opacity="0.3" stroke="#16a34a" stroke-width="1.6"/>
    <path d="M-17,0 l4,-6 l4,12 l4,-12 l4,12 l4,-12 l4,12 l4,-6" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle cx="295" cy="176" r="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
    <path d="M323.0,98 q24.0,-8 48,0" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M325.0,106 q22.0,-8 44,0" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M327.0,114 q20.0,-8 40,0" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M329.0,122 q18.0,-8 36,0" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="325" y="78" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Eukaryote (animal, plant)</text>
    <text x="325" y="226" font-size="12" text-anchor="middle" fill="#111827">DNA inside a nucleus</text>
    <text x="325" y="242" font-size="12" text-anchor="middle" fill="#111827">membrane-bound organelles</text>
    <text x="325" y="262" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">about 10–100 µm</text>
    <rect x="30" y="284" width="380" height="68" rx="10" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="1.2"/>
    <text x="220" y="306" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Both have: a cell membrane, cytoplasm, DNA and ribosomes.</text>
    <text x="220" y="326" font-size="12" text-anchor="middle" fill="#111827">Bacterial ribosomes are smaller. Bacteria have a cell wall.</text>
    <text x="220" y="342" font-size="12" text-anchor="middle" fill="#111827">Eukaryotes are ~10× wider (drawing not to scale).</text>
  </g>
</svg>
