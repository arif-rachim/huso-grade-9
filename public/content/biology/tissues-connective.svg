<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="tct tcd">
  <title id="tct">Bone, cartilage, ligament, tendon and blood</title>
  <desc id="tcd">A joint: the upper and lower bones have cartilage caps and are joined by ligaments. A muscle is attached to the bones by tendons. A blood vessel shows blood as a liquid connective tissue.</desc>
  <defs>
    <marker id="tca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="tcg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Connective tissues around a joint</text>
    <g data-label="bone"><rect x="128" y="46" width="44" height="116" rx="14" fill="#e5e7eb" stroke="#111827" stroke-width="2"/><rect x="128" y="206" width="44" height="116" rx="14" fill="#e5e7eb" stroke="#111827" stroke-width="2"/></g>
    <g data-label="cartilage"><rect x="126" y="160" width="48" height="12" rx="6" fill="#16a34a" fill-opacity="0.6" stroke="#16a34a" stroke-width="1.5"/><rect x="126" y="196" width="48" height="12" rx="6" fill="#16a34a" fill-opacity="0.6" stroke="#16a34a" stroke-width="1.5"/></g>
    <g data-label="ligament"><path d="M132,140 L132,230" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/><path d="M168,140 L168,230" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/></g>
    <g data-label="muscle"><ellipse cx="260" cy="130" rx="30" ry="62" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="260" y="134" font-size="13" text-anchor="middle" font-weight="bold">muscle</text></g>
    <g data-label="tendon"><path d="M254,70 C230,64 200,60 172,62" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round"/><path d="M262,192 C250,230 210,244 172,246" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round"/></g>
    <text x="8" y="100" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">bone</text>
    <text x="8" y="116" font-size="11" text-anchor="start" fill="#6b7280">hard: supports and</text>
    <text x="8" y="130" font-size="11" text-anchor="start" fill="#6b7280">protects</text>
    <line x1="50" y1="104" x2="126" y2="104" stroke="#6b7280"/>
    <text x="8" y="184" font-size="13" text-anchor="start" fill="#16a34a" font-weight="bold">cartilage</text>
    <text x="8" y="200" font-size="11" text-anchor="start" fill="#6b7280">smooth, bendy cap</text>
    <text x="8" y="214" font-size="11" text-anchor="start" fill="#6b7280">on the bone ends</text>
    <line x1="62" y1="190" x2="124" y2="190" stroke="#16a34a"/>
    <text x="8" y="262" font-size="13" text-anchor="start" fill="#16a34a" font-weight="bold">ligament</text>
    <text x="8" y="278" font-size="11" text-anchor="start" fill="#6b7280">bone to bone</text>
    <line x1="62" y1="268" x2="130" y2="236" stroke="#16a34a"/>
    <text x="300" y="92" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">tendon</text>
    <text x="300" y="108" font-size="11" text-anchor="start" fill="#6b7280">muscle to bone</text>
    <line x1="296" y1="98" x2="236" y2="68" stroke="#6b7280"/>
    <text x="300" y="236" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">tendon</text>
    <line x1="296" y1="232" x2="240" y2="238" stroke="#6b7280"/>
    <rect x="15" y="338" width="450" height="52" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
    <path d="M120,350 L440,350 M120,380 L440,380" stroke="#6b7280" stroke-width="2" fill="none"/>
    <ellipse cx="150" cy="365" rx="11" ry="8" fill="#dc2626" fill-opacity="0.7" stroke="#b91c1c"/>
    <ellipse cx="200" cy="365" rx="11" ry="8" fill="#dc2626" fill-opacity="0.7" stroke="#b91c1c"/>
    <ellipse cx="255" cy="365" rx="11" ry="8" fill="#dc2626" fill-opacity="0.7" stroke="#b91c1c"/>
    <ellipse cx="330" cy="365" rx="11" ry="8" fill="#dc2626" fill-opacity="0.7" stroke="#b91c1c"/>
    <ellipse cx="400" cy="365" rx="11" ry="8" fill="#dc2626" fill-opacity="0.7" stroke="#b91c1c"/>
    <circle cx="295" cy="365" r="11" fill="#ffffff" stroke="#111827" stroke-width="1.5"/><circle cx="295" cy="365" r="4" fill="#111827" fill-opacity="0.5"/>
    <text x="24" y="361" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">blood</text>
    <text x="24" y="377" font-size="11" text-anchor="start" fill="#6b7280">liquid tissue</text>
  </g>
</svg>
