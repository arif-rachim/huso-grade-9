<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-labelledby="tmt tmd">
  <title id="tmt">Three types of muscle tissue</title>
  <desc id="tmd">Skeletal muscle has long striped voluntary fibres attached to bones. Smooth muscle has spindle-shaped unstriped involuntary cells in organ walls. Cardiac muscle has branched striped involuntary cells in the heart wall.</desc>
