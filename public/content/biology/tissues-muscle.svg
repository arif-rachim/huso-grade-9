    <text x="245" y="184" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">unstriated</text>
    <text x="245" y="200" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">involuntary</text>
    <text x="245" y="230" font-size="12" text-anchor="middle" fill="#6b7280">Where / job</text>
    <text x="245" y="252" font-size="12" text-anchor="middle" fill="#111827">walls of stomach,</text>
    <text x="245" y="270" font-size="12" text-anchor="middle" fill="#111827">gut, blood vessels</text>
    <text x="245" y="288" font-size="12" text-anchor="middle" fill="#111827">pushes food along,</text>
    <text x="245" y="306" font-size="12" text-anchor="middle" fill="#111827">controls vessel width</text>
    <text x="245" y="340" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="bold">works by itself</text>
    </g>
