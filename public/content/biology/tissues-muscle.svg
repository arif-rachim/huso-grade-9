    <text x="87" y="184" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">striated</text>
    <text x="87" y="200" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">voluntary</text>
    <text x="87" y="230" font-size="12" text-anchor="middle" fill="#6b7280">Where / job</text>
    <text x="87" y="252" font-size="12" text-anchor="middle" fill="#111827">attached to bones</text>
    <text x="87" y="270" font-size="12" text-anchor="middle" fill="#111827">by tendons</text>
    <text x="87" y="288" font-size="12" text-anchor="middle" fill="#111827">moves arms and legs</text>
    <text x="87" y="306" font-size="12" text-anchor="middle" fill="#111827">(also makes heat)</text>
    <text x="87" y="340" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="bold">you decide when</text>
