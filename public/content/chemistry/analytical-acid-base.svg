    <rect x="220.0" y="78" width="28.571428571428573" height="22" rx="0" fill="#6b7280" fill-opacity="0.1"/>
    <rect x="248.57142857142858" y="78" width="28.571428571428573" height="22" rx="0" fill="#6b7280" fill-opacity="0.15000000000000002"/>
    <rect x="277.14285714285717" y="78" width="28.571428571428573" height="22" rx="0" fill="#6b7280" fill-opacity="0.2"/>
    <rect x="305.7142857142857" y="78" width="28.571428571428573" height="22" rx="0" fill="#6b7280" fill-opacity="0.25"/>
    <rect x="334.2857142857143" y="78" width="28.571428571428573" height="22" rx="0" fill="#6b7280" fill-opacity="0.30000000000000004"/>
