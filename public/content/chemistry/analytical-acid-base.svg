    <rect x="391.42857142857144" y="78" width="28.571428571428573" height="22" rx="0" fill="#6b7280" fill-opacity="0.4"/>
    <rect x="20" y="78" width="400" height="22" rx="0" fill="none" fill-opacity="1" stroke="#111827" stroke-width="1.5"/>
    <line x1="20.0" y1="100" x2="20.0" y2="106" stroke="#111827" stroke-width="1.2"/>
    <text x="20.0" y="120" font-size="12" text-anchor="middle" fill="#6b7280">0</text>
    <line x1="48.57142857142857" y1="100" x2="48.57142857142857" y2="106" stroke="#111827" stroke-width="1.2"/>
    <text x="48.57142857142857" y="120" font-size="12" text-anchor="middle" fill="#6b7280">1</text>
    <line x1="77.14285714285714" y1="100" x2="77.14285714285714" y2="106" stroke="#111827" stroke-width="1.2"/>
    <text x="77.14285714285714" y="120" font-size="12" text-anchor="middle" fill="#6b7280">2</text>
    <line x1="105.71428571428572" y1="100" x2="105.71428571428572" y2="106" stroke="#111827" stroke-width="1.2"/>
    <text x="105.71428571428572" y="120" font-size="12" text-anchor="middle" fill="#6b7280">3</text>
