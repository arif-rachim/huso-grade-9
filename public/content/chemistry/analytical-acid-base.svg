    <text x="305.7142857142857" y="120" font-size="12" text-anchor="middle" fill="#6b7280">10</text>
    <line x1="334.2857142857143" y1="100" x2="334.2857142857143" y2="106" stroke="#111827" stroke-width="1.2"/>
    <text x="334.2857142857143" y="120" font-size="12" text-anchor="middle" fill="#6b7280">11</text>
    <line x1="362.8571428571429" y1="100" x2="362.8571428571429" y2="106" stroke="#111827" stroke-width="1.2"/>
    <text x="362.8571428571429" y="120" font-size="12" text-anchor="middle" fill="#6b7280">12</text>
    <line x1="391.42857142857144" y1="100" x2="391.42857142857144" y2="106" stroke="#111827" stroke-width="1.2"/>
    <text x="391.42857142857144" y="120" font-size="12" text-anchor="middle" fill="#6b7280">13</text>
    <line x1="420.0" y1="100" x2="420.0" y2="106" stroke="#111827" stroke-width="1.2"/>
    <text x="420.0" y="120" font-size="12" text-anchor="middle" fill="#6b7280">14</text>
    <text x="120.0" y="50" font-size="13" text-anchor="middle" font-weight="bold" fill="#ca8a04">ACIDIC</text>
    <text x="320.0" y="50" font-size="13" text-anchor="middle" font-weight="bold" fill="#6b7280">BASIC</text>
    <text x="220.0" y="50" font-size="12" text-anchor="middle">neutral</text>
    <text x="62.9" y="68" font-size="11" text-anchor="middle">stomach acid</text>
    <text x="102.9" y="136" font-size="11" text-anchor="middle">vinegar</text>
    <text x="162.9" y="68" font-size="11" text-anchor="middle">coffee</text>
    <text x="220.0" y="136" font-size="11" text-anchor="middle">pure water</text>
    <text x="234.3" y="68" font-size="11" text-anchor="middle">pool</text>
    <text x="257.1" y="152" font-size="11" text-anchor="middle">baking soda</text>
    <text x="320.0" y="68" font-size="11" text-anchor="middle">soap</text>
    <text x="348.6" y="136" font-size="11" text-anchor="middle">ammonia</text>
    <text x="220" y="30" font-size="11" text-anchor="middle"></text>
    <rect x="8" y="160" width="214" height="196" rx="10" fill="none" fill-opacity="1" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="115" y="180" font-size="12" text-anchor="middle" font-weight="bold">Three theories (each one is wider)</text>
    <circle cx="115" cy="292" r="66" fill="#ca8a04" fill-opacity="0.1" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="115" cy="308" r="46" fill="#ca8a04" fill-opacity="0.2" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="115" cy="322" r="24" fill="#ca8a04" fill-opacity="0.35" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="115" y="223" font-size="12" text-anchor="middle" font-weight="bold" fill="#ca8a04">Lewis</text>
    <text x="115" y="238" font-size="11" text-anchor="middle">e⁻-pair acceptor / donor</text>
    <text x="115" y="275" font-size="12" text-anchor="middle" font-weight="bold" fill="#ca8a04">Brønsted–Lowry</text>
    <text x="115" y="289" font-size="11" text-anchor="middle">H⁺ donor / acceptor</text>
    <text x="115" y="322" font-size="11" text-anchor="middle" font-weight="bold" fill="#ca8a04">Arrhenius</text>
    <text x="115" y="336" font-size="10" text-anchor="middle">H⁺ / OH⁻</text>
    <rect x="232" y="160" width="200" height="196" rx="10" fill="#ca8a04" fill-opacity="0.08" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="332" y="180" font-size="11" text-anchor="middle" font-weight="bold" fill="#ca8a04">Buffer = weak acid + conjugate base</text>
    <text x="332" y="204" font-size="13" text-anchor="middle" font-weight="bold">pH = pKa + log([A⁻] ÷ [HA])</text>
    <text x="332" y="226" font-size="12" text-anchor="middle">Add acid:  H⁺ + A⁻ → HA</text>
    <text x="332" y="244" font-size="12" text-anchor="middle">Add base:  OH⁻ + HA → A⁻ + H₂O</text>
    <text x="332" y="270" font-size="12" text-anchor="middle">equal amounts: pH = pKa</text>
    <text x="332" y="288" font-size="12" text-anchor="middle">best range: pH = pKa ± 1</text>
    <text x="332" y="312" font-size="11" text-anchor="middle" fill="#6b7280">Weak acid and conjugate pair:</text>
    <text x="332" y="328" font-size="12" text-anchor="middle" font-weight="bold">Ka × Kb = Kw   (pKa + pKb = 14)</text>
    <text x="332" y="346" font-size="11" text-anchor="middle" fill="#6b7280">pH = −log[H⁺],  pH + pOH = 14</text>
  </g>
</svg>
