<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 372" role="img">
  <title>Acids and bases</title>
  <desc>A pH scale from 0 to 14 with everyday examples (stomach acid, lemon juice, vinegar, coffee, pure water, pool water, baking soda solution, soap, ammonia); three nested acid-base theories (Arrhenius inside Bronsted-Lowry inside Lewis); and a buffer box with the Henderson-Hasselbalch equation.</desc>
  <rect x="0" y="0" width="440" height="372" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220" y="20" font-size="15" text-anchor="middle" font-weight="bold">pH scale, three theories, and buffers</text>
