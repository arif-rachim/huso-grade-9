    <line x1="248.57142857142858" y1="100" x2="248.57142857142858" y2="106" stroke="#111827" stroke-width="1.2"/>
    <text x="248.57142857142858" y="120" font-size="12" text-anchor="middle" fill="#6b7280">8</text>
    <line x1="277.14285714285717" y1="100" x2="277.14285714285717" y2="106" stroke="#111827" stroke-width="1.2"/>
    <text x="277.14285714285717" y="120" font-size="12" text-anchor="middle" fill="#6b7280">9</text>
