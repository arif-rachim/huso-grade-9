<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 362" role="img" aria-labelledby="t d">
  <title id="t">Flame test colors of common metal ions</title>
  <desc id="d">Seven flames with their colors: lithium crimson red, sodium intense yellow, potassium lilac, calcium orange-red, strontium scarlet red, barium apple green, copper blue-green.</desc>
  <defs>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
  </defs>
  <rect x="0" y="0" width="500" height="362" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="250" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Flame tests: the color tells the metal ion</text>
    <rect x="40" y="118" width="44" height="8" fill="#d1d5db" fill-opacity="1" stroke="#6b7280" stroke-width="1.5" />
    <path d="M 62 118 C 42 118 40 90 62 56 C 84 90 82 118 62 118 Z" fill="#dc143c" fill-opacity="0.85" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 62 116 C 53 116 52 104 62 88 C 72 104 71 116 62 116 Z" fill="#ffffff" fill-opacity="0.55" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="144" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Li⁺</text>
    <text x="62" y="160" font-size="12" text-anchor="middle" fill="#6b7280">crimson red</text>
    <rect x="165" y="118" width="44" height="8" fill="#d1d5db" fill-opacity="1" stroke="#6b7280" stroke-width="1.5" />
    <path d="M 187 118 C 167 118 165 90 187 56 C 209 90 207 118 187 118 Z" fill="#facc15" fill-opacity="0.85" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 187 116 C 178 116 177 104 187 88 C 197 104 196 116 187 116 Z" fill="#ffffff" fill-opacity="0.55" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="187" y="144" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Na⁺</text>
    <text x="187" y="160" font-size="12" text-anchor="middle" fill="#6b7280">intense yellow</text>
    <rect x="290" y="118" width="44" height="8" fill="#d1d5db" fill-opacity="1" stroke="#6b7280" stroke-width="1.5" />
    <path d="M 312 118 C 292 118 290 90 312 56 C 334 90 332 118 312 118 Z" fill="#c4a1e8" fill-opacity="0.85" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 312 116 C 303 116 302 104 312 88 C 322 104 321 116 312 116 Z" fill="#ffffff" fill-opacity="0.55" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="312" y="144" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">K⁺</text>
    <text x="312" y="160" font-size="12" text-anchor="middle" fill="#6b7280">lilac (pale violet)</text>
    <rect x="415" y="118" width="44" height="8" fill="#d1d5db" fill-opacity="1" stroke="#6b7280" stroke-width="1.5" />
    <path d="M 437 118 C 417 118 415 90 437 56 C 459 90 457 118 437 118 Z" fill="#ea580c" fill-opacity="0.85" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 437 116 C 428 116 427 104 437 88 C 447 104 446 116 437 116 Z" fill="#ffffff" fill-opacity="0.55" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="437" y="144" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Ca²⁺</text>
    <text x="437" y="160" font-size="12" text-anchor="middle" fill="#6b7280">orange-red</text>
    <rect x="103" y="230" width="44" height="8" fill="#d1d5db" fill-opacity="1" stroke="#6b7280" stroke-width="1.5" />
    <path d="M 125 230 C 105 230 103 202 125 168 C 147 202 145 230 125 230 Z" fill="#b91c1c" fill-opacity="0.85" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 125 228 C 116 228 115 216 125 200 C 135 216 134 228 125 228 Z" fill="#ffffff" fill-opacity="0.55" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="125" y="256" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Sr²⁺</text>
    <text x="125" y="272" font-size="12" text-anchor="middle" fill="#6b7280">scarlet red</text>
    <rect x="228" y="230" width="44" height="8" fill="#d1d5db" fill-opacity="1" stroke="#6b7280" stroke-width="1.5" />
    <path d="M 250 230 C 230 230 228 202 250 168 C 272 202 270 230 250 230 Z" fill="#84cc16" fill-opacity="0.85" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 250 228 C 241 228 240 216 250 200 C 260 216 259 228 250 228 Z" fill="#ffffff" fill-opacity="0.55" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="250" y="256" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Ba²⁺</text>
    <text x="250" y="272" font-size="12" text-anchor="middle" fill="#6b7280">apple green</text>
    <rect x="353" y="230" width="44" height="8" fill="#d1d5db" fill-opacity="1" stroke="#6b7280" stroke-width="1.5" />
    <path d="M 375 230 C 355 230 353 202 375 168 C 397 202 395 230 375 230 Z" fill="#14b8a6" fill-opacity="0.85" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 375 228 C 366 228 365 216 375 200 C 385 216 384 228 375 228 Z" fill="#ffffff" fill-opacity="0.55" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="375" y="256" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Cu²⁺</text>
    <text x="375" y="272" font-size="12" text-anchor="middle" fill="#6b7280">blue-green</text>
    <rect x="18" y="286" width="464" height="62" fill="#ca8a04" fill-opacity="0.12" stroke="#ca8a04" stroke-width="1.5" rx="6" />
    <text x="28" y="306" font-size="12.5" text-anchor="start" fill="#111827">How to: dip a clean wire (or splint) in the salt, then hold it in the</text>
    <text x="28" y="324" font-size="12.5" text-anchor="start" fill="#111827">hot flame. Na⁺ yellow hides K⁺ lilac: look through cobalt-blue glass.</text>
    <text x="28" y="342" font-size="12.5" text-anchor="start" fill="#111827">Li⁺ and Sr²⁺ are both red: Li⁺ is crimson, Sr²⁺ is scarlet.</text>
  </g>
</svg>
