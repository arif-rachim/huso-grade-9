<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" role="img" aria-labelledby="t d">
  <title id="t">Titration curves: strong acid and weak acid titrated with NaOH</title>
  <desc id="d">pH against volume of 0.100 molar NaOH added to 25.00 mL of 0.100 molar acid. Strong acid curve is flat, jumps through pH 7 at 25 mL. Weak acid curve starts near pH 2.9, has a buffer region, half-equivalence at pH 4.74 and equivalence near pH 8.7. Indicator color ranges are shown on the right.</desc>
