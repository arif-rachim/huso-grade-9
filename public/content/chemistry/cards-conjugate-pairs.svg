<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Conjugate acid base pairs">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="240" fill="#ffffff"/>
<text x="200" y="20" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Brønsted: acids donate H⁺, bases accept H⁺</text><g data-label="Acid"><rect x="20" y="50" width="80" height="40" rx="4" fill="#ca8a04" fill-opacity="0.4" stroke="#ca8a04" stroke-width="1.5"/><text x="60" y="75" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Acid HA</text></g><g data-label="Base"><rect x="20" y="130" width="80" height="40" rx="4" fill="#ca8a04" fill-opacity="0.15" stroke="#ca8a04" stroke-width="1.5"/><text x="60" y="155" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Base B</text></g><g data-label="Conjugate base"><rect x="300" y="50" width="80" height="40" rx="4" fill="#ca8a04" fill-opacity="0.15" stroke="#ca8a04" stroke-width="1.5"/><text x="340" y="70" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#111827">Conjugate</text><text x="340" y="84" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">base A⁻</text></g><g data-label="Conjugate acid"><rect x="300" y="130" width="80" height="40" rx="4" fill="#ca8a04" fill-opacity="0.4" stroke="#ca8a04" stroke-width="1.5"/><text x="340" y="150" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#111827">Conjugate</text><text x="340" y="164" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">acid BH⁺</text></g><line x1="102" y1="70" x2="298" y2="70" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><text x="200" y="62" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827">loses H⁺</text><line x1="102" y1="150" x2="298" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><text x="200" y="142" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827">gains H⁺</text><text x="200" y="205" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#6b7280">A conjugate pair differs by exactly one H⁺</text><text x="200" y="225" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#6b7280">Strong acid → weak conjugate base</text>
</svg>
