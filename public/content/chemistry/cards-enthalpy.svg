<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 255" role="img" aria-label="Exothermic and endothermic enthalpy diagrams">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="255" fill="#ffffff"/>
<text x="200" y="18" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Enthalpy diagrams</text><text x="100" y="38" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#ca8a04" font-weight="bold">Exothermic (ΔH &lt; 0)</text><text x="300" y="38" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#ca8a04" font-weight="bold">Endothermic (ΔH &gt; 0)</text><line x1="20" y1="205" x2="190" y2="205" stroke="#6b7280" stroke-width="1.5"/><line x1="220" y1="205" x2="390" y2="205" stroke="#6b7280" stroke-width="1.5"/><line x1="30" y1="80" x2="90" y2="80" stroke="#111827" stroke-width="3"/><line x1="130" y1="160" x2="185" y2="160" stroke="#111827" stroke-width="3"/><line x1="90" y1="80" x2="130" y2="160" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="230" y1="160" x2="290" y2="160" stroke="#111827" stroke-width="3"/><line x1="330" y1="80" x2="385" y2="80" stroke="#111827" stroke-width="3"/><line x1="290" y1="160" x2="330" y2="80" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/><g data-label="Reactants"><text x="60" y="72" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#111827">Reactants</text></g><g data-label="Products"><text x="157" y="178" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#111827">Products</text></g><text x="260" y="178" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#111827">Reactants</text><text x="357" y="72" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#111827">Products</text><line x1="110" y1="90" x2="110" y2="150" stroke="#ca8a04" stroke-width="2.5" marker-end="url(#ar)"/><text x="122" y="125" font-family="sans-serif" font-size="13" text-anchor="start" fill="#ca8a04" font-weight="bold">ΔH</text><line x1="310" y1="150" x2="310" y2="90" stroke="#ca8a04" stroke-width="2.5" marker-end="url(#ar)"/><text x="322" y="125" font-family="sans-serif" font-size="13" text-anchor="start" fill="#ca8a04" font-weight="bold">ΔH</text><text x="100" y="225" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">heat released, products lower</text><text x="300" y="225" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">heat absorbed, products higher</text><text x="200" y="245" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Hess's law: ΔH_total = ΔH₁ + ΔH₂ (path does not matter)</text>
</svg>
