<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 245" role="img" aria-label="Equilibrium constant expressions">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="245" fill="#ffffff"/>
<text x="200" y="18" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Equilibrium constants</text><rect x="20" y="35" width="360" height="55" rx="4" fill="#ca8a04" fill-opacity="0.12" stroke="#ca8a04" stroke-width="1.5"/><text x="200" y="58" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">aA + bB ⇌ cC + dD</text><text x="200" y="80" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#ca8a04" font-weight="bold">Kc = [C]ᶜ[D]ᵈ / ([A]ᵃ[B]ᵇ)</text><text x="200" y="115" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827">Pure solids and liquids are NOT in K</text><text x="200" y="140" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827">Kp = Kc (RT)^Δn   (Δn = gas moles products - reactants)</text><text x="200" y="170" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#ca8a04" font-weight="bold">ΔG° = -RT ln K</text><text x="200" y="192" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">K &gt; 1: products favored, ΔG° &lt; 0</text><text x="200" y="207" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">K &lt; 1: reactants favored, ΔG° &gt; 0</text><text x="200" y="232" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">ΔT = i·K·m  (freezing point down, boiling point up)</text>
</svg>
