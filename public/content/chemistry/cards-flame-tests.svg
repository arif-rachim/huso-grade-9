<text x="200" y="20" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Flame test colors</text><path d="M60,110 Q40,80 60,45 Q80,80 60,110 Z" fill="#dc2626" fill-opacity="0.85" stroke="#6b7280" stroke-width="1"/><g data-label="Li⁺"><text x="60" y="128" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Li⁺</text></g><text x="60" y="142" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">crimson red</text><path d="M190,110 Q170,80 190,45 Q210,80 190,110 Z" fill="#eab308" fill-opacity="0.85" stroke="#6b7280" stroke-width="1"/><g data-label="Na⁺"><text x="190" y="128" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Na⁺</text></g><text x="190" y="142" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">intense yellow</text><path d="M320,110 Q300,80 320,45 Q340,80 320,110 Z" fill="#a78bfa" fill-opacity="0.85" stroke="#6b7280" stroke-width="1"/><g data-label="K⁺"><text x="320" y="128" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">K⁺</text></g><text x="320" y="142" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">lilac / violet</text><path d="M60,222 Q40,192 60,157 Q80,192 60,222 Z" fill="#f97316" fill-opacity="0.85" stroke="#6b7280" stroke-width="1"/><g data-label="Ca²⁺"><text x="60" y="240" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Ca²⁺</text></g><text x="60" y="254" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">orange-red</text><path d="M190,222 Q170,192 190,157 Q210,192 190,222 Z" fill="#10b981" fill-opacity="0.85" stroke="#6b7280" stroke-width="1"/><g data-label="Cu²⁺"><text x="190" y="240" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Cu²⁺</text></g><text x="190" y="254" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">blue-green</text><path d="M320,222 Q300,192 320,157 Q340,192 320,222 Z" fill="#84cc16" fill-opacity="0.85" stroke="#6b7280" stroke-width="1"/><g data-label="Ba²⁺"><text x="320" y="240" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Ba²⁺</text></g><text x="320" y="254" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">pale green</text>
