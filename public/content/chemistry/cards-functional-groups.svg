<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 242" role="img" aria-label="Common functional groups and formulas">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="242" fill="#ffffff"/>
<text x="200" y="18" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Functional groups</text><rect x="15" y="38" width="185" height="42" rx="4" fill="#ca8a04" fill-opacity="0.12" stroke="#ca8a04" stroke-width="1.5"/><g data-label="Alcohol"><text x="25" y="63" font-family="sans-serif" font-size="13" text-anchor="start" fill="#ca8a04" font-weight="bold">Alcohol</text></g><text x="190" y="64" font-family="sans-serif" font-size="13" text-anchor="end" fill="#111827">R-OH</text><rect x="210" y="38" width="185" height="42" rx="4" fill="#ca8a04" fill-opacity="0.12" stroke="#ca8a04" stroke-width="1.5"/><g data-label="Aldehyde"><text x="220" y="63" font-family="sans-serif" font-size="13" text-anchor="start" fill="#ca8a04" font-weight="bold">Aldehyde</text></g><text x="385" y="64" font-family="sans-serif" font-size="13" text-anchor="end" fill="#111827">R-CHO</text><rect x="15" y="90" width="185" height="42" rx="4" fill="#ca8a04" fill-opacity="0.12" stroke="#ca8a04" stroke-width="1.5"/><g data-label="Ketone"><text x="25" y="115" font-family="sans-serif" font-size="13" text-anchor="start" fill="#ca8a04" font-weight="bold">Ketone</text></g><text x="190" y="116" font-family="sans-serif" font-size="13" text-anchor="end" fill="#111827">R-CO-R</text><rect x="210" y="90" width="185" height="42" rx="4" fill="#ca8a04" fill-opacity="0.12" stroke="#ca8a04" stroke-width="1.5"/><g data-label="Carboxylic acid"><text x="220" y="115" font-family="sans-serif" font-size="13" text-anchor="start" fill="#ca8a04" font-weight="bold">Carboxylic acid</text></g><text x="385" y="116" font-family="sans-serif" font-size="13" text-anchor="end" fill="#111827">R-COOH</text><rect x="15" y="142" width="185" height="42" rx="4" fill="#ca8a04" fill-opacity="0.12" stroke="#ca8a04" stroke-width="1.5"/><g data-label="Ester"><text x="25" y="167" font-family="sans-serif" font-size="13" text-anchor="start" fill="#ca8a04" font-weight="bold">Ester</text></g><text x="190" y="168" font-family="sans-serif" font-size="13" text-anchor="end" fill="#111827">R-COO-R</text><rect x="210" y="142" width="185" height="42" rx="4" fill="#ca8a04" fill-opacity="0.12" stroke="#ca8a04" stroke-width="1.5"/><g data-label="Amine"><text x="220" y="167" font-family="sans-serif" font-size="13" text-anchor="start" fill="#ca8a04" font-weight="bold">Amine</text></g><text x="385" y="168" font-family="sans-serif" font-size="13" text-anchor="end" fill="#111827">R-NH₂</text><text x="200" y="210" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Acidity: RCOOH &gt; phenol &gt; H₂O &gt; alcohol</text><text x="200" y="230" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Amines are bases (lone pair on N picks up H⁺)</text>
</svg>
