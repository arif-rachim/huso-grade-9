<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 242" role="img" aria-label="Ideal gas law and related formulas">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="242" fill="#ffffff"/>
<text x="200" y="18" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Ideal gas law</text><text x="200" y="60" font-family="sans-serif" font-size="26" text-anchor="middle" fill="#ca8a04" font-weight="bold">PV = nRT</text><text x="200" y="90" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#6b7280">R = 0.0821 L·atm/(mol·K) = 8.314 J/(mol·K)</text><text x="200" y="125" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">T must be in kelvin: K = °C + 273.15</text><text x="200" y="150" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827">STP: 0 °C, 1 atm → 1 mol = 22.4 L</text><text x="200" y="185" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827">Combined: P₁V₁/T₁ = P₂V₂/T₂</text><text x="200" y="210" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Boyle: P ↑ then V ↓ (T constant)    Charles: V ∝ T</text><text x="200" y="228" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Dalton: P_total = P₁ + P₂ + …</text>
</svg>
