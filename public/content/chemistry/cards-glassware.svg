<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Common laboratory glassware">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="240" fill="#ffffff"/>
<text x="200" y="18" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Pick the right glassware</text><path d="M50,50 L50,150 L90,150 L90,50" fill="none" stroke="#111827" stroke-width="2"/><line x1="45" y1="50" x2="95" y2="50" stroke="#111827" stroke-width="2"/><line x1="50" y1="70" x2="62" y2="70" stroke="#111827" stroke-width="1"/><line x1="50" y1="90" x2="62" y2="90" stroke="#111827" stroke-width="1"/><line x1="50" y1="110" x2="62" y2="110" stroke="#111827" stroke-width="1"/><line x1="50" y1="130" x2="62" y2="130" stroke="#111827" stroke-width="1"/><g data-label="Graduated cylinder"><text x="70" y="172" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#ca8a04" font-weight="bold">Graduated</text><text x="70" y="185" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#ca8a04" font-weight="bold">cylinder</text></g><path d="M135,45 L135,150 L145,165 L155,150 L155,45" fill="none" stroke="#111827" stroke-width="2"/><line x1="130" y1="45" x2="160" y2="45" stroke="#111827" stroke-width="2"/><g data-label="Burette"><text x="145" y="185" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#ca8a04" font-weight="bold">Burette</text></g><path d="M215,45 L215,75 Q195,110 195,140 Q195,155 215,155 Q235,155 235,140 Q235,110 215,75" fill="none" stroke="#111827" stroke-width="2"/><line x1="215" y1="45" x2="215" y2="60" stroke="#111827" stroke-width="2"/><line x1="195" y1="100" x2="235" y2="100" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="5 4"/><g data-label="Volumetric flask"><text x="215" y="172" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#ca8a04" font-weight="bold">Volumetric</text><text x="215" y="185" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#ca8a04" font-weight="bold">flask</text></g><path d="M300,60 L270,150 L330,150 L300,60" fill="none" stroke="#111827" stroke-width="2"/><line x1="295" y1="60" x2="305" y2="60" stroke="#111827" stroke-width="2"/><g data-label="Erlenmeyer flask"><text x="300" y="172" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#ca8a04" font-weight="bold">Erlenmeyer</text><text x="300" y="185" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#ca8a04" font-weight="bold">flask</text></g><text x="70" y="215" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">rough volumes</text><text x="145" y="215" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">delivers exact</text><text x="145" y="227" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">variable volume</text><text x="215" y="215" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">exact volume</text><text x="215" y="227" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">of ONE mark</text><text x="300" y="215" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">swirl and titrate;</text><text x="300" y="227" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">not for measuring</text>
</svg>
