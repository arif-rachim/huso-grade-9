ze="11" text-anchor="middle" fill="#6b7280">3</text><rect x="320" y="190.625" width="36" height="9.375" rx="4" fill="#ca8a04" fill-opacity="0.3" stroke="#ca8a04" stroke-width="1.5"/><text x="338" y="185.625" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#111827" font-weight="bold">6.25%</text><text x="338" y="215" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">4</text><g data-label="Remaining fraction"><text x="300" y="60" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#ca8a04" font-weight="bold">N = N₀ × (½)ⁿ</text></g>
