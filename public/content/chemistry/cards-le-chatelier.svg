<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 255" role="img" aria-label="Le Chatelier shifts for concentration pressure temperature catalyst">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="255" fill="#ffffff"/>
<text x="200" y="20" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Le Chatelier: the system fights the change</text><rect x="40" y="45" width="320" height="50" rx="4" fill="#ca8a04" fill-opacity="0.1" stroke="#ca8a04" stroke-width="1.5"/><text x="200" y="78" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">N₂ + 3H₂  ⇌  2NH₃     (exothermic)</text><text x="30" y="130" font-family="sans-serif" font-size="12" text-anchor="start" fill="#111827">Add reactant or remove product</text><text x="235" y="130" font-family="sans-serif" font-size="12" text-anchor="start" fill="#ca8a04" font-weight="bold">→ shifts right</text><text x="30" y="158" font-family="sans-serif" font-size="12" text-anchor="start" fill="#111827">Raise pressure / shrink volume</text><text x="235" y="158" font-family="sans-serif" font-size="12" text-anchor="start" fill="#ca8a04" font-weight="bold">→ fewer-gas-moles side</text><text x="30" y="186" font-family="sans-serif" font-size="12" text-anchor="start" fill="#111827">Raise temperature</text><text x="235" y="186" font-family="sans-serif" font-size="12" text-anchor="start" fill="#ca8a04" font-weight="bold">→ endothermic side</text><text x="30" y="214" font-family="sans-serif" font-size="12" text-anchor="start" fill="#111827">Add a catalyst</text><text x="235" y="214" font-family="sans-serif" font-size="12" text-anchor="start" fill="#ca8a04" font-weight="bold">→ no shift, same K</text><text x="200" y="245" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Only a change in temperature changes the value of K</text>
</svg>
