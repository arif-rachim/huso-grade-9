<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img" aria-label="Beaker showing molarity and dilution formulas">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="230" fill="#ffffff"/>
<text x="200" y="20" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Molarity: moles per liter of SOLUTION</text><path d="M80,50 L80,170 Q80,190 100,190 L160,190 Q180,190 180,170 L180,50" fill="none" stroke="#111827" stroke-width="2"/><rect x="82" y="100" width="96" height="88" fill="#ca8a04" fill-opacity="0.25"/><g data-label="Solute"><circle cx="110" cy="150" r="5" fill="#ca8a04" fill-opacity="0.9" stroke="#ca8a04" stroke-width="1.5"/><circle cx="140" cy="165" r="5" fill="#ca8a04" fill-opacity="0.9" stroke="#ca8a04" stroke-width="1.5"/><circle cx="125" cy="125" r="5" fill="#ca8a04" fill-opacity="0.9" stroke="#ca8a04" stroke-width="1.5"/><circle cx="155" cy="140" r="5" fill="#ca8a04" fill-opacity="0.9" stroke="#ca8a04" stroke-width="1.5"/><text x="205" y="150" font-family="sans-serif" font-size="12" text-anchor="start" fill="#ca8a04" font-weight="bold">solute (mol)</text></g><g data-label="Solution volume"><text x="205" y="120" font-family="sans-serif" font-size="12" text-anchor="start" fill="#ca8a04" font-weight="bold">solution (L)</text></g><text x="330" y="70" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">M = n / V</text><text x="330" y="95" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#6b7280">mol/L</text><text x="330" y="140" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Dilution:</text><text x="330" y="160" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#ca8a04" font-weight="bold">M₁V₁ = M₂V₂</text><text x="130" y="215" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#6b7280">Molality = mol solute / kg SOLVENT</text>
</svg>
