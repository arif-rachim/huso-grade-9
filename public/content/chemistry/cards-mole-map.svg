<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Mole map linking mass moles particles and gas volume">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="240" fill="#ffffff"/>
<text x="200" y="20" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">The mole map</text><g data-label="Mass"><rect x="10" y="90" width="90" height="50" rx="4" fill="#ca8a04" fill-opacity="0.15" stroke="#ca8a04" stroke-width="1.5"/><text x="55" y="112" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Mass (g)</text><text x="55" y="129" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">m</text></g><g data-label="Moles"><rect x="155" y="90" width="90" height="50" rx="4" fill="#ca8a04" fill-opacity="0.4" stroke="#ca8a04" stroke-width="1.5"/><text x="200" y="112" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Moles</text><text x="200" y="129" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">n</text></g><g data-label="Particles"><rect x="300" y="40" width="90" height="50" rx="4" fill="#ca8a04" fill-opacity="0.15" stroke="#ca8a04" stroke-width="1.5"/><text x="345" y="62" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Particles</text><text x="345" y="79" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">N</text></g><g data-label="Gas volume"><rect x="300" y="140" width="90" height="50" rx="4" fill="#ca8a04" fill-opacity="0.15" stroke="#ca8a04" stroke-width="1.5"/><text x="345" y="162" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Gas volume</text><text x="345" y="179" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">V at STP</text></g><line x1="102" y1="105" x2="153" y2="105" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><text x="128" y="98" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#111827">÷ M</text><line x1="153" y1="125" x2="102" y2="125" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><text x="128" y="140" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#111827">× M</text><line x1="247" y1="100" x2="298" y2="70" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><text x="290" y="105" font-family="sans-serif" font-size="10" text-anchor="end" fill="#111827">× 6.02×10²³</text><line x1="247" y1="130" x2="298" y2="160" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><text x="240" y="160" font-family="sans-serif" font-size="10" text-anchor="end" fill="#111827">× 22.4 L</text><text x="200" y="225" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Molar mass M in g/mol; 1 mol = 6.02×10²³ particles</text>
</svg>
