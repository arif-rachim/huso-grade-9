ll="#ca8a04" fill-opacity="0.4" stroke="#ca8a04" stroke-width="1.5"/><text x="357" y="70" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">hex-</text><text x="357" y="102" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#6b7280">6 C</text><g data-label="alkane -ane"><text x="200" y="140" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#ca8a04" font-weight="bold">single bonds: -ane (CₙH₂ₙ₊₂)</text></g><g data-label="alkene -ene"><text x="200" y="165" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#ca8a04" font-weight="bold">double bond C=C: -ene (CₙH₂ₙ)</text></g><g data-label="alkyne -yne"><text x="200" y="190" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#ca8a04" font-weight="bold">triple bond C≡C: -yne (CₙH₂ₙ₋₂)</text></g><text x="200" y="225" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Number the chain from the end nearest the double bond or group</text>
