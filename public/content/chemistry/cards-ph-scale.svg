<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="pH scale from 0 to 14 with formulas">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="240" fill="#ffffff"/>
<text x="200" y="20" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">pH scale at 25 °C</text><rect x="20" y="50" width="160" height="40" rx="4" fill="#ca8a04" fill-opacity="0.4" stroke="#ca8a04" stroke-width="1.5"/><rect x="180" y="50" width="40" height="40" rx="4" fill="#6b7280" fill-opacity="0.1" stroke="#6b7280" stroke-width="1.5"/><rect x="220" y="50" width="160" height="40" rx="4" fill="#ca8a04" fill-opacity="0.15" stroke="#ca8a04" stroke-width="1.5"/><g data-label="Acidic"><text x="100" y="75" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">ACIDIC  pH &lt; 7</text></g><g data-label="Neutral"><text x="200" y="75" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">7</text></g><g data-label="Basic"><text x="300" y="75" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">BASIC  pH &gt; 7</text></g><text x="20" y="110" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827">0</text><text x="200" y="110" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827">7</text><text x="380" y="110" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827">14</text><text x="100" y="135" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#6b7280">[H⁺] &gt; 10⁻⁷ M</text><text x="300" y="135" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#6b7280">[OH⁻] &gt; 10⁻⁷ M</text><text x="200" y="170" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">pH = -log[H⁺]    pOH = -log[OH⁻]</text><text x="200" y="195" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#ca8a04" font-weight="bold">pH + pOH = 14      Kw = [H⁺][OH⁻] = 10⁻¹⁴</text><text x="200" y="225" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#6b7280">Each pH step = 10× change in [H⁺]</text>
</svg>
