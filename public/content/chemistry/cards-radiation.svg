<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" role="img" aria-label="Alpha beta gamma penetration through paper aluminum lead">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="470" height="250" fill="#ffffff"/>
<text x="235" y="22" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Penetrating power of radiation</text><circle cx="40" cy="120" r="22" fill="#ca8a04" fill-opacity="0.15" stroke="#ca8a04" stroke-width="1.5"/><text x="40" y="124" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#111827">source</text><rect x="130" y="50" width="12" height="140" rx="4" fill="#6b7280" fill-opacity="0.25" stroke="#6b7280" stroke-width="1.5"/><rect x="210" y="50" width="12" height="140" rx="4" fill="#6b7280" fill-opacity="0.4" stroke="#6b7280" stroke-width="1.5"/><rect x="290" y="50" width="24" height="140" rx="4" fill="#111827" fill-opacity="0.5" stroke="#111827" stroke-width="1.5"/><g data-label="Paper"><text x="136" y="210" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827">Paper</text></g><g data-label="Aluminum"><text x="216" y="210" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827">Aluminum</text></g><g data-label="Lead"><text x="302" y="210" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827">Lead</text></g><line x1="58" y1="70" x2="128" y2="70" stroke="#ca8a04" stroke-width="3"/><text x="75" y="62" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#ca8a04" font-weight="bold">alpha</text><line x1="58" y1="120" x2="208" y2="120" stroke="#ca8a04" stroke-width="3"/><text x="75" y="112" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#ca8a04" font-weight="bold">beta</text><line x1="58" y1="170" x2="288" y2="170" stroke="#ca8a04" stroke-width="3"/><text x="75" y="162" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#ca8a04" font-weight="bold">gamma</text><text x="62" y="88" font-family="sans-serif" font-size="11" text-anchor="start" fill="#6b7280">stopped by paper</text><text x="150" y="138" font-family="sans-serif" font-size="11" text-anchor="start" fill="#6b7280">stopped by aluminum</text><t