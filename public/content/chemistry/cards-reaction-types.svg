<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 248" role="img" aria-label="Five reaction types with general equations">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="248" fill="#ffffff"/>
<text x="200" y="18" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Five reaction types</text><g data-label="Synthesis"><rect x="15" y="38" width="140" height="30" rx="4" fill="#ca8a04" fill-opacity="0.3" stroke="#ca8a04" stroke-width="1.5"/><text x="85" y="58" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Synthesis</text></g><text x="175" y="58" font-family="sans-serif" font-size="13" text-anchor="start" fill="#111827">A + B → AB</text><g data-label="Decomposition"><rect x="15" y="76" width="140" height="30" rx="4" fill="#ca8a04" fill-opacity="0.3" stroke="#ca8a04" stroke-width="1.5"/><text x="85" y="96" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Decomposition</text></g><text x="175" y="96" font-family="sans-serif" font-size="13" text-anchor="start" fill="#111827">AB → A + B</text><g data-label="Single replacement"><rect x="15" y="114" width="140" height="30" rx="4" fill="#ca8a04" fill-opacity="0.3" stroke="#ca8a04" stroke-width="1.5"/><text x="85" y="134" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Single replacement</text></g><text x="175" y="134" font-family="sans-serif" font-size="13" text-anchor="start" fill="#111827">A + BC → AC + B</text><g data-label="Double replacement"><rect x="15" y="152" width="140" height="30" rx="4" fill="#ca8a04" fill-opacity="0.3" stroke="#ca8a04" stroke-width="1.5"/><text x="85" y="172" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Double replacement</text></g><text x="175" y="172" font-family="sans-serif" font-size="13" text-anchor="start" fill="#111827">AB + CD → AD + CB</text><g data-label="Combustion"><rect x="15" y="190" width="140" height="30" rx="4" fill="#ca8a04" fill-opacity="0.3" stroke="#ca8a04" stroke-width="1.5"/><text x="85" y="210" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Combustion</text></g><text x="175" y="210" font-family="sans-serif" font-size="13" text-anchor="start" fill="#111827">fuel + O₂ → CO₂ + H₂O</text><text x="200" y="235" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Precipitation and acid-base reactions are double replacement</text>
</svg>
