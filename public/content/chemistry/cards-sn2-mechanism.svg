<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 245" role="img" aria-label="SN2 backside attack mechanism">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="245" fill="#ffffff"/>
<text x="200" y="18" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">SN2: one step, backside attack, inversion</text><circle cx="210" cy="100" r="16" fill="#ca8a04" fill-opacity="0.4" stroke="#ca8a04" stroke-width="1.5"/><text x="210" y="105" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">C</text><line x1="196" y1="92" x2="170" y2="75" stroke="#111827" stroke-width="2.5"/><line x1="196" y1="108" x2="170" y2="125" stroke="#111827" stroke-width="2.5"/><line x1="224" y1="100" x2="252" y2="100" stroke="#111827" stroke-width="2.5"/><text x="160" y="72" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827">R</text><text x="160" y="135" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827">R</text><text x="262" y="104" font-family="sans-serif" font-size="12" text-anchor="start" fill="#111827">R</text><g data-label="Nucleophile"><text x="40" y="105" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#ca8a04" font-weight="bold">Nu⁻</text></g><g data-label="Leaving group"><text x="330" y="60" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#ca8a04" font-weight="bold">X (leaves)</text></g><path d="M70,100 Q70,100 150,100" fill="none" stroke="#ca8a04" stroke-width="2.5" marker-end="url(#ar)"/><line x1="238" y1="85" x2="320" y2="65" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="100" y="140" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">attacks from the side</text><text x="100" y="153" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">opposite the leaving group</text><text x="200" y="195" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Rate = k[substrate][Nu⁻]   (second order)</text><text x="200" y="215" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Best on methyl and primary carbons</text><text x="200" y="233" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">SN1: carbocation first, so tertiary carbons, racemization</text>
</svg>
