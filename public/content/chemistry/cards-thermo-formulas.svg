<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" role="img" aria-label="Thermochemistry formulas">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="252" fill="#ffffff"/>
<text x="200" y="18" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Thermochemistry toolkit</text><text x="20" y="50" font-family="sans-serif" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">ΔU = q + w</text><text x="380" y="50" font-family="sans-serif" font-size="11" text-anchor="end" fill="#6b7280">first law</text><text x="20" y="80" font-family="sans-serif" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">q = m c ΔT</text><text x="380" y="80" font-family="sans-serif" font-size="11" text-anchor="end" fill="#6b7280">heating a sample</text><text x="20" y="110" font-family="sans-serif" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">ΔH° = ΣΔHf°(products) - ΣΔHf°(reactants)</text><text x="20" y="140" font-family="sans-serif" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">ΔH° = Σ bonds broken - Σ bonds formed</text><text x="20" y="170" font-family="sans-serif" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">ΔG = ΔH - TΔS</text><text x="380" y="170" font-family="sans-serif" font-size="11" text-anchor="end" fill="#6b7280">spontaneous if ΔG &lt; 0</text><text x="20" y="200" font-family="sans-serif" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">Hess: add steps, add ΔH; flip step, flip sign</text><text x="200" y="240" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Entropy S rises: solid → liquid → gas, and with more particles</text>
</svg>
