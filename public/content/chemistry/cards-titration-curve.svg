<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 245" role="img" aria-label="Titration curve with equivalence point at pH 7">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="245" fill="#ffffff"/>
<text x="200" y="18" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Strong acid + strong base titration curve</text><line x1="50" y1="210" x2="370" y2="210" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><line x1="50" y1="210" x2="50" y2="30" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><text x="210" y="230" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">volume of base added (mL)</text><text x="22" y="120" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#6b7280">pH</text><path d="M50,190 L150,180 L200,165 L225,140 L236,120 L246,60 L260,48 L300,42 L360,38" fill="none" stroke="#ca8a04" stroke-width="3"/><line x1="50" y1="120" x2="240" y2="120" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="240" y1="120" x2="240" y2="210" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/><g data-label="Equivalence point"><circle cx="240" cy="120" r="6" fill="#ca8a04" fill-opacity="1" stroke="#ca8a04" stroke-width="1.5"/><text x="255" y="135" font-family="sans-serif" font-size="12" text-anchor="start" fill="#ca8a04" font-weight="bold">equivalence point</text><text x="255" y="149" font-family="sans-serif" font-size="10" text-anchor="start" fill="#6b7280">pH 7 (strong/strong)</text></g><text x="75" y="114" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">pH 7</text><text x="110" y="168" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">acid in flask</text><text x="310" y="70" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">excess base</text>
</svg>
