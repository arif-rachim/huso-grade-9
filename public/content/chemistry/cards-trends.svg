<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 235" role="img" aria-label="Periodic trends across a period and down a group">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="235" fill="#ffffff"/>
<text x="200" y="20" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Periodic trends</text><rect x="60" y="40" width="220" height="150" rx="4" fill="#ca8a04" fill-opacity="0.06" stroke="#ca8a04" stroke-width="1.2"/><line x1="70" y1="200" x2="270" y2="200" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><line x1="50" y1="50" x2="50" y2="180" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><text x="170" y="218" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">across a period (left to right)</text><text x="25" y="110" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">down</text><text x="25" y="124" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">a group</text><g data-label="Ionization energy"><text x="170" y="80" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#ca8a04" font-weight="bold">Ionization energy: → and ↑</text></g><g data-label="Electronegativity"><text x="170" y="102" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#ca8a04" font-weight="bold">Electronegativity: → and ↑</text></g><g data-label="Atomic radius"><text x="170" y="134" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#ca8a04" font-weight="bold">Atomic radius: ← and ↓</text></g><text x="170" y="156" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#ca8a04" font-weight="bold">Metallic character: ← and ↓</text><text x="170" y="178" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">(bigger value in the arrow direction)</text><text x="340" y="70" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Fluorine:</text><text x="340" y="86" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">top right</text><text x="340" y="100" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">highest EN</text><text x="340" y="140" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Cesium /</text><text x="340" y="156" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Francium:</text><text x="340" y="172" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">bottom left</text><text x="340" y="186" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">biggest, most</text><text x="340" y="200" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">reactive metals</text>
</svg>
