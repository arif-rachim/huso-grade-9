<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="VSEPR geometries linear trigonal planar tetrahedral">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="250" fill="#ffffff"/>
<text x="200" y="20" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">VSEPR: electron pairs spread out</text><circle cx="70" cy="85" r="12" fill="#ca8a04" fill-opacity="0.4" stroke="#ca8a04" stroke-width="1.5"/><line x1="58" y1="85" x2="20" y2="85" stroke="#ca8a04" stroke-width="3"/><line x1="82" y1="85" x2="120" y2="85" stroke="#ca8a04" stroke-width="3"/><g data-label="Linear"><text x="70" y="150" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#ca8a04" font-weight="bold">Linear</text></g><text x="70" y="168" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827">180°</text><text x="70" y="184" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">CO2</text><circle cx="200" cy="85" r="12" fill="#ca8a04" fill-opacity="0.4" stroke="#ca8a04" stroke-width="1.5"/><line x1="200" y1="73" x2="200" y2="40" stroke="#ca8a04" stroke-width="3"/><line x1="190" y1="92" x2="162" y2="112" stroke="#ca8a04" stroke-width="3"/><line x1="210" y1="92" x2="238" y2="112" stroke="#ca8a04" stroke-width="3"/><g data-label="Trigonal planar"><text x="200" y="150" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#ca8a04" font-weight="bold">Trigonal planar</text></g><text x="200" y="168" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827">120°</text><text x="200" y="184" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">BF3</text><circle cx="330" cy="85" r="12" fill="#ca8a04" fill-opacity="0.4" stroke="#ca8a04" stroke-width="1.5"/><line x1="330" y1="73" x2="330" y2="40" stroke="#ca8a04" stroke-width="3"/><line x1="319" y1="90" x2="290" y2="112" stroke="#ca8a04" stroke-width="3"/><line x1="341" y1="90" x2="370" y2="112" stroke="#ca8a04" stroke-width="3"/><line x1="334" y1="95" x2="344" y2="120" stroke="#ca8a04" stroke-width="3" stroke-dasharray="5 4"/><g data-label="Tetrahedral"><text x="330" y="150" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#ca8a04" font-weight="bold">Tetrahedral</text></g><text x="330" y="168" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111827">109.5°</text><text x="330" y="184" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">CH4</text><text x="70" y="215" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">2 pairs</text><text x="200" y="215" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">3 pairs</text><text x="330" y="215" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">4 pairs</text><text x="200" y="238" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Lone pairs push bonds closer: NH3 pyramidal (107°), H2O bent (104.5°)</text>
