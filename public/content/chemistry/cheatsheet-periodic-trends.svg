<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" role="img" aria-labelledby="t d">
  <title id="t">Periodic trends on a blank periodic table</title>
  <desc id="d">A blank periodic table outline with s, d and p blocks. An arrow across a period points right: ionization energy, electronegativity and electron affinity increase, atomic radius and metallic character decrease. An arrow down a group points down: atomic radius and metallic character increase, ionization energy and electronegativity decrease. Fluorine in the top right is the most electronegative; francium and cesium at the bottom left have the largest radius.</desc>
