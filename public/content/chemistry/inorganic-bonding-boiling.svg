<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 276" role="img">
  <title>Boiling points of hydrides</title>
  <desc>Boiling points of group 16 hydrides (H2O 100, H2S -60, H2Se -41, H2Te -2 degrees C) and group 14 hydrides (CH4 -162, SiH4 -112, GeH4 -88, SnH4 -52 degrees C) by period. Water is far higher than the trend because of hydrogen bonding.</desc>
  <rect x="0" y="0" width="440" height="276" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220" y="22" font-size="15" text-anchor="middle" font-weight="bold">Why is a pool liquid? Hydrogen bonds</text>
    <line x1="70" y1="250" x2="410" y2="250" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="70" y1="250" x2="70" y2="45" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="66" y1="250.0" x2="70" y2="250.0" stroke="#6b7280" stroke-width="1.5"/>
    <text x="62" y="254.0" font-size="12" text-anchor="end" fill="#6b7280">-200</text>
    <line x1="66" y1="187.5" x2="70" y2="187.5" stroke="#6b7280" stroke-width="1.5"/>
    <text x="62" y="191.5" font-size="12" text-anchor="end" fill="#6b7280">-100</text>
    <line x1="70" y1="187.5" x2="410" y2="187.5" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="66" y1="125.0" x2="70" y2="125.0" stroke="#6b7280" stroke-width="1.5"/>
    <text x="62" y="129.0" font-size="12" text-anchor="end" fill="#6b7280">0</text>
    <line x1="70" y1="125.0" x2="410" y2="125.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="66" y1="62.5" x2="70" y2="62.5" stroke="#6b7280" stroke-width="1.5"/>
    <text x="62" y="66.5" font-size="12" text-anchor="end" fill="#6b7280">100</text>
    <line x1="70" y1="62.5" x2="410" y2="62.5" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
    <text transform="rotate(-90 18 150)" x="18" y="150" font-size="12" text-anchor="middle" fill="#6b7280">boiling point (°C)</text>
    <text x="90.0" y="266" font-size="12" text-anchor="middle" fill="#6b7280">period 2</text>
    <text x="190.0" y="266" font-size="12" text-anchor="middle" fill="#6b7280">period 3</text>
    <text x="290.0" y="266" font-size="12" text-anchor="middle" fill="#6b7280">period 4</text>
    <text x="390.0" y="266" font-size="12" text-anchor="middle" fill="#6b7280">period 5</text>
    <polyline points="90.0,62.5 190.0,162.5 290.0,150.6 390.0,126.2" fill="none" stroke="#ca8a04" stroke-width="2.5"/>
    <circle cx="90.0" cy="62.5" r="5" fill="#ca8a04" fill-opacity="1"/>
    <text x="108.0" y="52.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#ca8a04">H₂O</text>
    <circle cx="190.0" cy="162.5" r="5" fill="#ca8a04" fill-opacity="1"/>
    <text x="190.0" y="152.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#ca8a04">H₂S</text>
    <circle cx="290.0" cy="150.6" r="5" fill="#ca8a04" fill-opacity="1"/>
    <text x="290.0" y="140.6" font-size="12" text-anchor="middle" font-weight="bold" fill="#ca8a04">H₂Se</text>
    <circle cx="390.0" cy="126.2" r="5" fill="#ca8a04" fill-opacity="1"/>
    <text x="390.0" y="116.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#ca8a04">H₂Te</text>
    <polyline points="90.0,226.2 190.0,195.0 290.0,180.0 390.0,157.5" fill="none" stroke="#6b7280" stroke-width="2.5"/>
    <circle cx="90.0" cy="226.2" r="5" fill="#6b7280" fill-opacity="1"/>
    <text x="108.0" y="244.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827">CH₄</text>
    <circle cx="190.0" cy="195.0" r="5" fill="#6b7280" fill-opacity="1"/>
    <text x="190.0" y="213.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827">SiH₄</text>
    <circle cx="290.0" cy="180.0" r="5" fill="#6b7280" fill-opacity="1"/>
    <text x="290.0" y="198.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827">GeH₄</text>
    <circle cx="390.0" cy="157.5" r="5" fill="#6b7280" fill-opacity="1"/>
    <text x="390.0" y="175.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827">SnH₄</text>
    <text x="160.0" y="66.5" font-size="13" text-anchor="middle" font-weight="bold" fill="#ca8a04">H-bonds!</text>
    <line x1="210" y1="62" x2="236" y2="62" stroke="#ca8a04" stroke-width="3"/>
    <text x="244" y="66" font-size="12" text-anchor="start" font-weight="bold" fill="#ca8a04">group 16: O, S, Se, Te</text>
    <line x1="210" y1="82" x2="236" y2="82" stroke="#6b7280" stroke-width="3"/>
    <text x="244" y="86" font-size="12" text-anchor="start" font-weight="bold" fill="#6b7280">group 14: C, Si, Ge, Sn</text>
  </g>
</svg>
