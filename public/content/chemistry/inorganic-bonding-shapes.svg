  <desc>Eight molecular shapes from VSEPR theory: linear, trigonal planar, bent (SO2), tetrahedral, trigonal pyramidal, bent (water), trigonal bipyramidal and octahedral, with an example, the hybridization and the bond angle for each.</desc>
