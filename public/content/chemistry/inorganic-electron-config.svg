<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 358" role="img">
  <title>Orbital box diagram of iron</title>
  <desc>Energy ladder of subshells 1s, 2s, 2p, 3s, 3p, 4s and 3d filled with the 26 electrons of iron. Each box holds at most two electrons with opposite spin; the five 3d boxes have one electron each first (Hund), giving four unpaired electrons.</desc>
  <rect x="0" y="0" width="440" height="358" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220" y="22" font-size="15" text-anchor="middle" font-weight="bold">Filling the boxes: iron (26 electrons)</text>
