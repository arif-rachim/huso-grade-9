    <text x="76" y="275" font-size="14" text-anchor="end" font-weight="bold">2s</text>
    <rect x="90" y="258" width="24" height="24" rx="0" fill="#ca8a04" fill-opacity="0.12" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="98" y1="278" x2="98" y2="263" stroke="#111827" stroke-width="2"/>
