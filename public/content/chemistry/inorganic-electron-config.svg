    <text x="76" y="237" font-size="14" text-anchor="end" font-weight="bold">2p</text>
    <rect x="90" y="220" width="24" height="24" rx="0" fill="#ca8a04" fill-opacity="0.12" stroke="#ca8a04" stroke-width="1.5"/>
