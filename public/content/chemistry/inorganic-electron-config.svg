    <text x="179" y="161" font-size="13" text-anchor="start" fill="#6b7280">3p⁶</text>
    <text x="76" y="123" font-size="14" text-anchor="end" font-weight="bold">4s</text>
    <rect x="90" y="106" width="24" height="24" rx="0" fill="#ca8a04" fill-opacity="0.12" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="98" y1="126" x2="98" y2="111" stroke="#111827" stroke-width="2"/>
    <path d="M94.5 116 L98 110 L101.5 116" fill="none" fill-opacity="1" stroke="#111827" stroke-width="2"/>
    <line x1="106" y1="110" x2="106" y2="125" stroke="#111827" stroke-width="2"/>
    <path d="M102.5 120 L106 126 L109.5 120" fill="none" fill-opacity="1" stroke="#111827" stroke-width="2"/>
    <text x="125" y="123" font-size="13" text-anchor="start" fill="#6b7280">4s²</text>
    <text x="76" y="85" font-size="14" text-anchor="end" font-weight="bold">3d</text>
    <rect x="90" y="68" width="24" height="24" rx="0" fill="#ca8a04" fill-opacity="0.25" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="98" y1="88" x2="98" y2="73" stroke="#111827" stroke-width="2"/>
