    <path d="M202.5 78 L206 72 L209.5 78" fill="none" fill-opacity="1" stroke="#111827" stroke-width="2"/>
    <text x="233" y="85" font-size="13" text-anchor="start" fill="#6b7280">3d⁶</text>
    <rect x="269" y="52" width="163" height="80" rx="8" fill="none" fill-opacity="1" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="350" y="72" font-size="13" text-anchor="middle" font-weight="bold" fill="#ca8a04">Pauli principle</text>
    <text x="350" y="90" font-size="12" text-anchor="middle">max 2 electrons per box,</text>
    <text x="350" y="106" font-size="12" text-anchor="middle">arrows point opposite ways</text>
    <text x="350" y="123" font-size="12" text-anchor="middle">(opposite spins)</text>
    <rect x="269" y="142" width="163" height="80" rx="8" fill="none" fill-opacity="1" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="350" y="162" font-size="13" text-anchor="middle" font-weight="bold" fill="#ca8a04">Hund's rule</text>
    <text x="350" y="180" font-size="12" text-anchor="middle">equal-energy boxes: one</text>
    <text x="350" y="196" font-size="12" text-anchor="middle">electron in each box first,</text>
    <text x="350" y="213" font-size="12" text-anchor="middle">all pointing the same way</text>
    <rect x="269" y="232" width="163" height="80" rx="8" fill="none" fill-opacity="1" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="350" y="252" font-size="13" text-anchor="middle" font-weight="bold" fill="#ca8a04">Aufbau (building up)</text>
    <text x="350" y="270" font-size="12" text-anchor="middle">fill from the bottom up;</text>
    <text x="350" y="286" font-size="12" text-anchor="middle">4s comes before 3d</text>
    <text x="220" y="346" font-size="12" text-anchor="middle" font-weight="bold">Fe = [Ar] 4s² 3d⁶  →  4 unpaired electrons  →  paramagnetic</text>
  </g>
</svg>
