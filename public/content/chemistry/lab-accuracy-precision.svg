<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 392" role="img" aria-labelledby="t d">
  <title id="t">Accuracy and precision shown as four targets</title>
  <desc id="d">Four targets with dots. Top left: dots tightly grouped in the center, precise and accurate. Top right: tightly grouped but off center, precise but not accurate. Bottom left: spread around the center, accurate on average but not precise. Bottom right: spread and off center, neither.</desc>
  <defs>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
  </defs>
  <rect x="0" y="0" width="500" height="392" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="250" y="22" font-size="13.5" text-anchor="middle" fill="#111827" font-weight="bold">Accuracy = close to the true value · Precision = close to each other</text>
    <g id="target-A">
    <circle cx="125" cy="100" r="58" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
    <circle cx="125" cy="100" r="38" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
    <circle cx="125" cy="100" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
    <circle cx="121.7" cy="103.5" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="121.3" cy="95.5" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="117.6" cy="97.6" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="130.9" cy="101.7" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="130.6" cy="100.7" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="127.9" cy="101" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    </g>
    <text x="125" y="176" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">precise and accurate</text>
    <text x="125" y="191" font-size="11.5" text-anchor="middle" fill="#6b7280">(small random error, no systematic error)</text>
    <g id="target-B">
    <circle cx="375" cy="100" r="58" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
    <circle cx="375" cy="100" r="38" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
    <circle cx="375" cy="100" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
    <circle cx="402" cy="83.7" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="414.6" cy="83.1" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="403.3" cy="71.7" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="404.8" cy="76.2" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="414.8" cy="78.7" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="414.4" cy="74.7" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    </g>
    <text x="375" y="176" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">precise, not accurate</text>
    <text x="375" y="191" font-size="11.5" text-anchor="middle" fill="#6b7280">(systematic error: same bias every time)</text>
    <g id="target-C">
    <circle cx="125" cy="272" r="58" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
    <circle cx="125" cy="272" r="38" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
    <circle cx="125" cy="272" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
    <circle cx="134.2" cy="275.3" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="114.5" cy="291.9" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="135.7" cy="286.4" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="112.3" cy="248.5" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="112.6" cy="260" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="140.6" cy="269.9" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    </g>
    <text x="125" y="348" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">accurate, not precise</text>
    <text x="125" y="363" font-size="11.5" text-anchor="middle" fill="#6b7280">(large random error, average is right)</text>
    <g id="target-D">
    <circle cx="375" cy="272" r="58" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
    <circle cx="375" cy="272" r="38" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
    <circle cx="375" cy="272" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
    <circle cx="347.7" cy="277.4" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="347.1" cy="317.2" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="339.6" cy="300.7" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="363.3" cy="270.9" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="357.1" cy="318.8" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    <circle cx="327.2" cy="291" r="3.6" fill="#ca8a04" stroke="#111827" stroke-width="1.2"/>
    </g>
    <text x="375" y="348" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">neither</text>
    <text x="375" y="363" font-size="11.5" text-anchor="middle" fill="#6b7280">(both kinds of error)</text>
  </g>
</svg>
