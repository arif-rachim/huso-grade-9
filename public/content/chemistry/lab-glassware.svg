    <text x="460" y="298" font-size="11" text-anchor="middle" fill="#6b7280">vacuum</text>
    <text x="430" y="364" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">Büchner funnel</text>
    <text x="430" y="380" font-size="11.5" text-anchor="middle" fill="#6b7280">fast vacuum</text>
    <text x="430" y="394" font-size="11.5" text-anchor="middle" fill="#6b7280">filtering of crystals</text>
    <text x="430" y="410" font-size="12" text-anchor="middle" fill="#ca8a04">●●○○</text>
    <text x="250" y="436" font-size="11.5" text-anchor="middle" fill="#6b7280">●●●● = most precise · shaded boxes = measuring glassware you can trust to ± 0.1 % to 0.2 %</text>
    <text x="250" y="454" font-size="12" text-anchor="middle" fill="#6b7280">Never heat volumetric glassware: it changes its shape and size.</text>
