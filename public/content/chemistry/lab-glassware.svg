    <line x1="72" y1="126" x2="84" y2="126" stroke="#6b7280" stroke-width="1.5"/>
    <rect x="39" y="104" width="50" height="39" fill="#ca8a04" fill-opacity="0.25" stroke="none" stroke-width="0" />
    <text x="64" y="168" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">beaker</text>
    <text x="64" y="184" font-size="11.5" text-anchor="middle" fill="#6b7280">hold, mix, heat</text>
    <text x="64" y="198" font-size="11.5" text-anchor="middle" fill="#6b7280">NOT for measuring</text>
    <text x="64" y="214" font-size="12" text-anchor="middle" fill="#ca8a04">●○○○</text>
    <rect x="128" y="34" width="116" height="186" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" rx="8" />
    <polyline points="176.0,54.0 176.0,82.0 154.0,144.0 218.0,144.0 196.0,82.0 196.0,54.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="172" y1="54" x2="200" y2="54" stroke="#111827" stroke-width="2.4"/>
    <polygon points="164.0,116.0 208.0,116.0 218.0,144.0 154.0,144.0" fill="#ca8a04" fill-opacity="0.25" stroke="#ca8a04" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/>
