    <path d="M 52 284 C 52 304 76 304 76 284" fill="#ca8a04" fill-opacity="0.25" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="364" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">volumetric pipette</text>
