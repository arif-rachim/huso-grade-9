    <line x1="310" y1="132" x2="316" y2="132" stroke="#6b7280" stroke-width="1.3"/>
    <rect x="297" y="98" width="22" height="40" fill="#ca8a04" fill-opacity="0.25" stroke="none" stroke-width="0" />
    <text x="308" y="168" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">graduated cylinder</text>
    <text x="308" y="184" font-size="11.5" text-anchor="middle" fill="#6b7280">measure roughly</text>
    <text x="308" y="198" font-size="11.5" text-anchor="middle" fill="#6b7280">(± 1 %)</text>
    <text x="308" y="214" font-size="12" text-anchor="middle" fill="#ca8a04">●●○○</text>
