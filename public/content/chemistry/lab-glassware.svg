    <line x1="188" y1="334" x2="193" y2="334" stroke="#6b7280" stroke-width="1.3"/>
    <rect x="180" y="286" width="12" height="56" fill="#ca8a04" fill-opacity="0.25" stroke="none" stroke-width="0" />
    <line x1="172" y1="344" x2="200" y2="344" stroke="#111827" stroke-width="3"/>
    <line x1="186" y1="344" x2="186" y2="356" stroke="#111827" stroke-width="2.4"/>
    <text x="186" y="364" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">buret</text>
