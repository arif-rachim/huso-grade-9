<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 470" role="img" aria-labelledby="t d">
  <title id="t">Common lab glassware and what each is for</title>
  <desc id="d">Eight pieces of equipment: beaker, conical flask, graduated cylinder, volumetric flask, volumetric pipette, buret, separatory funnel and Buchner funnel with filter flask. Beaker and conical flask are approximate, the graduated cylinder is medium and the volumetric flask, pipette and buret are precise.</desc>
  <defs>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
  </defs>
  <rect x="0" y="0" width="500" height="470" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="250" y="22" font-size="14.5" text-anchor="middle" fill="#111827" font-weight="bold">Pick the tool for the job: approximate → precise</text>
