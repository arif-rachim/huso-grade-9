    <polyline points="422.0,286.0 422.0,300.0 396.0,342.0 464.0,342.0 438.0,300.0 438.0,286.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
