    <text x="308" y="394" font-size="11.5" text-anchor="middle" fill="#6b7280">that do not mix</text>
    <text x="308" y="410" font-size="12" text-anchor="middle" fill="#ca8a04">●●○○</text>
    <rect x="372" y="230" width="116" height="186" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" rx="8" />
    <polygon points="404.0,250.0 456.0,250.0 442.0,276.0 418.0,276.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
