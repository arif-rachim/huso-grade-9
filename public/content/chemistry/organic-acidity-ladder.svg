<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 470" role="img" aria-labelledby="t d">
  <title id="t">Acidity ladder: pKa of common functional groups</title>
  <desc id="d">Vertical pKa scale. Lower pKa means stronger acid. Carboxylic acid about 4 to 5, phenol 10, water and alcohols about 16, ketone alpha hydrogen about 19 to 20, terminal alkyne 25, amine N-H about 35, alkene C-H 44, alkane C-H about 50.</desc>
  <defs>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
  </defs>
  <rect x="0" y="0" width="500" height="470" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="250" y="22" font-size="14.5" text-anchor="middle" fill="#111827" font-weight="bold">Acidity ladder (pKa): lower = stronger acid</text>
    <line x1="150" y1="50" x2="150" y2="414" stroke="#111827" stroke-width="2.5"/>
    <line x1="145" y1="50" x2="155" y2="50" stroke="#111827" stroke-width="1.5"/>
    <text x="140" y="54" font-size="12" text-anchor="end" fill="#6b7280">0</text>
    <line x1="145" y1="120" x2="155" y2="120" stroke="#111827" stroke-width="1.5"/>
    <text x="140" y="124" font-size="12" text-anchor="end" fill="#6b7280">10</text>
    <line x1="145" y1="190" x2="155" y2="190" stroke="#111827" stroke-width="1.5"/>
    <text x="140" y="194" font-size="12" text-anchor="end" fill="#6b7280">20</text>
    <line x1="145" y1="260" x2="155" y2="260" stroke="#111827" stroke-width="1.5"/>
    <text x="140" y="264" font-size="12" text-anchor="end" fill="#6b7280">30</text>
    <line x1="145" y1="330" x2="155" y2="330" stroke="#111827" stroke-width="1.5"/>
    <text x="140" y="334" font-size="12" text-anchor="end" fill="#6b7280">40</text>
    <line x1="145" y1="400" x2="155" y2="400" stroke="#111827" stroke-width="1.5"/>
    <text x="140" y="404" font-size="12" text-anchor="end" fill="#6b7280">50</text>
    <circle cx="150" cy="83.32" r="5.5" fill="#ca8a04" stroke="#111827" stroke-width="2"/>
    <line x1="156" y1="83.32" x2="180" y2="83.32" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="186" y="87.82" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">carboxylic acid R–COOH</text>
    <text x="346.08" y="87.82" font-size="12" text-anchor="start" fill="#6b7280">pKa 4.8</text>
    <circle cx="150" cy="120" r="5.5" fill="#ca8a04" stroke="#111827" stroke-width="2"/>
    <line x1="156" y1="120" x2="180" y2="120" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="186" y="124.5" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">phenol C₆H₅–OH</text>
    <text x="292.96" y="124.5" font-size="12" text-anchor="start" fill="#6b7280">pKa 10</text>
    <circle cx="150" cy="160.6" r="5.5" fill="#ca8a04" stroke="#111827" stroke-width="2"/>
    <line x1="156" y1="160.6" x2="180" y2="160.6" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="186" y="165.1" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">water, alcohols R–OH</text>
    <text x="332.8" y="165.1" font-size="12" text-anchor="start" fill="#6b7280">pKa 15.7–16</text>
    <circle cx="150" cy="185.1" r="5.5" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <line x1="156" y1="185.1" x2="180" y2="185.1" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="186" y="189.6" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">ketone α C–H</text>
    <text x="279.68" y="189.6" font-size="12" text-anchor="start" fill="#6b7280">pKa ≈ 19</text>
    <circle cx="150" cy="225" r="5.5" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <line x1="156" y1="225" x2="180" y2="225" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="186" y="229.5" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">terminal alkyne R–C≡C–H</text>
    <text x="352.72" y="229.5" font-size="12" text-anchor="start" fill="#6b7280">pKa 25</text>
    <circle cx="150" cy="295" r="5.5" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <line x1="156" y1="295" x2="180" y2="295" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="186" y="299.5" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">amine N–H  R₂N–H</text>
    <text x="306.24" y="299.5" font-size="12" text-anchor="start" fill="#6b7280">pKa ≈ 35</text>
    <circle cx="150" cy="358" r="5.5" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <line x1="156" y1="358" x2="180" y2="358" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="186" y="362.5" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">alkene C–H (sp²)</text>
    <text x="306.24" y="362.5" font-size="12" text-anchor="start" fill="#6b7280">pKa 44</text>
    <circle cx="150" cy="400" r="5.5" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <line x1="156" y1="400" x2="180" y2="400" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="186" y="404.5" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">alkane C–H (sp³)</text>
    <text x="306.24" y="404.5" font-size="12" text-anchor="start" fill="#6b7280">pKa ≈ 50</text>
    <line x1="34" y1="372" x2="34" y2="106" stroke="#ca8a04" stroke-width="3" marker-end="url(#arY)"/>
    <text x="46" y="239" font-size="12" text-anchor="start" fill="#ca8a04" font-weight="bold">stronger</text>
    <text x="46" y="253" font-size="12" text-anchor="start" fill="#ca8a04" font-weight="bold">acid</text>
    <line x1="486" y1="106" x2="486" y2="372" stroke="#111827" stroke-width="3" marker-end="url(#arK)"/>
    <text x="476" y="239" font-size="12" text-anchor="end" fill="#111827" font-weight="bold">stronger</text>
    <text x="476" y="253" font-size="12" text-anchor="end" fill="#111827" font-weight="bold">conj. base</text>
    <rect x="14" y="424" width="472" height="34" fill="#ca8a04" fill-opacity="0.12" stroke="#ca8a04" stroke-width="1.5" rx="6" />
    <text x="250" y="446" font-size="12" text-anchor="middle" fill="#111827">Bases: amines R–NH₂ take H⁺ (pKa of R–NH₃⁺ ≈ 10–11). Amides do not.</text>
  </g>
</svg>
