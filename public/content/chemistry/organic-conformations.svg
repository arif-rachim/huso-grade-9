<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 410" role="img" aria-labelledby="t d">
  <title id="t">Butane conformations and their energy</title>
  <desc id="d">Energy of butane against the CH3-C-C-CH3 dihedral angle from 0 to 360 degrees. Anti at 180 is the lowest at zero, gauche at 60 and 300 is about 3.8 kilojoules per mole, eclipsed at 120 and 240 is about 16, fully eclipsed at 0 and 360 is about 19. Newman projections are drawn under the curve.</desc>
