<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" role="img" aria-labelledby="t d">
  <title id="t">The common organic functional groups</title>
  <desc id="d">Twelve groups with a small drawing, generic formula, suffix and an example: alkane, alkene, alkyne, alcohol, ether, alkyl halide, aldehyde, ketone, carboxylic acid, ester, amide, amine. The five groups containing C=O form the carbonyl family.</desc>
  <defs>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
  </defs>
  <rect x="0" y="0" width="500" height="560" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
