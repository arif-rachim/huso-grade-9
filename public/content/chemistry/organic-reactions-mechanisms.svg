<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" role="img" aria-labelledby="t d">
  <title id="t">Curved-arrow mechanisms: addition to an alkene, SN2 and addition to a carbonyl</title>
  <desc id="d">Three panels. First: propene plus HBr: the double bond attacks H, the H-Br bond goes to Br, giving a secondary carbocation and bromide, which then attacks the carbocation to give 2-bromopropane. Second: SN2 where hydroxide attacks carbon from the back as bromide leaves and the three other groups flip like an umbrella. Third: a nucleophile attacks the carbon of C=O and the pi electrons move to oxygen.</desc>
  <defs>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
  </defs>
  <rect x="0" y="0" width="500" height="650" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="14" y="22" font-size="13.5" text-anchor="start" fill="#111827" font-weight="bold">① Electrophilic addition to an alkene:  CH₃CH=CH₂ + HBr</text>
    <line x1="30" y1="100" x2="70" y2="76" stroke="#111827" stroke-width="2.4"/>
    <line x1="71.6464" y1="73.256" x2="111.646" y2="97.256" stroke="#111827" stroke-width="2.4"/>
    <line x1="68.3536" y1="78.744" x2="108.354" y2="102.744" stroke="#111827" stroke-width="2.4"/>
    <text x="156" y="90" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">H</text>
    <line x1="166" y1="86" x2="196" y2="86" stroke="#111827" stroke-width="2.4"/>
    <text x="210" y="90" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Br</text>
    <path d="M 92 80 Q 108 40 150 72" fill="none" stroke="#ca8a04" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arY)"/>
    <path d="M 181 82 Q 190 56 206 72" fill="none" stroke="#ca8a04" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arY)"/>
    <text x="250" y="94" font-size="22" text-anchor="middle" fill="#111827">→</text>
    <polyline points="282.0,100.0 322.0,76.0 362.0,100.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="322" y="66" font-size="17" text-anchor="middle" fill="#ca8a04" font-weight="bold">+</text>
    <text x="392" y="88" font-size="16" text-anchor="start" fill="#111827">+</text>
    <text x="420" y="91" font-size="15" text-anchor="start" fill="#111827" font-weight="bold">Br⁻</text>
    <text x="14" y="130" font-size="12" text-anchor="start" fill="#6b7280">step 1: the C=C (electron-rich) attacks H. H goes to the carbon that already has more H&#x27;s,</text>
    <text x="14" y="145" font-size="12" text-anchor="start" fill="#6b7280">so the + lands on the more substituted carbon (a secondary carbocation, more stable).</text>
    <text x="40" y="215" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Br⁻</text>
    <polyline points="120.0,218.0 160.0,194.0 200.0,218.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="160" y="184" font-size="17" text-anchor="middle" fill="#ca8a04" font-weight="bold">+</text>
    <path d="M 52 202 Q 90 160 152 186" fill="none" stroke="#ca8a04" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arY)"/>
    <text x="250" y="210" font-size="22" text-anchor="middle" fill="#111827">→</text>
    <polyline points="282.0,218.0 322.0,194.0 362.0,218.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="322" y1="194" x2="322" y2="170" stroke="#111827" stroke-width="2.4"/>
    <text x="322" y="162" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Br</text>
    <text x="384" y="204" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">2-bromopropane</text>
    <text x="384" y="220" font-size="12" text-anchor="start" fill="#6b7280">(Markovnikov)</text>
    <text x="14" y="244" font-size="12" text-anchor="start" fill="#6b7280">step 2: the lone pair on Br⁻ attacks the carbocation and a new C–Br bond forms.</text>
    <line x1="14" y1="262" x2="486" y2="262" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="14" y="284" font-size="13.5" text-anchor="start" fill="#111827" font-weight="bold">② SN2: HO⁻ + CH₃Br  (one step, backside attack, inversion)</text>
    <text x="30" y="355" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">HO⁻</text>
    <circle cx="104" cy="350" r="3.5" fill="#111827" stroke="#111827" stroke-width="1"/>
    <line x1="104" y1="350" x2="94.4234" y2="323.689" stroke="#111827" stroke-width="2.2"/>
    <text x="91.0032" y="319.292" font-size="12" text-anchor="middle" fill="#6b7280">H</text>
    <line x1="104" y1="350" x2="94.4234" y2="376.311" stroke="#111827" stroke-width="2.2"/>
    <text x="91.0032" y="390.708" font-size="12" text-anchor="middle" fill="#6b7280">H</text>
    <line x1="104" y1="350" x2="81.0637" y2="366.06" stroke="#111827" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="72.8722" y="376.796" font-size="12" text-anchor="middle" fill="#6b7280">H</text>
    <line x1="104" y1="350" x2="140" y2="350" stroke="#111827" stroke-width="2.4"/>
    <text x="154" y="355" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Br</text>
    <path d="M 42 336 Q 76 276 100 340" fill="none" stroke="#ca8a04" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arY)"/>
    <path d="M 124 342 Q 148 316 154 334" fill="none" stroke="#ca8a04" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arY)"/>
    <text x="196" y="355" font-size="22" text-anchor="middle" fill="#111827">→</text>
    <text x="216" y="355" font-size="12.5" text-anchor="start" fill="#111827" font-weight="bold">[HO···C···Br]⁻‡</text>
    <text x="344" y="355" font-size="22" text-anchor="middle" fill="#111827">→</text>
    <text x="372" y="355" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">HO</text>
    <line x1="384" y1="350" x2="424" y2="350" stroke="#111827" stroke-width="2.4"/>
    <circle cx="424" cy="350" r="3.5" fill="#111827" stroke="#111827" stroke-width="1"/>
    <line x1="424" y1="350" x2="433.577" y2="323.689" stroke="#111827" stroke-width="2.2"/>
    <text x="436.997" y="319.292" font-size="12" text-anchor="middle" fill="#6b7280">H</text>
    <line x1="424" y1="350" x2="433.577" y2="376.311" stroke="#111827" stroke-width="2.2"/>
    <text x="436.997" y="390.708" font-size="12" text-anchor="middle" fill="#6b7280">H</text>
    <line x1="424" y1="350" x2="446.936" y2="366.06" stroke="#111827" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="455.128" y="376.796" font-size="12" text-anchor="middle" fill="#6b7280">H</text>
    <text x="388" y="410" font-size="14" text-anchor="start" fill="#111827" font-weight="bold">+ Br⁻</text>
    <text x="14" y="416" font-size="12" text-anchor="start" fill="#6b7280">The three H&#x27;s flip like an umbrella in the wind: the</text>
    <text x="14" y="431" font-size="12" text-anchor="start" fill="#6b7280">product has the opposite configuration at carbon.</text>
    <line x1="14" y1="448" x2="486" y2="448" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="14" y="470" font-size="13.5" text-anchor="start" fill="#111827" font-weight="bold">③ Nucleophilic addition to a carbonyl:  Nu⁻ + R₂C=O</text>
    <text x="40" y="566" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Nu⁻</text>
    <circle cx="170" cy="560" r="3" fill="#111827" stroke="#111827" stroke-width="1"/>
    <line x1="166.8" y1="560" x2="166.8" y2="520" stroke="#111827" stroke-width="2.4"/>
    <line x1="173.2" y1="560" x2="173.2" y2="520" stroke="#111827" stroke-width="2.4"/>
    <text x="170" y="510" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">O</text>
    <line x1="170" y1="560" x2="140" y2="590" stroke="#111827" stroke-width="2.4"/>
    <line x1="170" y1="560" x2="200" y2="590" stroke="#111827" stroke-width="2.4"/>
    <text x="136" y="606" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">R</text>
    <text x="204" y="606" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">R</text>
    <text x="184" y="558" font-size="11.5" text-anchor="start" fill="#ca8a04" font-weight="bold">δ+</text>
    <text x="150" y="512" font-size="11.5" text-anchor="end" fill="#6b7280" font-weight="bold">δ−</text>
    <path d="M 62 554 Q 100 504 158 552" fill="none" stroke="#ca8a04" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arY)"/>
    <path d="M 177 538 Q 205 520 187 506" fill="none" stroke="#ca8a04" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arY)"/>
    <text x="250" y="566" font-size="22" text-anchor="middle" fill="#111827">→</text>
    <circle cx="320" cy="560" r="3" fill="#111827" stroke="#111827" stroke-width="1"/>
    <line x1="320" y1="560" x2="320" y2="526" stroke="#111827" stroke-width="2.4"/>
    <text x="320" y="516" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">O⁻</text>
    <line x1="320" y1="560" x2="290" y2="590" stroke="#111827" stroke-width="2.4"/>
    <line x1="320" y1="560" x2="350" y2="590" stroke="#111827" stroke-width="2.4"/>
    <line x1="320" y1="560" x2="360" y2="546" stroke="#111827" stroke-width="2.4"/>
    <text x="372" y="551" font-size="14" text-anchor="start" fill="#111827" font-weight="bold">Nu</text>
    <text x="286" y="606" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">R</text>
    <text x="354" y="606" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">R</text>
    <text x="14" y="626" font-size="12" text-anchor="start" fill="#6b7280">The carbon of C=O is δ+ (O pulls the electrons), so the nucleophile attacks the carbon.</text>
    <text x="14" y="642" font-size="12" text-anchor="start" fill="#6b7280">Then H⁺ adds to O⁻ and you get an alcohol: R₂C(Nu)–OH.</text>
  </g>
</svg>
