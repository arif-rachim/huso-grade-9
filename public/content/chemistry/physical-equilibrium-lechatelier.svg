<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" role="img" aria-labelledby="t d">
  <title id="t">Le Chatelier&#x27;s principle for ammonia synthesis</title>
  <desc id="d">Table of stresses on N2 + 3H2 in equilibrium with 2NH3 (exothermic): adding reactant or removing product shifts right, higher pressure shifts right, inert gas at constant volume and a catalyst do not shift, raising temperature shifts left and lowers K, lowering temperature shifts right and raises K.</desc>
  <defs>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
  </defs>
  <rect x="0" y="0" width="500" height="440" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="250" y="24" font-size="14.5" text-anchor="middle" fill="#111827" font-weight="bold">Le Chatelier: the system pushes back against a stress</text>
    <rect x="14" y="36" width="472" height="40" fill="#ca8a04" fill-opacity="0.15" stroke="#ca8a04" stroke-width="1.5" rx="6" />
    <text x="250" y="60" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">N₂(g) + 3H₂(g)  ⇌  2NH₃(g)      ΔH = −92 kJ (releases heat)</text>
    <text x="20" y="98" font-size="12" text-anchor="start" fill="#6b7280">stress on the equilibrium</text>
    <text x="272" y="98" font-size="12" text-anchor="middle" fill="#6b7280">shift</text>
    <text x="366" y="98" font-size="12" text-anchor="start" fill="#6b7280">does K change?</text>
    <line x1="14" y1="142" x2="486" y2="142" stroke="#d1d5db" stroke-width="1"/>
    <text x="20" y="128" font-size="12" text-anchor="start" fill="#111827">add N₂ or H₂ / remove NH₃</text>
    <line x1="252" y1="124" x2="292" y2="124" stroke="#ca8a04" stroke-width="2.5" marker-end="url(#arY)"/>
    <text x="300" y="128" font-size="12" text-anchor="start" fill="#ca8a04" font-weight="bold">right</text>
    <text x="366" y="128" font-size="12" text-anchor="start" fill="#6b7280">no</text>
    <line x1="14" y1="178" x2="486" y2="178" stroke="#d1d5db" stroke-width="1"/>
    <text x="20" y="164" font-size="12" text-anchor="start" fill="#111827">higher pressure (4 → 2 mol gas)</text>
    <line x1="252" y1="160" x2="292" y2="160" stroke="#ca8a04" stroke-width="2.5" marker-end="url(#arY)"/>
    <text x="300" y="164" font-size="12" text-anchor="start" fill="#ca8a04" font-weight="bold">right</text>
    <text x="366" y="164" font-size="12" text-anchor="start" fill="#6b7280">no</text>
    <line x1="14" y1="214" x2="486" y2="214" stroke="#d1d5db" stroke-width="1"/>
    <text x="20" y="200" font-size="12" text-anchor="start" fill="#111827">add argon at constant volume</text>
    <text x="272" y="201" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="bold">no shift</text>
    <text x="366" y="200" font-size="12" text-anchor="start" fill="#6b7280">no</text>
    <line x1="14" y1="250" x2="486" y2="250" stroke="#d1d5db" stroke-width="1"/>
    <text x="20" y="236" font-size="12" text-anchor="start" fill="#111827">add a catalyst (both rates speed up)</text>
    <text x="272" y="237" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="bold">no shift</text>
    <text x="366" y="236" font-size="12" text-anchor="start" fill="#6b7280">no</text>
    <line x1="14" y1="286" x2="486" y2="286" stroke="#d1d5db" stroke-width="1"/>
    <text x="20" y="272" font-size="12" text-anchor="start" fill="#111827">raise the temperature</text>
    <line x1="292" y1="268" x2="252" y2="268" stroke="#111827" stroke-width="2.5" marker-end="url(#arK)"/>
    <text x="300" y="272" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">left</text>
    <text x="366" y="272" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">K gets smaller</text>
    <line x1="14" y1="322" x2="486" y2="322" stroke="#d1d5db" stroke-width="1"/>
    <text x="20" y="308" font-size="12" text-anchor="start" fill="#111827">lower the temperature</text>
    <line x1="252" y1="304" x2="292" y2="304" stroke="#ca8a04" stroke-width="2.5" marker-end="url(#arY)"/>
    <text x="300" y="308" font-size="12" text-anchor="start" fill="#ca8a04" font-weight="bold">right</text>
    <text x="366" y="308" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">K gets bigger</text>
    <rect x="14" y="334" width="230" height="92" fill="#ca8a04" fill-opacity="0.12" stroke="#ca8a04" stroke-width="1.5" rx="6" />
    <text x="24" y="354" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Compare Q with K</text>
    <text x="24" y="374" font-size="12.5" text-anchor="start" fill="#111827">Q &lt; K → shifts right (to products)</text>
    <text x="24" y="392" font-size="12.5" text-anchor="start" fill="#111827">Q = K → at equilibrium</text>
    <text x="24" y="410" font-size="12.5" text-anchor="start" fill="#111827">Q &gt; K → shifts left (to reactants)</text>
    <rect x="256" y="334" width="230" height="92" fill="#ca8a04" fill-opacity="0.12" stroke="#ca8a04" stroke-width="1.5" rx="6" />
    <text x="266" y="354" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Only temperature changes K</text>
    <text x="266" y="374" font-size="12.5" text-anchor="start" fill="#111827">K = [NH₃]² ÷ ([N₂][H₂]³)</text>
    <text x="266" y="392" font-size="12.5" text-anchor="start" fill="#111827">ΔG° = −RT ln K</text>
    <text x="266" y="410" font-size="12.5" text-anchor="start" fill="#111827">Kp = Kc (RT)^Δn   (Δn = −2 here)</text>
  </g>
</svg>
