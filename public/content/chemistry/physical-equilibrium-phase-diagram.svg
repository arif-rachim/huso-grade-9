    <circle cx="190" cy="285" r="5" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <text x="232" y="319" font-size="12" text-anchor="start" fill="#111827">triple point: 0.01 °C, 0.006 atm</text>
    <circle cx="418" cy="95" r="5" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <text x="406" y="87" font-size="12" text-anchor="end" fill="#111827">critical point: 374 °C, 218 atm</text>
    <circle cx="184" cy="215" r="5" fill="#ca8a04" stroke="#111827" stroke-width="2"/>
    <text x="160" y="207" font-size="12" text-anchor="end" fill="#111827">melts 0 °C</text>
    <circle cx="322" cy="215" r="5" fill="#ca8a04" stroke="#111827" stroke-width="2"/>
    <text x="318" y="205" font-size="12" text-anchor="end" fill="#111827">boils 100 °C</text>
    <circle cx="335.594" cy="215" r="5" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="343.594" y="237" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">boils higher</text>
    <text x="150" y="267" font-size="12" text-anchor="end" fill="#111827" font-weight="bold">freezes lower</text>
    <line x1="70" y1="380" x2="100" y2="380" stroke="#ca8a04" stroke-width="3.2"/>
    <text x="106" y="384" font-size="12.5" text-anchor="start" fill="#111827">pure water</text>
    <line x1="190" y1="380" x2="220" y2="380" stroke="#111827" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="226" y="384" font-size="12.5" text-anchor="start" fill="#111827">water with a dissolved solute (exaggerated)</text>
  </g>
</svg>
