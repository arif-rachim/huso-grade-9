    <line x1="190" y1="285" x2="168" y2="56" stroke="#ca8a04" stroke-width="3.2"/>
    <polyline points="190.0,285.0 150.0,310.0 66.0,328.0" fill="none" stroke="#ca8a04" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="95" y="150" font-size="14" text-anchor="middle" fill="#ca8a04" font-weight="bold">SOLID</text>
