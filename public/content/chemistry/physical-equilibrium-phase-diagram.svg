<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 396" role="img" aria-labelledby="t d">
  <title id="t">Phase diagram of water with a dissolved solute</title>
  <desc id="d">Schematic pressure-temperature phase diagram of water: solid, liquid and gas regions, the triple point near 0.01 degrees C, the critical point at 374 degrees C and 218 atm. The solid-liquid line leans slightly backward. Dashed lines show that a dissolved solute lowers the freezing point and raises the boiling point.</desc>
  <defs>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
  </defs>
  <rect x="0" y="0" width="500" height="396" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="250" y="22" font-size="14.5" text-anchor="middle" fill="#111827" font-weight="bold">Phase diagram of water (schematic, not to scale)</text>
