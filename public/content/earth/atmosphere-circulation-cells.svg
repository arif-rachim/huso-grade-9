<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" role="img" aria-labelledby="t d">
  <title id="t">Three circulation cells in each hemisphere</title>
  <desc id="d">A pole to pole slice of the atmosphere. In each hemisphere: the Hadley cell from the equator to 30 degrees, the Ferrel cell from 30 to 60 degrees, and the polar cell from 60 to 90 degrees. Air rises at the equator and at 60 degrees, sinks at 30 degrees and at the poles. Surface winds: trade winds, westerlies, polar easterlies.</desc>
