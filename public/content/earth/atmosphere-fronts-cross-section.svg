<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-labelledby="t d">
  <title id="t">Cold front and warm front seen from the side</title>
  <desc id="d">Top: a cold front. Dense cold air wedges under warm air on a steep slope, warm air is pushed up fast and makes tall cumulonimbus clouds with heavy showers. Bottom: a warm front. Warm air slides up a gentle slope over cold air and makes layered clouds and long steady rain ahead of the front.</desc>
