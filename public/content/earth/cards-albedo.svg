<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="t d">
<title id="t">Albedo of surfaces</title>
<desc id="d">Bars of albedo from 0 to 1: fresh snow 0.85, thick clouds 0.7, sea ice 0.6, desert 0.4, grassland 0.25, forest 0.12, ocean 0.06, with the Earth average of about 0.3.</desc>
<defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="320" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="200" y="18" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Albedo = share of sunlight reflected</text>
<text x="110" y="56" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">Fresh snow</text>
<rect x="120" y="40" width="221" height="22" fill="#92400e" fill-opacity="0.25" stroke="#92400e" stroke-width="1" rx="3"/>
<text x="345" y="56" font-size="13" text-anchor="start" fill="#111827">0.85</text>
<text x="110" y="86" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">Thick clouds</text>
<rect x="120" y="70" width="182" height="22" fill="#92400e" fill-opacity="0.25" stroke="#92400e" stroke-width="1" rx="3"/>
<text x="306" y="86" font-size="13" text-anchor="start" fill="#111827">0.7</text>
<text x="110" y="116" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">Sea ice</text>
<rect x="120" y="100" width="156" height="22" fill="#92400e" fill-opacity="0.25" stroke="#92400e" stroke-width="1" rx="3"/>
<text x="280" y="116" font-size="13" text-anchor="start" fill="#111827">0.6</text>
<text x="110" y="146" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">Desert sand</text>
<rect x="120" y="130" width="104" height="22" fill="#92400e" fill-opacity="0.25" stroke="#92400e" stroke-width="1" rx="3"/>
<text x="228" y="146" font-size="13" text-anchor="start" fill="#111827">0.4</text>
<text x="110" y="176" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">Grassland</text>
<rect x="120" y="160" width="65" height="22" fill="#92400e" fill-opacity="0.25" stroke="#92400e" stroke-width="1" rx="3"/>
<text x="189" y="176" font-size="13" text-anchor="start" fill="#111827">0.25</text>
<text x="110" y="206" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">Forest</text>
<rect x="120" y="190" width="31.2" height="22" fill="#92400e" fill-opacity="0.25" stroke="#92400e" stroke-width="1" rx="3"/>
<text x="155.2" y="206" font-size="13" text-anchor="start" fill="#111827">0.12</text>
<text x="110" y="236" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">Ocean</text>
<rect x="120" y="220" width="15.6" height="22" fill="#92400e" fill-opacity="0.25" stroke="#92400e" stroke-width="1" rx="3"/>
<text x="139.6" y="236" font-size="13" text-anchor="start" fill="#111827">0.06</text>
<line x1="198" y1="34" x2="198" y2="252" stroke="#111827" stroke-width="2" stroke-dasharray="5 4"/>
<text x="202" y="266" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">Earth average ≈ 0.3</text>
<text x="200" y="292" font-size="12" text-anchor="middle" fill="#6b7280">Bright = reflects (cooler).  Dark = absorbs (warmer).</text>
<text x="200" y="308" font-size="12" text-anchor="middle" fill="#6b7280">Ice melts → darker surface → more heating: ice–albedo feedback.</text>
</g>
</svg>
