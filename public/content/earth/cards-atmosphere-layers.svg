<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 352" role="img" aria-labelledby="t d">
<title id="t">Layers of the atmosphere</title>
<desc id="d">Four layers from the ground up: troposphere to about 12 km, stratosphere to 50 km, mesosphere to 85 km, thermosphere above. The temperature falls, rises, falls, then rises again.</desc>
<defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="352" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<rect x="20" y="20" width="190" height="80" fill="#92400e" fill-opacity="0.05"/>
<rect x="20" y="100" width="190" height="70" fill="#92400e" fill-opacity="0.12"/>
<rect x="20" y="170" width="190" height="70" fill="#92400e" fill-opacity="0.22"/>
<rect x="20" y="240" width="190" height="80" fill="#92400e" fill-opacity="0.35"/>
<line x1="20" y1="100" x2="390" y2="100" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="20" y1="170" x2="390" y2="170" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="20" y1="240" x2="390" y2="240" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="20" y="320" width="190" height="12" fill="#6b7280" fill-opacity="0.6"/>
<text x="115" y="329" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">Earth&#x27;s surface</text>
<text data-label="Thermosphere" x="115" y="65" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Thermosphere</text>
<text data-label="Mesosphere" x="115" y="140" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Mesosphere</text>
<text data-label="Stratosphere" x="115" y="199" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Stratosphere</text>
<text data-label="Troposphere" x="115" y="285" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Troposphere</text>
<text x="115" y="213" font-size="12" text-anchor="middle" fill="#111827" font-style="italic">ozone layer absorbs UV</text>
<text x="215" y="238" font-size="12" text-anchor="start" fill="#6b7280">tropopause</text>
<text x="215" y="168" font-size="12" text-anchor="start" fill="#6b7280">stratopause</text>
<text x="215" y="98" font-size="12" text-anchor="start" fill="#6b7280">mesopause</text>
<line x1="236" y1="320" x2="392" y2="320" stroke="#111827" stroke-width="1.5"/>
<text x="314" y="346" font-size="12" text-anchor="middle" fill="#6b7280">temperature →</text>
<polyline points="343.5,320 279.6,240 328.2,170 249,100 385,24" fill="none" stroke="#92400e" stroke-width="3" stroke-linejoin="round"/>
<circle cx="343.5" cy="320" r="3.5" fill="#92400e"/>
<circle cx="279.6" cy="240" r="3.5" fill="#92400e"/>
<circle cx="328.2" cy="170" r="3.5" fill="#92400e"/>
<circle cx="249" cy="100" r="3.5" fill="#92400e"/>
<text x="349.5" y="317" font-size="12" text-anchor="start" fill="#111827">15 °C</text>
<text x="271.6" y="258" font-size="12" text-anchor="end" fill="#111827">-56 °C</text>
<text x="334.2" y="190" font-size="12" text-anchor="start" fill="#111827">-2 °C</text>
<text x="245" y="120" font-size="12" text-anchor="end" fill="#111827">-90 °C</text>
<text x="300" y="40" font-size="12" text-anchor="end" fill="#6b7280">gets very hot</text>
<text x="20" y="12" font-size="12" text-anchor="start" fill="#6b7280">Heights are not to scale</text>
<text x="215" y="278" font-size="12" text-anchor="start" fill="#111827"></text>
</g>
</svg>
