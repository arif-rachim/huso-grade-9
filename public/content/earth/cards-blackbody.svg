<text x="255" y="212" font-size="12" text-anchor="start" fill="#6b7280" font-weight="bold">cool (red)</text>
<text x="200" y="22" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Wien: peak λ × T = constant (hotter, shorter λ)</text>
<text x="200" y="300" font-size="13" text-anchor="middle" fill="#92400e" font-weight="bold">Stefan–Boltzmann: L = 4πR² σ T⁴</text>
<text x="200" y="320" font-size="12" text-anchor="middle" fill="#6b7280">Double the temperature: 16 times the power per area.</text>
