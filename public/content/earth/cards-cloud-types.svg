<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-labelledby="t d">
<title id="t">Cloud types</title>
<desc id="d">Cirrus clouds are high, altocumulus are middle, stratus and nimbostratus are low, and cumulonimbus are tall clouds that stretch through all levels and produce thunderstorms.</desc>
<defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="340" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="200" y="18" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Cloud types by height</text>
<rect x="10" y="30" width="380" height="70" fill="#92400e" fill-opacity="0.05"/>
<line x1="10" y1="30" x2="390" y2="30" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
<text x="14" y="44" font-size="12" text-anchor="start" fill="#6b7280" font-weight="bold">High  (above ~6 km)</text>
<rect x="10" y="100" width="380" height="70" fill="#92400e" fill-opacity="0.12"/>
<line x1="10" y1="100" x2="390" y2="100" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
<text x="14" y="114" font-size="12" text-anchor="start" fill="#6b7280" font-weight="bold">Middle  (2–6 km)</text>
<rect x="10" y="170" width="380" height="80" fill="#92400e" fill-opacity="0.2"/>
<line x1="10" y1="170" x2="390" y2="170" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
<text x="14" y="184" font-size="12" text-anchor="start" fill="#6b7280" font-weight="bold">Low  (below ~2 km)</text>
<path d="M50,72 C70,56 100,62 125,68" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M60,80 C85,68 110,74 130,78" fill="none" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text data-label="Cirrus" x="88" y="94" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Cirrus</text>
<g transform="translate(60 140) scale(0.6)"><path d="M-26,8 C-38,8 -38,-8 -24,-8 C-24,-24 4,-26 8,-12 C22,-20 38,-6 28,8 Z" fill="#ffffff" stroke="#6b7280" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
<g transform="translate(100 140) scale(0.6)"><path d="M-26,8 C-38,8 -38,-8 -24,-8 C-24,-24 4,-26 8,-12 C22,-20 38,-6 28,8 Z" fill="#ffffff" stroke="#6b7280" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
<g transform="translate(140 140) scale(0.6)"><path d="M-26,8 C-38,8 -38,-8 -24,-8 C-24,-24 4,-26 8,-12 C22,-20 38,-6 28,8 Z" fill="#ffffff" stroke="#6b7280" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
<g transform="translate(180 140) scale(0.6)"><path d="M-26,8 C-38,8 -38,-8 -24,-8 C-24,-24 4,-26 8,-12 C22,-20 38,-6 28,8 Z" fill="#ffffff" stroke="#6b7280" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
<text data-label="Altocumulus" x="120" y="162" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Altocumulus</text>
<rect x="25" y="205" width="110" height="16" fill="#d1d5db" fill-opacity="0.9" stroke="#6b7280" stroke-width="1.5" rx="8"/>
<text data-label="Stratus" x="80" y="240" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Stratus</text>
<rect x="150" y="192" width="110" height="34" fill="#6b7280" fill-opacity="0.5" stroke="#6b7280" stroke-width="1.5" rx="10"/>
<text data-label="Nimbostratus" x="205" y="208" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Nimbostratus</text>
<text x="205" y="222" font-size="12" text-anchor="middle" fill="#111827">(steady rain)</text>
<line x1="175" y1="228" x2="171" y2="246" stroke="#6b7280" stroke-width="1.5"/>
<line x1="205" y1="228" x2="201" y2="246" stroke="#6b7280" stroke-width="1.5"/>
<line x1="235" y1="228" x2="231" y2="246" stroke="#6b7280" stroke-width="1.5"/>
<polygon points="305,250 305,150 288,138 283,108 312,100 322,78 350,76 362,98 388,106 386,132 368,148 368,250" fill="#d1d5db" fill-opacity="0.95" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/>
<text data-label="Cumulonimbus" x="336" y="270" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Cumulonimbus</text>
<text x="336" y="285" font-size="12" text-anchor="middle" fill="#6b7280">(tall, thunderstorms)</text>
<text x="200" y="312" font-size="12" text-anchor="middle" fill="#6b7280">Cirro- = high, alto- = middle. Stratus = layer, cumulus = heap.</text>
<text x="200" y="328" font-size="12" text-anchor="middle" fill="#6b7280">Nimbo- / -nimbus = rain-bearing.</text>
</g>
</svg>
