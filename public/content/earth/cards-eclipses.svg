<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 374" role="img" aria-labelledby="t d">
<title id="t">Solar and lunar eclipses</title>
<desc id="d">A solar eclipse occurs at new moon when the Moon&#x27;s shadow falls on Earth. A lunar eclipse occurs at full moon when the Moon passes through Earth&#x27;s shadow. Not to scale.</desc>
<defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="374" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="200" y="18" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Solar eclipse (New Moon): the Moon blocks the Sun</text>
<circle cx="40" cy="90" r="28" fill="#92400e" fill-opacity="0.3"/>
<text x="40" y="94" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Sun</text>
<polygon points="250,80.5 250,99.5 357.8,90" fill="#111827" fill-opacity="0.55"/>
<polygon points="250,80.5 370,59.1 370,120.9 250,99.5" fill="#111827" fill-opacity="0.12"/>
<circle cx="250" cy="90" r="9.5" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text x="250" y="118" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Moon</text>
<circle cx="350" cy="90" r="16" fill="#92400e" fill-opacity="0.4" stroke="#92400e" stroke-width="1.5"/>
<text x="350" y="124" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Earth</text>
<text data-label="Penumbra" x="300" y="62" font-size="12" text-anchor="middle" fill="#111827">penumbra</text>
<text data-label="Umbra" x="290" y="128" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">umbra</text>
<line x1="290" y1="118" x2="290" y2="94" stroke="#111827" stroke-width="1"/>
<text x="200" y="165" font-size="12" text-anchor="middle" fill="#6b7280">Total solar eclipse only in the narrow umbra on Earth</text>
<line x1="20" y1="185" x2="380" y2="185" stroke="#d1d5db" stroke-width="1"/>
<text x="200" y="208" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Lunar eclipse (Full Moon): Earth&#x27;s shadow falls on the Moon</text>
<circle cx="40" cy="270" r="28" fill="#92400e" fill-opacity="0.3"/>
<text x="40" y="274" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Sun</text>
<polygon points="170,254 170,286 370,270" fill="#111827" fill-opacity="0.35"/>
<circle cx="170" cy="270" r="16" fill="#92400e" fill-opacity="0.4" stroke="#92400e" stroke-width="1.5"/>
<text x="170" y="304" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Earth</text>
<circle cx="280" cy="270" r="9" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text x="280" y="298" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Moon</text>
<text x="340" y="262" font-size="12" text-anchor="middle" fill="#111827">Earth&#x27;s</text>
<text x="340" y="276" font-size="12" text-anchor="middle" fill="#111827">umbra</text>
<text x="200" y="346" font-size="12" text-anchor="middle" fill="#6b7280">Lunar: seen from the whole night side.</text>
<text x="200" y="362" font-size="12" text-anchor="middle" fill="#6b7280">No eclipse every month: the Moon&#x27;s orbit is tilted about 5°.</text>
</g>
</svg>
