<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 248" role="img" aria-labelledby="t d">
<title id="t">Three types of fault</title>
<desc id="d">Normal fault: hanging wall moves down under tension. Reverse fault: hanging wall moves up under compression. Strike-slip fault: blocks slide sideways past each other.</desc>
<defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="248" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<g transform="translate(5 50)"><polygon points="0,10 43.3,10 70,90 0,90" fill="#92400e" fill-opacity="0.35" stroke="#111827" stroke-width="1.5" stroke-linejoin="round"/><polygon points="49.3,28 110,28 110,90 70,90" fill="#92400e" fill-opacity="0.15" stroke="#111827" stroke-width="1.5" stroke-linejoin="round"/><line x1="38" y1="0" x2="71.3" y2="100" stroke="#111827" stroke-width="2" stroke-dasharray="5 3"/><text x="20" y="55" font-size="12" text-anchor="middle" fill="#111827">foot-</text><text x="20" y="69" font-size="12" text-anchor="middle" fill="#111827">wall</text><text x="88" y="38" font-size="12" text-anchor="middle" fill="#111827">hanging</text><text x="88" y="52" font-size="12" text-anchor="middle" fill="#111827">wall</text><line x1="100" y1="62" x2="100" y2="86" stroke="#92400e" stroke-width="3" marker-end="url(#ahB)"/></g>
<text data-label="Normal fault" x="60" y="28" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Normal fault</text>
<text x="60" y="168" font-size="12" text-anchor="middle" fill="#6b7280">stretching (tension)</text>
<g transform="translate(140 50)"><polygon points="0,10 43.3,10 70,90 0,90" fill="#92400e" fill-opacity="0.35" stroke="#111827" stroke-width="1.5" stroke-linejoin="round"/><polygon points="38.7,-4 110,-4 110,90 70,90" fill="#92400e" fill-opacity="0.15" stroke="#111827" stroke-width="1.5" stroke-linejoin="round"/><line x1="38" y1="0" x2="71.3" y2="100" stroke="#111827" stroke-width="2" stroke-dasharray="5 3"/><text x="20" y="55" font-size="12" text-anchor="middle" fill="#111827">foot-</text><text x="20" y="69" font-size="12" text-anchor="middle" fill="#111827">wall</text><text x="88" y="38" font-size="12" text-anchor="middle" fill="#111827">hanging</text><text x="88" y="52" font-size="12" text-anchor="middle" fill="#111827">wall</text><line x1="100" y1="86" x2="100" y2="62" stroke="#92400e" stroke-width="3" marker-end="url(#ahB)"/></g>
<text data-label="Reverse fault" x="195" y="28" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Reverse fault</text>
<text x="195" y="168" font-size="12" text-anchor="middle" fill="#6b7280">squeezing (compression)</text>
<text data-label="Strike-slip fault" x="330" y="28" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Strike-slip fault</text>
<rect x="290" y="50" width="40" height="90" fill="#92400e" fill-opacity="0.3" stroke="#111827" stroke-width="1.5"/>
<rect x="330" y="50" width="40" height="90" fill="#92400e" fill-opacity="0.12" stroke="#111827" stroke-width="1.5"/>
<line x1="330" y1="50" x2="330" y2="140" stroke="#111827" stroke-width="2" stroke-dasharray="5 3"/>
<line x1="310" y1="128" x2="310" y2="72" stroke="#92400e" stroke-width="3" marker-end="url(#ahB)"/>
<line x1="350" y1="62" x2="350" y2="118" stroke="#92400e" stroke-width="3" marker-end="url(#ahB)"/>
<text x="330" y="168" font-size="12" text-anchor="middle" fill="#6b7280">sliding sideways</text>
<text x="330" y="184" font-size="12" text-anchor="middle" fill="#6b7280">(top view)</text>
<text x="200" y="220" font-size="12" text-anchor="middle" fill="#6b7280">Hanging wall = the block above the sloping fault.</text>
<text x="200" y="236" font-size="12" text-anchor="middle" fill="#6b7280">Normal: hanging wall moves DOWN.  Reverse: it moves UP.</text>
</g>
</svg>
