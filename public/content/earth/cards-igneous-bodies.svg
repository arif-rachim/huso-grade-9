<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 378" role="img" aria-labelledby="t d">
<title id="t">Intrusive igneous bodies</title>
<desc id="d">Cross section through layered rock: a batholith at depth, a dike cutting across the layers, a sill between layers, a laccolith that bulges the layers above, and a volcano fed by a vent.</desc>
<defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="378" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="200" y="16" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Igneous bodies in cross section</text>
<rect x="10" y="130" width="380" height="30" fill="#92400e" fill-opacity="0.08"/>
<rect x="10" y="160" width="380" height="30" fill="#92400e" fill-opacity="0.2"/>
<rect x="10" y="190" width="380" height="30" fill="#92400e" fill-opacity="0.08"/>
<rect x="10" y="220" width="380" height="30" fill="#92400e" fill-opacity="0.2"/>
<rect x="10" y="250" width="380" height="80" fill="#92400e" fill-opacity="0.12"/>
<line x1="10" y1="130" x2="390" y2="130" stroke="#111827" stroke-width="2"/>
<polygon points="150,130 200,82 250,130" fill="#92400e" fill-opacity="0.5" stroke="#111827" stroke-width="1.5" stroke-linejoin="round"/>
<text x="200" y="72" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Volcano</text>
<path d="M110,330 C100,270 150,245 200,245 C250,245 300,270 290,330 Z" fill="#111827" fill-opacity="0.6"/>
<rect x="194" y="95" width="12" height="155" fill="#111827" fill-opacity="0.6"/>
<polygon points="128,262 120,130 128,130 136,262" fill="#111827" fill-opacity="0.6"/>
<polygon points="206,157 330,157 330,164 206,164" fill="#111827" fill-opacity="0.6"/>
<path d="M20,222 C25,192 90,192 98,222 Z" fill="#111827" fill-opacity="0.6"/>
<line x1="60" y1="118" x2="124" y2="160" stroke="#111827" stroke-width="1.2"/>
<text data-label="Dike" x="60" y="112" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Dike</text>
<text x="60" y="126" font-size="12" text-anchor="start" fill="#111827"></text>
<text x="98" y="125" font-size="12" text-anchor="start" fill="#111827"></text>
<line x1="345" y1="150" x2="322" y2="160" stroke="#111827" stroke-width="1.2"/>
<text data-label="Sill" x="350" y="146" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Sill</text>
<line x1="60" y1="280" x2="58" y2="215" stroke="#111827" stroke-width="1.2"/>
<text data-label="Laccolith" x="60" y="296" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Laccolith</text>
<line x1="300" y1="300" x2="270" y2="300" stroke="#111827" stroke-width="1.2"/>
<text data-label="Batholith" x="305" y="304" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Batholith</text>
<text x="305" y="319" font-size="12" text-anchor="start" fill="#6b7280">(magma chamber)</text>
<text x="200" y="350" font-size="12" text-anchor="middle" fill="#6b7280">Dike cuts ACROSS the layers. Sill goes ALONG them.</text>
<text x="200" y="366" font-size="12" text-anchor="middle" fill="#6b7280">Intrusive = cooled underground (big crystals).</text>
</g>
</svg>
