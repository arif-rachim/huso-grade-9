<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 316" role="img" aria-labelledby="t d">
<title id="t">Kepler&#x27;s laws</title>
<desc id="d">An elliptical orbit with the Sun at one focus. Perihelion is the closest point and aphelion the farthest. Two shaded sectors have equal area and are swept in equal times. T squared equals a cubed.</desc>
<defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="316" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<ellipse cx="200" cy="150" rx="150" ry="100" fill="none" stroke="#92400e" stroke-width="2.5"/>
<polygon points="88.2,150 210.9,249.7 199.9,250 188.4,249.7 176.1,248.7 163.1,246.9 149.4,244.1 134.8,240.1 119.4,234.3 103.2,226.4 86.4,215.3 69.9,199.8 56,178 50,150 56,122 69.9,100.2 86.4,84.7 103.2,73.6 119.4,65.7 134.8,59.9 149.4,55.9 163.1,53.1 176.1,51.3 188.4,50.3 199.9,50 210.9,50.3" fill="#92400e" fill-opacity="0.35" stroke="#92400e" stroke-width="1" stroke-linejoin="round"/>
<polygon points="88.2,150 329.7,99.8 333,103.8 336,107.8 338.7,111.9 341.1,116 343.2,120.2 345,124.4 346.5,128.6 347.8,132.9 348.8,137.1 349.4,141.4 349.9,145.7 350,150 349.9,154.3 349.4,158.6 348.8,162.9 347.8,167.1 346.5,171.4 345,175.6 343.2,179.8 341.1,184 338.7,188.1 336,192.2 333,196.2 329.7,200.2" fill="#92400e" fill-opacity="0.35" stroke="#92400e" stroke-width="1" stroke-linejoin="round"/>
<circle cx="88.2" cy="150" r="10" fill="#92400e" stroke="#111827" stroke-width="1"/>
<text x="88.2" y="174" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Sun</text>
<circle cx="311.8" cy="150" r="3" fill="#111827"/>
<text x="311.8" y="172" font-size="12" text-anchor="middle" fill="#6b7280">empty focus</text>
<circle cx="50" cy="150" r="6" fill="#111827"/>
<text data-label="Perihelion" x="44" y="136" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Perihelion</text>
<circle cx="350" cy="150" r="6" fill="#111827"/>
<text data-label="Aphelion" x="354" y="136" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">Aphelion</text>
<text x="44.2" y="290" font-size="12" text-anchor="start" fill="#111827"></text>
<line x1="54" y1="200" x2="346" y2="200" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
<text x="200" y="216" font-size="12" text-anchor="middle" fill="#6b7280">major axis = 2a</text>
<text x="200" y="20" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Kepler&#x27;s laws</text>
<text x="200" y="262" font-size="13" text-anchor="middle" fill="#111827">1st: orbits are ellipses with the Sun at one focus.</text>
<text x="200" y="282" font-size="13" text-anchor="middle" fill="#111827">2nd: equal areas in equal times (fast near the Sun).</text>
<text x="200" y="302" font-size="13" text-anchor="middle" fill="#92400e" font-weight="bold">3rd: T² = a³  (T in years, a in AU)</text>
</g>
</svg>
