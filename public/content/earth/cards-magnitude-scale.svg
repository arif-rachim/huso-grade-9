<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 294" role="img" aria-labelledby="t d">
<title id="t">Magnitude scale</title>
<desc id="d">A magnitude scale from -27 to +6 with the Sun, Full Moon, Venus, Sirius, Vega, Polaris and the naked-eye limit. Smaller numbers are brighter. Five magnitudes is a factor of 100.</desc>
<defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="294" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="200" y="18" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Apparent magnitude: smaller = brighter</text>
<line x1="20" y1="120" x2="380" y2="120" stroke="#111827" stroke-width="2.5"/>
<text x="24" y="108" font-size="12" text-anchor="start" fill="#6b7280">brighter</text>
<text x="376" y="108" font-size="12" text-anchor="end" fill="#6b7280">fainter</text>
<line x1="41.2" y1="114" x2="41.2" y2="126" stroke="#111827" stroke-width="1.5"/>
<text x="41.2" y="140" font-size="12" text-anchor="middle" fill="#6b7280">-25</text>
<line x1="94.1" y1="114" x2="94.1" y2="126" stroke="#111827" stroke-width="1.5"/>
<text x="94.1" y="140" font-size="12" text-anchor="middle" fill="#6b7280">-20</text>
<line x1="147.1" y1="114" x2="147.1" y2="126" stroke="#111827" stroke-width="1.5"/>
<text x="147.1" y="140" font-size="12" text-anchor="middle" fill="#6b7280">-15</text>
<line x1="200" y1="114" x2="200" y2="126" stroke="#111827" stroke-width="1.5"/>
<text x="200" y="140" font-size="12" text-anchor="middle" fill="#6b7280">-10</text>
<line x1="252.9" y1="114" x2="252.9" y2="126" stroke="#111827" stroke-width="1.5"/>
<text x="252.9" y="140" font-size="12" text-anchor="middle" fill="#6b7280">-5</text>
<line x1="305.9" y1="114" x2="305.9" y2="126" stroke="#111827" stroke-width="1.5"/>
<text x="305.9" y="140" font-size="12" text-anchor="middle" fill="#6b7280">0</text>
<line x1="358.8" y1="114" x2="358.8" y2="126" stroke="#111827" stroke-width="1.5"/>
<text x="358.8" y="140" font-size="12" text-anchor="middle" fill="#6b7280">5</text>
<circle cx="23.2" cy="120" r="5" fill="#92400e" stroke="#111827" stroke-width="1"/>
<line x1="23.2" y1="115" x2="23.2" y2="44" stroke="#6b7280" stroke-width="1"/>
<text x="20" y="40" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">Sun -26.7</text>
<circle cx="171.4" cy="120" r="5" fill="#92400e" stroke="#111827" stroke-width="1"/>
<line x1="171.4" y1="115" x2="171.4" y2="72" stroke="#6b7280" stroke-width="1"/>
<text x="171.4" y="68" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Full Moon -12.7</text>
<circle cx="259.3" cy="120" r="5" fill="#92400e" stroke="#111827" stroke-width="1"/>
<line x1="259.3" y1="115" x2="259.3" y2="44" stroke="#6b7280" stroke-width="1"/>
<text x="259.3" y="40" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Venus (max) -4.4</text>
<circle cx="290.4" cy="120" r="5" fill="#92400e" stroke="#111827" stroke-width="1"/>
<line x1="290.4" y1="115" x2="290.4" y2="72" stroke="#6b7280" stroke-width="1"/>
<text x="290.4" y="68" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Sirius -1.46</text>
<circle cx="306.2" cy="120" r="5" fill="#92400e" stroke="#111827" stroke-width="1"/>
<line x1="306.2" y1="115" x2="306.2" y2="100" stroke="#6b7280" stroke-width="1"/>
<text x="306.2" y="96" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Vega 0.03</text>
<circle cx="327.1" cy="120" r="5" fill="#92400e" stroke="#111827" stroke-width="1"/>
<line x1="327.1" y1="125" x2="327.1" y2="160" stroke="#6b7280" stroke-width="1"/>
<text x="327.1" y="172" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Polaris 2</text>
<circle cx="369.4" cy="120" r="5" fill="#92400e" stroke="#111827" stroke-width="1"/>
<line x1="369.4" y1="125" x2="369.4" y2="180" stroke="#6b7280" stroke-width="1"/>
<text x="388" y="192" font-size="12" text-anchor="end" fill="#111827" font-weight="bold">Naked-eye limit 6</text>
<text x="200" y="222" font-size="14" text-anchor="middle" fill="#92400e" font-weight="bold">5 magnitudes = 100 times brighter</text>
<text x="100" y="244" font-size="12" text-anchor="start" fill="#111827"></text>
<text x="200" y="242" font-size="13" text-anchor="middle" fill="#111827">1 magnitude = 100^(1/5) ≈ 2.512 times</text>
<text x="200" y="264" font-size="12" text-anchor="middle" fill="#6b7280">Absolute magnitude M = brightness at 10 parsecs.</text>
<text x="200" y="282" font-size="13" text-anchor="middle" fill="#92400e" font-weight="bold">m − M = 5 log₁₀(d / 10 pc)</text>
</g>
</svg>
