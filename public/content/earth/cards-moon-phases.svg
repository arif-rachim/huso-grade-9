<path d="M144.8,55.8 A9,9 0 0 1 144.8,73.8 Z" fill="#ffffff"/>
<circle cx="122" cy="120" r="9" fill="#6b7280" stroke="#111827" stroke-width="1"/>
<path d="M122,111 A9,9 0 0 1 122,129 Z" fill="#ffffff"/>
