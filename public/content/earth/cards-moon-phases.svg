<path d="M255.2,55.8 A9,9 0 0 1 255.2,73.8 Z" fill="#ffffff"/>
<circle cx="200" cy="42" r="9" fill="#6b7280" stroke="#111827" stroke-width="1"/>
<path d="M200,33 A9,9 0 0 1 200,51 Z" fill="#ffffff"/>
