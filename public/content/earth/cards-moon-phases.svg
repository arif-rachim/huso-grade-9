<path d="M255.2,166.2 A9,9 0 0 1 255.2,184.2 Z" fill="#ffffff"/>
<line x1="385" y1="50" x2="345" y2="50" stroke="#92400e" stroke-width="3" marker-end="url(#ahB)"/>
<line x1="385" y1="120" x2="345" y2="120" stroke="#92400e" stroke-width="3" marker-end="url(#ahB)"/>
<line x1="385" y1="190" x2="345" y2="190" stroke="#92400e" stroke-width="3" marker-end="url(#ahB)"/>
<text x="350" y="36" font-size="12" text-anchor="middle" fill="#92400e" font-weight="bold">Sunlight</text>
<text x="200" y="228" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">As seen from Earth (Northern Hemisphere):</text>
<circle cx="55" cy="262" r="24" fill="#6b7280" stroke="#111827" stroke-width="1"/>
<path d="M55,238 A24,24 0 0 1 55,286 A24,24 0 0 0 55,238 Z" fill="#ffffff"/>
