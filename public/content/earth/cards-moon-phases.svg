<text data-label="Waxing gibbous" x="346" y="304" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Waxing gibbous</text>
<circle cx="55" cy="340" r="24" fill="#6b7280" stroke="#111827" stroke-width="1"/>
