<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 432" role="img" aria-labelledby="t d">
<title id="t">Phases of the Moon</title>
<desc id="d">Eight phases in order: new moon, waxing crescent, first quarter, waxing gibbous, full moon, waning gibbous, third quarter, waning crescent. A full cycle takes about 29.5 days.</desc>
<defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="432" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="200" y="16" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Moon&#x27;s orbit seen from above the North Pole</text>
<circle cx="200" cy="120" r="20" fill="#92400e" fill-opacity="0.3" stroke="#92400e" stroke-width="1.5"/>
<text x="200" y="124" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Earth</text>
<circle cx="200" cy="120" r="78" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
