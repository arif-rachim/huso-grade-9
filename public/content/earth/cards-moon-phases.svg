<circle cx="346" cy="340" r="24" fill="#6b7280" stroke="#111827" stroke-width="1"/>
<path d="M346,316 A24,24 0 0 0 346,364 A17,24 0 0 1 346,316 Z" fill="#ffffff"/>
<circle cx="346" cy="340" r="24" fill="none" stroke="#92400e" stroke-width="1.5"/>
<text data-label="Waning crescent" x="346" y="382" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Waning crescent</text>
<text x="200" y="418" font-size="12" text-anchor="middle" fill="#6b7280">Waxing = growing (lit side on the right).  Waning = shrinking.</text>
</g>
</svg>
