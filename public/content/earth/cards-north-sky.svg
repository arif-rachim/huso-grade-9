<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" role="img" aria-labelledby="t d">
<title id="t">Big Dipper, Cassiopeia and Polaris</title>
<desc id="d">The pointer stars Dubhe and Merak of the Big Dipper point to Polaris, the end of the Little Dipper handle. Cassiopeia, a W-shaped group, lies on the opposite side of Polaris.</desc>
<defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="390" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="200" y="16" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Finding Polaris (north celestial pole)</text>
<circle cx="200" cy="90" r="8" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<text data-label="Polaris" x="190" y="118" font-size="14" text-anchor="end" fill="#111827" font-weight="bold">Polaris</text>
<line x1="255" y1="215" x2="255" y2="270" stroke="#6b7280" stroke-width="1.5"/>
<line x1="255" y1="270" x2="185" y2="280" stroke="#6b7280" stroke-width="1.5"/>
<line x1="185" y1="280" x2="170" y2="232" stroke="#6b7280" stroke-width="1.5"/>
<line x1="170" y1="232" x2="255" y2="215" stroke="#6b7280" stroke-width="1.5"/>
<line x1="170" y1="232" x2="120" y2="222" stroke="#6b7280" stroke-width="1.5"/>
<line x1="120" y1="222" x2="80" y2="205" stroke="#6b7280" stroke-width="1.5"/>
<line x1="80" y1="205" x2="35" y2="218" stroke="#6b7280" stroke-width="1.5"/>
<circle cx="255" cy="215" r="5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="255" cy="270" r="5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="185" cy="280" r="5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="170" cy="232" r="5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="120" cy="222" r="5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="80" cy="205" r="5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="35" cy="218" r="5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<line x1="255" y1="270" x2="255" y2="215" stroke="#92400e" stroke-width="2.5"/>
<line x1="255" y1="215" x2="205" y2="100" stroke="#92400e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahB)"/>
<text x="275" y="262" font-size="12" text-anchor="start" fill="#111827">Merak</text>
<text x="275" y="222" font-size="12" text-anchor="start" fill="#111827">Dubhe</text>
<text data-label="Pointer stars" x="285" y="242" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Pointer stars</text>
<text data-label="Big Dipper" x="150" y="300" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Big Dipper</text>
<text x="150" y="316" font-size="12" text-anchor="middle" fill="#6b7280">(part of Ursa Major)</text>
<polyline points="200,90 225,100 245,118 262,135 285,148 275,175 250,160" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="250" y1="160" x2="262" y2="135" stroke="#6b7280" stroke-width="1.5"/>
<circle cx="225" cy="100" r="3.5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="245" cy="118" r="3.5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="262" cy="135" r="3.5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="285" cy="148" r="3.5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="275" cy="175" r="3.5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="250" cy="160" r="3.5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<text x="330" y="150" font-size="12" text-anchor="middle" fill="#111827">Little Dipper</text>
<text x="330" y="164" font-size="12" text-anchor="middle" fill="#6b7280">(Ursa Minor)</text>
<polyline points="60,70 85,105 115,75 145,110 170,70" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="60" cy="70" r="4.5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="85" cy="105" r="4.5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="115" cy="75" r="4.5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="145" cy="110" r="4.5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="170" cy="70" r="4.5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<text data-label="Cassiopeia" x="110" y="138" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Cassiopeia</text>
<text x="110" y="154" font-size="12" text-anchor="middle" fill="#6b7280">a W (or M) shape</text>
<line x1="170" y1="70" x2="190" y2="82" stroke="#92400e" stroke-width="0"/>
<text x="200" y="345" font-size="12" text-anchor="middle" fill="#6b7280">Dubhe and Merak point to Polaris (about 5 times their gap).</text>
<text x="200" y="361" font-size="12" text-anchor="middle" fill="#6b7280">Polaris ends the Little Dipper handle. Cassiopeia is opposite.</text>
<text x="200" y="377" font-size="12" text-anchor="middle" fill="#6b7280">Not to scale. Circumpolar stars circle Polaris all night.</text>
</g>
</svg>
