<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 384" role="img" aria-labelledby="t d">
<title id="t">The constellation Orion</title>
<desc id="d">Orion: red Betelgeuse at the upper left shoulder, Bellatrix the other shoulder, a belt of three stars, Saiph and blue-white Rigel as feet, and the Orion Nebula M42 in the sword.</desc>
<defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="384" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<line x1="185" y1="35" x2="110" y2="70" stroke="#6b7280" stroke-width="1.5"/>
<line x1="185" y1="35" x2="265" y2="80" stroke="#6b7280" stroke-width="1.5"/>
<line x1="110" y1="70" x2="160" y2="175" stroke="#6b7280" stroke-width="1.5"/>
<line x1="265" y1="80" x2="230" y2="160" stroke="#6b7280" stroke-width="1.5"/>
<line x1="160" y1="175" x2="195" y2="168" stroke="#6b7280" stroke-width="1.5"/>
<line x1="195" y1="168" x2="230" y2="160" stroke="#6b7280" stroke-width="1.5"/>
<line x1="160" y1="175" x2="135" y2="290" stroke="#6b7280" stroke-width="1.5"/>
<line x1="230" y1="160" x2="285" y2="295" stroke="#6b7280" stroke-width="1.5"/>
<circle cx="110" cy="70" r="9" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="265" cy="80" r="7" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="185" cy="35" r="4" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="160" cy="175" r="6" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="195" cy="168" r="7" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="230" cy="160" r="5" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="135" cy="290" r="6" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<circle cx="285" cy="295" r="10" fill="#ffffff" stroke="#111827" stroke-width="0.8"/>
<text data-label="Betelgeuse" x="96" y="54" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">Betelgeuse</text>
<text x="94" y="70" font-size="12" text-anchor="end" fill="#6b7280">red, α Ori</text>
<text data-label="Rigel" x="298" y="312" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Rigel</text>
<text x="298" y="328" font-size="12" text-anchor="start" fill="#6b7280">blue-white, β Ori</text>
<text x="275" y="72" font-size="12" text-anchor="start" fill="#111827">Bellatrix</text>
<text x="120" y="292" font-size="12" text-anchor="end" fill="#111827">Saiph</text>
<text x="160" y="192" font-size="12" text-anchor="end" fill="#111827">Alnitak</text>
<text x="230" y="150" font-size="12" text-anchor="start" fill="#111827">Mintaka</text>
<text data-label="Belt" x="195" y="150" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Belt</text>
<line x1="195" y1="185" x2="195" y2="225" stroke="#6b7280" stroke-width="1.5"/>
<ellipse cx="195" cy="215" rx="14" ry="22" fill="#92400e" fill-opacity="0.2" stroke="#92400e" stroke-width="1"/>
<circle cx="195" cy="220" r="4" fill="#92400e"/>
<text data-label="M42" x="215" y="228" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">M42</text>
<text x="215" y="244" font-size="12" text-anchor="start" fill="#6b7280">Orion Nebula</text>
<text x="200" y="355" font-size="12" text-anchor="middle" fill="#6b7280">Betelgeuse and Rigel are opposite corners.</text>
<text x="200" y="372" font-size="12" text-anchor="middle" fill="#6b7280">Look for the 3-star Belt first.</text>
<text x="30" y="20" font-size="15" text-anchor="start" fill="#111827" font-weight="bold">Orion (the Hunter)</text>
</g>
</svg>
