<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 366" role="img" aria-labelledby="t d">
<title id="t">Stellar parallax</title>
<desc id="d">A nearby star appears to shift against distant background stars as Earth moves around its orbit. The parallax angle p is seen from the star between the Sun and Earth, 1 AU apart. d in parsecs equals one divided by p in arcseconds.</desc>
<defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="366" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="200" y="18" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Stellar parallax</text>
<circle cx="200" cy="270" r="12" fill="#92400e" fill-opacity="0.3"/>
<text x="200" y="300" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Sun</text>
<circle cx="110" cy="270" r="6" fill="#92400e" stroke="#111827" stroke-width="1.5"/>
<circle cx="290" cy="270" r="6" fill="#92400e" stroke="#111827" stroke-width="1.5"/>
<ellipse cx="200" cy="270" rx="90" ry="28" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
<text x="110" y="304" font-size="12" text-anchor="middle" fill="#111827">Earth in January</text>
<text x="290" y="304" font-size="12" text-anchor="middle" fill="#111827">Earth in July</text>
<text x="245" y="262" font-size="12" text-anchor="middle" fill="#92400e" font-weight="bold">1 AU</text>
<circle cx="200" cy="130" r="6" fill="#92400e" stroke="#111827" stroke-width="0.8"/>
<text x="214" y="124" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">near star</text>
<line x1="110" y1="270" x2="200" y2="130" stroke="#111827" stroke-width="1.2"/>
<line x1="290" y1="270" x2="200" y2="130" stroke="#111827" stroke-width="1.2"/>
<line x1="200" y1="270" x2="200" y2="130" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M200,152 A22,22 0 0 0 211.9,148.5" fill="none" stroke="#92400e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="222" y="168" font-size="12" text-anchor="start" fill="#92400e" font-weight="bold">p = parallax angle</text>
<circle cx="60" cy="55" r="3" fill="#6b7280"/>
<circle cx="120" cy="55" r="3" fill="#6b7280"/>
<circle cx="180" cy="55" r="3" fill="#6b7280"/>
<circle cx="240" cy="55" r="3" fill="#6b7280"/>
<circle cx="300" cy="55" r="3" fill="#6b7280"/>
<circle cx="350" cy="55" r="3" fill="#6b7280"/>
<text x="20" y="42" font-size="12" text-anchor="start" fill="#6b7280">distant background stars</text>
<line x1="110" y1="270" x2="130" y2="55" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 3"/>
<line x1="290" y1="270" x2="270" y2="55" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 3"/>
<circle cx="130" cy="55" r="4" fill="none" stroke="#92400e" stroke-width="1.5"/>
<circle cx="270" cy="55" r="4" fill="none" stroke="#92400e" stroke-width="1.5"/>
<text x="200" y="336" font-size="14" text-anchor="middle" fill="#92400e" font-weight="bold">d (parsecs) = 1 / p (arcseconds)</text>
<text x="200" y="354" font-size="12" text-anchor="middle" fill="#6b7280">1 parsec = 3.26 light-years = distance with p = 1″</text>
</g>
</svg>
