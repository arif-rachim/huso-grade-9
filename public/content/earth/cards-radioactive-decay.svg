<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="t d">
<title id="t">Radioactive decay curve</title>
<desc id="d">The amount of parent isotope halves after every half-life: 100 percent, 50, 25, 12.5, 6.25.</desc>
<defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="320" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<line x1="55" y1="260" x2="375" y2="260" stroke="#111827" stroke-width="2"/>
<line x1="55" y1="40" x2="55" y2="260" stroke="#111827" stroke-width="2"/>
<text x="215" y="298" font-size="12" text-anchor="middle" fill="#6b7280">time (in half-lives)</text>
<text x="14" y="150.0" font-size="12" text-anchor="middle" fill="#6b7280" transform="rotate(-90 14 150.0)">parent isotope left</text>
<polyline points="55,40 71,71.8 87,99 103,122.2 119,142.1 135,159.1 151,173.7 167,186.2 183,196.8 199,205.9 215,213.8 231,220.4 247,226.1 263,231 279,235.2 295,238.8 311,241.9 327,244.5 343,246.7 359,248.6 375,250.3" fill="none" stroke="#92400e" stroke-width="3" stroke-linejoin="round"/>
<line x1="55" y1="260" x2="55" y2="265" stroke="#111827" stroke-width="1.5"/>
<text x="55" y="280" font-size="12" text-anchor="middle" fill="#111827">0</text>
<line x1="126.1" y1="260" x2="126.1" y2="265" stroke="#111827" stroke-width="1.5"/>
<text x="126.1" y="280" font-size="12" text-anchor="middle" fill="#111827">1</text>
<line x1="197.2" y1="260" x2="197.2" y2="265" stroke="#111827" stroke-width="1.5"/>
<text x="197.2" y="280" font-size="12" text-anchor="middle" fill="#111827">2</text>
<line x1="268.3" y1="260" x2="268.3" y2="265" stroke="#111827" stroke-width="1.5"/>
<text x="268.3" y="280" font-size="12" text-anchor="middle" fill="#111827">3</text>
<line x1="339.4" y1="260" x2="339.4" y2="265" stroke="#111827" stroke-width="1.5"/>
<text x="339.4" y="280" font-size="12" text-anchor="middle" fill="#111827">4</text>
<circle cx="55" cy="40" r="4.5" fill="#92400e" stroke="#111827" stroke-width="1"/>
<line x1="55" y1="40" x2="55" y2="40" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
<text x="50" y="44" font-size="12" text-anchor="end" fill="#111827">100%</text>
<circle cx="126.1" cy="150" r="4.5" fill="#92400e" stroke="#111827" stroke-width="1"/>
<line x1="55" y1="150" x2="126.1" y2="150" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
<text x="50" y="154" font-size="12" text-anchor="end" fill="#111827">50%</text>
<circle cx="197.2" cy="205" r="4.5" fill="#92400e" stroke="#111827" stroke-width="1"/>
<line x1="55" y1="205" x2="197.2" y2="205" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
<text x="50" y="209" font-size="12" text-anchor="end" fill="#111827">25%</text>
<circle cx="268.3" cy="232.5" r="4.5" fill="#92400e" stroke="#111827" stroke-width="1"/>
<line x1="55" y1="232.5" x2="268.3" y2="232.5" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
<text x="50" y="236.5" font-size="12" text-anchor="end" fill="#111827">12.5%</text>
<circle cx="339.4" cy="246.2" r="4.5" fill="#92400e" stroke="#111827" stroke-width="1"/>
<line x1="55" y1="246.2" x2="339.4" y2="246.2" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
<text x="50" y="250.2" font-size="12" text-anchor="end" fill="#111827">6.25%</text>
<text x="205" y="70" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">After each half-life</text>
<text x="205" y="86" font-size="13" text-anchor="start" fill="#111827">half of the parent is left</text>
<text x="205" y="110" font-size="14" text-anchor="start" fill="#92400e" font-weight="bold">N = N₀ × (½)ⁿ</text>
<text x="205" y="128" font-size="12" text-anchor="start" fill="#6b7280">n = t / half-life</text>
<text x="200" y="20" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Radioactive decay and half-life</text>
</g>
</svg>
