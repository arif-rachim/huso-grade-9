<title id="t">Order of the planets</title>
<desc id="d">Mercury, Venus, Earth and Mars are rocky. Then the asteroid belt, the gas giants Jupiter and Saturn, the ice giants Uranus and Neptune, and the Kuiper belt. Distances in astronomical units are shown.</desc>
