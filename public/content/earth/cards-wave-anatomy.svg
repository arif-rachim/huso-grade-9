<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-labelledby="t d">
<title id="t">Anatomy of a water wave</title>
<desc id="d">A water wave with crest, trough, wavelength and wave height labeled. Water particles move in circles that shrink with depth to almost zero at half a wavelength.</desc>
<defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="400" height="270" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="200" y="16" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Anatomy of a water wave</text>
<polygon points="30,100 34,94.2 38,88.6 42,83.5 46,79.2 50,75.8 54,73.4 58,72.2 62,72.2 66,73.4 70,75.8 74,79.2 78,83.5 82,88.6 86,94.2 90,100 94,105.8 98,111.4 102,116.5 106,120.8 110,124.2 114,126.6 118,127.8 122,127.8 126,126.6 130,124.2 134,120.8 138,116.5 142,111.4 146,105.8 150,100 154,94.2 158,88.6 162,83.5 166,79.2 170,75.8 174,73.4 178,72.2 182,72.2 186,73.4 190,75.8 194,79.2 198,83.5 202,88.6 206,94.2 210,100 214,105.8 218,111.4 222,116.5 226,120.8 230,124.2 234,126.6 238,127.8 242,127.8 246,126.6 250,124.2 254,120.8 258,116.5 262,111.4 266,105.8 270,100 270,190 30,190" fill="#92400e" fill-opacity="0.12"/>
<polyline points="30,100 34,94.2 38,88.6 42,83.5 46,79.2 50,75.8 54,73.4 58,72.2 62,72.2 66,73.4 70,75.8 74,79.2 78,83.5 82,88.6 86,94.2 90,100 94,105.8 98,111.4 102,116.5 106,120.8 110,124.2 114,126.6 118,127.8 122,127.8 126,126.6 130,124.2 134,120.8 138,116.5 142,111.4 146,105.8 150,100 154,94.2 158,88.6 162,83.5 166,79.2 170,75.8 174,73.4 178,72.2 182,72.2 186,73.4 190,75.8 194,79.2 198,83.5 202,88.6 206,94.2 210,100 214,105.8 218,111.4 222,116.5 226,120.8 230,124.2 234,126.6 238,127.8 242,127.8 246,126.6 250,124.2 254,120.8 258,116.5 262,111.4 266,105.8 270,100" fill="none" stroke="#92400e" stroke-width="3" stroke-linejoin="round"/>
<line x1="20" y1="100" x2="280" y2="100" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 4"/>
<circle cx="60" cy="72" r="4" fill="#111827"/>
<text data-label="Crest" x="60" y="60" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Crest</text>
<circle cx="120" cy="128" r="4" fill="#111827"/>
<text data-label="Trough" x="120" y="150" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Trough</text>
<line x1="60" y1="38" x2="180" y2="38" stroke="#111827" stroke-width="1.5" marker-end="url(#ahK)"/>
<line x1="180" y1="38" x2="60" y2="38" stroke="#111827" stroke-width="1.5" marker-end="url(#ahK)"/>
<text data-label="Wavelength" x="120" y="32" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Wavelength λ</text>
<line x1="60" y1="72" x2="100" y2="72" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="120" y1="128" x2="100" y2="128" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="92" y1="74" x2="92" y2="126" stroke="#92400e" stroke-width="2" marker-end="url(#ahB)"/>
<line x1="92" y1="126" x2="92" y2="74" stroke="#92400e" stroke-width="2" marker-end="url(#ahB)"/>
<text data-label="Wave height" x="86" y="104" font-size="12" text-anchor="end" fill="#92400e" font-weight="bold">Height</text>
<circle cx="335" cy="100" r="14" fill="none" stroke="#92400e" stroke-width="1.8"/>
<circle cx="335" cy="132" r="8" fill="none" stroke="#92400e" stroke-width="1.8"/>
<circle cx="335" cy="154" r="4" fill="none" stroke="#92400e" stroke-width="1.8"/>
<circle cx="335" cy="172" r="1.5" fill="none" stroke="#92400e" stroke-width="1.8"/>
<text x="335" y="40" font-size="12" text-anchor="middle" fill="#111827">particles move</text>
<text x="335" y="56" font-size="12" text-anchor="middle" fill="#111827">in circles</text>
<text x="335" y="196" font-size="12" text-anchor="middle" fill="#6b7280">≈ 0 at depth λ/2</text>
<text x="200" y="222" font-size="14" text-anchor="middle" fill="#92400e" font-weight="bold">Speed: v = f λ.   Period T = 1 / f.</text>
<text x="200" y="242" font-size="12" text-anchor="middle" fill="#6b7280">Wave height = crest to trough = 2 × amplitude.</text>
<text x="200" y="258" font-size="12" text-anchor="middle" fill="#6b7280">In shallow water a wave slows down and gets taller.</text>
</g>
</svg>
