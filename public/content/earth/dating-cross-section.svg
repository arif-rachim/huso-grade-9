<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 468" role="img" aria-labelledby="t d">
  <title id="t">A cross section to read in order</title>
  <desc id="d">Cross section with a granite basement, sandstone, limestone and shale layers, a dike cutting all of them, a lava flow lying on top of the dike, and a fault that offsets everything including the lava. The order from oldest to youngest is granite, sandstone, limestone, shale, dike, lava, fault.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="468" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Read the order of events (oldest → youngest)</text>
    <rect x="20" y="120" width="260" height="30" fill="#d1d5db" fill-opacity="0.7" stroke="#6b7280" stroke-width="1.2"/>
    <rect x="20" y="150" width="260" height="46" fill="#fde68a" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.2"/>
    <rect x="20" y="196" width="260" height="46" fill="#fef3c7" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.2"/>
    <rect x="20" y="242" width="260" height="50" fill="#fde68a" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.2"/>
    <path d="M20,292 C50,286 80,298 150.0,292 S240,287 280,292 L280,392 L20,392 z" fill="#9ca3af" fill-opacity="0.7" stroke="#6b7280" stroke-width="1.2"/>
    <rect x="286" y="136" width="174" height="30" fill="#d1d5db" fill-opacity="0.7" stroke="#6b7280" stroke-width="1.2"/>
    <rect x="286" y="166" width="174" height="46" fill="#fde68a" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.2"/>
    <rect x="286" y="212" width="174" height="46" fill="#fef3c7" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.2"/>
    <rect x="286" y="258" width="174" height="50" fill="#fde68a" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.2"/>
    <path d="M286,308 C316,302 346,314 373.0,308 S420,303 460,308 L460,408 L286,408 z" fill="#9ca3af" fill-opacity="0.7" stroke="#6b7280" stroke-width="1.2"/>
    <line x1="280" y1="116" x2="286" y2="414" stroke="#dc2626" stroke-width="3.5"/>
    <text x="292" y="114" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">F  fault</text>
    <line x1="304" y1="126" x2="304" y2="142" stroke="#111827" stroke-width="2" marker-end="url(#arK)"/>
    <text x="314" y="141" font-size="12" text-anchor="start" fill="#6b7280">moved down</text>
    <path d="M120,392 L138,392 L138,150 L120,150 z" fill="#6b7280" fill-opacity="0.85" stroke="#111827" stroke-width="1.5"/>
    <line x1="140" y1="228" x2="154" y2="218" stroke="#111827" stroke-width="1"/>
    <text x="156" y="222" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">D  dike</text>
    <text x="156" y="236" font-size="12" text-anchor="start" fill="#6b7280">cuts across the layers</text>
    <text x="28" y="142" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">L  lava flow</text>
    <text x="28" y="178" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">S3  shale</text>
    <text x="28" y="224" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">S2  limestone</text>
    <text x="28" y="272" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">S1  sandstone</text>
    <text x="150" y="345" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">G  granite basement</text>
    <text x="150" y="288" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">nonconformity</text>
    <text x="150" y="301" font-size="12" text-anchor="start" fill="#dc2626">(sediments on granite)</text>
    <rect x="20" y="424" width="440" height="28" fill="#fef3c7" fill-opacity="0.5" stroke="#92400e" stroke-width="1.2" rx="6"/>
    <text x="240" y="443" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Order: G → S1 → S2 → S3 → D → L → F</text>
    <text x="20" y="48" font-size="12" text-anchor="start" fill="#92400e" font-weight="bold">Rules used:</text>
    <text x="20" y="64" font-size="12" text-anchor="start" fill="#111827">• superposition: in undisturbed layers, up = younger</text>
    <text x="20" y="80" font-size="12" text-anchor="start" fill="#111827">• cross-cutting: whatever cuts a rock is younger than that rock</text>
    <text x="20" y="96" font-size="12" text-anchor="start" fill="#111827">  (D cuts S3 but not L; F cuts everything, so F is the youngest)</text>
  </g>
</svg>
