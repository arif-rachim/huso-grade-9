    <text x="352" y="62" font-size="13" text-anchor="start" fill="#92400e" font-weight="bold">Useful clocks</text>
    <text x="352" y="82" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">Carbon-14</text>
    <text x="352" y="96" font-size="12" text-anchor="start" fill="#111827">t½ = 5,730 yr</text>
    <text x="352" y="110" font-size="12" text-anchor="start" fill="#6b7280">to about 50,000 yr</text>
    <text x="352" y="132" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">Uranium-238</text>
    <text x="352" y="146" font-size="12" text-anchor="start" fill="#111827">t½ = 4.47 Gyr</text>
    <text x="352" y="160" font-size="12" text-anchor="start" fill="#6b7280">→ lead-206</text>
    <text x="352" y="182" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">Potassium-40</text>
    <text x="352" y="196" font-size="12" text-anchor="start" fill="#111827">t½ = 1.25 Gyr</text>
    <text x="352" y="210" font-size="12" text-anchor="start" fill="#6b7280">→ argon-40</text>
    <text x="352" y="232" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">Rubidium-87</text>
    <text x="352" y="246" font-size="12" text-anchor="start" fill="#111827">t½ = 48.8 Gyr</text>
    <text x="352" y="260" font-size="12" text-anchor="start" fill="#6b7280">→ strontium-87</text>
