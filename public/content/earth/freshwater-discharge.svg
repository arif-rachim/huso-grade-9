<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-labelledby="t d">
  <title id="t">Stream discharge: width times depth times speed</title>
  <desc id="d">Left: a stream channel cross-section with width w and mean depth d, so area A equals w times d. Right: map view with a float that travels a measured distance in a measured time to give the surface speed. Discharge Q equals area times mean velocity, in cubic meters per second.</desc>
  <rect x="0" y="0" width="440" height="330" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="18.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Discharge Q = A × v  (m³ per second)</text>
    <rect x="20.0" y="34.0" width="200.0" height="170.0" rx="0" fill="#eef0f3" fill-opacity="0.5"/>
    <path d="M30.0 70.0 L60.0 150.0 L180.0 150.0 L210.0 70.0 L210.0 190.0 L30.0 190.0 Z" fill="#92400e" fill-opacity="0.45"/>
    <path d="M30.0 70.0 L60.0 150.0 L180.0 150.0 L210.0 70.0" fill="none" stroke="#92400e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M36.0 86.0 L60.0 150.0 L180.0 150.0 L204.0 86.0 Z" fill="#2563eb" fill-opacity="0.3"/>
    <line x1="36.0" y1="86.0" x2="204.0" y2="86.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="36.0" y1="76.0" x2="204.0" y2="76.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36.0" y1="71.0" x2="36.0" y2="81.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="204.0" y1="71.0" x2="204.0" y2="81.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
    <text x="120.0" y="66.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">width w</text>
    <line x1="120.0" y1="86.0" x2="120.0" y2="150.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="115.0" y1="86.0" x2="125.0" y2="86.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="115.0" y1="150.0" x2="125.0" y2="150.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
    <text x="128.0" y="124.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">depth d</text>
    <text x="120.0" y="172.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">A ≈ w × d</text>
    <text x="120.0" y="188.0" font-size="12" text-anchor="middle" fill="#6b7280">use mean depth in a real stream</text>
    <rect x="230.0" y="34.0" width="190.0" height="170.0" rx="0" fill="#eef0f3" fill-opacity="0.5"/>
    <rect x="236.0" y="80.0" width="178.0" height="70.0" rx="0" fill="#2563eb" fill-opacity="0.28"/>
    <line x1="236.0" y1="80.0" x2="414.0" y2="80.0" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
    <line x1="236.0" y1="150.0" x2="414.0" y2="150.0" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
    <line x1="262.0" y1="164.0" x2="262.0" y2="70.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/>
    <line x1="382.0" y1="164.0" x2="382.0" y2="70.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/>
    <text x="262.0" y="62.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">start</text>
    <text x="382.0" y="62.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">finish</text>
    <line x1="262.0" y1="172.0" x2="382.0" y2="172.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="262.0" y1="167.0" x2="262.0" y2="177.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="382.0" y1="167.0" x2="382.0" y2="177.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
    <text x="322.0" y="190.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">distance L, time t</text>
    <circle cx="300.0" cy="115.0" r="6" fill="#92400e" stroke="#111827" stroke-width="1.5"/>
    <line x1="310.0" y1="115.0" x2="360.0" y2="115.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <line x1="360.0" y1="115.0" x2="351.9" y2="111.1" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <line x1="360.0" y1="115.0" x2="351.9" y2="118.9" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <text x="322.0" y="106.0" font-size="12" text-anchor="middle" fill="#92400e" font-weight="bold">float</text>
    <text x="322.0" y="140.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">v(surface) = L ÷ t</text>
    <rect x="20.0" y="218.0" width="400.0" height="96.0" rx="8" fill="#ffffff" stroke="#92400e" stroke-width="2"/>
    <text x="220.0" y="242.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">v(mean) ≈ 0.8 to 0.9 × v(surface)  (water is slower at the bed)</text>
    <text x="220.0" y="266.0" font-size="15" text-anchor="middle" fill="#92400e" font-weight="bold">Q = w × d × v(mean)</text>
    <text x="220.0" y="288.0" font-size="13" text-anchor="middle" fill="#111827">Example: 6 m × 0.8 m × 0.5 m/s = 2.4 m³/s = 2 400 L/s</text>
    <text x="220.0" y="306.0" font-size="12" text-anchor="middle" fill="#6b7280">Same Q everywhere: narrower or shallower → faster</text>
  </g>
</svg>
