<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-labelledby="t d">
  <title id="t">Meanders, cut banks, point bars and oxbow lakes</title>
  <desc id="d">Map view of a meandering stream. Water is fastest on the outside of each bend, so it erodes a steep cut bank there. On the inside of the bend the water is slow and drops sand to build a point bar. Over time a bend can grow until the neck is cut through, leaving a crescent shaped oxbow lake.</desc>
