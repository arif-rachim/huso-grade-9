<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" role="img" aria-labelledby="t d">
  <title id="t">Bowen's reaction series</title>
  <desc id="d">Two branches cool downward from hot to cool. The discontinuous branch goes olivine, pyroxene, amphibole, biotite. The continuous branch goes from calcium-rich to sodium-rich plagioclase. They join and finish with potassium feldspar, muscovite and quartz.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="500" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Bowen's reaction series: the order minerals crystallize</text>
    <line x1="30" y1="60" x2="30" y2="430" stroke="#111827" stroke-width="2" marker-end="url(#arK)"/>
    <text x="30" y="50" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">hotter</text>
    <text x="30" y="450" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">cooler</text>
    <text x="44" y="78" font-size="12" text-anchor="start" fill="#6b7280">~1200 °C</text>
    <text x="44" y="416" font-size="12" text-anchor="start" fill="#6b7280">~600 °C</text>
    <text x="165" y="66" font-size="13" text-anchor="middle" fill="#92400e" font-weight="bold">Discontinuous series</text>
    <text x="165" y="80" font-size="12" text-anchor="middle" fill="#6b7280">(different minerals)</text>
    <text x="345" y="66" font-size="13" text-anchor="middle" fill="#92400e" font-weight="bold">Continuous series</text>
    <text x="345" y="80" font-size="12" text-anchor="middle" fill="#6b7280">(one mineral, changing)</text>
    <rect x="100" y="92" width="130" height="40" fill="#92400e" fill-opacity="0.2" stroke="#92400e" stroke-width="1.6" rx="6"/>
    <text x="165" y="117" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Olivine</text>
    <rect x="100" y="148" width="130" height="40" fill="#92400e" fill-opacity="0.2" stroke="#92400e" stroke-width="1.6" rx="6"/>
    <text x="165" y="173" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Pyroxene</text>
    <rect x="100" y="204" width="130" height="40" fill="#92400e" fill-opacity="0.2" stroke="#92400e" stroke-width="1.6" rx="6"/>
    <text x="165" y="229" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Amphibole</text>
    <rect x="100" y="260" width="130" height="40" fill="#92400e" fill-opacity="0.2" stroke="#92400e" stroke-width="1.6" rx="6"/>
    <text x="165" y="285" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Biotite mica</text>
    <rect x="265" y="92" width="160" height="52" fill="#92400e" fill-opacity="0.2" stroke="#92400e" stroke-width="1.6" rx="6"/>
    <text x="345" y="116" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Ca-rich plagioclase</text>
    <text x="345" y="131" font-size="12" text-anchor="middle" fill="#6b7280">(anorthite)</text>
    <rect x="265" y="160" width="160" height="40" fill="#92400e" fill-opacity="0.2" stroke="#92400e" stroke-width="1.6" rx="6"/>
    <text x="345" y="185" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Intermediate</text>
    <rect x="265" y="216" width="160" height="52" fill="#92400e" fill-opacity="0.2" stroke="#92400e" stroke-width="1.6" rx="6"/>
    <text x="345" y="240" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Na-rich plagioclase</text>
    <text x="345" y="255" font-size="12" text-anchor="middle" fill="#6b7280">(albite)</text>
    <line x1="165" y1="132" x2="165" y2="148" stroke="#111827" stroke-width="1.8" marker-end="url(#arK)"/>
    <line x1="165" y1="188" x2="165" y2="204" stroke="#111827" stroke-width="1.8" marker-end="url(#arK)"/>
    <line x1="165" y1="244" x2="165" y2="260" stroke="#111827" stroke-width="1.8" marker-end="url(#arK)"/>
    <line x1="345" y1="144" x2="345" y2="160" stroke="#111827" stroke-width="1.8" marker-end="url(#arK)"/>
    <line x1="345" y1="200" x2="345" y2="216" stroke="#111827" stroke-width="1.8" marker-end="url(#arK)"/>
    <line x1="165" y1="300" x2="255" y2="328" stroke="#111827" stroke-width="1.8" marker-end="url(#arK)"/>
    <line x1="345" y1="268" x2="255" y2="328" stroke="#111827" stroke-width="1.8" marker-end="url(#arK)"/>
    <rect x="160" y="332" width="190" height="36" fill="#92400e" fill-opacity="0.2" stroke="#92400e" stroke-width="1.6" rx="6"/>
    <text x="255" y="355" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">K-feldspar</text>
    <rect x="160" y="380" width="90" height="34" fill="#92400e" fill-opacity="0.2" stroke="#92400e" stroke-width="1.6" rx="6"/>
    <text x="205" y="402" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Muscovite</text>
    <rect x="260" y="380" width="90" height="34" fill="#92400e" fill-opacity="0.35" stroke="#92400e" stroke-width="1.6" rx="6"/>
    <text x="305" y="402" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Quartz</text>
    <line x1="255" y1="368" x2="205" y2="380" stroke="#111827" stroke-width="1.8" marker-end="url(#arK)"/>
    <line x1="255" y1="368" x2="305" y2="380" stroke="#111827" stroke-width="1.8" marker-end="url(#arK)"/>
    <text x="452" y="112" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">mafic</text>
    <text x="452" y="128" font-size="12" text-anchor="middle" fill="#6b7280">dark</text>
    <text x="452" y="141" font-size="12" text-anchor="middle" fill="#6b7280">Fe, Mg</text>
    <text x="452" y="154" font-size="12" text-anchor="middle" fill="#6b7280">low SiO₂</text>
    <text x="452" y="352" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">felsic</text>
    <text x="452" y="368" font-size="12" text-anchor="middle" fill="#6b7280">light</text>
    <text x="452" y="381" font-size="12" text-anchor="middle" fill="#6b7280">K, Na, Al</text>
    <text x="452" y="394" font-size="12" text-anchor="middle" fill="#6b7280">high SiO₂</text>
    <text x="250" y="468" font-size="12" text-anchor="middle" fill="#6b7280">Weathering goes the other way (Goldich): olivine breaks down fastest, quartz slowest.</text>
    <text x="250" y="486" font-size="12" text-anchor="middle" fill="#6b7280">Rocks: gabbro/basalt (top) → diorite/andesite (middle) → granite/rhyolite (bottom).</text>
  </g>
</svg>
