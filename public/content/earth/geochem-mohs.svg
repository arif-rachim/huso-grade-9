<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t d">
  <title id="t">The Mohs hardness scale</title>
  <desc id="d">Ten reference minerals from talc (1) to diamond (10), with everyday tools placed on the scale: a fingernail at 2.5, a copper coin at 3.5, a steel knife blade and glass at 5.5, and a steel file at 6.5.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="360" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Mohs scale: a harder mineral scratches a softer one</text>
    <rect x="100" y="50" width="28" height="22" fill="#92400e" fill-opacity="0.19" stroke="#92400e" stroke-width="1.2"/>
    <text x="92" y="66" font-size="14" text-anchor="end" fill="#111827" font-weight="bold">1</text>
    <text x="136" y="66" font-size="13" text-anchor="start" fill="#111827">Talc</text>
    <rect x="100" y="76" width="46" height="22" fill="#92400e" fill-opacity="0.26" stroke="#92400e" stroke-width="1.2"/>
    <text x="92" y="92" font-size="14" text-anchor="end" fill="#111827" font-weight="bold">2</text>
    <text x="154" y="92" font-size="13" text-anchor="start" fill="#111827">Gypsum</text>
    <rect x="100" y="102" width="64" height="22" fill="#92400e" fill-opacity="0.33" stroke="#92400e" stroke-width="1.2"/>
    <text x="92" y="118" font-size="14" text-anchor="end" fill="#111827" font-weight="bold">3</text>
    <text x="172" y="118" font-size="13" text-anchor="start" fill="#111827">Calcite</text>
    <rect x="100" y="128" width="82" height="22" fill="#92400e" fill-opacity="0.4" stroke="#92400e" stroke-width="1.2"/>
    <text x="92" y="144" font-size="14" text-anchor="end" fill="#111827" font-weight="bold">4</text>
    <text x="190" y="144" font-size="13" text-anchor="start" fill="#111827">Fluorite</text>
    <rect x="100" y="154" width="100" height="22" fill="#92400e" fill-opacity="0.47000000000000003" stroke="#92400e" stroke-width="1.2"/>
    <text x="92" y="170" font-size="14" text-anchor="end" fill="#111827" font-weight="bold">5</text>
    <text x="208" y="170" font-size="13" text-anchor="start" fill="#111827">Apatite</text>
    <rect x="100" y="180" width="118" height="22" fill="#92400e" fill-opacity="0.54" stroke="#92400e" stroke-width="1.2"/>
    <text x="92" y="196" font-size="14" text-anchor="end" fill="#111827" font-weight="bold">6</text>
    <text x="226" y="196" font-size="13" text-anchor="start" fill="#111827">Orthoclase</text>
    <rect x="100" y="206" width="136" height="22" fill="#92400e" fill-opacity="0.6100000000000001" stroke="#92400e" stroke-width="1.2"/>
    <text x="92" y="222" font-size="14" text-anchor="end" fill="#111827" font-weight="bold">7</text>
    <text x="244" y="222" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Quartz</text>
    <rect x="100" y="232" width="154" height="22" fill="#92400e" fill-opacity="0.68" stroke="#92400e" stroke-width="1.2"/>
    <text x="92" y="248" font-size="14" text-anchor="end" fill="#111827" font-weight="bold">8</text>
    <text x="262" y="248" font-size="13" text-anchor="start" fill="#111827">Topaz</text>
    <rect x="100" y="258" width="172" height="22" fill="#92400e" fill-opacity="0.7500000000000001" stroke="#92400e" stroke-width="1.2"/>
    <text x="92" y="274" font-size="14" text-anchor="end" fill="#111827" font-weight="bold">9</text>
    <text x="280" y="274" font-size="13" text-anchor="start" fill="#111827">Corundum</text>
    <rect x="100" y="284" width="190" height="22" fill="#92400e" fill-opacity="0.8200000000000001" stroke="#92400e" stroke-width="1.2"/>
    <text x="92" y="300" font-size="14" text-anchor="end" fill="#111827" font-weight="bold">10</text>
    <text x="298" y="300" font-size="13" text-anchor="start" fill="#111827">Diamond</text>
    <line x1="344" y1="50" x2="344" y2="310" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="350" y="46" font-size="13" text-anchor="start" fill="#92400e" font-weight="bold">Everyday tools</text>
    <line x1="344" y1="100" x2="354" y2="100" stroke="#92400e" stroke-width="2.5"/>
    <circle cx="344" cy="100" r="3.5" fill="#92400e"/>
    <text x="358" y="105" font-size="12" text-anchor="start" fill="#111827">fingernail 2.5</text>
    <line x1="344" y1="126" x2="354" y2="126" stroke="#92400e" stroke-width="2.5"/>
    <circle cx="344" cy="126" r="3.5" fill="#92400e"/>
    <text x="358" y="131" font-size="12" text-anchor="start" fill="#111827">copper coin 3.5</text>
    <line x1="344" y1="178" x2="354" y2="178" stroke="#92400e" stroke-width="2.5"/>
    <circle cx="344" cy="178" r="3.5" fill="#92400e"/>
    <text x="358" y="183" font-size="12" text-anchor="start" fill="#111827">steel knife, glass 5.5</text>
    <line x1="344" y1="204" x2="354" y2="204" stroke="#92400e" stroke-width="2.5"/>
    <circle cx="344" cy="204" r="3.5" fill="#92400e"/>
    <text x="358" y="209" font-size="12" text-anchor="start" fill="#111827">steel file 6.5</text>
    <text x="240" y="330" font-size="12" text-anchor="middle" fill="#6b7280">Not evenly spaced: diamond is about 4 times harder than corundum (9).</text>
    <text x="240" y="346" font-size="12" text-anchor="middle" fill="#6b7280">Test: try to scratch with a tool or another mineral and see which one leaves a groove.</text>
  </g>
</svg>
