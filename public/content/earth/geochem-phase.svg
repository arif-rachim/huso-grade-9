<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t d">
  <title id="t">Two phase diagrams</title>
  <desc id="d">Left: the pressure-temperature diagram of water with the solid, liquid and gas fields, the triple point and the critical point; the melting line slopes backward. Right: a temperature-composition eutectic diagram of two minerals with a liquid field, two liquid-plus-crystal fields and a solid field, meeting at the eutectic point.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="340" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Two kinds of phase diagrams</text>
    <line x1="40" y1="250" x2="230" y2="250" stroke="#111827" stroke-width="2" marker-end="url(#arK)"/>
    <line x1="40" y1="250" x2="40" y2="50" stroke="#111827" stroke-width="2" marker-end="url(#arK)"/>
    <text x="135" y="272" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">temperature</text>
    <text x="14" y="150" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold" transform="rotate(-90 14 150)">pressure</text>
    <rect x="40" y="50" width="190" height="200" fill="none"/>
    <path d="M110,200 L96,50" fill="none" stroke="#92400e" stroke-width="2.5"/>
    <path d="M40,250 Q80,242 110,200" fill="none" stroke="#92400e" stroke-width="2.5"/>
    <path d="M110,200 Q170,180 210,100" fill="none" stroke="#92400e" stroke-width="2.5"/>
    <circle cx="110" cy="200" r="5" fill="#111827"/>
    <circle cx="210" cy="100" r="5" fill="#111827"/>
    <text x="120" y="216" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">triple point</text>
    <text x="120" y="230" font-size="12" text-anchor="start" fill="#6b7280">0.01 °C</text>
    <text x="120" y="244" font-size="12" text-anchor="start" fill="#6b7280">0.006 atm</text>
    <text x="202" y="90" font-size="12" text-anchor="end" fill="#111827" font-weight="bold">critical point</text>
    <text x="202" y="104" font-size="12" text-anchor="end" fill="#6b7280">374 °C, 218 atm</text>
    <text x="64" y="110" font-size="14" text-anchor="middle" fill="#92400e" font-weight="bold">SOLID</text>
    <text x="64" y="124" font-size="12" text-anchor="middle" fill="#6b7280">(ice)</text>
    <text x="140" y="140" font-size="14" text-anchor="middle" fill="#92400e" font-weight="bold">LIQUID</text>
    <text x="208" y="218" font-size="14" text-anchor="middle" fill="#92400e" font-weight="bold">GAS</text>
    <text x="208" y="232" font-size="12" text-anchor="middle" fill="#6b7280">(vapor)</text>
    <text x="135" y="42" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Water (not to scale)</text>
    <line x1="40" y1="160" x2="230" y2="160" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="232" y="164" font-size="12" text-anchor="start" fill="#6b7280">1 atm</text>
    <circle cx="102" cy="160" r="3.5" fill="#92400e"/>
    <text x="102" y="176" font-size="12" text-anchor="middle" fill="#111827">0 °C</text>
    <circle cx="169.8" cy="160" r="3.5" fill="#92400e"/>
    <text x="176" y="176" font-size="12" text-anchor="start" fill="#111827">100 °C</text>
    <line x1="290" y1="250" x2="460" y2="250" stroke="#111827" stroke-width="2" marker-end="url(#arK)"/>
    <line x1="290" y1="250" x2="290" y2="50" stroke="#111827" stroke-width="2" marker-end="url(#arK)"/>
    <text x="375" y="272" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">composition (% B)</text>
    <text x="272" y="150" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold" transform="rotate(-90 272 150)">temperature</text>
    <text x="290" y="262" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">A</text>
    <text x="460" y="262" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">B</text>
    <path d="M290,80 L361.4,170 L460,58" fill="none" stroke="#92400e" stroke-width="2.5"/>
    <line x1="290" y1="170" x2="460" y2="170" stroke="#92400e" stroke-width="2.5"/>
    <line x1="361.4" y1="170" x2="361.4" y2="250" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="375" y="42" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Two minerals (A and B)</text>
    <text x="361.4" y="105" font-size="14" text-anchor="middle" fill="#92400e" font-weight="bold">LIQUID</text>
    <text x="330" y="150" font-size="12" text-anchor="middle" fill="#111827">liquid + A</text>
    <text x="426" y="132" font-size="12" text-anchor="middle" fill="#111827">liquid + B</text>
    <text x="361.4" y="220" font-size="13" text-anchor="middle" fill="#92400e" font-weight="bold">A + B crystals</text>
    <text x="361.4" y="234" font-size="12" text-anchor="middle" fill="#6b7280">(all solid)</text>
    <circle cx="361.4" cy="170" r="5" fill="#111827"/>
    <text x="369.4" y="186" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">eutectic E</text>
    <text x="240" y="292" font-size="12" text-anchor="middle" fill="#6b7280">Left: crossing a line changes the phase of water.</text>
    <text x="240" y="308" font-size="12" text-anchor="middle" fill="#6b7280">Right: the eutectic E is the lowest melting temperature of any A–B mixture.</text>
    <text x="240" y="324" font-size="12" text-anchor="middle" fill="#6b7280">Salt + ice is such a mixture: it melts down to about −21 °C.</text>
  </g>
</svg>
