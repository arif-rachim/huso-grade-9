    <text x="336" y="302" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Halite, galena</text>
    <text x="336" y="317" font-size="12" text-anchor="middle" fill="#6b7280">3 directions at 90°</text>
    <text x="336" y="332" font-size="12" text-anchor="middle" fill="#6b7280">(cubic)</text>
    <path d="M412,254 L440,254 L446,286 L418,286 z" fill="#92400e" fill-opacity="0.12" stroke="#92400e" stroke-width="1.5"/>
    <path d="M412,254 L426,242 L454,242 L440,254 z" fill="#92400e" fill-opacity="0.22" stroke="#92400e" stroke-width="1.5"/>
    <path d="M440,254 L454,242 L460,274 L446,286 z" fill="#92400e" fill-opacity="0.3" stroke="#92400e" stroke-width="1.5"/>
    <text x="432" y="302" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Calcite</text>
    <text x="432" y="317" font-size="12" text-anchor="middle" fill="#6b7280">3 directions,</text>
    <text x="432" y="332" font-size="12" text-anchor="middle" fill="#6b7280">NOT at 90° (rhomb)</text>
    <text x="240" y="372" font-size="12" text-anchor="middle" fill="#111827"></text>
    <text x="240" y="400" font-size="12" text-anchor="middle" fill="#111827">Quartz has no cleavage: it breaks with curved, shell-like surfaces (conchoidal fracture).</text>
    <text x="240" y="418" font-size="12" text-anchor="middle" fill="#6b7280">Check cleavage with a hand lens: flat, shiny, repeating faces mean cleavage.</text>
    <text x="240" y="436" font-size="12" text-anchor="middle" fill="#6b7280">Sheets, chains and frameworks are different ways the same tetrahedron links up.</text>
  </g>
</svg>
