    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Silicate structures and cleavage</text>
    <text x="240" y="46" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">1. The silicon–oxygen tetrahedron (a triangle here) is the building block</text>
