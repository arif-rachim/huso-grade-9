    <text x="240" y="328" font-size="12" text-anchor="middle" fill="#6b7280">at 56° and 124°</text>
    <path d="M314,254 L346,254 L346,286 L314,286 z" fill="#92400e" fill-opacity="0.12" stroke="#92400e" stroke-width="1.5"/>
