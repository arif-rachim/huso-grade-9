<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 452" role="img" aria-labelledby="t d">
  <title id="t">Silicate structures and cleavage</title>
  <desc id="d">Top row: silicate minerals built from tetrahedra that are isolated in olivine, in single chains in pyroxene, in double chains in amphibole, in sheets in mica and in a 3D framework in quartz and feldspar. Bottom row: cleavage patterns: one direction in mica, two directions at about 90 degrees in pyroxene, two at 56 and 124 degrees in amphibole, three at 90 degrees in halite, three not at 90 degrees in calcite, and none in quartz.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="452" fill="#ffffff"/>
