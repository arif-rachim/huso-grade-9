    <text x="48" y="142" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Isolated</text>
    <text x="48" y="157" font-size="12" text-anchor="middle" fill="#6b7280">olivine</text>
    <text x="144" y="142" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Single chain</text>
    <text x="144" y="157" font-size="12" text-anchor="middle" fill="#6b7280">pyroxene</text>
    <text x="240" y="142" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Double chain</text>
    <text x="240" y="157" font-size="12" text-anchor="middle" fill="#6b7280">amphibole</text>
    <text x="336" y="142" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Sheets</text>
    <text x="336" y="157" font-size="12" text-anchor="middle" fill="#6b7280">mica</text>
    <text x="432" y="142" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Framework</text>
    <text x="432" y="157" font-size="12" text-anchor="middle" fill="#6b7280">quartz, feldspar</text>
    <text x="240" y="178" font-size="12" text-anchor="middle" fill="#6b7280">more shared corners = more Si–O bonds = harder to break, higher SiO₂ (felsic)</text>
    <line x1="20" y1="190" x2="460" y2="190" stroke="#d1d5db" stroke-width="1"/>
    <text x="240" y="212" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">2. Cleavage: smooth flat breaks along weak planes (fracture: any other break)</text>
