<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-labelledby="t d">
  <title id="t">Parts of a valley glacier</title>
  <desc id="d">A valley glacier has an upper accumulation zone where more snow falls than melts and a lower ablation zone where more ice melts than is added. They meet at the equilibrium line. Ice flows downhill by deforming and sliding, cracks open as crevasses where it bends, and the glacier ends at the terminus with meltwater and moraines.</desc>
