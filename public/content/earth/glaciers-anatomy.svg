    <text x="223.0" y="44.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">equilibrium line (ELA):</text>
    <text x="223.0" y="59.0" font-size="12" text-anchor="start" fill="#6b7280">snow added = ice lost</text>
    <text x="120.0" y="44.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">ACCUMULATION ZONE</text>
    <text x="120.0" y="59.0" font-size="12" text-anchor="middle" fill="#2563eb">snow > melt: ice grows</text>
    <text x="330.0" y="120.0" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">ABLATION ZONE</text>
    <text x="330.0" y="135.0" font-size="12" text-anchor="middle" fill="#dc2626">melt > snow: ice shrinks</text>
