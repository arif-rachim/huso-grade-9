    <text x="372.0" y="338.0" font-size="12" text-anchor="middle" fill="#2563eb">with braided streams</text>
    <text x="220.0" y="376.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">C. Mountain top from above</text>
    <rect x="20.0" y="386.0" width="400.0" height="124.0" rx="0" fill="#eef0f3" fill-opacity="0.4"/>
    <line x1="126.9" y1="454.0" x2="168.5" y2="478.0" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
    <line x1="113.1" y1="454.0" x2="71.5" y2="478.0" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
    <line x1="120.0" y1="442.0" x2="120.0" y2="394.0" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="120.0" cy="486.0" r="17" fill="#dbeafe" fill-opacity="0.95" stroke="#2563eb" stroke-width="2"/>
    <circle cx="88.8" cy="432.0" r="17" fill="#dbeafe" fill-opacity="0.95" stroke="#2563eb" stroke-width="2"/>
    <circle cx="151.2" cy="432.0" r="17" fill="#dbeafe" fill-opacity="0.95" stroke="#2563eb" stroke-width="2"/>
    <path d="M120.0 441.0 L129.0 456.0 L111.0 456.0 Z" fill="#92400e" fill-opacity="0.8" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="215.0" y="410.0" font-size="13" text-anchor="start" fill="#92400e" font-weight="bold">HORN</text>
    <text x="215.0" y="425.0" font-size="12" text-anchor="start" fill="#111827">pyramid peak, 3+ cirques</text>
    <text x="215.0" y="452.0" font-size="13" text-anchor="start" fill="#2563eb" font-weight="bold">CIRQUE</text>
    <text x="215.0" y="467.0" font-size="12" text-anchor="start" fill="#111827">armchair hollow (lake = tarn)</text>
    <text x="215.0" y="494.0" font-size="13" text-anchor="start" fill="#92400e" font-weight="bold">ARÊTE</text>
    <text x="215.0" y="509.0" font-size="12" text-anchor="start" fill="#111827">knife-edge ridge between cirques</text>
  </g>
</svg>
