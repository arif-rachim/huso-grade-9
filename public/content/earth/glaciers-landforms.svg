<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" role="img" aria-labelledby="t d">
  <title id="t">Glacial landforms</title>
  <desc id="d">Top: a river cuts a V-shaped valley, a glacier cuts a wide U-shaped valley. Middle: map view of a valley glacier with lateral, medial and terminal moraines, and an outwash plain with braided streams beyond the terminal moraine. Bottom: map view of a horn with three cirques and the sharp arete ridges between them.</desc>
  <rect x="0" y="0" width="440" height="520" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="18.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">A. River valley vs glacier valley (cross-sections)</text>
    <rect x="20.0" y="28.0" width="190.0" height="110.0" rx="0" fill="#eef0f3" fill-opacity="0.5"/>
    <path d="M20.0 40.0 L95.0 124.0 L110.0 124.0 L210.0 40.0 L210.0 138.0 L20.0 138.0 Z" fill="#92400e" fill-opacity="0.4"/>
    <path d="M20.0 40.0 L95.0 124.0 L110.0 124.0 L210.0 40.0" fill="none" stroke="#92400e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="115.0" y="60.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">V-shaped (river)</text>
    <rect x="230.0" y="28.0" width="190.0" height="110.0" rx="0" fill="#eef0f3" fill-opacity="0.5"/>
    <path d="M230.0 40.0 L258.0 112.0 L270.0 124.0 L370.0 124.0 L382.0 112.0 L420.0 40.0 L420.0 138.0 L230.0 138.0 Z" fill="#92400e" fill-opacity="0.4"/>
    <path d="M230.0 40.0 L262.0 108.0 L276.0 123.0 L366.0 123.0 L380.0 108.0 L420.0 40.0" fill="none" stroke="#92400e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="325.0" y="60.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">U-shaped (glacier)</text>
    <text x="220.0" y="168.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">B. Valley glacier from above</text>
    <rect x="20.0" y="178.0" width="400.0" height="170.0" rx="0" fill="#eef0f3" fill-opacity="0.4"/>
    <path d="M24.0 204.0 L255.0 204.0 L292.0 232.0 L292.0 296.0 L255.0 322.0 L24.0 322.0 Z" fill="#dbeafe" fill-opacity="0.95" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M30 208 L255 208 L288 234" fill="none" stroke="#92400e" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M30 318 L255 318 L288 294" fill="none" stroke="#92400e" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="150.0" y="228.0" font-size="12" text-anchor="middle" fill="#92400e" font-weight="bold">lateral moraine</text>
    <text x="215.0" y="308.0" font-size="12" text-anchor="middle" fill="#92400e" font-weight="bold">lateral moraine</text>
    <path d="M30 263 L270 263" fill="none" stroke="#92400e" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="150.0" y="253.0" font-size="12" text-anchor="middle" fill="#92400e" font-weight="bold">medial moraine</text>
    <text x="215.0" y="282.0" font-size="12" text-anchor="middle" fill="#6b7280">(two glaciers joined)</text>
    <line x1="36.0" y1="296.0" x2="82.0" y2="296.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <line x1="82.0" y1="296.0" x2="73.9" y2="292.1" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <line x1="82.0" y1="296.0" x2="73.9" y2="299.9" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <text x="90.0" y="300.0" font-size="12" text-anchor="start" fill="#2563eb" font-weight="bold">ice flow</text>
    <path d="M292 232 Q 324 264 292 296" fill="none" stroke="#92400e" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="366.0" y="224.0" font-size="12" text-anchor="middle" fill="#92400e" font-weight="bold">terminal moraine</text>
    <text x="366.0" y="239.0" font-size="12" text-anchor="middle" fill="#6b7280">(farthest advance)</text>
    <path d="M326 262 q40 -6 86 -20" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
