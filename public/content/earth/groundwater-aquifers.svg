<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" role="img" aria-labelledby="t d">
  <title id="t">Water table, unconfined and confined aquifers</title>
  <desc id="d">A cross-section of the ground. Rain soaks in and fills the pores below the water table, the saturated zone. The unconfined aquifer is open to the surface. Deeper, a confined aquifer is trapped between two clay layers, the aquitards. Water enters at the recharge area on the high side, and an artesian well drilled into it flows without pumping because the potentiometric surface is above the ground.</desc>
