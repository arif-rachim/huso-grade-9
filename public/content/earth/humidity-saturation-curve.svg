    <text x="79.7" y="77.6" font-size="13" text-anchor="start" fill="#92400e" font-weight="bold">Curve = air is full</text>
    <text x="79.7" y="93.6" font-size="13" text-anchor="start" fill="#92400e" font-weight="bold">(RH = 100%)</text>
    <circle cx="361.4" cy="196.1" r="6" fill="#111827"/>
    <text x="369.4" y="218.1" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">air: 30 °C, 15 g/m³</text>
    <text x="369.4" y="234.1" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">RH ≈ 49%</text>
    <line x1="361.4" y1="105.7" x2="361.4" y2="196.1" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/>
    <text x="369.4" y="142.8" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">max</text>
    <text x="369.4" y="157.8" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">30 g/m³</text>
    <line x1="353.4" y1="196.1" x2="247.4" y2="196.1" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <line x1="247.4" y1="196.1" x2="255.5" y2="200.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <line x1="247.4" y1="196.1" x2="255.5" y2="192.2" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <circle cx="241.4" cy="196.1" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="221.4" y="226.1" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">dew point ≈ 18 °C</text>
    <text x="221.4" y="242.1" font-size="12" text-anchor="middle" fill="#2563eb">RH 100%: dew, fog, cloud</text>
    <text x="301.4" y="188.1" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">cool it</text>
  </g>
</svg>
