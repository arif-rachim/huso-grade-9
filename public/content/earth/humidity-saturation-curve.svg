<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" role="img" aria-labelledby="t d">
  <title id="t">How much water vapor air can hold at each temperature</title>
  <desc id="d">A curve of the maximum water vapor per cubic meter of air against temperature. Warm air holds much more. A parcel at 30 degrees Celsius holding 15 grams per cubic meter has a relative humidity of about 49 percent. Cooled to about 18 degrees Celsius it reaches the curve, so the relative humidity is 100 percent: that temperature is the dew point.</desc>
  <rect x="0" y="0" width="440" height="340" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="20.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Warm air holds more water vapor</text>
    <rect x="70.0" y="48.0" width="340.0" height="237.0" rx="0" fill="#eef0f3" fill-opacity="0.5"/>
    <line x1="70.0" y1="48.0" x2="70.0" y2="285.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="70.0" y="303.0" font-size="12" text-anchor="middle" fill="#6b7280">0</text>
    <line x1="118.6" y1="48.0" x2="118.6" y2="285.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="118.6" y="303.0" font-size="12" text-anchor="middle" fill="#6b7280">5</text>
    <line x1="167.1" y1="48.0" x2="167.1" y2="285.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="167.1" y="303.0" font-size="12" text-anchor="middle" fill="#6b7280">10</text>
    <line x1="215.7" y1="48.0" x2="215.7" y2="285.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="215.7" y="303.0" font-size="12" text-anchor="middle" fill="#6b7280">15</text>
    <line x1="264.3" y1="48.0" x2="264.3" y2="285.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="264.3" y="303.0" font-size="12" text-anchor="middle" fill="#6b7280">20</text>
    <line x1="312.9" y1="48.0" x2="312.9" y2="285.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="312.9" y="303.0" font-size="12" text-anchor="middle" fill="#6b7280">25</text>
    <line x1="361.4" y1="48.0" x2="361.4" y2="285.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="361.4" y="303.0" font-size="12" text-anchor="middle" fill="#6b7280">30</text>
    <line x1="410.0" y1="48.0" x2="410.0" y2="285.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="410.0" y="303.0" font-size="12" text-anchor="middle" fill="#6b7280">35</text>
    <line x1="70.0" y1="285.0" x2="410.0" y2="285.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="64.0" y="289.0" font-size="12" text-anchor="end" fill="#6b7280">0</text>
    <line x1="70.0" y1="225.8" x2="410.0" y2="225.8" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="64.0" y="229.8" font-size="12" text-anchor="end" fill="#6b7280">10</text>
    <line x1="70.0" y1="166.5" x2="410.0" y2="166.5" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="64.0" y="170.5" font-size="12" text-anchor="end" fill="#6b7280">20</text>
    <line x1="70.0" y1="107.2" x2="410.0" y2="107.2" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="64.0" y="111.2" font-size="12" text-anchor="end" fill="#6b7280">30</text>
    <line x1="70.0" y1="48.0" x2="410.0" y2="48.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="64.0" y="52.0" font-size="12" text-anchor="end" fill="#6b7280">40</text>
    <text x="240.0" y="323.0" font-size="12" text-anchor="middle" fill="#6b7280">air temperature (°C)</text>
    <text x="70.0" y="40.0" font-size="12" text-anchor="start" fill="#6b7280">max vapor in g per m³ of air</text>
