<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-labelledby="t d">
  <title id="t">The water cycle</title>
  <desc id="d">Water evaporates from the ocean, transpires from plants and sublimates from ice. Water vapor rises and condenses into clouds, wind carries the clouds, then precipitation falls as rain or snow. On land water runs off into rivers, infiltrates into the ground as groundwater, and flows back to the ocean.</desc>
