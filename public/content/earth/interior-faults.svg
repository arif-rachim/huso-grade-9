<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" role="img" aria-labelledby="t d">
  <title id="t">Three kinds of faults</title>
  <desc id="d">Normal fault: the hanging wall moves down under tension. Reverse fault: the hanging wall moves up under compression. Strike-slip fault: blocks slide sideways past each other under shear.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="290" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Faults: which way did the blocks move?</text>
    <path d="M20,60 L75,60 L100,130 L20,130 z" fill="#92400e" fill-opacity="0.22" stroke="#92400e" stroke-width="1.5"/>
    <path d="M80.1,74 L125.1,74 L125.1,144 L105.1,144 z" fill="#92400e" fill-opacity="0.38" stroke="#92400e" stroke-width="1.5"/>
    <line x1="20" y1="80" x2="82.1" y2="80" stroke="#92400e" stroke-width="1.2"/>
    <line x1="87.3" y1="94" x2="125.1" y2="94" stroke="#92400e" stroke-width="1.2"/>
    <line x1="20" y1="105" x2="91.1" y2="105" stroke="#92400e" stroke-width="1.2"/>
    <line x1="96.2" y1="119" x2="125.1" y2="119" stroke="#92400e" stroke-width="1.2"/>
    <line x1="75" y1="60" x2="100" y2="130" stroke="#111827" stroke-width="2.5"/>
    <text x="42" y="158" font-size="12" text-anchor="middle" fill="#111827">footwall</text>
    <text x="108" y="158" font-size="12" text-anchor="middle" fill="#111827">hanging wall</text>
    <line x1="70" y1="48" x2="30" y2="48" stroke="#111827" stroke-width="2" marker-end="url(#arK)"/>
    <line x1="110" y1="48" x2="150" y2="48" stroke="#111827" stroke-width="2" marker-end="url(#arK)"/>
    <text x="80" y="180" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">NORMAL</text>
    <text x="80" y="196" font-size="12" text-anchor="middle" fill="#111827">hanging wall DOWN</text>
    <text x="80" y="211" font-size="12" text-anchor="middle" fill="#6b7280">pulled apart (tension)</text>
    <text x="80" y="226" font-size="12" text-anchor="middle" fill="#6b7280">horst and graben</text>
    <path d="M170,60 L225,60 L250,130 L170,130 z" fill="#92400e" fill-opacity="0.22" stroke="#92400e" stroke-width="1.5"/>
    <path d="M219.9,46 L264.9,46 L264.9,116 L244.9,116 z" fill="#92400e" fill-opacity="0.38" stroke="#92400e" stroke-width="1.5"/>
    <line x1="170" y1="80" x2="232.1" y2="80" stroke="#92400e" stroke-width="1.2"/>
    <line x1="227" y1="66" x2="264.9" y2="66" stroke="#92400e" stroke-width="1.2"/>
    <line x1="170" y1="105" x2="241.1" y2="105" stroke="#92400e" stroke-width="1.2"/>
    <line x1="235.9" y1="91" x2="264.9" y2="91" stroke="#92400e" stroke-width="1.2"/>
    <line x1="225" y1="60" x2="250" y2="130" stroke="#111827" stroke-width="2.5"/>
    <text x="192" y="158" font-size="12" text-anchor="middle" fill="#111827">footwall</text>
    <text x="258" y="158" font-size="12" text-anchor="middle" fill="#111827">hanging wall</text>
    <line x1="180" y1="38" x2="220" y2="38" stroke="#111827" stroke-width="2" marker-end="url(#arK)"/>
    <line x1="290" y1="38" x2="250" y2="38" stroke="#111827" stroke-width="2" marker-end="url(#arK)"/>
    <text x="230" y="180" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">REVERSE (thrust)</text>
    <text x="230" y="196" font-size="12" text-anchor="middle" fill="#111827">hanging wall UP</text>
    <text x="230" y="211" font-size="12" text-anchor="middle" fill="#6b7280">squeezed (compression)</text>
    <text x="230" y="226" font-size="12" text-anchor="middle" fill="#6b7280">makes mountains</text>
    <rect x="330" y="52" width="120" height="82" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
    <rect x="330" y="52" width="60" height="82" fill="#92400e" fill-opacity="0.18"/>
    <rect x="390" y="52" width="60" height="82" fill="#92400e" fill-opacity="0.3"/>
    <line x1="390" y1="52" x2="390" y2="134" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
    <path d="M330,82 L390,82" fill="none" stroke="#6b7280" stroke-width="3"/>
    <path d="M390,98 L450,98" fill="none" stroke="#6b7280" stroke-width="3"/>
    <line x1="360" y1="118" x2="360" y2="64" stroke="#111827" stroke-width="2.2" marker-end="url(#arK)"/>
    <line x1="420" y1="68" x2="420" y2="122" stroke="#111827" stroke-width="2.2" marker-end="url(#arK)"/>
    <text x="390" y="172" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">STRIKE-SLIP</text>
    <text x="390" y="188" font-size="12" text-anchor="middle" fill="#111827">blocks slide sideways</text>
    <text x="390" y="203" font-size="12" text-anchor="middle" fill="#6b7280">shear, map view: a road is</text>
    <text x="390" y="218" font-size="12" text-anchor="middle" fill="#6b7280">offset (right-lateral)</text>
  </g>
</svg>
