<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 350" role="img" aria-labelledby="t d">
  <title id="t">Layers of the Earth</title>
  <desc id="d">Cross section of the Earth: a thin crust, a thick solid mantle to 2890 kilometers, a liquid outer core to 5150 kilometers and a solid inner core with a radius of about 1220 kilometers.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="350" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Layers of the Earth</text>
    <circle cx="120" cy="175" r="110" fill="#92400e" stroke="#92400e" stroke-width="1.5"/>
    <circle cx="120" cy="175" r="105" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <circle cx="120" cy="175" r="60.1" fill="#fca5a5" stroke="#92400e" stroke-width="1.5"/>
    <circle cx="120" cy="175" r="21.1" fill="#b45309" stroke="#92400e" stroke-width="1.5"/>
    <text x="120" y="113" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">mantle</text>
    <text x="120" y="139" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">outer core</text>
    <text x="120" y="179" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">inner</text>
    <text x="120" y="192" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">core</text>
    <text x="120" y="307" font-size="12" text-anchor="middle" fill="#6b7280">Crust is drawn much too thick so you can see it.</text>
    <rect x="250" y="48" width="18" height="18" fill="#92400e" stroke="#92400e" stroke-width="1.2"/>
    <text x="276" y="61" font-size="14" text-anchor="start" fill="#111827" font-weight="bold">Crust</text>
    <text x="276" y="77" font-size="12" text-anchor="start" fill="#111827">0 to 35 km (ocean ~7, land ~35)</text>
    <text x="276" y="92" font-size="12" text-anchor="start" fill="#6b7280">solid; basalt (ocean), granite-like (land)</text>
    <rect x="250" y="106" width="18" height="18" fill="#fde68a" stroke="#92400e" stroke-width="1.2"/>
    <text x="276" y="119" font-size="14" text-anchor="start" fill="#111827" font-weight="bold">Mantle</text>
    <text x="276" y="135" font-size="12" text-anchor="start" fill="#111827">to 2890 km</text>
    <text x="276" y="150" font-size="12" text-anchor="start" fill="#6b7280">solid rock (peridotite) that flows slowly</text>
    <rect x="250" y="164" width="18" height="18" fill="#fca5a5" stroke="#92400e" stroke-width="1.2"/>
    <text x="276" y="177" font-size="14" text-anchor="start" fill="#111827" font-weight="bold">Outer core</text>
    <text x="276" y="193" font-size="12" text-anchor="start" fill="#111827">2890 to 5150 km</text>
    <text x="276" y="208" font-size="12" text-anchor="start" fill="#6b7280">LIQUID iron + nickel</text>
    <rect x="250" y="222" width="18" height="18" fill="#b45309" stroke="#92400e" stroke-width="1.2"/>
    <text x="276" y="235" font-size="14" text-anchor="start" fill="#111827" font-weight="bold">Inner core</text>
    <text x="276" y="251" font-size="12" text-anchor="start" fill="#111827">5150 to 6371 km</text>
    <text x="276" y="266" font-size="12" text-anchor="start" fill="#6b7280">SOLID iron + nickel, about 5400 °C</text>
    <text x="250" y="300" font-size="12" text-anchor="start" fill="#111827">Lithosphere = crust + top of mantle</text>
    <text x="250" y="315" font-size="12" text-anchor="start" fill="#111827">(about 100 km thick, rigid)</text>
    <text x="250" y="330" font-size="12" text-anchor="start" fill="#111827">Asthenosphere = soft, weak mantle below</text>
  </g>
</svg>
