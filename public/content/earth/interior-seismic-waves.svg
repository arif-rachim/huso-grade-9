<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 430" role="img" aria-labelledby="t d">
  <title id="t">Seismic waves and the Earth's core</title>
  <desc id="d">Earth cross section with an earthquake at the top. P waves cross the liquid core and bend. S waves cannot cross it. The P shadow zone is between 103 and 142 degrees from the quake. S waves are missing beyond 103 degrees.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="430" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">How earthquake waves reveal the liquid core</text>
    <circle cx="125" cy="215" r="105" fill="#fde68a" fill-opacity="0.45" stroke="#92400e" stroke-width="2"/>
    <circle cx="125" cy="215" r="57.4" fill="#dc2626" fill-opacity="0.3" stroke="#92400e" stroke-width="1.5"/>
    <text x="125" y="219" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">liquid core</text>
    <circle cx="125" cy="110" r="6" fill="#dc2626" stroke="#111827" stroke-width="1.5"/>
    <text x="137" y="104" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">earthquake</text>
    <path d="M234.1,240.2 A112,112 0 0 1 194.0,303.3" fill="none" stroke="#dc2626" stroke-width="5"/>
    <path d="M56.0,303.3 A112,112 0 0 1 15.9,240.2" fill="none" stroke="#dc2626" stroke-width="5"/>
    <path d="M194.0,303.3 A112,112 0 0 1 56.0,303.3" fill="none" stroke="#6b7280" stroke-width="5"/>
    <line x1="125" y1="110" x2="185.2" y2="129" stroke="#92400e" stroke-width="1.8"/>
    <line x1="125" y1="110" x2="220.2" y2="170.6" stroke="#92400e" stroke-width="1.8"/>
    <line x1="125" y1="110" x2="229.6" y2="224.2" stroke="#92400e" stroke-width="1.8"/>
    <path d="M125,110 L135.0,158.5 L153.7,264.7 L180.6,304.0" fill="none" stroke="#92400e" stroke-width="1.8"/>
    <path d="M125,110 L138.9,159.3 L130.0,272.2 L139.6,319.0" fill="none" stroke="#92400e" stroke-width="1.8"/>
    <path d="M125,110 L144.6,161.1 L105.4,268.9 L96.1,315.9" fill="none" stroke="#92400e" stroke-width="1.8"/>
    <line x1="125" y1="110" x2="133" y2="158.2" stroke="#111827" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="117" y="149.6" font-size="12" text-anchor="end" fill="#111827">S stops</text>
    <text x="245" y="245.8" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">103°</text>
    <text x="202.3" y="322.8" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">142°</text>
    <line x1="285" y1="70" x2="315" y2="70" stroke="#92400e" stroke-width="2"/>
    <text x="323" y="74" font-size="12" text-anchor="start" fill="#111827">P wave (solid line)</text>
    <line x1="285" y1="92" x2="315" y2="92" stroke="#111827" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="323" y="96" font-size="12" text-anchor="start" fill="#111827">S wave (dashed)</text>
    <line x1="285" y1="114" x2="315" y2="114" stroke="#dc2626" stroke-width="5"/>
    <text x="323" y="118" font-size="12" text-anchor="start" fill="#111827">P shadow 103° to 142°</text>
    <line x1="285" y1="136" x2="315" y2="136" stroke="#6b7280" stroke-width="5"/>
    <text x="323" y="140" font-size="12" text-anchor="start" fill="#111827">no S waves beyond 103°</text>
    <text x="285" y="184" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">P wave: push-pull</text>
    <text x="285" y="200" font-size="12" text-anchor="start" fill="#111827">fastest; solids AND liquids</text>
    <path d="M285,222 l8,0 l4,-8 l4,16 l4,-16 l4,16 l4,-8 l8,0" fill="none" stroke="#92400e" stroke-width="2"/>
    <text x="285" y="252" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">S wave: side-to-side</text>
    <text x="285" y="268" font-size="12" text-anchor="start" fill="#111827">about 0.6 × P speed; solids ONLY</text>
    <path d="M285,292 C297,272 309,312 321,292 C333,272 345,312 357,292" fill="none" stroke="#92400e" stroke-width="2"/>
    <text x="285" y="324" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Surface waves: slowest,</text>
    <text x="285" y="340" font-size="12" text-anchor="start" fill="#111827">most damage (Love, Rayleigh)</text>
    <text x="240" y="396" font-size="12" text-anchor="middle" fill="#6b7280">S waves vanish and P waves bend at the core boundary: the outer core is liquid.</text>
    <text x="240" y="412" font-size="12" text-anchor="middle" fill="#6b7280">Rays are schematic; the real paths are curved.</text>
  </g>
</svg>
