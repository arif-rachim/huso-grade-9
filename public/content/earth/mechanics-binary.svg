<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 466" role="img" aria-labelledby="t d">
  <title id="t">Binary stars</title>
  <desc id="d">Two stars orbit their common center of mass. The heavier star, three times the mass of the lighter one, has an orbit three times smaller and moves three times slower. Below, an eclipsing binary light curve with a deep and a shallow dip, and the opposite radial velocity swings of a spectroscopic binary.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="466" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Binary stars orbit their center of mass</text>
    <circle cx="130" cy="130" r="25" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="130" cy="130" r="75" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="109.5" y1="115.7" x2="191.4" y2="173" stroke="#6b7280" stroke-width="1.2"/>
    <circle cx="130" cy="130" r="4" fill="#111827"/>
    <text x="138" y="122" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">center of mass</text>
    <circle cx="109.5" cy="115.7" r="13" fill="#92400e" fill-opacity="0.6" stroke="#111827" stroke-width="2"/>
    <text x="109.5" y="119.7" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">3M</text>
    <circle cx="191.4" cy="173" r="8" fill="#fde68a" stroke="#111827" stroke-width="2"/>
    <text x="191.4" y="177" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">M</text>
    <line x1="109.5" y1="115.7" x2="124.4" y2="94.4" stroke="#111827" stroke-width="2.5" marker-end="url(#arK)"/>
    <text x="131.3" y="88.5" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">v</text>
    <line x1="191.4" y1="173" x2="151.3" y2="230.4" stroke="#111827" stroke-width="2.5" marker-end="url(#arK)"/>
    <text x="144.4" y="244.2" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">3v</text>
    <text x="270" y="62" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Same center, same period</text>
    <text x="270" y="82" font-size="13" text-anchor="start" fill="#111827">m₁ r₁ = m₂ r₂</text>
    <text x="270" y="99" font-size="13" text-anchor="start" fill="#111827">the heavier star is closer to</text>
    <text x="270" y="116" font-size="13" text-anchor="start" fill="#111827">the center: smaller orbit,</text>
    <text x="270" y="133" font-size="13" text-anchor="start" fill="#111827">slower speed (v ∝ r)</text>
    <text x="270" y="168" font-size="13" text-anchor="start" fill="#92400e" font-weight="bold">Total mass (Kepler 3):</text>
    <text x="270" y="186" font-size="14" text-anchor="start" fill="#111827" font-weight="bold">M₁ + M₂ = a³ / T²</text>
    <text x="270" y="202" font-size="12" text-anchor="start" fill="#6b7280">(a = separation in AU, T in years,</text>
    <text x="270" y="216" font-size="12" text-anchor="start" fill="#6b7280">masses in Suns)</text>
    <text x="20" y="276" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Eclipsing binary: brightness dips</text>
    <line x1="30" y1="366" x2="220" y2="366" stroke="#111827" stroke-width="1.5" marker-end="url(#arK)"/>
    <line x1="30" y1="366" x2="30" y2="286" stroke="#111827" stroke-width="1.5" marker-end="url(#arK)"/>
    <path d="M30,301 L60,301 L68,351 L84,351 L92,301 L128,301 L134,324 L146,324 L152,301 L212,301" fill="none" stroke="#92400e" stroke-width="2.5"/>
    <text x="76" y="380" font-size="12" text-anchor="middle" fill="#111827">deep dip</text>
    <text x="140" y="380" font-size="12" text-anchor="middle" fill="#111827">shallow</text>
    <text x="260" y="276" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Spectroscopic binary: Doppler swings</text>
    <line x1="260" y1="366" x2="460" y2="366" stroke="#111827" stroke-width="1.5" marker-end="url(#arK)"/>
    <line x1="260" y1="366" x2="260" y2="286" stroke="#111827" stroke-width="1.5" marker-end="url(#arK)"/>
    <line x1="260" y1="326" x2="460" y2="326" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="464" y="330" font-size="12" text-anchor="start" fill="#6b7280">0</text>
    <path d="M260.0,326.0 L262.0,325.1 L264.0,324.1 L266.0,323.2 L268.0,322.3 L270.0,321.5 L272.0,320.6 L274.0,319.9 L276.0,319.2 L278.0,318.5 L280.0,317.9 L282.0,317.4 L284.0,317.0 L286.0,316.6 L288.0,316.3 L290.0,316.1 L292.0,316.0 L294.0,316.0 L296.0,316.1 L298.0,316.2 L300.0,316.5 L302.0,316.8 L304.0,317.2 L306.0,317.7 L308.0,318.3 L310.0,318.9 L312.0,319.6 L314.0,320.4 L316.0,321.2 L318.0,322.0 L320.0,322.9 L322.0,323.8 L324.0,324.7 L326.0,325.7 L328.0,326.6 L330.0,327.6 L332.0,328.5 L334.0,329.4 L336.0,330.3 L338.0,331.1 L340.0,331.9 L342.0,332.6 L344.0,333.3 L346.0,333.9 L348.0,334.4 L350.0,334.9 L352.0,335.3 L354.0,335.6 L356.0,335.8 L358.0,336.0 L360.0,336.0 L362.0,336.0 L364.0,335.8 L366.0,335.6 L368.0,335.3 L370.0,334.9 L372.0,334.4 L374.0,333.9 L376.0,333.3 L378.0,332.6 L380.0,331.9 L382.0,331.1 L384.0,330.3 L386.0,329.4 L388.0,328.5 L390.0,327.6 L392.0,326.6 L394.0,325.7 L396.0,324.7 L398.0,323.8 L400.0,322.9 L402.0,322.0 L404.0,321.2 L406.0,320.4 L408.0,319.6 L410.0,318.9 L412.0,318.3 L414.0,317.7 L416.0,317.2 L418.0,316.8 L420.0,316.5 L422.0,316.2 L424.0,316.1 L426.0,316.0 L428.0,316.0 L430.0,316.1 L432.0,316.3 L434.0,316.6 L436.0,317.0 L438.0,317.4 L440.0,317.9 L442.0,318.5 L444.0,319.2 L446.0,319.9 L448.0,320.6 L450.0,321.5 L452.0,322.3 L454.0,323.2 L456.0,324.1 L458.0,325.1 L460.0,326.0 " fill="none" stroke="#92400e" stroke-width="2.5"/>
    <path d="M260.0,326.0 L262.0,328.8 L264.0,331.6 L266.0,334.4 L268.0,337.0 L270.0,339.6 L272.0,342.1 L274.0,344.4 L276.0,346.5 L278.0,348.5 L280.0,350.3 L282.0,351.8 L284.0,353.1 L286.0,354.2 L288.0,355.1 L290.0,355.6 L292.0,355.9 L294.0,356.0 L296.0,355.8 L298.0,355.3 L300.0,354.5 L302.0,353.5 L304.0,352.3 L306.0,350.8 L308.0,349.1 L310.0,347.2 L312.0,345.1 L314.0,342.9 L316.0,340.5 L318.0,337.9 L320.0,335.3 L322.0,332.5 L324.0,329.8 L326.0,326.9 L328.0,324.1 L330.0,321.3 L332.0,318.5 L334.0,315.8 L336.0,313.2 L338.0,310.7 L340.0,308.4 L342.0,306.2 L344.0,304.1 L346.0,302.3 L348.0,300.7 L350.0,299.3 L352.0,298.1 L354.0,297.2 L356.0,296.5 L358.0,296.1 L360.0,296.0 L362.0,296.1 L364.0,296.5 L366.0,297.2 L368.0,298.1 L370.0,299.3 L372.0,300.7 L374.0,302.3 L376.0,304.1 L378.0,306.2 L380.0,308.4 L382.0,310.7 L384.0,313.2 L386.0,315.8 L388.0,318.5 L390.0,321.3 L392.0,324.1 L394.0,326.9 L396.0,329.8 L398.0,332.5 L400.0,335.3 L402.0,337.9 L404.0,340.5 L406.0,342.9 L408.0,345.1 L410.0,347.2 L412.0,349.1 L414.0,350.8 L416.0,352.3 L418.0,353.5 L420.0,354.5 L422.0,355.3 L424.0,355.8 L426.0,356.0 L428.0,355.9 L430.0,355.6 L432.0,355.1 L434.0,354.2 L436.0,353.1 L438.0,351.8 L440.0,350.3 L442.0,348.5 L444.0,346.5 L446.0,344.4 L448.0,342.1 L450.0,339.6 L452.0,337.0 L454.0,334.4 L456.0,331.6 L458.0,328.8 L460.0,326.0 " fill="none" stroke="#6b7280" stroke-width="2.5"/>
    <text x="360" y="386" font-size="12" text-anchor="middle" fill="#6b7280">redshift ↑ / blueshift ↓</text>
    <text x="240" y="450" font-size="12" text-anchor="middle" fill="#6b7280">Brown = heavy star (small swing), gray = light star (big swing); they are always opposite.</text>
  </g>
</svg>
