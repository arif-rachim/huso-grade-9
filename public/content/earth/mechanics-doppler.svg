<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-labelledby="t d">
  <title id="t">The Doppler effect</title>
  <desc id="d">Waves from a moving source are squeezed together in front and stretched behind. Light from a source moving away is shifted to longer wavelengths (redshift), and light from a source moving toward us is shifted to shorter wavelengths (blueshift).</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="420" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Doppler effect: moving source, squeezed and stretched waves</text>
    <circle cx="233.7" cy="118" r="14" fill="none" stroke="#92400e" stroke-width="1.8"/>
    <circle cx="227.4" cy="118" r="28" fill="none" stroke="#92400e" stroke-width="1.8"/>
    <circle cx="221.1" cy="118" r="42" fill="none" stroke="#92400e" stroke-width="1.8"/>
    <circle cx="214.8" cy="118" r="56" fill="none" stroke="#92400e" stroke-width="1.8"/>
    <circle cx="208.5" cy="118" r="70" fill="none" stroke="#92400e" stroke-width="1.8"/>
    <circle cx="240" cy="118" r="5" fill="#fde68a" stroke="#111827" stroke-width="2"/>
    <line x1="248" y1="118" x2="294" y2="118" stroke="#111827" stroke-width="2.5" marker-end="url(#arK)"/>
    <text x="288" y="108" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">v</text>
    <text x="70" y="76" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">behind:</text>
    <text x="70" y="92" font-size="12" text-anchor="middle" fill="#111827">stretched</text>
    <text x="70" y="108" font-size="12" text-anchor="middle" fill="#111827">longer λ</text>
    <text x="70" y="124" font-size="12" text-anchor="middle" fill="#111827">lower f</text>
    <text x="70" y="142" font-size="12" text-anchor="middle" fill="#92400e" font-weight="bold">REDSHIFT</text>
    <text x="410" y="76" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">ahead:</text>
    <text x="410" y="92" font-size="12" text-anchor="middle" fill="#111827">squeezed</text>
    <text x="410" y="108" font-size="12" text-anchor="middle" fill="#111827">shorter λ</text>
    <text x="410" y="124" font-size="12" text-anchor="middle" fill="#111827">higher f</text>
    <text x="410" y="142" font-size="12" text-anchor="middle" fill="#92400e" font-weight="bold">BLUESHIFT</text>
    <text x="240" y="214" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Same spectral line (hydrogen-alpha), three cases:</text>
    <rect x="40" y="240" width="400" height="24" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
    <line x1="226.3" y1="240" x2="226.3" y2="264" stroke="#92400e" stroke-width="4"/>
    <text x="446" y="256" font-size="12" text-anchor="start" fill="#111827">656.3 nm</text>
    <text x="44" y="237" font-size="12" text-anchor="start" fill="#6b7280">Lab (at rest)</text>
    <rect x="40" y="280" width="400" height="24" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
    <line x1="157.7" y1="280" x2="157.7" y2="304" stroke="#92400e" stroke-width="4"/>
    <text x="446" y="296" font-size="12" text-anchor="start" fill="#111827">650.3 nm</text>
    <text x="44" y="277" font-size="12" text-anchor="start" fill="#6b7280">Moving toward us: blueshift</text>
    <rect x="40" y="320" width="400" height="24" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
    <line x1="294.9" y1="320" x2="294.9" y2="344" stroke="#92400e" stroke-width="4"/>
    <text x="446" y="336" font-size="12" text-anchor="start" fill="#111827">662.3 nm</text>
    <text x="44" y="317" font-size="12" text-anchor="start" fill="#6b7280">Moving away: redshift</text>
    <rect x="20" y="372" width="440" height="38" fill="#fef3c7" fill-opacity="0.5" stroke="#92400e" stroke-width="1.2" rx="8"/>
    <text x="240" y="389" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Δλ / λ₀ = v / c   (v much smaller than c)</text>
    <text x="240" y="404" font-size="12" text-anchor="middle" fill="#6b7280">Only the speed along the line of sight counts. Away = red, toward = blue.</text>
  </g>
</svg>
