    <line x1="108.0" y1="178.0" x2="117.0" y2="182.3" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="108.0" y1="178.0" x2="117.0" y2="173.7" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    <text x="220.0" y="100.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">NORTHERN gyre</text>
    <text x="220.0" y="116.0" font-size="12" text-anchor="middle" fill="#6b7280">clockwise</text>
    <text x="220.0" y="232.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">SOUTHERN gyre</text>
    <text x="220.0" y="248.0" font-size="12" text-anchor="middle" fill="#6b7280">counterclockwise</text>
    <text x="96.0" y="124.0" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">WARM, narrow</text>
    <text x="96.0" y="139.0" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">and fast</text>
    <text x="344.0" y="124.0" font-size="12" text-anchor="end" fill="#2563eb" font-weight="bold">COLD, wide</text>
    <text x="344.0" y="139.0" font-size="12" text-anchor="end" fill="#2563eb" font-weight="bold">and slow</text>
    <text x="220.0" y="40.0" font-size="12" text-anchor="middle" fill="#92400e">winds: westerlies push water east</text>
    <text x="220.0" y="193.0" font-size="12" text-anchor="middle" fill="#dc2626">trade winds push water west</text>
    <text x="220.0" y="292.0" font-size="12" text-anchor="middle" fill="#92400e">westerlies push water east</text>
    <text x="220.0" y="313.0" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="bold">Western side: Gulf Stream, Kuroshio, Brazil, East Australian</text>
    <text x="220.0" y="330.0" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">Eastern side: California, Canary, Humboldt, Benguela</text>
    <text x="220.0" y="346.0" font-size="12" text-anchor="middle" fill="#111827"></text>
  </g>
</svg>
