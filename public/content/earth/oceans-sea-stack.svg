<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" role="img" aria-labelledby="t d">
  <title id="t">From sea cave to sea stump</title>
  <desc id="d">Waves attack a headland. A crack widens into a sea cave, the cave cuts through into a sea arch, the arch roof collapses leaving a sea stack, and the stack is worn down to a stump.</desc>
  <rect x="0" y="0" width="440" height="210" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="18.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Headland erosion: crack → cave → arch → stack → stump</text>
    <rect x="12.0" y="150.0" width="78.0" height="36.0" rx="0" fill="#2563eb" fill-opacity="0.25"/>
    <path d="M18.0 150.0 L18.0 52.0 L84.0 52.0 L84.0 150.0 Z" fill="#92400e" fill-opacity="0.45" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M50 150 L48 124 L53 110" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="51.0" y="205.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">1 crack</text>
    <rect x="96.0" y="150.0" width="78.0" height="36.0" rx="0" fill="#2563eb" fill-opacity="0.25"/>
    <path d="M102.0 150.0 L102.0 52.0 L168.0 52.0 L168.0 150.0 Z" fill="#92400e" fill-opacity="0.45" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M122 150 L122 128 Q 135 110 148 128 L148 150 Z" fill="#ffffff" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="135.0" y="205.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">2 cave</text>
    <rect x="180.0" y="150.0" width="78.0" height="36.0" rx="0" fill="#2563eb" fill-opacity="0.25"/>
    <path d="M186.0 150.0 L186.0 52.0 L252.0 52.0 L252.0 150.0 Z" fill="#92400e" fill-opacity="0.45" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M200 150 L200 104 Q 219 88 238 104 L238 150 Z" fill="#ffffff" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="219.0" y="205.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">3 arch</text>
    <rect x="264.0" y="150.0" width="78.0" height="36.0" rx="0" fill="#2563eb" fill-opacity="0.25"/>
    <path d="M270.0 150.0 L270.0 110.0 L284.0 110.0 L284.0 150.0 Z" fill="#92400e" fill-opacity="0.45" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M308.0 150.0 L308.0 62.0 L328.0 62.0 L328.0 150.0 Z" fill="#92400e" fill-opacity="0.45" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="303.0" y="205.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">4 stack</text>
    <rect x="348.0" y="150.0" width="78.0" height="36.0" rx="0" fill="#2563eb" fill-opacity="0.25"/>
    <path d="M354.0 150.0 L354.0 135.0 L364.0 135.0 L364.0 150.0 Z" fill="#92400e" fill-opacity="0.45" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M392.0 150.0 L392.0 128.0 L412.0 128.0 L412.0 150.0 Z" fill="#92400e" fill-opacity="0.45" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="387.0" y="205.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">5 stump</text>
  </g>
</svg>
