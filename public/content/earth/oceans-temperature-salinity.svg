<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-labelledby="t d">
  <title id="t">Ocean temperature with depth and salinity with latitude</title>
  <desc id="d">Left: in the tropics the surface is warm and temperature drops quickly between about 100 and 1000 meters, the thermocline; below that it is cold. Polar water is cold at all depths with no thermocline. Right: surface salinity is highest in the subtropics around 25 degrees where evaporation beats rainfall, and lower at the equator and near the poles where rain and ice melt freshen the water. The average is 35 per mille.</desc>
  <rect x="0" y="0" width="440" height="330" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="18.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Temperature falls with depth · salinity peaks at ±25°</text>
    <rect x="60.0" y="62.0" width="140.0" height="223.0" rx="0" fill="#eef0f3" fill-opacity="0.5"/>
    <rect x="60.0" y="67.6" width="140.0" height="50.2" rx="0" fill="#92400e" fill-opacity="0.18"/>
    <text x="196.0" y="104.4" font-size="12" text-anchor="end" fill="#92400e" font-weight="bold">thermocline</text>
    <line x1="69.3" y1="62.0" x2="69.3" y2="285.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="69.3" y="56.0" font-size="12" text-anchor="middle" fill="#6b7280">0</text>
    <line x1="116.0" y1="62.0" x2="116.0" y2="285.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="116.0" y="56.0" font-size="12" text-anchor="middle" fill="#6b7280">10</text>
    <line x1="162.7" y1="62.0" x2="162.7" y2="285.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="162.7" y="56.0" font-size="12" text-anchor="middle" fill="#6b7280">20</text>
    <line x1="209.3" y1="62.0" x2="209.3" y2="285.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="209.3" y="56.0" font-size="12" text-anchor="middle" fill="#6b7280">30</text>
    <line x1="60.0" y1="62.0" x2="200.0" y2="62.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="55.0" y="66.0" font-size="12" text-anchor="end" fill="#6b7280">0</text>
    <line x1="60.0" y1="117.8" x2="200.0" y2="117.8" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="55.0" y="121.8" font-size="12" text-anchor="end" fill="#6b7280">1000</text>
    <line x1="60.0" y1="173.5" x2="200.0" y2="173.5" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="55.0" y="177.5" font-size="12" text-anchor="end" fill="#6b7280">2000</text>
    <line x1="60.0" y1="229.2" x2="200.0" y2="229.2" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="55.0" y="233.2" font-size="12" text-anchor="end" fill="#6b7280">3000</text>
    <line x1="60.0" y1="285.0" x2="200.0" y2="285.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="55.0" y="289.0" font-size="12" text-anchor="end" fill="#6b7280">4000</text>
    <text x="130.0" y="40.0" font-size="12" text-anchor="middle" fill="#6b7280">temperature (°C) →</text>
    <text x="6.0" y="56.0" font-size="12" text-anchor="start" fill="#6b7280">depth (m) ↓</text>
    <path d="M195.3 62.0 L193.0 67.6 L153.3 78.7 L116.0 95.5 L92.7 117.8 L83.3 173.5 L78.7 229.2 L76.8 285.0" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
