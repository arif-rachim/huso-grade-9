    <text x="265.0" y="177.5" font-size="12" text-anchor="end" fill="#6b7280">35</text>
    <line x1="270.0" y1="136.3" x2="420.0" y2="136.3" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="265.0" y="140.3" font-size="12" text-anchor="end" fill="#6b7280">36</text>
    <line x1="270.0" y1="99.2" x2="420.0" y2="99.2" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <text x="265.0" y="103.2" font-size="12" text-anchor="end" fill="#6b7280">37</text>
    <text x="270.0" y="301.0" font-size="12" text-anchor="middle" fill="#6b7280">90°</text>
    <text x="295.0" y="301.0" font-size="12" text-anchor="middle" fill="#6b7280">60°</text>
    <text x="320.0" y="301.0" font-size="12" text-anchor="middle" fill="#6b7280">30°</text>
    <text x="345.0" y="301.0" font-size="12" text-anchor="middle" fill="#6b7280">0°</text>
    <text x="370.0" y="301.0" font-size="12" text-anchor="middle" fill="#6b7280">30°</text>
    <text x="395.0" y="301.0" font-size="12" text-anchor="middle" fill="#6b7280">60°</text>
    <text x="420.0" y="301.0" font-size="12" text-anchor="middle" fill="#6b7280">90°</text>
    <text x="307.5" y="317.0" font-size="12" text-anchor="middle" fill="#6b7280">S</text>
