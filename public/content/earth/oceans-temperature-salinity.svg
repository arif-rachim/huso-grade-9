    <text x="345.0" y="40.0" font-size="12" text-anchor="middle" fill="#6b7280">surface salinity (‰) →</text>
    <path d="M270.0 218.1 L295.0 214.4 L311.7 151.2 L324.2 121.5 L336.7 166.1 L345.0 177.2 L353.3 188.4 L365.8 114.0 L378.3 147.5 L395.0 247.8 L420.0 273.9" fill="none" stroke="#92400e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="270.0" y1="173.5" x2="420.0" y2="173.5" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
    <text x="274.0" y="169.5" font-size="12" text-anchor="start" fill="#6b7280">average 35</text>
    <text x="365.8" y="106.0" font-size="12" text-anchor="middle" fill="#92400e" font-weight="bold">dry, evaporation</text>
    <text x="318.3" y="225.5" font-size="12" text-anchor="middle" fill="#92400e" font-weight="bold">rainy equator</text>
    <text x="424.0" y="214.4" font-size="12" text-anchor="end" fill="#92400e" font-weight="bold">ice melt</text>
  </g>
</svg>
