    <text x="75.3" y="201.4" font-size="12" text-anchor="start" fill="#2563eb" font-weight="bold">polar</text>
    <text x="130.0" y="305.0" font-size="12" text-anchor="middle" fill="#6b7280">Cold, dense water lies below.</text>
