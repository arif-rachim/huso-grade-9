    <line x1="267.5" y1="33.0" x2="267.5" y2="43.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
    <text x="172.5" y="32.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">wavelength L</text>
    <line x1="30.0" y1="59.0" x2="414.0" y2="59.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
