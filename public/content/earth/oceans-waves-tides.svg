    <line x1="420.0" y1="59.0" x2="420.0" y2="111.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="415.0" y1="59.0" x2="425.0" y2="59.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="415.0" y1="111.0" x2="425.0" y2="111.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
    <text x="428.0" y="90.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">H</text>
    <text x="300.0" y="138.0" font-size="13" text-anchor="middle" fill="#92400e" font-weight="bold">speed = L ÷ T  (T = period)</text>
    <text x="220.0" y="168.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Tides: Sun + Moon + Earth</text>
    <rect x="10.0" y="180.0" width="200.0" height="180.0" rx="0" fill="#eef0f3" fill-opacity="0.5"/>
    <text x="110.0" y="198.0" font-size="13" text-anchor="middle" fill="#92400e" font-weight="bold">SPRING tides</text>
    <ellipse cx="110" cy="275" rx="56" ry="30" transform="rotate(0 110 275)" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="110.0" cy="275.0" r="20" fill="#92400e" fill-opacity="0.55" stroke="#111827" stroke-width="1.5"/>
    <text x="110.0" y="279.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Earth</text>
    <circle cx="24.0" cy="275.0" r="11" fill="#92400e" fill-opacity="0.9"/>
    <text x="24.0" y="301.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Sun</text>
    <circle cx="160.0" cy="275.0" r="7" fill="#6b7280" stroke="#111827" stroke-width="1.2"/>
    <text x="160.0" y="263.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Moon</text>
    <text x="110.0" y="350.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">biggest range</text>
    <text x="110.0" y="222.0" font-size="12" text-anchor="middle" fill="#6b7280">new moon (or full moon)</text>
    <rect x="230.0" y="180.0" width="200.0" height="180.0" rx="0" fill="#eef0f3" fill-opacity="0.5"/>
    <text x="330.0" y="198.0" font-size="13" text-anchor="middle" fill="#92400e" font-weight="bold">NEAP tides</text>
    <ellipse cx="330" cy="275" rx="40" ry="36" transform="rotate(0 330 275)" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="330.0" cy="275.0" r="20" fill="#92400e" fill-opacity="0.55" stroke="#111827" stroke-width="1.5"/>
    <text x="330.0" y="279.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Earth</text>
    <circle cx="244.0" cy="275.0" r="11" fill="#92400e" fill-opacity="0.9"/>
    <text x="244.0" y="301.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Sun</text>
    <circle cx="330.0" cy="232.0" r="7" fill="#6b7280" stroke="#111827" stroke-width="1.2"/>
    <text x="354.0" y="236.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Moon</text>
    <text x="330.0" y="350.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">smallest range</text>
    <text x="330.0" y="232.0" font-size="12" text-anchor="middle" fill="#111827"></text>
    <text x="330.0" y="366.0" font-size="12" text-anchor="middle" fill="#111827"></text>
    <text x="220.0" y="386.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Two high tides a day (about every 12 h 25 min).</text>
    <text x="220.0" y="404.0" font-size="12" text-anchor="middle" fill="#6b7280">Spring: new and full moon (Sun-Moon-Earth in a line).</text>
    <text x="220.0" y="421.0" font-size="12" text-anchor="middle" fill="#6b7280">Neap: first and third quarter (Sun and Moon at 90°).</text>
    <text x="220.0" y="438.0" font-size="12" text-anchor="middle" fill="#6b7280">Spring and neap tides repeat every ~14.8 days.</text>
  </g>
</svg>
