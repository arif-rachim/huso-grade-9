    <line x1="30.0" y1="85.0" x2="410.0" y2="85.0" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
    <text x="34.0" y="101.0" font-size="12" text-anchor="start" fill="#6b7280">still water level</text>
    <circle cx="77.5" cy="59.0" r="4" fill="#92400e"/>
    <text x="77.5" y="49.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">crest</text>
    <circle cx="172.5" cy="111.0" r="4" fill="#92400e"/>
    <text x="172.5" y="127.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">trough</text>
    <line x1="77.5" y1="38.0" x2="267.5" y2="38.0" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
