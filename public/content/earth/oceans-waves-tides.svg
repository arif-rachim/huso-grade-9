<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 450" role="img" aria-labelledby="t d">
  <title id="t">Wave parts and spring and neap tides</title>
  <desc id="d">Top: a wave with its crest, trough, wavelength and height; speed equals wavelength divided by period. Bottom: at new moon and full moon the Sun, Moon and Earth line up and the tides are strongest, spring tides. At first and third quarter the Sun and Moon pull at right angles and the tides are weakest, neap tides.</desc>
  <rect x="0" y="0" width="440" height="450" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="18.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Wave anatomy</text>
