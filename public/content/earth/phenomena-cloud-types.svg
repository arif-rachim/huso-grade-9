  <title id="t">Ten cloud types by height</title>
  <desc id="d">Clouds are grouped by height. High clouds above about 6 kilometers: cirrus, cirrostratus, cirrocumulus. Middle clouds 2 to 6 kilometers: altocumulus and altostratus. Low clouds below 2 kilometers: stratus, stratocumulus and cumulus. Nimbostratus and cumulonimbus are rain clouds.</desc>
