<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" role="img" aria-labelledby="t d">
  <title id="t">Normal, El Nino and La Nina in the Pacific</title>
  <desc id="d">Three side views of the tropical Pacific, Indonesia on the left and South America on the right. Normal years: trade winds blow east to west, warm water piles up near Indonesia, air rises there and cold water upwells off Peru. El Nino: trade winds weaken, warm water slides east, the rain moves to the central and eastern Pacific and Indonesia gets dry. La Nina: trade winds are stronger, even more warm water piles up near Indonesia, more rain there.</desc>
