<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-labelledby="t d">
  <title id="t">Albedo</title>
  <desc id="d">Albedo is the fraction of sunlight reflected. Fresh snow reflects about 0.85, thick clouds about 0.65, desert sand about 0.35, forest about 0.15 and the ocean about 0.06. Earth as a whole reflects 0.30.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="380" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Albedo = reflected ÷ incoming sunlight</text>
    <text x="20" y="66" font-size="13" text-anchor="start" fill="#111827">Fresh snow</text>
    <rect x="150" y="50" width="255" height="22" fill="#92400e" fill-opacity="0.575" stroke="#92400e" stroke-width="1.2"/>
    <text x="413" y="66" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">0.85</text>
    <text x="20" y="100" font-size="13" text-anchor="start" fill="#111827">Thick clouds</text>
    <rect x="150" y="84" width="195" height="22" fill="#92400e" fill-opacity="0.475" stroke="#92400e" stroke-width="1.2"/>
    <text x="353" y="100" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">0.65</text>
    <text x="20" y="134" font-size="13" text-anchor="start" fill="#111827">Desert sand</text>
    <rect x="150" y="118" width="105" height="22" fill="#92400e" fill-opacity="0.32499999999999996" stroke="#92400e" stroke-width="1.2"/>
    <text x="263" y="134" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">0.35</text>
    <text x="20" y="168" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Earth (average)</text>
    <rect x="150" y="152" width="90" height="22" fill="#92400e" fill-opacity="0.3" stroke="#92400e" stroke-width="1.2"/>
    <text x="248" y="168" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">0.3</text>
    <text x="20" y="202" font-size="13" text-anchor="start" fill="#111827">Forest</text>
    <rect x="150" y="186" width="45" height="22" fill="#92400e" fill-opacity="0.22499999999999998" stroke="#92400e" stroke-width="1.2"/>
    <text x="203" y="202" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">0.15</text>
    <text x="20" y="236" font-size="13" text-anchor="start" fill="#111827">Ocean</text>
    <rect x="150" y="220" width="18" height="22" fill="#92400e" fill-opacity="0.18" stroke="#92400e" stroke-width="1.2"/>
    <text x="176" y="236" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">0.06</text>
    <rect x="20" y="268" width="440" height="98" fill="#fef3c7" fill-opacity="0.5" stroke="#92400e" stroke-width="1.2" rx="8"/>
    <text x="240" y="290" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Absorbed power per m² of cross-section: S (1 − A)</text>
    <text x="240" y="308" font-size="12" text-anchor="middle" fill="#111827">Balance (sphere): S(1 − A)/4 = σT⁴  →  T = [ S(1 − A) / (4σ) ]^¼</text>
    <text x="240" y="328" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Earth: S = 1361 W/m², A = 0.30  →  T ≈ 255 K (−18 °C)</text>
    <text x="240" y="348" font-size="12" text-anchor="middle" fill="#6b7280">Real average is 288 K (+15 °C): the greenhouse effect adds about 33 K.</text>
  </g>
</svg>
