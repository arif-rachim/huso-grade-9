<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-labelledby="t d">
  <title id="t">The rock cycle</title>
  <desc id="d">Magma cools to igneous rock. Weathering and erosion turn any rock into sediment. Lithification turns sediment into sedimentary rock. Heat and pressure turn any rock into metamorphic rock. Melting turns any rock back into magma.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="440" height="440" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220" y="24" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">The rock cycle</text>
    <rect x="158" y="58" width="124" height="44" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="1.5" rx="22"/>
    <text x="220" y="85" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Magma</text>
    <rect x="298" y="153" width="124" height="44" fill="#92400e" fill-opacity="0.15" stroke="#92400e" stroke-width="1.5" rx="6"/>
    <text x="360" y="180" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Igneous rock</text>
    <rect x="258" y="298" width="124" height="44" fill="#6b7280" fill-opacity="0.15" stroke="#6b7280" stroke-width="1.5" rx="6"/>
    <text x="320" y="325" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Sediment</text>
    <rect x="58" y="298" width="124" height="44" fill="#92400e" fill-opacity="0.15" stroke="#92400e" stroke-width="1.5" rx="6"/>
    <text x="120" y="325" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Sedimentary rock</text>
    <rect x="18" y="153" width="124" height="44" fill="#92400e" fill-opacity="0.15" stroke="#92400e" stroke-width="1.5" rx="6"/>
    <text x="80" y="180" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Metamorphic rock</text>
    <line x1="256.8" y1="105" x2="320.2" y2="148" stroke="#92400e" stroke-width="2.2" marker-end="url(#arB)"/>
    <text x="322" y="108" font-size="12" text-anchor="start" fill="#92400e" font-weight="bold">Cooling &amp;</text>
    <text x="322" y="122" font-size="12" text-anchor="start" fill="#92400e">crystallization</text>
    <line x1="353.1" y1="200" x2="327.4" y2="293" stroke="#92400e" stroke-width="2.2" marker-end="url(#arB)"/>
    <text x="384" y="255" font-size="12" text-anchor="start" fill="#92400e" font-weight="bold">Weathering &amp;</text>
    <text x="384" y="269" font-size="12" text-anchor="start" fill="#92400e">erosion</text>
    <line x1="255" y1="320" x2="187" y2="320" stroke="#92400e" stroke-width="2.2" marker-end="url(#arB)"/>
    <text x="220" y="372" font-size="12" text-anchor="middle" fill="#92400e" font-weight="bold">Deposition, burial, compaction,</text>
    <text x="220" y="386" font-size="12" text-anchor="middle" fill="#92400e">cementation (= lithification)</text>
    <line x1="113.1" y1="295" x2="87.4" y2="202" stroke="#92400e" stroke-width="2.2" marker-end="url(#arB)"/>
    <text x="20" y="258" font-size="12" text-anchor="start" fill="#92400e" font-weight="bold">Heat &amp;</text>
    <text x="20" y="272" font-size="12" text-anchor="start" fill="#92400e">pressure</text>
    <line x1="116.8" y1="150" x2="180.2" y2="107" stroke="#92400e" stroke-width="2.2" marker-end="url(#arB)"/>
    <text x="100" y="108" font-size="12" text-anchor="middle" fill="#92400e" font-weight="bold">Melting</text>
    <line x1="295" y1="175" x2="147" y2="175" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arG)"/>
    <line x1="121.4" y1="200" x2="275.3" y2="293" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arG)"/>
    <line x1="130.4" y1="295" x2="208.8" y2="107" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arG)"/>
    <text x="220" y="416" font-size="12" text-anchor="middle" fill="#6b7280">Dashed arrows = shortcuts: any rock can be weathered, melted or metamorphosed.</text>
    <text x="220" y="432" font-size="12" text-anchor="middle" fill="#6b7280">Metamorphism changes a rock in the solid state; if it melts, it becomes magma.</text>
  </g>
</svg>
