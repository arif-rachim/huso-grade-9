  <title id="t">Sedimentary structures</title>
  <desc id="d">Four panels: cross-bedding with inclined layers cut off at the top, graded bedding with coarse grains at the bottom and fine at the top, asymmetric ripple marks with a gentle upstream side and steep downstream side, and mud cracks forming polygons.</desc>
