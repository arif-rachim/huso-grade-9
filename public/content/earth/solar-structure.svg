<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 492" role="img" aria-labelledby="t d">
  <title id="t">Structure of the Solar System</title>
  <desc id="d">A logarithmic distance scale in astronomical units showing the four terrestrial planets, the asteroid belt, Jupiter and Saturn as gas giants, Uranus and Neptune as ice giants, the Kuiper belt and the Oort cloud. Below, the planets drawn at their relative sizes.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="492" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">The Solar System on a log scale (AU)</text>
    <line x1="24" y1="100" x2="458" y2="100" stroke="#111827" stroke-width="2.5" marker-end="url(#arK)"/>
    <line x1="62.8" y1="95" x2="62.8" y2="105" stroke="#111827" stroke-width="1.5"/>
    <text x="62.8" y="120" font-size="12" text-anchor="middle" fill="#111827">1</text>
    <line x1="137" y1="95" x2="137" y2="105" stroke="#111827" stroke-width="1.5"/>
    <text x="137" y="120" font-size="12" text-anchor="middle" fill="#111827">10</text>
    <line x1="211.1" y1="95" x2="211.1" y2="105" stroke="#111827" stroke-width="1.5"/>
    <text x="211.1" y="120" font-size="12" text-anchor="middle" fill="#111827">100</text>
    <line x1="285.3" y1="95" x2="285.3" y2="105" stroke="#111827" stroke-width="1.5"/>
    <text x="285.3" y="120" font-size="12" text-anchor="middle" fill="#111827">1,000</text>
    <line x1="359.5" y1="95" x2="359.5" y2="105" stroke="#111827" stroke-width="1.5"/>
    <text x="359.5" y="120" font-size="12" text-anchor="middle" fill="#111827">10,000</text>
    <line x1="433.7" y1="95" x2="433.7" y2="105" stroke="#111827" stroke-width="1.5"/>
    <text x="433.7" y="120" font-size="12" text-anchor="middle" fill="#111827">100,000</text>
    <text x="446" y="138" font-size="12" text-anchor="end" fill="#111827" font-weight="bold">AU</text>
    <rect x="86.7" y="86" width="14.6" height="14" fill="#92400e" fill-opacity="0.3" stroke="#92400e" stroke-width="1"/>
    <text x="94.8" y="54" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">asteroid belt</text>
    <text x="94.8" y="68" font-size="12" text-anchor="middle" fill="#6b7280">2.1–3.3 AU</text>
    <line x1="94.8" y1="72" x2="94.8" y2="84" stroke="#6b7280" stroke-width="1"/>
    <rect x="172.4" y="86" width="16.5" height="14" fill="#92400e" fill-opacity="0.3" stroke="#92400e" stroke-width="1"/>
    <text x="181.6" y="54" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Kuiper belt</text>
    <text x="181.6" y="68" font-size="12" text-anchor="middle" fill="#6b7280">30–50 AU</text>
    <line x1="181.6" y1="72" x2="181.6" y2="84" stroke="#6b7280" stroke-width="1"/>
    <rect x="307.6" y="86" width="126" height="14" fill="#92400e" fill-opacity="0.12" stroke="#92400e" stroke-width="1"/>
    <text x="370.3" y="54" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Oort cloud (comets)</text>
    <text x="370.3" y="68" font-size="12" text-anchor="middle" fill="#6b7280">about 2,000–100,000 AU</text>
    <line x1="370.3" y1="72" x2="370.3" y2="84" stroke="#6b7280" stroke-width="1"/>
    <text x="26" y="78" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">Sun</text>
    <circle cx="24" cy="100" r="5" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
    <circle cx="32.2" cy="100" r="4.5" fill="#92400e" fill-opacity="0.7" stroke="#111827" stroke-width="1.2"/>
    <text x="32.2" y="150" font-size="12" text-anchor="middle" fill="#111827">Mercury</text>
    <line x1="32.2" y1="105" x2="32.2" y2="138" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="52.3" cy="100" r="4.5" fill="#92400e" fill-opacity="0.7" stroke="#111827" stroke-width="1.2"/>
    <text x="52.3" y="165" font-size="12" text-anchor="middle" fill="#111827">Venus</text>
    <line x1="52.3" y1="105" x2="52.3" y2="153" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="62.8" cy="100" r="4.5" fill="#92400e" fill-opacity="0.7" stroke="#111827" stroke-width="1.2"/>
    <text x="62.8" y="180" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Earth</text>
    <line x1="62.8" y1="105" x2="62.8" y2="168" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="76.4" cy="100" r="4.5" fill="#92400e" fill-opacity="0.7" stroke="#111827" stroke-width="1.2"/>
    <text x="76.4" y="195" font-size="12" text-anchor="middle" fill="#111827">Mars</text>
    <line x1="76.4" y1="105" x2="76.4" y2="183" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="115.9" cy="100" r="4.5" fill="#92400e" fill-opacity="0.7" stroke="#111827" stroke-width="1.2"/>
    <text x="115.9" y="150" font-size="12" text-anchor="middle" fill="#111827">Jupiter</text>
    <line x1="115.9" y1="105" x2="115.9" y2="138" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="135.4" cy="100" r="4.5" fill="#92400e" fill-opacity="0.7" stroke="#111827" stroke-width="1.2"/>
    <text x="135.4" y="165" font-size="12" text-anchor="middle" fill="#111827">Saturn</text>
    <line x1="135.4" y1="105" x2="135.4" y2="153" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="158" cy="100" r="4.5" fill="#92400e" fill-opacity="0.7" stroke="#111827" stroke-width="1.2"/>
    <text x="158" y="180" font-size="12" text-anchor="middle" fill="#111827">Uranus</text>
    <line x1="158" y1="105" x2="158" y2="168" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="172.4" cy="100" r="4.5" fill="#92400e" fill-opacity="0.7" stroke="#111827" stroke-width="1.2"/>
    <text x="172.4" y="195" font-size="12" text-anchor="middle" fill="#111827">Neptune</text>
    <line x1="172.4" y1="105" x2="172.4" y2="183" stroke="#d1d5db" stroke-width="1"/>
    <text x="24" y="214" font-size="12" text-anchor="start" fill="#6b7280">Terrestrial (rocky): Mercury, Venus, Earth, Mars</text>
    <text x="24" y="230" font-size="12" text-anchor="start" fill="#6b7280">Gas giants: Jupiter, Saturn   ·   Ice giants: Uranus, Neptune</text>
    <text x="240" y="266" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Relative sizes (Earth = 1)</text>
    <circle cx="51" cy="314" r="0.8" fill="#92400e" fill-opacity="0.6" stroke="#111827" stroke-width="1.2"/>
    <text x="51" y="378" font-size="12" text-anchor="middle" fill="#111827">Mercury</text>
    <text x="51" y="393" font-size="12" text-anchor="middle" fill="#6b7280">0.38</text>
    <circle cx="105" cy="314" r="2.1" fill="#92400e" fill-opacity="0.6" stroke="#111827" stroke-width="1.2"/>
    <text x="105" y="378" font-size="12" text-anchor="middle" fill="#111827">Venus</text>
    <text x="105" y="393" font-size="12" text-anchor="middle" fill="#6b7280">0.95</text>
    <circle cx="159" cy="314" r="2.2" fill="#92400e" fill-opacity="0.6" stroke="#111827" stroke-width="1.2"/>
    <text x="159" y="378" font-size="12" text-anchor="middle" fill="#111827">Earth</text>
    <text x="159" y="393" font-size="12" text-anchor="middle" fill="#6b7280">1</text>
    <circle cx="213" cy="314" r="1.2" fill="#92400e" fill-opacity="0.6" stroke="#111827" stroke-width="1.2"/>
    <text x="213" y="378" font-size="12" text-anchor="middle" fill="#111827">Mars</text>
    <text x="213" y="393" font-size="12" text-anchor="middle" fill="#6b7280">0.53</text>
    <circle cx="267" cy="314" r="24.6" fill="#92400e" fill-opacity="0.35" stroke="#111827" stroke-width="1.2"/>
    <text x="267" y="378" font-size="12" text-anchor="middle" fill="#111827">Jupiter</text>
    <text x="267" y="393" font-size="12" text-anchor="middle" fill="#6b7280">11.2</text>
    <circle cx="321" cy="314" r="20.8" fill="#92400e" fill-opacity="0.35" stroke="#111827" stroke-width="1.2"/>
    <text x="321" y="378" font-size="12" text-anchor="middle" fill="#111827">Saturn</text>
    <text x="321" y="393" font-size="12" text-anchor="middle" fill="#6b7280">9.45</text>
    <circle cx="375" cy="314" r="8.8" fill="#92400e" fill-opacity="0.35" stroke="#111827" stroke-width="1.2"/>
    <text x="375" y="378" font-size="12" text-anchor="middle" fill="#111827">Uranus</text>
    <text x="375" y="393" font-size="12" text-anchor="middle" fill="#6b7280">4</text>
    <circle cx="429" cy="314" r="8.6" fill="#92400e" fill-opacity="0.35" stroke="#111827" stroke-width="1.2"/>
    <text x="429" y="378" font-size="12" text-anchor="middle" fill="#111827">Neptune</text>
    <text x="429" y="393" font-size="12" text-anchor="middle" fill="#6b7280">3.9</text>
    <text x="240" y="424" font-size="12" text-anchor="middle" fill="#111827">Sun: 99.86 % of all the mass, a star 109 Earth diameters wide.</text>
    <text x="240" y="442" font-size="12" text-anchor="middle" fill="#111827">1 AU = 149.6 million km (Earth–Sun); sunlight takes about 8.3 min to reach Earth.</text>
    <text x="240" y="460" font-size="12" text-anchor="middle" fill="#111827">Pluto, Eris, Ceres, Haumea and Makemake are dwarf planets (IAU, 2006).</text>
    <text x="240" y="478" font-size="12" text-anchor="middle" fill="#6b7280">Gas giants: mostly hydrogen and helium. Ice giants: water, ammonia, methane ices.</text>
  </g>
</svg>
