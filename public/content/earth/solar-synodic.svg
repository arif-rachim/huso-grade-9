<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="t d">
  <title id="t">Synodic and sidereal periods</title>
  <desc id="d">Top view of the Sun with the orbits of Earth and Mars. At opposition the Sun, Earth and Mars are in line. Earth laps Mars once every synodic period of 780 days. The synodic period is longer than Earth's year because Mars also moves.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Sidereal vs. synodic period</text>
    <circle cx="130" cy="170" r="62" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <circle cx="130" cy="170" r="98" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <circle cx="130" cy="170" r="11" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
    <circle cx="192" cy="170" r="6" fill="#92400e" fill-opacity="0.6" stroke="#111827" stroke-width="1.5"/>
    <circle cx="228" cy="170" r="6" fill="#dc2626" fill-opacity="0.5" stroke="#111827" stroke-width="1.5"/>
    <text x="182" y="158" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Earth</text>
    <text x="232" y="156" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Mars</text>
    <line x1="130" y1="170" x2="228" y2="170" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="175.4" cy="212.2" r="5" fill="#92400e" fill-opacity="0.35" stroke="#111827" stroke-width="1.2"/>
    <text x="167.4" y="228.2" font-size="12" text-anchor="end" fill="#6b7280">Earth after 687 d</text>
    <text x="130" y="292" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Start: opposition (Sun, Earth, Mars in a line)</text>
    <text x="130" y="308" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Earth gains 360° on Mars every S</text>
    <text x="260" y="60" font-size="13" text-anchor="start" fill="#92400e" font-weight="bold">Sidereal period P</text>
    <text x="260" y="76" font-size="12" text-anchor="start" fill="#111827">one orbit relative to the stars</text>
    <text x="260" y="110" font-size="13" text-anchor="start" fill="#92400e" font-weight="bold">Synodic period S</text>
    <text x="260" y="126" font-size="12" text-anchor="start" fill="#111827">from one alignment with the Sun</text>
    <text x="260" y="142" font-size="12" text-anchor="start" fill="#111827">to the next (same phase, same line-up)</text>
    <rect x="254" y="160" width="216" height="68" fill="#fef3c7" fill-opacity="0.5" stroke="#92400e" stroke-width="1.2" rx="8"/>
    <text x="360" y="182" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">1 / S = | 1 / P₁ − 1 / P₂ |</text>
    <text x="360" y="200" font-size="12" text-anchor="middle" fill="#111827">P₁ = Earth's year (365.26 d)</text>
    <text x="360" y="216" font-size="12" text-anchor="middle" fill="#111827">P₂ = the other body's period</text>
    <text x="260" y="256" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">Mars: 1/365.26 − 1/687.0  →  S = 780 d</text>
    <text x="260" y="274" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">Venus: 1/224.7 vs 1/365.26  →  S = 584 d</text>
    <text x="260" y="292" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">Moon: P = 27.32 d vs Earth's year</text>
    <text x="260" y="308" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">→ S = 29.53 d (phase cycle)</text>
    <text x="240" y="372" font-size="12" text-anchor="middle" fill="#6b7280">Outer planets: opposition (closest, brightest), conjunction (behind the Sun).</text>
    <text x="240" y="388" font-size="12" text-anchor="middle" fill="#6b7280">Inner planets (Mercury, Venus): inferior and superior conjunction; greatest elongation.</text>
  </g>
</svg>
