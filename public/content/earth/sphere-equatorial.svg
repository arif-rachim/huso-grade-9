<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" role="img" aria-labelledby="t d">
  <title id="t">The celestial sphere and equatorial coordinates</title>
  <desc id="d">A sphere around the Earth showing the celestial poles, the celestial equator, the ecliptic tilted 23.4 degrees, the vernal equinox point, and a star located by right ascension along the equator and declination north of it.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="460" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">The celestial sphere: RA and Dec</text>
    <circle cx="205" cy="190" r="118" fill="#fef3c7" fill-opacity="0.5" stroke="#92400e" stroke-width="2"/>
