    <path d="M315.9,214.8 L313.8,216.2 L311.4,217.4 L308.7,218.6 L305.8,219.6 L302.5,220.6 L299.0,221.6 L295.2,222.4 L291.2,223.1 L287.0,223.8 L282.5,224.3 L277.8,224.8 L272.9,225.2 L267.9,225.4 L262.6,225.6 L257.2,225.7 L251.7,225.7 L246.0,225.6 L240.2,225.4 L234.3,225.0 L228.4,224.6 L222.3,224.1 L216.3,223.5 L210.2,222.8 L204.0,222.1 L197.9,221.2 L191.8,220.3 L185.8,219.2 L179.8,218.1 L173.8,216.9 L168.0,215.6 L162.2,214.3 L156.6,212.9 L151.1,211.4 L145.7,209.9 L140.5,208.3 L135.5,206.7 L130.7,205.0 L126.1,203.3 L121.7,201.6 L117.5,199.8 L113.6,198.0 L109.9,196.1 L106.4,194.3 L103.3,192.4 L100.4,190.6 L97.8,188.7 L95.5,186.8 L93.5,185.0 L91.8,183.1 L90.5,181.3 L89.4,179.5 L88.6,177.7 L88.2,176.0 L88.1,174.3 L88.3,172.6 M321.7,207.4 L321.2,209.0 L320.3,210.5 L319.1,212.0 L317.7,213.5 L315.9,214.8 " fill="none" stroke="#6b7280" stroke-width="2"/>
    <path d="M88.3,172.6 L88.8,171.0 L89.7,169.5 L90.9,168.0 L92.3,166.5 L94.1,165.2 L96.2,163.8 L98.6,162.6 L101.3,161.4 L104.2,160.4 L107.5,159.4 L111.0,158.4 L114.8,157.6 L118.8,156.9 L123.0,156.2 L127.5,155.7 L132.2,155.2 L137.1,154.8 L142.1,154.6 L147.4,154.4 L152.8,154.3 L158.3,154.3 L164.0,154.4 L169.8,154.6 L175.7,155.0 L181.6,155.4 L187.7,155.9 L193.7,156.5 L199.8,157.2 L206.0,157.9 L212.1,158.8 L218.2,159.7 L224.2,160.8 L230.2,161.9 L236.2,163.1 L242.0,164.4 L247.8,165.7 L253.4,167.1 L258.9,168.6 L264.3,170.1 L269.5,171.7 L274.5,173.3 L279.3,175.0 L283.9,176.7 L288.3,178.4 L292.5,180.2 L296.4,182.0 L300.1,183.9 L303.6,185.7 L306.7,187.6 L309.6,189.4 L312.2,191.3 L314.5,193.2 L316.5,195.0 L318.2,196.9 L319.5,198.7 L320.6,200.5 L321.4,202.3 L321.8,204.0 L321.9,205.7 L321.7,207.4 " fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="205" y1="283" x2="205" y2="97" stroke="#111827" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="205" cy="97" r="3.5" fill="#111827"/>
    <circle cx="205" cy="283" r="3.5" fill="#111827"/>
    <text x="213" y="101" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">NCP (north celestial pole)</text>
    <text x="205" y="300" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">SCP (south)</text>
    <circle cx="205" cy="190" r="6" fill="#92400e" stroke="#111827" stroke-width="1"/>
    <text x="195" y="182" font-size="12" text-anchor="end" fill="#111827">Earth</text>
    <circle cx="315.9" cy="214.8" r="5" fill="#111827"/>
    <text x="327.9" y="218.8" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">Vernal equinox</text>
    <text x="327.9" y="232.8" font-size="12" text-anchor="start" fill="#111827">RA 0h, Dec 0°</text>
    <circle cx="168" cy="215.6" r="4" fill="#6b7280"/>
    <text x="160" y="231.6" font-size="12" text-anchor="end" fill="#6b7280" font-weight="bold">Jun</text>
    <circle cx="242" cy="164.4" r="4" fill="#6b7280"/>
    <text x="248" y="156.4" font-size="12" text-anchor="start" fill="#6b7280" font-weight="bold">Dec</text>
    <path d="M272.7,249.5 L272.6,246.2 L272.5,242.9 L272.3,239.5 L272.0,236.0 L271.7,232.5 L271.2,228.9 L270.7,225.2 L270.1,221.6 L269.4,217.9 L268.6,214.1 L267.8,210.3 L266.8,206.5 L265.8,202.7 L264.8,198.9 L263.6,195.0 L262.4,191.2 L261.1,187.3 L259.8,183.5 L258.3,179.6 L256.8,175.8 " fill="none" stroke="#dc2626" stroke-width="3"/>
    <path d="M315.9,214.8 L314.6,216.9 L313.2,219.0 L311.7,221.0 L310.1,223.0 L308.5,224.9 L306.7,226.9 L304.8,228.8 L302.8,230.6 L300.8,232.4 L298.6,234.2 L296.4,236.0 L294.1,237.7 L291.7,239.3 L289.2,240.9 L286.6,242.5 L284.0,244.0 L281.2,245.4 L278.5,246.9 L275.6,248.2 L272.7,249.5 " fill="none" stroke="#111827" stroke-width="3.5"/>
    <circle cx="256.8" cy="175.8" r="6" fill="#fde68a" stroke="#111827" stroke-width="2"/>
    <text x="266.8" y="169.8" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">star</text>
    <text x="260.6" y="218.1" font-size="13" text-anchor="end" fill="#dc2626" font-weight="bold">Dec (δ)</text>
    <text x="292.6" y="254.2" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">RA (α)</text>
    <line x1="350" y1="250" x2="370" y2="250" stroke="#92400e" stroke-width="2.4"/>
    <text x="376" y="254" font-size="12" text-anchor="start" fill="#92400e" font-weight="bold">celestial equator</text>
    <line x1="350" y1="270" x2="370" y2="270" stroke="#6b7280" stroke-width="2"/>
    <text x="376" y="274" font-size="12" text-anchor="start" fill="#6b7280" font-weight="bold">ecliptic (Sun's path)</text>
    <text x="350" y="296" font-size="12" text-anchor="start" fill="#6b7280">Jun, Dec = the Sun on</text>
    <text x="350" y="310" font-size="12" text-anchor="start" fill="#6b7280">21 Jun (Dec +23.4°) and</text>
    <text x="350" y="324" font-size="12" text-anchor="start" fill="#6b7280">21 Dec (Dec −23.4°)</text>
    <text x="20" y="350" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Right ascension (RA, α)</text>
    <text x="20" y="366" font-size="12" text-anchor="start" fill="#111827">like longitude: measured</text>
    <text x="20" y="380" font-size="12" text-anchor="start" fill="#111827">east along the equator</text>
    <text x="20" y="394" font-size="12" text-anchor="start" fill="#111827">from the vernal equinox,</text>
    <text x="20" y="408" font-size="12" text-anchor="start" fill="#111827">in hours (0h to 24h)</text>
    <text x="20" y="422" font-size="12" text-anchor="start" fill="#111827">1 h = 15°</text>
    <text x="175" y="350" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">Declination (Dec, δ)</text>
    <text x="175" y="366" font-size="12" text-anchor="start" fill="#111827">like latitude: degrees</text>
    <text x="175" y="380" font-size="12" text-anchor="start" fill="#111827">north (+) or south (−)</text>
    <text x="175" y="394" font-size="12" text-anchor="start" fill="#111827">of the equator,</text>
    <text x="175" y="408" font-size="12" text-anchor="start" fill="#111827">−90° to +90°</text>
    <text x="175" y="422" font-size="12" text-anchor="start" fill="#111827">(the NCP is +90°)</text>
    <text x="330" y="350" font-size="13" text-anchor="start" fill="#6b7280" font-weight="bold">Ecliptic coordinates</text>
    <text x="330" y="366" font-size="12" text-anchor="start" fill="#111827">same idea, but measured</text>
    <text x="330" y="380" font-size="12" text-anchor="start" fill="#111827">from the ecliptic: ecliptic</text>
    <text x="330" y="394" font-size="12" text-anchor="start" fill="#111827">longitude and latitude.</text>
    <text x="330" y="408" font-size="12" text-anchor="start" fill="#111827">The ecliptic is tilted 23.4°</text>
    <text x="330" y="422" font-size="12" text-anchor="start" fill="#111827">to the equator.</text>
  </g>
</svg>
