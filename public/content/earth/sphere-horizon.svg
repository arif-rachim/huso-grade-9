<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 396" role="img" aria-labelledby="t d">
  <title id="t">Horizon view: latitude and circumpolar stars</title>
  <desc id="d">A side view of the sky for an observer at 40 degrees north. The north celestial pole is 40 degrees above the north horizon. A star with declination 60 degrees never sets because its lowest point is 10 degrees above the horizon. A star at declination 20 degrees dips below the horizon.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="396" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Latitude 40° N: which stars never set?</text>
    <path d="M85,215 A130,130 0 0 1 345,215" fill="#fef3c7" fill-opacity="0.5" stroke="#92400e" stroke-width="2"/>
    <line x1="65" y1="215" x2="365" y2="215" stroke="#111827" stroke-width="2"/>
    <rect x="65" y="215" width="300" height="28" fill="#e5e7eb" fill-opacity="0.7"/>
    <text x="75" y="233" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">N</text>
    <text x="355" y="233" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">S</text>
    <text x="215" y="233" font-size="12" text-anchor="middle" fill="#6b7280">horizon</text>
    <line x1="215" y1="215" x2="215" y2="77" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="215" y="71" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">zenith</text>
    <line x1="215" y1="215" x2="115.4" y2="131.4" stroke="#111827" stroke-width="2"/>
    <circle cx="115.4" cy="131.4" r="4" fill="#111827"/>
    <text x="109.4" y="123.4" font-size="12" text-anchor="end" fill="#111827" font-weight="bold">NCP</text>
    <path d="M155,215 A60,60 0 0 1 169.0,176.4" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <text x="141.8" y="187.6" font-size="16" text-anchor="end" fill="#dc2626" font-weight="bold">φ</text>
    <line x1="298.6" y1="115.4" x2="215" y2="215" stroke="#92400e" stroke-width="2.2"/>
    <line x1="215" y1="215" x2="177.4" y2="259.8" stroke="#92400e" stroke-width="2.2" stroke-dasharray="6 4"/>
    <text x="312.6" y="123.4" font-size="12" text-anchor="start" fill="#92400e" font-weight="bold">celestial equator</text>
    <text x="312.6" y="137.4" font-size="12" text-anchor="start" fill="#92400e">(50° up, due south)</text>
    <line x1="170.5" y1="92.8" x2="87" y2="192.4" stroke="#111827" stroke-width="1.8" stroke-dasharray="6 4"/>
    <circle cx="170.5" cy="92.8" r="5" fill="#fde68a" stroke="#111827" stroke-width="2"/>
    <circle cx="87" cy="192.4" r="5" fill="#fde68a" stroke="#111827" stroke-width="2"/>
    <text x="160.5" y="86.8" font-size="12" text-anchor="end" fill="#111827" font-weight="bold">A: δ = +60°</text>
    <line x1="259.5" y1="92.8" x2="102.4" y2="280" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4"/>
    <circle cx="259.5" cy="92.8" r="5" fill="#fde68a" stroke="#6b7280" stroke-width="2"/>
    <circle cx="102.4" cy="280" r="5" fill="#fde68a" stroke="#6b7280" stroke-width="2"/>
    <text x="269.5" y="86.8" font-size="12" text-anchor="start" fill="#6b7280" font-weight="bold">B: δ = +20°</text>
    <text x="97" y="179" font-size="12" text-anchor="middle" fill="#111827"></text>
    <text x="20" y="322" font-size="12" text-anchor="start" fill="#111827">A: lowest point 40° − 30° = 10° above the horizon: circumpolar (never sets).</text>
    <text x="20" y="340" font-size="12" text-anchor="start" fill="#111827">B: lowest point 40° − 70° = −30°: below the horizon, so B rises and sets.</text>
    <text x="20" y="364" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">φ = 40° = your latitude = the altitude of the NCP.</text>
    <text x="20" y="382" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">Rule: circumpolar if δ &gt; 90° − φ (north).</text>
  </g>
</svg>
