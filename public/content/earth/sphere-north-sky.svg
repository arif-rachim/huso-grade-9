<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 530" role="img" aria-labelledby="t d">
  <title id="t">The northern sky around the pole</title>
  <desc id="d">A polar star chart centered on the north celestial pole with Polaris at the center, the Big Dipper in Ursa Major whose pointer stars point to Polaris, the Little Dipper in Ursa Minor, the W of Cassiopeia on the other side of the pole, Vega in Lyra and Alpheratz Mirach and Almach of Andromeda with the Andromeda Galaxy M31.</desc>
