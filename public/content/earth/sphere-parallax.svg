<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 385" role="img" aria-labelledby="t d">
  <title id="t">Stellar parallax</title>
  <desc id="d">Earth observes a nearby star from opposite sides of its orbit, six months apart. The star appears to shift against distant background stars. The parallax angle p in arcseconds gives the distance in parsecs as one divided by p.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="385" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Stellar parallax: a nearby star seems to wobble</text>
    <circle cx="160" cy="280" r="12" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
    <text x="160" y="312" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">Sun</text>
    <circle cx="160" cy="280" r="70" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="90" cy="280" r="7" fill="#92400e" fill-opacity="0.5" stroke="#111827" stroke-width="1.5"/>
    <circle cx="230" cy="280" r="7" fill="#92400e" fill-opacity="0.5" stroke="#111827" stroke-width="1.5"/>
    <text x="82" y="306" font-size="12" text-anchor="end" fill="#111827">Earth (January)</text>
    <text x="238" y="306" font-size="12" text-anchor="start" fill="#111827">Earth (July)</text>
    <text x="196" y="274" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">1 AU</text>
    <circle cx="160" cy="96" r="7" fill="#fde68a" stroke="#111827" stroke-width="2"/>
    <text x="172" y="100" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">nearby star</text>
    <line x1="90" y1="280" x2="160" y2="96" stroke="#92400e" stroke-width="1.5"/>
    <line x1="230" y1="280" x2="160" y2="96" stroke="#92400e" stroke-width="1.5"/>
    <line x1="160" y1="280" x2="160" y2="96" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M160.0,136 A40,40 0 0 0 145.8,133.4" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <text x="126" y="152" font-size="15" text-anchor="end" fill="#dc2626" font-weight="bold">p</text>
    <rect x="20" y="36" width="300" height="40" fill="#e5e7eb" fill-opacity="0.8"/>
    <text x="170" y="70" font-size="12" text-anchor="middle" fill="#6b7280">distant background stars (do not move)</text>
    <circle cx="45" cy="46" r="2" fill="#111827"/>
    <circle cx="85" cy="46" r="2" fill="#111827"/>
    <circle cx="255" cy="46" r="2" fill="#111827"/>
    <circle cx="295" cy="46" r="2" fill="#111827"/>
    <path d="M174,52 L184,52 L179,43 z" fill="#dc2626" fill-opacity="0.6" stroke="#dc2626" stroke-width="1"/>
    <path d="M136,52 L146,52 L141,43 z" fill="#dc2626" fill-opacity="0.6" stroke="#dc2626" stroke-width="1"/>
    <text x="187" y="56" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">Jan</text>
    <text x="133" y="56" font-size="12" text-anchor="end" fill="#dc2626" font-weight="bold">Jul</text>
    <text x="340" y="120" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">p = parallax angle</text>
    <text x="340" y="136" font-size="12" text-anchor="start" fill="#111827">half of the total shift</text>
    <text x="340" y="176" font-size="14" text-anchor="start" fill="#111827" font-weight="bold">d in parsecs</text>
    <text x="340" y="194" font-size="14" text-anchor="start" fill="#111827" font-weight="bold">= 1 ÷ p in arcseconds</text>
    <text x="340" y="226" font-size="12" text-anchor="start" fill="#111827">1 pc = 3.26 light-years</text>
    <text x="340" y="241" font-size="12" text-anchor="start" fill="#111827">= 206 265 AU</text>
    <text x="340" y="256" font-size="12" text-anchor="start" fill="#111827">1 arcsecond = 1/3600°</text>
    <text x="340" y="292" font-size="12" text-anchor="start" fill="#92400e">Proxima Centauri:</text>
    <text x="340" y="307" font-size="12" text-anchor="start" fill="#92400e">p = 0.77″ → d = 1.3 pc</text>
    <text x="340" y="322" font-size="12" text-anchor="start" fill="#92400e">≈ 4.2 light-years</text>
    <text x="250" y="372" font-size="12" text-anchor="middle" fill="#6b7280">Smaller angle = farther star.</text>
  </g>
</svg>
