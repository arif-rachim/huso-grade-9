<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-labelledby="t d">
  <title id="t">Equinoxes and solstices</title>
  <desc id="d">Earth at four points of its orbit with its axis always tilted 23.4 degrees the same way. In June the north pole tilts toward the Sun and the Sun's declination is plus 23.4 degrees. In December it is minus 23.4. In March and September the Sun is on the celestial equator.</desc>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker><marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="480" height="420" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="240" y="22" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Why the Sun's declination changes</text>
    <path d="M65,215 A175,80 0 1 1 415,215 A175,80 0 1 1 65,215" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <circle cx="240" cy="215" r="26" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
    <text x="240" y="219" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Sun</text>
    <circle cx="415" cy="215" r="18" fill="#92400e" fill-opacity="0.25" stroke="#111827" stroke-width="1.5"/>
    <line x1="403.1" y1="242.5" x2="426.9" y2="187.5" stroke="#111827" stroke-width="2"/>
    <circle cx="426.9" cy="187.5" r="2.5" fill="#111827"/>
    <text x="432.9" y="185.5" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">N</text>
    <text x="415" y="259" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">December solstice</text>
    <text x="415" y="273" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="bold">Sun Dec −23.4°</text>
    <text x="415" y="287" font-size="12" text-anchor="middle" fill="#6b7280">~21 Dec: short days in N</text>
    <circle cx="240" cy="135" r="18" fill="#92400e" fill-opacity="0.25" stroke="#111827" stroke-width="1.5"/>
    <line x1="228.1" y1="162.5" x2="251.9" y2="107.5" stroke="#111827" stroke-width="2"/>
    <circle cx="251.9" cy="107.5" r="2.5" fill="#111827"/>
    <text x="257.9" y="105.5" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">N</text>
    <text x="240" y="71" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">March equinox</text>
    <text x="240" y="85" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="bold">Sun Dec 0° (RA 0h)</text>
    <text x="240" y="99" font-size="12" text-anchor="middle" fill="#6b7280">~20 Mar: equal day and night</text>
    <circle cx="65" cy="215" r="18" fill="#92400e" fill-opacity="0.25" stroke="#111827" stroke-width="1.5"/>
    <line x1="53.1" y1="242.5" x2="76.9" y2="187.5" stroke="#111827" stroke-width="2"/>
    <circle cx="76.9" cy="187.5" r="2.5" fill="#111827"/>
    <text x="82.9" y="185.5" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">N</text>
    <text x="65" y="259" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">June solstice</text>
    <text x="65" y="273" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="bold">Sun Dec +23.4°</text>
    <text x="65" y="287" font-size="12" text-anchor="middle" fill="#6b7280">~21 Jun: long days in N</text>
    <circle cx="240" cy="295" r="18" fill="#92400e" fill-opacity="0.25" stroke="#111827" stroke-width="1.5"/>
    <line x1="228.1" y1="322.5" x2="251.9" y2="267.5" stroke="#111827" stroke-width="2"/>
    <circle cx="251.9" cy="267.5" r="2.5" fill="#111827"/>
    <text x="257.9" y="265.5" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">N</text>
    <text x="240" y="345" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">September equinox</text>
    <text x="240" y="359" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="bold">Sun Dec 0° (RA 12h)</text>
    <text x="240" y="373" font-size="12" text-anchor="middle" fill="#6b7280">~22 Sep: equal day and night</text>
    <text x="240" y="396" font-size="12" text-anchor="middle" fill="#6b7280">The axis always points the same way (toward Polaris), so the tilt faces the Sun in June.</text>
  </g>
</svg>
