<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" role="img" aria-labelledby="t d">
  <title id="t">Parts of a circle</title>
  <desc id="d">A circle with its center, a radius, a diameter, a chord, a tangent line and a secant line labeled.</desc>
  <rect x="0" y="0" width="420" height="310" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <circle cx="190.0" cy="150.0" r="100.0" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="190.0" cy="150.0" r="4" fill="#111827"/>
    <line x1="90.0" y1="150.0" x2="290.0" y2="150.0" stroke="#111827" stroke-width="1.8"/>
    <line x1="190.0" y1="150.0" x2="254.3" y2="73.4" stroke="#dc2626" stroke-width="2.5"/>
    <line x1="108.1" y1="207.4" x2="271.9" y2="207.4" stroke="#111827" stroke-width="1.8"/>
    <line x1="290.0" y1="80.0" x2="290.0" y2="225.0" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="55.0" y1="90.0" x2="250.0" y2="55.0" stroke="#6b7280" stroke-width="1.8"/>
    <text x="182.0" y="166.0" font-size="12" text-anchor="end" fill="#111827" data-label="center">center</text>
    <text x="236.1" y="103.7" font-size="12" text-anchor="start" fill="#dc2626" data-label="radius">radius</text>
    <text x="150.0" y="144.0" font-size="12" text-anchor="middle" fill="#111827" data-label="diameter">diameter</text>
    <text x="190.0" y="222.0" font-size="12" text-anchor="middle" fill="#111827" data-label="chord">chord</text>
    <text x="302.0" y="242.0" font-size="12" text-anchor="middle" fill="#111827" data-label="tangent">tangent</text>
    <text x="65.0" y="80.0" font-size="12" text-anchor="start" fill="#6b7280" data-label="secant">secant</text>
  </g>
</svg>
