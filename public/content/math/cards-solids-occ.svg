<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-labelledby="t d">
  <title id="t">Solid volume formulas</title>
  <desc id="d">Cylinder, cone, sphere, square pyramid and prism each with its volume formula.</desc>
  <rect x="0" y="0" width="440" height="330" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <ellipse cx="60" cy="60" rx="40" ry="12" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
    <line x1="20.0" y1="60.0" x2="20.0" y2="130.0" stroke="#2563eb" stroke-width="2"/>
    <line x1="100.0" y1="60.0" x2="100.0" y2="130.0" stroke="#2563eb" stroke-width="2"/>
    <path d="M20,130 A40,12 0 0 0 100,130" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="60.0" y="175.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Cylinder</text>
    <text x="60.0" y="198.0" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold" data-label="Cylinder volume = πr²h">πr²h</text>
    <line x1="205.0" y1="30.0" x2="165.0" y2="130.0" stroke="#2563eb" stroke-width="2"/>
    <line x1="205.0" y1="30.0" x2="245.0" y2="130.0" stroke="#2563eb" stroke-width="2"/>
    <path d="M165,130 A40,12 0 0 0 245,130" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M165,130 A40,12 0 0 1 245,130" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="205.0" y="175.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Cone</text>
    <text x="205.0" y="198.0" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold" data-label="Cone volume = ⅓πr²h">⅓πr²h</text>
    <circle cx="345.0" cy="80.0" r="50.0" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
    <ellipse cx="345" cy="80" rx="50" ry="14" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="345.0" y="175.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Sphere</text>
    <text x="345.0" y="198.0" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold" data-label="Sphere volume = 4/3 πr³">4/3 πr³</text>
    <polygon points="90.0,235.0 45.0,300.0 130.0,300.0" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="90.0,235.0 130.0,300.0 165.0,280.0" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="45.0" y1="300.0" x2="80.0" y2="280.0" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4 3"/>
    <line x1="80.0" y1="280.0" x2="165.0" y2="280.0" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4 3"/>
    <line x1="80.0" y1="280.0" x2="90.0" y2="235.0" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="250.0" y="262.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Pyramid</text>
    <text x="250.0" y="288.0" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold" data-label="Pyramid volume = ⅓ · base · h">⅓ · base · h</text>
    <text x="380.0" y="262.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Prism</text>
    <text x="380.0" y="288.0" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold" data-label="Prism volume = base · h">base · h</text>
  </g>
</svg>
