<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" role="img" aria-labeledby="t d">
  <title id="t">Inscribed angles and cyclic quadrilaterals</title>
  <desc id="d">Left: central angle 80 degrees and inscribed angles 40 degrees on the same arc. Right: a cyclic quadrilateral with angles 95, 105, 85, 75 so opposite angles add to 180.</desc>
  <rect x="0" y="0" width="440" height="340" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="17" text-anchor="middle" fill="#111827" font-weight="bold">Angles in a circle</text>
    <rect x="8.0" y="40.0" width="206.0" height="292.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <rect x="226.0" y="40.0" width="206.0" height="292.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="111.0" y="60.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">Inscribed angle</text>
    <circle cx="111.0" cy="150.0" r="66.0" fill="#2563eb" fill-opacity="0.05" stroke="#111827" stroke-width="1.8"/>
    <line x1="111.0" y1="150.0" x2="173.0" y2="127.4" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <line x1="111.0" y1="150.0" x2="99.5" y2="85.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <line x1="83.1" y1="209.8" x2="173.0" y2="127.4" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="83.1" y1="209.8" x2="99.5" y2="85.0" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="153.4" y1="200.6" x2="173.0" y2="127.4" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="153.4" y1="200.6" x2="99.5" y2="85.0" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M126.0,144.5 A16,16 0 0 0 108.2,134.2" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="127.0" y="126.3" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">80°</text>
    <path d="M96.4,197.7 A18,18 0 0 0 85.5,192.0" fill="none" stroke="#111827" stroke-width="1.5"/>
    <path d="M158.1,183.2 A18,18 0 0 0 145.8,184.2" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="86.1" y="175.8" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">40°</text>
    <text x="150.4" y="166.6" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">40°</text>
    <circle cx="111.0" cy="150.0" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="100.0" y="154.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">O</text>
    <circle cx="173.0" cy="127.4" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="184.0" y="123.4" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">A</text>
    <circle cx="99.5" cy="85.0" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="91.5" y="77.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">B</text>
    <circle cx="83.1" cy="209.8" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="75.1" y="223.8" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <circle cx="153.4" cy="200.6" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="163.4" y="212.6" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">D</text>
    <text x="111.0" y="256.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">∠ACB = ½ · ∠AOB</text>
    <text x="111.0" y="276.0" font-size="12" text-anchor="middle" fill="#111827">Same arc ⇒ same inscribed angle</text>
    <text x="111.0" y="294.0" font-size="12" text-anchor="middle" fill="#111827">Arc is a half-circle ⇒ angle = 90°</text>
    <text x="111.0" y="312.0" font-size="12" text-anchor="middle" fill="#6b7280">(inscribed = ½ of central)</text>
    <text x="329.0" y="60.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">Cyclic quadrilateral</text>
    <circle cx="329.0" cy="150.0" r="66.0" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polygon points="291.1,95.9 383.1,112.1 388.8,177.9 269.2,177.9" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M305.9,98.5 A15,15 0 0 1 287.3,110.4" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="308.3" y="126.9" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">95°</text>
    <circle cx="291.1" cy="95.9" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="284.8" y="90.9" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">A</text>
    <path d="M384.4,127.1 A15,15 0 0 1 368.3,109.5" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="359.5" y="137.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">105°</text>
    <circle cx="383.1" cy="112.1" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="392.1" y="109.8" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">B</text>
    <path d="M373.8,177.9 A15,15 0 0 1 387.5,162.9" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="365.2" y="160.3" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">85°</text>
    <circle cx="388.8" cy="177.9" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="398.8" y="186.5" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <path d="M273.1,163.4 A15,15 0 0 1 284.2,177.9" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="294.6" y="162.4" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">75°</text>
    <circle cx="269.2" cy="177.9" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="259.2" y="186.5" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">D</text>
    <text x="329.0" y="256.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Opposite angles add to 180°</text>
    <text x="329.0" y="276.0" font-size="12" text-anchor="middle" fill="#111827">A + C = 95° + 85° = 180°</text>
    <text x="329.0" y="294.0" font-size="12" text-anchor="middle" fill="#111827">B + D = 105° + 75° = 180°</text>
    <text x="329.0" y="312.0" font-size="12" text-anchor="middle" fill="#6b7280">(all 4 corners sit on the circle)</text>
  </g>
</svg>
