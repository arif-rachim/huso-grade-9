<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="t d">
  <title id="t">Power of a point</title>
  <desc id="d">Three cases: two chords crossing inside a circle, two secants from an outside point, and a tangent with a secant. In each case the products of the segment lengths are equal.</desc>
  <rect x="0" y="0" width="440" height="300" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Power of a point: one product, three pictures</text>
    <rect x="8.0" y="40.0" width="140.0" height="250.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="78.0" y="58.0" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="bold">Two chords</text>
    <rect x="150.0" y="40.0" width="140.0" height="250.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="220.0" y="58.0" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="bold">Two secants</text>
    <rect x="292.0" y="40.0" width="140.0" height="250.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="362.0" y="58.0" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="bold">Tangent + secant</text>
    <circle cx="78.0" cy="135.0" r="44.0" fill="#2563eb" fill-opacity="0.07" stroke="#111827" stroke-width="1.8"/>
    <line x1="44.4" y1="163.4" x2="121.3" y2="127.4" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <circle cx="44.4" cy="163.4" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="36.7" y="173.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">A</text>
    <circle cx="121.3" cy="127.4" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="131.2" y="129.7" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">B</text>
    <line x1="101.6" y1="172.1" x2="64.7" y2="93.1" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <circle cx="101.6" cy="172.1" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="107.0" y="184.6" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <circle cx="64.7" cy="93.1" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="61.7" y="87.5" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">D</text>
    <circle cx="88.0" cy="143.0" r="3.5" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
    <text x="99.0" y="147.0" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">P</text>
    <text x="78.0" y="222.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">PA · PB = PC · PD</text>
    <text x="78.0" y="240.0" font-size="12" text-anchor="middle" fill="#111827">e.g. 6 · 2 = 3 · 4</text>
    <text x="78.0" y="258.0" font-size="12" text-anchor="middle" fill="#6b7280">Inside: the two pieces</text>
    <text x="78.0" y="274.0" font-size="12" text-anchor="middle" fill="#6b7280">of each chord.</text>
    <circle cx="228.0" cy="123.0" r="44.0" fill="#2563eb" fill-opacity="0.07" stroke="#111827" stroke-width="1.8"/>
    <line x1="176.0" y1="193.0" x2="270.2" y2="135.5" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <circle cx="219.9" cy="166.2" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="217.8" y="181.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">A</text>
    <circle cx="270.2" cy="135.5" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="280.7" y="142.7" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">B</text>
    <line x1="176.0" y1="193.0" x2="223.4" y2="79.2" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <circle cx="193.7" cy="150.5" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="185.1" y="161.4" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <circle cx="223.4" cy="79.2" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="222.2" y="72.3" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">D</text>
    <circle cx="176.0" cy="193.0" r="3.5" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
    <text x="168.0" y="208.0" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">P</text>
    <text x="220.0" y="222.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">PA · PB = PC · PD</text>
    <text x="220.0" y="240.0" font-size="12" text-anchor="middle" fill="#111827">A, C near · B, D far</text>
    <text x="220.0" y="258.0" font-size="12" text-anchor="middle" fill="#6b7280">Use the whole secant</text>
    <text x="220.0" y="274.0" font-size="12" text-anchor="middle" fill="#6b7280">× its outside part.</text>
    <circle cx="370.0" cy="123.0" r="44.0" fill="#2563eb" fill-opacity="0.07" stroke="#111827" stroke-width="1.8"/>
    <line x1="310.0" y1="193.0" x2="327.0" y2="113.8" stroke="#111827" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="327.0" cy="113.8" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="323.0" y="104.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">T</text>
    <line x1="310.0" y1="193.0" x2="408.9" y2="102.3" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <circle cx="346.1" cy="159.9" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="340.1" y="173.2" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">A</text>
    <circle cx="408.9" cy="102.3" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="418.6" y="101.2" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">B</text>
    <circle cx="310.0" cy="193.0" r="3.5" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
    <text x="302.0" y="208.0" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">P</text>
    <text x="362.0" y="222.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">PT² = PA · PB</text>
    <text x="362.0" y="240.0" font-size="12" text-anchor="middle" fill="#111827">PT² = PO² − r²</text>
    <text x="362.0" y="258.0" font-size="12" text-anchor="middle" fill="#6b7280">Tangent ⟂ radius,</text>
    <text x="362.0" y="274.0" font-size="12" text-anchor="middle" fill="#6b7280">so PT is a tangent length.</text>
  </g>
</svg>
