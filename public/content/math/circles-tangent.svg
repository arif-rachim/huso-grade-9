<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" role="img" aria-labeledby="t d">
  <title id="t">Tangent circles</title>
  <desc id="d">Externally tangent circles have center distance r1 plus r2; internally tangent circles have center distance r1 minus r2; a common external tangent has length square root of d squared minus (r1 minus r2) squared.</desc>
  <rect x="0" y="0" width="440" height="520" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="17" text-anchor="middle" fill="#111827" font-weight="bold">Tangent circles</text>
    <rect x="8.0" y="40.0" width="206.0" height="190.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <rect x="226.0" y="40.0" width="206.0" height="190.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <circle cx="79.0" cy="125.0" r="39.0" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
    <circle cx="144.0" cy="125.0" r="26.0" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="2"/>
    <line x1="79.0" y1="125.0" x2="144.0" y2="125.0" stroke="#111827" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
    <circle cx="79.0" cy="125.0" r="2.5" fill="#111827" stroke="#111827" stroke-width="1"/>
    <circle cx="144.0" cy="125.0" r="2.5" fill="#111827" stroke="#111827" stroke-width="1"/>
    <circle cx="118.0" cy="125.0" r="4.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="98.5" y="119.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">3</text>
    <text x="131.0" y="119.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">2</text>
    <text x="118.0" y="145.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">T</text>
    <text x="111.0" y="60.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">Externally tangent</text>
    <text x="111.0" y="194.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">d = r₁ + r₂ = 5</text>
    <text x="111.0" y="212.0" font-size="12" text-anchor="middle" fill="#6b7280">T lies on the line of centers</text>
    <circle cx="316.0" cy="125.0" r="52.0" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
    <circle cx="342.0" cy="125.0" r="26.0" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="2"/>
    <line x1="316.0" y1="125.0" x2="342.0" y2="125.0" stroke="#111827" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
    <circle cx="316.0" cy="125.0" r="2.5" fill="#111827" stroke="#111827" stroke-width="1"/>
    <circle cx="342.0" cy="125.0" r="2.5" fill="#111827" stroke="#111827" stroke-width="1"/>
    <circle cx="368.0" cy="125.0" r="4.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="372.0" y="145.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">T</text>
    <text x="329.0" y="119.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">2</text>
    <text x="290.0" y="141.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">4</text>
    <text x="329.0" y="60.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">Internally tangent</text>
    <text x="329.0" y="194.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">d = r₁ − r₂ = 2</text>
    <text x="329.0" y="212.0" font-size="12" text-anchor="middle" fill="#6b7280">small circle inside the big one</text>
    <rect x="8.0" y="244.0" width="424.0" height="268.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="220.0" y="264.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">Common external tangent (radii 7 and 2, centers 13 apart)</text>
    <circle cx="104.5" cy="382.0" r="80.5" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
    <circle cx="254.0" cy="382.0" r="23.0" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="2"/>
    <line x1="135.5" y1="307.7" x2="294.7" y2="374.0" stroke="#111827" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="104.5" y1="382.0" x2="135.5" y2="307.7" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="254.0" y1="382.0" x2="262.8" y2="360.8" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="126.6" y1="328.9" x2="254.0" y2="382.0" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 3" stroke-linecap="round"/>
    <line x1="104.5" y1="382.0" x2="254.0" y2="382.0" stroke="#111827" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
    <circle cx="104.5" cy="382.0" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <circle cx="254.0" cy="382.0" r="3.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <circle cx="135.5" cy="307.7" r="3.5" fill="#111827" stroke="#111827" stroke-width="1"/>
    <circle cx="262.8" cy="360.8" r="3.5" fill="#111827" stroke="#111827" stroke-width="1"/>
    <polyline points="123.5,336.3 130.9,339.4 134.0,332.0" fill="none" stroke="#111827" stroke-width="1.2"/>
    <text x="108.0" y="340.8" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">7</text>
    <text x="248.4" y="375.4" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">2</text>
    <text x="205.2" y="325.2" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">L = 12</text>
    <text x="183.2" y="399.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">d = 13</text>
    <text x="103.6" y="369.5" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">5</text>
    <text x="129.5" y="299.7" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">T₁</text>
    <text x="270.8" y="352.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">T₂</text>
    <text x="220.0" y="484.0" font-size="12" text-anchor="middle" fill="#111827">Right triangle: legs L and (r₁ − r₂), hypotenuse d  ⇒  L = √(d² − (r₁ − r₂)²)</text>
    <text x="220.0" y="502.0" font-size="12" text-anchor="middle" fill="#6b7280">Internal common tangent: L = √(d² − (r₁ + r₂)²)</text>
  </g>
</svg>
