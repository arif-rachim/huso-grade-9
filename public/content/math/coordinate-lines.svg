<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" role="img" aria-labeledby="t d">
  <title id="t">Distance, midpoint and two lines on a grid map</title>
  <desc id="d">Points A(1,2) and B(7,10) are 10 apart (a 6-8-10 right triangle). Line AB is 4x - 3y + 2 = 0. The line x + 2y = 16 crosses it at P(4,6), the midpoint of AB.</desc>
  <rect x="0" y="0" width="440" height="500" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">A grid map: distance, line, intersection</text>
    <line x1="34.0" y1="430.0" x2="34.0" y2="58.0" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="65.0" y1="430.0" x2="65.0" y2="58.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="96.0" y1="430.0" x2="96.0" y2="58.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <text x="96.0" y="444.0" font-size="11" text-anchor="middle" fill="#6b7280">2</text>
    <line x1="127.0" y1="430.0" x2="127.0" y2="58.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="158.0" y1="430.0" x2="158.0" y2="58.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <text x="158.0" y="444.0" font-size="11" text-anchor="middle" fill="#6b7280">4</text>
    <line x1="189.0" y1="430.0" x2="189.0" y2="58.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="220.0" y1="430.0" x2="220.0" y2="58.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <text x="220.0" y="444.0" font-size="11" text-anchor="middle" fill="#6b7280">6</text>
    <line x1="251.0" y1="430.0" x2="251.0" y2="58.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="282.0" y1="430.0" x2="282.0" y2="58.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <text x="282.0" y="444.0" font-size="11" text-anchor="middle" fill="#6b7280">8</text>
    <line x1="313.0" y1="430.0" x2="313.0" y2="58.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="344.0" y1="430.0" x2="344.0" y2="58.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <text x="344.0" y="444.0" font-size="11" text-anchor="middle" fill="#6b7280">10</text>
    <line x1="375.0" y1="430.0" x2="375.0" y2="58.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="406.0" y1="430.0" x2="406.0" y2="58.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <text x="406.0" y="444.0" font-size="11" text-anchor="middle" fill="#6b7280">12</text>
    <line x1="34.0" y1="430.0" x2="406.0" y2="430.0" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="34.0" y1="399.0" x2="406.0" y2="399.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="34.0" y1="368.0" x2="406.0" y2="368.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <text x="26.0" y="372.0" font-size="11" text-anchor="end" fill="#6b7280">2</text>
    <line x1="34.0" y1="337.0" x2="406.0" y2="337.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="34.0" y1="306.0" x2="406.0" y2="306.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <text x="26.0" y="310.0" font-size="11" text-anchor="end" fill="#6b7280">4</text>
    <line x1="34.0" y1="275.0" x2="406.0" y2="275.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="34.0" y1="244.0" x2="406.0" y2="244.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <text x="26.0" y="248.0" font-size="11" text-anchor="end" fill="#6b7280">6</text>
    <line x1="34.0" y1="213.0" x2="406.0" y2="213.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="34.0" y1="182.0" x2="406.0" y2="182.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <text x="26.0" y="186.0" font-size="11" text-anchor="end" fill="#6b7280">8</text>
    <line x1="34.0" y1="151.0" x2="406.0" y2="151.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="34.0" y1="120.0" x2="406.0" y2="120.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <text x="26.0" y="124.0" font-size="11" text-anchor="end" fill="#6b7280">10</text>
    <line x1="34.0" y1="89.0" x2="406.0" y2="89.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="34.0" y1="58.0" x2="406.0" y2="58.0" stroke="#eef0f3" stroke-width="0.8" stroke-linecap="round"/>
    <text x="26.0" y="62.0" font-size="11" text-anchor="end" fill="#6b7280">12</text>
    <line x1="65.0" y1="368.0" x2="251.0" y2="368.0" stroke="#111827" stroke-width="1.6" stroke-dasharray="5 3" stroke-linecap="round"/>
    <line x1="251.0" y1="368.0" x2="251.0" y2="120.0" stroke="#111827" stroke-width="1.6" stroke-dasharray="5 3" stroke-linecap="round"/>
    <polyline points="243.0,368.0 243.0,360.0 251.0,360.0" fill="none" stroke="#111827" stroke-width="1.2"/>
    <text x="158.0" y="384.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Δx = 6</text>
    <text x="279.0" y="248.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Δy = 8</text>
    <line x1="34.0" y1="409.3" x2="282.0" y2="78.7" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="34.0" y1="182.0" x2="406.0" y2="368.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    <text x="288.2" y="70.4" font-size="12" text-anchor="middle" fill="#111827"></text>
    <text x="288.0" y="76.7" font-size="12.5" text-anchor="start" fill="#2563eb" font-weight="bold">4x − 3y + 2 = 0</text>
    <text x="317.0" y="274.5" font-size="12.5" text-anchor="start" fill="#111827" font-weight="bold">x + 2y = 16</text>
    <circle cx="65.0" cy="368.0" r="4.5" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
    <text x="75.0" y="388.0" font-size="13" text-anchor="start" fill="#2563eb" font-weight="bold">A(1, 2)</text>
    <circle cx="251.0" cy="120.0" r="4.5" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
    <text x="241.0" y="118.0" font-size="13" text-anchor="end" fill="#2563eb" font-weight="bold">B(7, 10)</text>
    <circle cx="158.0" cy="244.0" r="5.0" fill="#111827" stroke="#111827" stroke-width="1"/>
    <text x="148.0" y="234.0" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">P(4, 6)</text>
    <text x="43.3" y="82.8" font-size="13" text-anchor="start" fill="#2563eb" font-weight="bold">AB = √(6² + 8²) = 10</text>
    <text x="220.0" y="460.0" font-size="12" text-anchor="middle" fill="#111827">Slope m = Δy/Δx = 8/6 = 4/3   ·   midpoint = ((1+7)/2, (2+10)/2) = (4, 6)</text>
    <text x="220.0" y="478.0" font-size="12" text-anchor="middle" fill="#6b7280">Intersection: solve the two equations together → P(4, 6)</text>
    <text x="220.0" y="494.0" font-size="12" text-anchor="middle" fill="#6b7280">(here P happens to be the midpoint of AB)</text>
  </g>
</svg>
