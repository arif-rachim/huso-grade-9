<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 382" role="img" aria-labelledby="t d">
  <title id="t">Inclusion-exclusion with three dishes</title>
  <desc id="d">Three-circle Venn diagram of 40 club members: region counts 9, 6, 5, 6, 4, 3, 3 and 4 who like none. Total who like at least one is 36.</desc>
  <rect x="0" y="0" width="440" height="382" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220" y="22" font-size="16" text-anchor="middle" font-weight="bold">Who likes which dish? (club of 40)</text>
    <rect x="30" y="34" width="380" height="296" rx="10" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <circle cx="165" cy="135" r="82" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
    <circle cx="265" cy="135" r="82" fill="#6b7280" fill-opacity="0.12" stroke="#6b7280" stroke-width="2"/>
    <circle cx="215" cy="215" r="82" fill="#111827" fill-opacity="0.12" stroke="#111827" stroke-width="2"/>
    <text x="84" y="62" font-size="13" text-anchor="middle" font-weight="bold" fill="#2563eb">Fried rice 22</text>
    <text x="350" y="62" font-size="13" text-anchor="middle" font-weight="bold" fill="#6b7280">Soto 18</text>
    <text x="300" y="300" font-size="13" text-anchor="middle" font-weight="bold">Rendang 15</text>
    <text x="139" y="125" font-size="18" text-anchor="middle" font-weight="bold">9</text>
    <text x="291" y="125" font-size="18" text-anchor="middle" font-weight="bold">6</text>
    <text x="215" y="254" font-size="18" text-anchor="middle" font-weight="bold">5</text>
    <text x="215" y="116" font-size="18" text-anchor="middle" font-weight="bold">6</text>
    <text x="170" y="193" font-size="18" text-anchor="middle" font-weight="bold">4</text>
    <text x="260" y="193" font-size="18" text-anchor="middle" font-weight="bold">3</text>
    <text x="215" y="166" font-size="18" text-anchor="middle" font-weight="bold">3</text>
    <text x="66" y="320" font-size="14" text-anchor="middle" font-weight="bold">none: 4</text>
    <text x="215" y="350" font-size="14" text-anchor="middle" font-weight="bold" fill="#2563eb">At least one = 22 + 18 + 15 − 9 − 7 − 6 + 3 = 36</text>
    <text x="215" y="370" font-size="13" text-anchor="middle" fill="#6b7280">add the singles, subtract the pairs, add the triple back</text>

  </g>
</svg>
