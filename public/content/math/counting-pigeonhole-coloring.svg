<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" role="img" aria-labeledby="t d">
  <title id="t">Pigeonhole and coloring</title>
  <desc id="d">Left: five balls in four boxes forces a box with two balls. Right: a six by six board with two opposite corners removed has 18 light and 16 dark squares, so at most 16 dominoes fit.</desc>
  <rect x="0" y="0" width="440" height="340" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220" y="24" font-size="16" text-anchor="middle" font-weight="bold">Two tricks: pigeonhole and coloring</text>
    <text x="110" y="52" font-size="14" text-anchor="middle" font-weight="bold" fill="#2563eb">Pigeonhole</text>
    <rect x="20" y="150" width="42" height="50" rx="4" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
    <text x="41" y="218" font-size="12" text-anchor="middle" fill="#6b7280">box 1</text>
    <rect x="68" y="150" width="42" height="50" rx="4" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
    <text x="89" y="218" font-size="12" text-anchor="middle" fill="#6b7280">box 2</text>
    <rect x="116" y="150" width="42" height="50" rx="4" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
    <text x="137" y="218" font-size="12" text-anchor="middle" fill="#6b7280">box 3</text>
    <rect x="164" y="150" width="42" height="50" rx="4" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
    <text x="185" y="218" font-size="12" text-anchor="middle" fill="#6b7280">box 4</text>
    <circle cx="41" cy="175" r="9" fill="#2563eb"/>
    <circle cx="85" cy="168" r="9" fill="#2563eb"/>
    <circle cx="105" cy="185" r="9" fill="#2563eb"/>
    <circle cx="137" cy="175" r="9" fill="#2563eb"/>
    <circle cx="185" cy="175" r="9" fill="#2563eb"/>
    <text x="110" y="100" font-size="14" text-anchor="middle">5 balls, 4 boxes</text>
    <text x="110" y="120" font-size="14" text-anchor="middle" font-weight="bold">→ some box has 2 or more</text>
    <text x="110" y="250" font-size="13" text-anchor="middle">n + 1 items in n boxes:</text>
    <text x="110" y="268" font-size="13" text-anchor="middle">two share a box</text>
    <text x="330" y="52" font-size="14" text-anchor="middle" font-weight="bold" fill="#2563eb">Coloring</text>
    <rect x="230" y="70" width="26" height="26" fill="#d1d5db" stroke="#6b7280"/>
    <path d="M234 74 L252 92 M252 74 L234 92" stroke="#111827" stroke-width="2"/>
    <rect x="256" y="70" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="282" y="70" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="308" y="70" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="334" y="70" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="360" y="70" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="230" y="96" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="256" y="96" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="282" y="96" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="308" y="96" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="334" y="96" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="360" y="96" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="230" y="122" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="256" y="122" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="282" y="122" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="308" y="122" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="334" y="122" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="360" y="122" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="230" y="148" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="256" y="148" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="282" y="148" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="308" y="148" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="334" y="148" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="360" y="148" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="230" y="174" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="256" y="174" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="282" y="174" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="308" y="174" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="334" y="174" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="360" y="174" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="230" y="200" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="256" y="200" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="282" y="200" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="308" y="200" width="26" height="26" fill="#2563eb" fill-opacity="0.45" stroke="#6b7280"/>
    <rect x="334" y="200" width="26" height="26" fill="#2563eb" fill-opacity="0.05" stroke="#6b7280"/>
    <rect x="360" y="200" width="26" height="26" fill="#d1d5db" stroke="#6b7280"/>
    <path d="M364 204 L382 222 M382 204 L364 222" stroke="#111827" stroke-width="2"/>
    <text x="330" y="250" font-size="13" text-anchor="middle">6×6 board, 2 corners removed:</text>
    <text x="330" y="268" font-size="13" text-anchor="middle">16 dark + 18 light squares</text>
    <text x="330" y="286" font-size="13" text-anchor="middle">A domino covers 1 dark + 1 light</text>
    <text x="220" y="324" font-size="14" text-anchor="middle" font-weight="bold" fill="#2563eb">So at most 16 dominoes fit: coloring shows the limit.</text>

  </g>
</svg>
