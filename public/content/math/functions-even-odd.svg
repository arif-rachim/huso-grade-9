<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 315" role="img" aria-labelledby="t d">
<title id="t">Even and odd functions</title>
<desc id="d">Left: the graph of y equals x squared is a mirror image across the y axis, so the function is even. Right: the graph of y equals x cubed turns onto itself after a half-turn about the origin, so the function is odd.</desc>
<rect x="0" y="0" width="440" height="315" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="110.0" y="24.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold" >Even: f(−x) = f(x)</text>
<text x="330.0" y="24.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold" >Odd: f(−x) = −f(x)</text>
