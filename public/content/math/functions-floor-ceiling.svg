<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 375" role="img" aria-labeledby="t d">
<title id="t">Floor and ceiling graphs</title>
<desc id="d">Two staircase graphs for x from minus 2 to 3. The floor staircase is solid blue with a filled dot on the left of each step. The ceiling staircase is dashed gray with a filled dot on the right of each step.</desc>
<rect x="0" y="0" width="440" height="375" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="220.0" y="22.0" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold" >Floor ⌊x⌋ and ceiling ⌈x⌉</text>
<line x1="5.6" y1="160.0" x2="330.4" y2="160.0" stroke="#111827" stroke-width="1.5" />
<line x1="140.0" y1="37.6" x2="140.0" y2="250.0" stroke="#111827" stroke-width="1.5" />
<line x1="28.0" y1="156.0" x2="28.0" y2="164.0" stroke="#111827" stroke-width="1.5" />
<text x="28.0" y="178.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >-2</text>
<line x1="84.0" y1="156.0" x2="84.0" y2="164.0" stroke="#111827" stroke-width="1.5" />
<text x="84.0" y="178.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >-1</text>
<line x1="196.0" y1="156.0" x2="196.0" y2="164.0" stroke="#111827" stroke-width="1.5" />
<text x="196.0" y="178.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >1</text>
<line x1="252.0" y1="156.0" x2="252.0" y2="164.0" stroke="#111827" stroke-width="1.5" />
<text x="252.0" y="178.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >2</text>
<line x1="308.0" y1="156.0" x2="308.0" y2="164.0" stroke="#111827" stroke-width="1.5" />
<text x="308.0" y="178.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >3</text>
<line x1="5.6" y1="232.0" x2="330.4" y2="232.0" stroke="#d1d5db" stroke-width="1" />
<text x="0.0" y="236.0" font-size="12" text-anchor="end" fill="#111827" font-weight="normal" >-2</text>
<line x1="5.6" y1="196.0" x2="330.4" y2="196.0" stroke="#d1d5db" stroke-width="1" />
<text x="0.0" y="200.0" font-size="12" text-anchor="end" fill="#111827" font-weight="normal" >-1</text>
<line x1="5.6" y1="124.0" x2="330.4" y2="124.0" stroke="#d1d5db" stroke-width="1" />
<text x="0.0" y="128.0" font-size="12" text-anchor="end" fill="#111827" font-weight="normal" >1</text>
<line x1="5.6" y1="88.0" x2="330.4" y2="88.0" stroke="#d1d5db" stroke-width="1" />
<text x="0.0" y="92.0" font-size="12" text-anchor="end" fill="#111827" font-weight="normal" >2</text>
<line x1="5.6" y1="52.0" x2="330.4" y2="52.0" stroke="#d1d5db" stroke-width="1" />
<text x="0.0" y="56.0" font-size="12" text-anchor="end" fill="#111827" font-weight="normal" >3</text>
<line x1="28.0" y1="232.0" x2="84.0" y2="232.0" stroke="#2563eb" stroke-width="3" />
<circle cx="28.0" cy="232.0" r="4.5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<circle cx="84.0" cy="232.0" r="4.5" fill="#ffffff" fill-opacity="1" stroke="#2563eb" stroke-width="2" />
<line x1="84.0" y1="196.0" x2="140.0" y2="196.0" stroke="#2563eb" stroke-width="3" />
<circle cx="84.0" cy="196.0" r="4.5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<circle cx="140.0" cy="196.0" r="4.5" fill="#ffffff" fill-opacity="1" stroke="#2563eb" stroke-width="2" />
<line x1="140.0" y1="160.0" x2="196.0" y2="160.0" stroke="#2563eb" stroke-width="3" />
<circle cx="140.0" cy="160.0" r="4.5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<circle cx="196.0" cy="160.0" r="4.5" fill="#ffffff" fill-opacity="1" stroke="#2563eb" stroke-width="2" />
<line x1="196.0" y1="124.0" x2="252.0" y2="124.0" stroke="#2563eb" stroke-width="3" />
<circle cx="196.0" cy="124.0" r="4.5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<circle cx="252.0" cy="124.0" r="4.5" fill="#ffffff" fill-opacity="1" stroke="#2563eb" stroke-width="2" />
<line x1="252.0" y1="88.0" x2="308.0" y2="88.0" stroke="#2563eb" stroke-width="3" />
<circle cx="252.0" cy="88.0" r="4.5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<circle cx="308.0" cy="88.0" r="4.5" fill="#ffffff" fill-opacity="1" stroke="#2563eb" stroke-width="2" />
<line x1="28.0" y1="196.0" x2="84.0" y2="196.0" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6 3"/>
<circle cx="28.0" cy="196.0" r="4.5" fill="#ffffff" fill-opacity="1" stroke="#6b7280" stroke-width="2" />
<circle cx="84.0" cy="196.0" r="4.5" fill="#6b7280" fill-opacity="1" stroke="none" stroke-width="1.5" />
<line x1="84.0" y1="160.0" x2="140.0" y2="160.0" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6 3"/>
<circle cx="84.0" cy="160.0" r="4.5" fill="#ffffff" fill-opacity="1" stroke="#6b7280" stroke-width="2" />
<circle cx="140.0" cy="160.0" r="4.5" fill="#6b7280" fill-opacity="1" stroke="none" stroke-width="1.5" />
<line x1="140.0" y1="124.0" x2="196.0" y2="124.0" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6 3"/>
<circle cx="140.0" cy="124.0" r="4.5" fill="#ffffff" fill-opacity="1" stroke="#6b7280" stroke-width="2" />
<circle cx="196.0" cy="124.0" r="4.5" fill="#6b7280" fill-opacity="1" stroke="none" stroke-width="1.5" />
<line x1="196.0" y1="88.0" x2="252.0" y2="88.0" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6 3"/>
<circle cx="196.0" cy="88.0" r="4.5" fill="#ffffff" fill-opacity="1" stroke="#6b7280" stroke-width="2" />
<circle cx="252.0" cy="88.0" r="4.5" fill="#6b7280" fill-opacity="1" stroke="none" stroke-width="1.5" />
<line x1="252.0" y1="52.0" x2="308.0" y2="52.0" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6 3"/>
<circle cx="252.0" cy="52.0" r="4.5" fill="#ffffff" fill-opacity="1" stroke="#6b7280" stroke-width="2" />
<circle cx="308.0" cy="52.0" r="4.5" fill="#6b7280" fill-opacity="1" stroke="none" stroke-width="1.5" />
<line x1="30.0" y1="282.0" x2="60.0" y2="282.0" stroke="#2563eb" stroke-width="3" />
<text x="66.0" y="286.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal" >⌊x⌋ floor (round down)</text>
<line x1="230.0" y1="282.0" x2="260.0" y2="282.0" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6 3"/>
<text x="266.0" y="286.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal" >⌈x⌉ ceiling (round up)</text>
<text x="30.0" y="314.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal" >⌊2.3⌋ = 2   ⌈2.3⌉ = 3</text>
<text x="230.0" y="314.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal" >⌊−2.3⌋ = −3   ⌈−2.3⌉ = −2</text>
<text x="30.0" y="336.0" font-size="12" text-anchor="start" fill="#2563eb" font-weight="bold" >Whole numbers: ⌊x⌋ = ⌈x⌉ = x</text>
<text x="230.0" y="336.0" font-size="12" text-anchor="start" fill="#2563eb" font-weight="bold" >Otherwise: ⌈x⌉ = ⌊x⌋ + 1</text>
<text x="220.0" y="362.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >● filled dot = value included, ○ open dot = not included</text>
</g>
</svg>
