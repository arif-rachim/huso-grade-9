<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 410" role="img" aria-labelledby="t d">
<title id="t">Injective, surjective and bijective</title>
<desc id="d">Four mapping pictures between students A, B, C and chairs: injective only, surjective only, bijective, and an example that is not a function because one student has two chairs.</desc>
<rect x="0" y="0" width="440" height="410" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<text x="220.0" y="24.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold" >Function = every student gets exactly ONE chair</text>
<text x="105.0" y="50.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold" >Injective only</text>
<text x="105.0" y="66.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >no shared chair</text>
<rect x="28" y="84" width="44" height="100" rx="22" fill="#d1d5db" fill-opacity="0.5" stroke="#6b7280"/>
<rect x="138" y="84" width="44" height="100" rx="22" fill="#d1d5db" fill-opacity="0.5" stroke="#6b7280"/>
<circle cx="50.0" cy="104.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="16.0" y="108.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >A</text>
<circle cx="50.0" cy="134.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="16.0" y="138.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >B</text>
<circle cx="160.0" cy="104.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="194.0" y="108.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >1</text>
<circle cx="160.0" cy="134.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="194.0" y="138.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >2</text>
<circle cx="160.0" cy="164.0" r="5" fill="#ffffff" fill-opacity="1" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2 2"/>
<text x="194.0" y="168.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >3</text>
<line x1="57" y1="104" x2="151" y2="104" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="57" y1="134" x2="151" y2="134" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="105.0" y="204.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >chair 3 is empty</text>
<text x="325.0" y="50.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold" >Surjective only</text>
<text x="325.0" y="66.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >no empty chair</text>
<rect x="248" y="84" width="44" height="100" rx="22" fill="#d1d5db" fill-opacity="0.5" stroke="#6b7280"/>
<rect x="358" y="84" width="44" height="100" rx="22" fill="#d1d5db" fill-opacity="0.5" stroke="#6b7280"/>
<circle cx="270.0" cy="104.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="236.0" y="108.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >A</text>
<circle cx="270.0" cy="134.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="236.0" y="138.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >B</text>
<circle cx="270.0" cy="164.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="236.0" y="168.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >C</text>
<circle cx="380.0" cy="104.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="414.0" y="108.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >1</text>
<circle cx="380.0" cy="134.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="414.0" y="138.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >2</text>
<line x1="277" y1="104" x2="371" y2="104" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="277" y1="134" x2="371" y2="104" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="277" y1="164" x2="371" y2="134" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="325.0" y="204.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >A and B share chair 1</text>
<text x="105.0" y="245.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold" >Bijective = both</text>
<text x="105.0" y="261.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >one student per chair</text>
<rect x="28" y="279" width="44" height="100" rx="22" fill="#d1d5db" fill-opacity="0.5" stroke="#6b7280"/>
<rect x="138" y="279" width="44" height="100" rx="22" fill="#d1d5db" fill-opacity="0.5" stroke="#6b7280"/>
<circle cx="50.0" cy="299.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="16.0" y="303.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >A</text>
<circle cx="50.0" cy="329.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="16.0" y="333.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >B</text>
<circle cx="50.0" cy="359.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="16.0" y="363.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >C</text>
<circle cx="160.0" cy="299.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="194.0" y="303.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >1</text>
<circle cx="160.0" cy="329.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="194.0" y="333.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >2</text>
<circle cx="160.0" cy="359.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="194.0" y="363.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >3</text>
<line x1="57" y1="299" x2="151" y2="329" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="57" y1="329" x2="151" y2="359" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="57" y1="359" x2="151" y2="299" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="105.0" y="399.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >perfect match, can be undone</text>
<text x="325.0" y="245.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold" >NOT a function</text>
<text x="325.0" y="261.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >A has two chairs</text>
<rect x="248" y="279" width="44" height="70" rx="22" fill="#d1d5db" fill-opacity="0.5" stroke="#6b7280"/>
<rect x="358" y="279" width="44" height="70" rx="22" fill="#d1d5db" fill-opacity="0.5" stroke="#6b7280"/>
<circle cx="270.0" cy="299.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="236.0" y="303.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >A</text>
<circle cx="270.0" cy="329.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="236.0" y="333.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >B</text>
<circle cx="380.0" cy="299.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="414.0" y="303.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >1</text>
<circle cx="380.0" cy="329.0" r="5" fill="#2563eb" fill-opacity="1" stroke="none" stroke-width="1.5" />
<text x="414.0" y="333.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >2</text>
<line x1="277" y1="299" x2="371" y2="299" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="277" y1="299" x2="371" y2="329" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<line x1="277" y1="329" x2="371" y2="329" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="325.0" y="369.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >one student, two chairs</text>
</g>
