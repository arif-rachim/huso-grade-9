<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 310" role="img" aria-labeledby="t d">
<title id="t">Triangle inequality with skewers</title>
<desc id="d">A number line from 0 to 10. With sticks of 3 and 5, a third side x makes a triangle only when 2 is less than x and x is less than 8. Pictures show x = 1 and x = 9 leaving a gap and x = 4 forming a triangle.</desc>
<rect x="0" y="0" width="440" height="310" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="220.0" y="26.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold" >Two skewers: 3 cm and 5 cm. Which third skewer x works?</text>
<line x1="40.0" y1="80.0" x2="400.0" y2="80.0" stroke="#111827" stroke-width="2" />
<line x1="40.0" y1="75.0" x2="40.0" y2="85.0" stroke="#111827" stroke-width="1.5" />
<text x="40.0" y="102.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >0</text>
<line x1="76.0" y1="75.0" x2="76.0" y2="85.0" stroke="#111827" stroke-width="1.5" />
<text x="76.0" y="102.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >1</text>
<line x1="112.0" y1="75.0" x2="112.0" y2="85.0" stroke="#111827" stroke-width="1.5" />
<text x="112.0" y="102.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >2</text>
<line x1="148.0" y1="75.0" x2="148.0" y2="85.0" stroke="#111827" stroke-width="1.5" />
<text x="148.0" y="102.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >3</text>
<line x1="184.0" y1="75.0" x2="184.0" y2="85.0" stroke="#111827" stroke-width="1.5" />
<text x="184.0" y="102.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >4</text>
<line x1="220.0" y1="75.0" x2="220.0" y2="85.0" stroke="#111827" stroke-width="1.5" />
<text x="220.0" y="102.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >5</text>
<line x1="256.0" y1="75.0" x2="256.0" y2="85.0" stroke="#111827" stroke-width="1.5" />
<text x="256.0" y="102.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >6</text>
<line x1="292.0" y1="75.0" x2="292.0" y2="85.0" stroke="#111827" stroke-width="1.5" />
<text x="292.0" y="102.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >7</text>
<line x1="328.0" y1="75.0" x2="328.0" y2="85.0" stroke="#111827" stroke-width="1.5" />
<text x="328.0" y="102.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >8</text>
<line x1="364.0" y1="75.0" x2="364.0" y2="85.0" stroke="#111827" stroke-width="1.5" />
<text x="364.0" y="102.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >9</text>
<line x1="400.0" y1="75.0" x2="400.0" y2="85.0" stroke="#111827" stroke-width="1.5" />
<text x="400.0" y="102.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >10</text>
<rect x="112.0" y="66.0" width="216.0" height="28.0" fill="#2563eb" fill-opacity="0.25" stroke="none" stroke-width="1.5" />
<line x1="40.0" y1="80.0" x2="112.0" y2="80.0" stroke="#6b7280" stroke-width="5" />
<line x1="328.0" y1="80.0" x2="400.0" y2="80.0" stroke="#6b7280" stroke-width="5" />
<circle cx="112.0" cy="80.0" r="6" fill="#ffffff" fill-opacity="1" stroke="#2563eb" stroke-width="2.5" />
<circle cx="328.0" cy="80.0" r="6" fill="#ffffff" fill-opacity="1" stroke="#2563eb" stroke-width="2.5" />
<text x="220.0" y="58.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold" >works: 2 &lt; x &lt; 8</text>
<text x="76.0" y="58.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >too short</text>
<text x="364.0" y="58.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >too long</text>
<text x="220.0" y="128.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="normal" >|a − b| &lt; x &lt; a + b   (here |3 − 5| = 2 and 3 + 5 = 8)</text>
<line x1="30.0" y1="260.0" x2="110.0" y2="260.0" stroke="#111827" stroke-width="3" />
<line x1="30.0" y1="252.0" x2="78.0" y2="252.0" stroke="#2563eb" stroke-width="4" />
<line x1="110.0" y1="252.0" x2="94.0" y2="252.0" stroke="#2563eb" stroke-width="4" />
<text x="70.0" y="278.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >x = 1</text>
<text x="70.0" y="296.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >3 + 1 &lt; 5: gap</text>
<polygon points="150.0,260.0 214.0,260.0 150.0,212.0" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="2"/>
<text x="182.0" y="278.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >x = 4</text>
<text x="182.0" y="296.0" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold" >fits: a triangle!</text>
<line x1="250.0" y1="260.0" x2="394.0" y2="260.0" stroke="#111827" stroke-width="3" />
<line x1="250.0" y1="252.0" x2="298.0" y2="252.0" stroke="#2563eb" stroke-width="4" />
<line x1="394.0" y1="252.0" x2="314.0" y2="252.0" stroke="#2563eb" stroke-width="4" />
<text x="322.0" y="278.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >x = 9</text>
<text x="322.0" y="296.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >3 + 5 &lt; 9: gap</text>
<text x="220.0" y="190.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >Sticks laid flat along the longest side must overlap, or no triangle.</text>
</g>
</svg>
