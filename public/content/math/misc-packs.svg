<text x="220.0" y="262.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >Blue = can be made with 4a + 7b (a, b ≥ 0).  Gray = impossible.</text>
<text x="220.0" y="284.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >Impossible totals: 1, 2, 3, 5, 6, 9, 10, 13 and 17.</text>
<text x="220.0" y="310.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold" >After 4 in a row (18, 19, 20, 21), add 4 to keep going forever.</text>
<text x="220.0" y="330.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold" >The largest impossible total is 17 = 4 × 7 − 4 − 7.</text>
