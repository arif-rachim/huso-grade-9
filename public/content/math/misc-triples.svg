<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 345" role="img" aria-labeledby="t d">
<title id="t">Pythagorean triples</title>
<desc id="d">A right triangle with sides 3, 4 and 5 and squares on each side with areas 9, 16 and 25. A table lists common triples such as 5-12-13, 8-15-17 and 7-24-25 and the formula m squared minus n squared, 2mn, m squared plus n squared.</desc>
<rect x="0" y="0" width="440" height="345" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="220.0" y="24.0" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold" >Pythagorean triples: a² + b² = c²</text>
<polygon points="70.0,260.0 126.0,260.0 126.0,316.0 70.0,316.0" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="1.5"/>
<polygon points="70.0,260.0 70.0,218.0 28.0,218.0 28.0,260.0" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="1.5"/>
<polygon points="126.0,260.0 70.0,218.0 112.0,162.0 168.0,204.0" fill="#2563eb" fill-opacity="0.4" stroke="#2563eb" stroke-width="1.5"/>
<polygon points="70.0,260.0 126.0,260.0 70.0,218.0" fill="#ffffff" fill-opacity="1" stroke="#111827" stroke-width="1.5"/>
<text x="98.0" y="293.0" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold" >16</text>
<text x="49.0" y="244.0" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold" >9</text>
<text x="119.0" y="216.0" font-size="18" text-anchor="middle" fill="#111827" font-weight="bold" >25</text>
<text x="98.0" y="252.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal" >4</text>
<text x="76.0" y="239.0" font-size="13" text-anchor="start" fill="#6b7280" font-weight="normal" >3</text>
<text x="70.0" y="330.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold" >9 + 16 = 25  →  3, 4, 5</text>
<rect x="235.0" y="50.0" width="195.0" height="270.0" fill="#ffffff" fill-opacity="1" stroke="#d1d5db" stroke-width="1.5" />
<text x="332.0" y="72.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >Common triples (a, b, c)</text>
<text x="332.0" y="96.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" >3, 4, 5</text>
<text x="332.0" y="118.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" >5, 12, 13</text>
<text x="332.0" y="140.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" >8, 15, 17</text>
<text x="332.0" y="162.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" >7, 24, 25</text>
<text x="332.0" y="184.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="normal" >20, 21, 29</text>
<text x="332.0" y="206.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="normal" >9, 40, 41</text>
<text x="332.0" y="240.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >Multiples work too: 6, 8, 10</text>
<text x="332.0" y="258.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >and 9, 12, 15 and 12, 16, 20</text>
<text x="332.0" y="282.0" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold" >Recipe (m > n):</text>
<text x="332.0" y="298.0" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold" >m² − n²,  2mn,  m² + n²</text>
<text x="332.0" y="314.0" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="normal" >m = 2, n = 1 gives 3, 4, 5</text>
</g>
</svg>
