<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 370" role="img" aria-labeledby="t d">
<title id="t">Prime factorization of 360</title>
<desc id="d">A factor tree splits 360 into the primes 2, 2, 2, 3, 3 and 5, so 360 equals 2 cubed times 3 squared times 5. Adding 1 to each exponent and multiplying gives 4 times 3 times 2, which is 24 divisors.</desc>
<rect x="0" y="0" width="440" height="370" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="220.0" y="24.0" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold" >Factor tree of 360</text>
<rect x="50.0" y="52.0" width="60.0" height="34.0" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5" />
<text x="80.0" y="75.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" >360</text>
<line x1="110.0" y1="70.0" x2="150.0" y2="70.0" stroke="#6b7280" stroke-width="1.5" />
<circle cx="165.0" cy="70.0" r="17" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="2" />
<text x="165.0" y="75.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" >2</text>
<line x1="80.0" y1="86.0" x2="80.0" y2="102.0" stroke="#6b7280" stroke-width="1.5" />
<rect x="50.0" y="102.0" width="60.0" height="34.0" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5" />
<text x="80.0" y="125.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" >180</text>
<line x1="110.0" y1="120.0" x2="150.0" y2="120.0" stroke="#6b7280" stroke-width="1.5" />
<circle cx="165.0" cy="120.0" r="17" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="2" />
<text x="165.0" y="125.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" >2</text>
<line x1="80.0" y1="136.0" x2="80.0" y2="152.0" stroke="#6b7280" stroke-width="1.5" />
<rect x="50.0" y="152.0" width="60.0" height="34.0" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5" />
<text x="80.0" y="175.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" >90</text>
<line x1="110.0" y1="170.0" x2="150.0" y2="170.0" stroke="#6b7280" stroke-width="1.5" />
<circle cx="165.0" cy="170.0" r="17" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="2" />
<text x="165.0" y="175.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" >2</text>
<line x1="80.0" y1="186.0" x2="80.0" y2="202.0" stroke="#6b7280" stroke-width="1.5" />
<rect x="50.0" y="202.0" width="60.0" height="34.0" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5" />
<text x="80.0" y="225.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" >45</text>
<line x1="110.0" y1="220.0" x2="150.0" y2="220.0" stroke="#6b7280" stroke-width="1.5" />
<circle cx="165.0" cy="220.0" r="17" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="2" />
<text x="165.0" y="225.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" >3</text>
<line x1="80.0" y1="236.0" x2="80.0" y2="252.0" stroke="#6b7280" stroke-width="1.5" />
<rect x="50.0" y="252.0" width="60.0" height="34.0" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5" />
<text x="80.0" y="275.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" >15</text>
<line x1="110.0" y1="270.0" x2="150.0" y2="270.0" stroke="#6b7280" stroke-width="1.5" />
<circle cx="165.0" cy="270.0" r="17" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="2" />
<text x="165.0" y="275.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" >3</text>
<line x1="80.0" y1="286.0" x2="80.0" y2="302.0" stroke="#6b7280" stroke-width="1.5" />
<circle cx="80.0" cy="320.0" r="17" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="2" />
<text x="80.0" y="325.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" >5</text>
<text x="165.0" y="350.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >The circled primes: 2, 2, 2, 3, 3, 5</text>
<rect x="235.0" y="60.0" width="190.0" height="250.0" fill="#ffffff" fill-opacity="1" stroke="#d1d5db" stroke-width="1.5" />
<text x="330.0" y="86.0" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold" >360 = 2³ × 3² × 5</text>
<text x="330.0" y="116.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >How many divisors?</text>
<text x="330.0" y="138.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="normal" >Add 1 to each exponent,</text>
<text x="330.0" y="156.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="normal" >then multiply:</text>
<rect x="238.0" y="172.0" width="52.0" height="40.0" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5" />
<text x="264.0" y="190.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >2³</text>
<text x="264.0" y="206.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >3+1 = 4</text>
<rect x="300.0" y="172.0" width="52.0" height="40.0" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5" />
<text x="326.0" y="190.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >3²</text>
<text x="326.0" y="206.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >2+1 = 3</text>
<rect x="362.0" y="172.0" width="52.0" height="40.0" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5" />
<text x="388.0" y="190.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >5¹</text>
<text x="388.0" y="206.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >1+1 = 2</text>
<text x="330.0" y="242.0" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold" >4 × 3 × 2 = 24 divisors</text>
<text x="330.0" y="270.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >Perfect square? All exponents</text>
<text x="330.0" y="288.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >must be even.</text>
</g>
</svg>
