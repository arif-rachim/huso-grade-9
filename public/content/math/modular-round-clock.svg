<title id="t">Rounds around a 24-spot clock</title>
<desc id="d">Twenty-four numbered circles around a clock face. Rounds 1 to 12 are blue (side A) and 13 to 24 are gray (side B). An arrow shows that round 100 lands on spot 4 because 100 leaves remainder 4 when divided by 24.</desc>
