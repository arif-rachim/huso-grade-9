<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<line x1="220" y1="190" x2="299.7" y2="144.0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#m)"/>
<rect x="158.0" y="160.0" width="124.0" height="60.0" fill="#ffffff" fill-opacity="0.9" stroke="none" stroke-width="1.5" />
<text x="220.0" y="182.0" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold" >Rounds 1–12: side A</text>
<text x="220.0" y="200.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="bold" >Rounds 13–24: side B</text>
<text x="220.0" y="218.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >then start over</text>
<text x="220.0" y="335.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="normal" >Round 100: 100 = 4 × 24 + 4, so it lands on spot 4 (side A)</text>
<text x="220.0" y="356.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold" >100 ≡ 4 (mod 24).  Remainder 0 means spot 24, not spot 0!</text>
</g>
</svg>
