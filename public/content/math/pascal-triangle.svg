    <text x="22" y="61" font-size="12" fill="#6b7280" text-anchor="middle">n=0</text>
    <circle cx="220" cy="56" r="19" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
