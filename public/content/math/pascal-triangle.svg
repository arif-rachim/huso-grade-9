    <circle cx="194" cy="256" r="19" fill="#2563eb" fill-opacity="0.28" stroke="#2563eb" stroke-width="1.5"/>
    <text x="194" y="261" font-size="14" text-anchor="middle" font-weight="bold">10</text>
