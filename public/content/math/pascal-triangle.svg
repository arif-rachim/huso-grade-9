    <circle cx="324" cy="296" r="19" fill="#2563eb" fill-opacity="0.28" stroke="#2563eb" stroke-width="1.5"/>
    <text x="324" y="301" font-size="14" text-anchor="middle" font-weight="bold">6</text>
    <circle cx="376" cy="296" r="19" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
    <text x="376" y="301" font-size="14" text-anchor="middle" font-weight="bold">1</text>
    <text x="220" y="342" font-size="13" text-anchor="middle" fill="#6b7280">Example: (a + b)⁴ = 1a⁴ + 4a³b + 6a²b² + 4ab³ + 1b⁴ (row n=4)</text>
