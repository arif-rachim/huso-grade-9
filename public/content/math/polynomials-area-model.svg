<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-labelledby="t d">
  <title id="t">Pool area model: (x + 5)(x + 2)</title>
  <desc id="d">A rectangle split into four tiles: x squared, 5x, 2x and 10. Together they make x squared plus 7x plus 10.</desc>
  <rect x="0" y="0" width="440" height="330" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220" y="26" font-size="16" font-weight="bold" text-anchor="middle">Swimming pool: length (x + 5), width (x + 2)</text>
    <!-- dimension labels -->
    <text x="140" y="56" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">x</text>
    <text x="300" y="56" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">5</text>
    <text x="52" y="140" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">x</text>
    <text x="52" y="248" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">2</text>
    <!-- blocks -->
    <rect x="70" y="66" width="140" height="140" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="2"/>
    <rect x="210" y="66" width="180" height="140" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="2"/>
    <rect x="70" y="206" width="140" height="56" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="2"/>
    <rect x="210" y="206" width="180" height="56" fill="#d1d5db" fill-opacity="0.6" stroke="#6b7280" stroke-width="2"/>
    <text x="140" y="144" font-size="22" text-anchor="middle" font-weight="bold">x²</text>
    <text x="300" y="144" font-size="22" text-anchor="middle" font-weight="bold">5x</text>
    <text x="140" y="241" font-size="20" text-anchor="middle" font-weight="bold">2x</text>
    <text x="300" y="241" font-size="20" text-anchor="middle" font-weight="bold">10</text>
    <text x="220" y="296" font-size="16" text-anchor="middle">(x + 5)(x + 2) = x² + 5x + 2x + 10 = <tspan font-weight="bold" fill="#2563eb">x² + 7x + 10</tspan></text>
    <text x="220" y="318" font-size="13" text-anchor="middle" fill="#6b7280">Factoring = finding the sides of the rectangle from its area</text>
  </g>
</svg>
