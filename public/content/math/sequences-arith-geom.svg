<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-labelledby="t d">
<title id="t">Arithmetic and geometric sequences</title>
<desc id="d">Left: the staircase 3,5,7,9,11 and its reversed copy form a 5 by 14 rectangle, so the sum is 35. Right: bars 1,2,4,8,16 add up to 31, which is 32 minus 1.</desc>
<rect x="0" y="0" width="440" height="330" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="110.0" y="26.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold" >Arithmetic sequence (d = 2)</text>
<text x="330.0" y="26.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold" >Geometric sequence (r = 2)</text>
<rect x="25.0" y="214.0" width="30.0" height="36.0" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5" />
<rect x="25.0" y="82.0" width="30.0" height="132.0" fill="#d1d5db" fill-opacity="0.6" stroke="#6b7280" stroke-width="1.5" />
<text x="40.0" y="237.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >3</text>
<text x="40.0" y="153.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal" >11</text>
<rect x="59.0" y="190.0" width="30.0" height="60.0" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5" />
<rect x="59.0" y="82.0" width="30.0" height="108.0" fill="#d1d5db" fill-opacity="0.6" stroke="#6b7280" stroke-width="1.5" />
<text x="74.0" y="225.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >5</text>
<text x="74.0" y="141.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal" >9</text>
<rect x="93.0" y="166.0" width="30.0" height="84.0" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5" />
<rect x="93.0" y="82.0" width="30.0" height="84.0" fill="#d1d5db" fill-opacity="0.6" stroke="#6b7280" stroke-width="1.5" />
<text x="108.0" y="213.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >7</text>
<text x="108.0" y="129.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal" >7</text>
<rect x="127.0" y="142.0" width="30.0" height="108.0" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5" />
<rect x="127.0" y="82.0" width="30.0" height="60.0" fill="#d1d5db" fill-opacity="0.6" stroke="#6b7280" stroke-width="1.5" />
<text x="142.0" y="201.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >9</text>
<text x="142.0" y="117.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal" >5</text>
<rect x="161.0" y="118.0" width="30.0" height="132.0" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5" />
<rect x="161.0" y="82.0" width="30.0" height="36.0" fill="#d1d5db" fill-opacity="0.6" stroke="#6b7280" stroke-width="1.5" />
<text x="176.0" y="189.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >11</text>
<text x="176.0" y="105.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal" >3</text>
<text x="110.0" y="272.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >Stack a reversed copy (gray) on top (blue):</text>
<text x="110.0" y="290.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >5 columns × 14 = 70, take half</text>
<text x="110.0" y="310.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold" >S = 5 × (3 + 11) ÷ 2 = 35</text>
<rect x="250.0" y="242.5" width="32.0" height="7.5" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5" />
<text x="266.0" y="236.5" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >1</text>
<rect x="288.0" y="235.0" width="32.0" height="15.0" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5" />
<text x="304.0" y="229.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >2</text>
<rect x="326.0" y="220.0" width="32.0" height="30.0" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5" />
<text x="342.0" y="214.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >4</text>
<rect x="364.0" y="190.0" width="32.0" height="60.0" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5" />
<text x="380.0" y="184.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >8</text>
<rect x="402.0" y="130.0" width="32.0" height="120.0" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5" />
<text x="418.0" y="124.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" >16</text>
<line x1="246.0" y1="250.0" x2="440.0" y2="250.0" stroke="#6b7280" stroke-width="1.5" />
<text x="330.0" y="272.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal" >1 + 2 + 4 + 8 + 16 = 31 = 32 − 1</text>
<text x="330.0" y="290.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >(next term is 32, minus 1)</text>
<text x="330.0" y="310.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold" >S = a(rⁿ − 1) ÷ (r − 1)</text>
<line x1="220.0" y1="42.0" x2="220.0" y2="318.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
</g>
</svg>
