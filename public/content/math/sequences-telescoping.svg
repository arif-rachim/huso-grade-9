<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labeledby="t d">
<title id="t">Telescoping series</title>
<desc id="d">Nine boxes holding 1/k minus 1/(k+1). The negative part of each box cancels the positive part of the next box, leaving 1 minus 1/10, which is 9/10.</desc>
<rect x="0" y="0" width="440" height="300" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111827">
<text x="220.0" y="28.0" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold" >Telescoping: 1/(k(k+1)) = 1/k − 1/(k+1)</text>
<text x="220.0" y="50.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal" >Add up k = 1 to 9</text>
<rect x="15.0" y="70.0" width="70.0" height="86.0" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="1.5" />
<text x="50.0" y="88.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >k=1</text>
<text x="50.0" y="118.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold" >+ 1/1</text>
<text x="50.0" y="144.0" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="bold" >− 1/2</text>
<rect x="120.0" y="70.0" width="70.0" height="86.0" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="1.5" />
<text x="155.0" y="88.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >k=2</text>
<text x="155.0" y="118.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold" >+ 1/2</text>
<text x="155.0" y="144.0" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="bold" >− 1/3</text>
<rect x="225.0" y="70.0" width="70.0" height="86.0" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="1.5" />
<text x="260.0" y="88.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >k=3</text>
<text x="260.0" y="118.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold" >+ 1/3</text>
<text x="260.0" y="144.0" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="bold" >− 1/4</text>
<rect x="355.0" y="70.0" width="70.0" height="86.0" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="1.5" />
<text x="390.0" y="88.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal" >k=9</text>
<text x="390.0" y="118.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold" >+ 1/9</text>
<text x="390.0" y="144.0" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="bold" >− 1/10</text>
<text x="312.0" y="118.0" font-size="22" text-anchor="middle" fill="#111827" font-weight="normal" >⋯</text>
<path d="M 85 141 L 120 115" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
<text x="103.0" y="106.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="bold" >0</text>
<path d="M 190 141 L 225 115" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
<text x="208.0" y="106.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="bold" >0</text>
<path d="M 295 141 L 330 115" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
<text x="313.0" y="106.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="bold" >0</text>
<text x="220.0" y="184.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="normal" >Each − cancels the + in the next box</text>
<rect x="15.0" y="205.0" width="80.0" height="34.0" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5" />
<text x="55.0" y="227.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" >+ 1/1</text>
<text x="110.0" y="227.0" font-size="18" text-anchor="middle" fill="#111827" font-weight="normal" >+</text>
<rect x="125.0" y="205.0" width="100.0" height="34.0" fill="#d1d5db" fill-opacity="0.6" stroke="#6b7280" stroke-width="1.5" />
<text x="175.0" y="227.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" >− 1/10</text>
<text x="240.0" y="227.0" font-size="16" text-anchor="start" fill="#2563eb" font-weight="bold" >= 1 − 1/10 = 9/10</text>
<text x="220.0" y="270.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="normal" >Only the FIRST and the LAST piece survive.</text>
<text x="220.0" y="292.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal" >Rule: sum of n terms = 1 − 1/(n + 1) = n/(n + 1)</text>
</g>
</svg>
