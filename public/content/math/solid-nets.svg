<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" role="img" aria-labelledby="t d">
  <title id="t">Nets of a cone and a cylinder</title>
  <desc id="d">Cone with r 3, h 4, slant height 5 unrolls into a sector of radius 5 and angle 216 degrees plus a circle of radius 3. A cylinder with r 2 and h 4 unrolls into a 4 pi by 4 rectangle plus two circles.</desc>
  <rect x="0" y="0" width="440" height="520" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Unfold it: nets show the surface area</text>
    <rect x="8.0" y="40.0" width="424.0" height="236.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <rect x="8.0" y="288.0" width="424.0" height="226.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="220.0" y="60.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">Cone  (r = 3, h = 4, so l = 5)</text>
    <path d="M70,100 L25,160 A45,10 0 0 0 115,160 Z" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2"/>
    <line x1="70.0" y1="100.0" x2="70.0" y2="160.0" stroke="#111827" stroke-width="1.2" stroke-dasharray="3 2" stroke-linecap="round"/>
    <text x="76.0" y="134.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">h = 4</text>
    <line x1="70.0" y1="160.0" x2="115.0" y2="160.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
    <text x="92.5" y="176.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">r = 3</text>
    <text x="23.5" y="130.0" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">l = 5</text>
    <text x="70.0" y="206.0" font-size="12" text-anchor="middle" fill="#6b7280">3D cone</text>
    <path d="M225,112 L153.7,88.8 A75,75 0 1 0 296.3,88.8 Z" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2"/>
    <text x="183.3" y="116.4" font-size="12" text-anchor="end" fill="#2563eb" font-weight="bold">radius l = 5</text>
    <text x="225.0" y="203.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">arc = 2πr = 6π</text>
    <text x="225.0" y="136.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">216°</text>
    <circle cx="372.0" cy="160.0" r="45.0" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="2"/>
    <text x="372.0" y="164.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">base: r = 3</text>
    <text x="220.0" y="236.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">Lateral part = sector: area = πrl = 15π · base circle = πr² = 9π</text>
    <text x="220.0" y="254.0" font-size="12.5" text-anchor="middle" fill="#111827">SA = πr² + πrl = 9π + 15π = 24π   (sector angle = 360° · r/l)</text>
    <text x="220.0" y="270.0" font-size="12" text-anchor="middle" fill="#111827"></text>
    <text x="220.0" y="306.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">Cylinder  (r = 2, h = 4)</text>
    <rect x="60.0" y="372.0" width="175.9" height="56.0" rx="0" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2"/>
    <circle cx="110.0" cy="344.0" r="28.0" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="2"/>
    <circle cx="110.0" cy="456.0" r="28.0" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="2"/>
    <text x="148.0" y="404.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">side: 2πr × h = 4π × 4</text>
    <text x="243.9" y="404.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">h</text>
    <text x="110.0" y="348.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">r = 2</text>
    <text x="110.0" y="460.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">r = 2</text>
    <text x="148.0" y="436.0" font-size="12" text-anchor="middle" fill="#111827"></text>
    <text x="262.0" y="364.0" font-size="12.5" text-anchor="start" fill="#111827">2 circles: 2·πr² = 8π</text>
    <text x="262.0" y="442.0" font-size="12.5" text-anchor="start" fill="#111827">side: 2πrh = 16π</text>
    <text x="220.0" y="504.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">SA = 2πr² + 2πrh = 8π + 16π = 24π</text>
  </g>
</svg>
