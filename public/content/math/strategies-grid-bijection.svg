<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 352" role="img" aria-labelledby="t d">
  <title id="t">Bijection between grid paths and letter strings</title>
  <desc id="d">A path across a 4 by 3 grid corresponds to a string of four R and three U letters. There are C(7,3)=35 of them.</desc>
  <rect x="0" y="0" width="440" height="352" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220" y="24" font-size="16" text-anchor="middle" font-weight="bold">Grid path ↔ string of R and U</text>
    <line x1="70" y1="66" x2="70" y2="222" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="122" y1="66" x2="122" y2="222" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="174" y1="66" x2="174" y2="222" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="226" y1="66" x2="226" y2="222" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="278" y1="66" x2="278" y2="222" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="70" y1="66" x2="278" y2="66" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="70" y1="118" x2="278" y2="118" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="70" y1="170" x2="278" y2="170" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="70" y1="222" x2="278" y2="222" stroke="#d1d5db" stroke-width="1.5"/>
    <path d="M70 222 L122 222 L174 222 L174 170 L226 170 L226 118 L226 66 L278 66" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="70" cy="222" r="7" fill="#111827"/><circle cx="278" cy="66" r="7" fill="#111827"/>
    <text x="66" y="244" font-size="13" text-anchor="middle" font-weight="bold">Start</text>
    <text x="278" y="58" font-size="13" text-anchor="middle" font-weight="bold">Finish</text>
    <text x="220" y="264" font-size="16" text-anchor="middle" font-weight="bold" fill="#2563eb">This path = R R U R U U R</text>
    <text x="220" y="288" font-size="14" text-anchor="middle">Every path = 4 R's and 3 U's in some order</text>
    <text x="220" y="310" font-size="14" text-anchor="middle">Count the strings: choose 3 of the 7 spots for U</text>
    <text x="220" y="340" font-size="18" text-anchor="middle" font-weight="bold" fill="#2563eb">C(7, 3) = 35 paths</text>

  </g>
</svg>
