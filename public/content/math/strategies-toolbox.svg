<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" role="img" aria-labelledby="t d">
  <title id="t">Five counting strategies</title>
  <desc id="d">A list of five tools: casework, constructive counting, complementary counting, bijection and symmetry, each with a one-line hint.</desc>
  <rect x="0" y="0" width="440" height="340" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220" y="24" font-size="16" text-anchor="middle" font-weight="bold">Five counting tools: which one fits?</text>
    <rect x="20" y="42" width="400" height="50" rx="10" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="48" cy="67" r="16" fill="#2563eb"/>
    <text x="48" y="73" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text>
    <text x="76" y="64" font-size="15" text-anchor="start" font-weight="bold" fill="#2563eb">Casework</text>
    <text x="76" y="82" font-size="12" text-anchor="start">Split into cases that don't overlap → then add</text>
    <rect x="20" y="100" width="400" height="50" rx="10" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="48" cy="125" r="16" fill="#2563eb"/>
    <text x="48" y="131" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text>
    <text x="76" y="122" font-size="15" text-anchor="start" font-weight="bold" fill="#2563eb">Constructive</text>
    <text x="76" y="140" font-size="12" text-anchor="start">Build it step by step → then multiply</text>
    <rect x="20" y="158" width="400" height="50" rx="10" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="48" cy="183" r="16" fill="#2563eb"/>
    <text x="48" y="189" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text>
    <text x="76" y="180" font-size="15" text-anchor="start" font-weight="bold" fill="#2563eb">Complement</text>
    <text x="76" y="198" font-size="12" text-anchor="start">Total − bad → great for "at least one"</text>
    <rect x="20" y="216" width="400" height="50" rx="10" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="48" cy="241" r="16" fill="#2563eb"/>
    <text x="48" y="247" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text>
    <text x="76" y="238" font-size="15" text-anchor="start" font-weight="bold" fill="#2563eb">Bijection</text>
    <text x="76" y="256" font-size="12" text-anchor="start">Match with an easier object → e.g. paths ↔ letter strings</text>
    <rect x="20" y="274" width="400" height="50" rx="10" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="48" cy="299" r="16" fill="#2563eb"/>
    <text x="48" y="305" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">5</text>
    <text x="76" y="296" font-size="15" text-anchor="start" font-weight="bold" fill="#2563eb">Symmetry</text>
    <text x="76" y="314" font-size="12" text-anchor="start">Equal roles → equal counts → e.g. who is first: 1/2</text>

  </g>
</svg>
