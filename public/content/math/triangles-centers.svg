<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 516" role="img" aria-labeledby="t d">
  <title id="t">The four centers of a triangle</title>
  <desc id="d">Four panels on the same triangle: centroid (medians), circumcenter (perpendicular bisectors, circumcircle), orthocenter (altitudes), incenter (angle bisectors, incircle).</desc>
  <rect x="0" y="0" width="440" height="516" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="17" text-anchor="middle" fill="#111827" font-weight="bold">One triangle, four "centers"</text>
    <rect x="10.0" y="38.0" width="205.0" height="220.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="112.0" y="58.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">① Centroid G</text>
    <polygon points="112.0,90.0 50.9,162.8 155.8,195.8" fill="#2563eb" fill-opacity="0.08" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <line x1="112.0" y1="90.0" x2="103.4" y2="179.3" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <line x1="50.9" y1="162.8" x2="133.9" y2="142.9" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <line x1="155.8" y1="195.8" x2="81.5" y2="126.4" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <circle cx="106.3" cy="149.5" r="4.0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
    <text x="117.3" y="144.5" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">G</text>
    <circle cx="103.4" cy="179.3" r="2.5" fill="#6b7280" stroke="#6b7280" stroke-width="1"/>
    <circle cx="133.9" cy="142.9" r="2.5" fill="#6b7280" stroke="#6b7280" stroke-width="1"/>
    <circle cx="81.5" cy="126.4" r="2.5" fill="#6b7280" stroke="#6b7280" stroke-width="1"/>
    <text x="112.0" y="82.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">A</text>
    <text x="39.1" y="168.8" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">B</text>
    <text x="164.3" y="208.3" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <text x="112.0" y="234.0" font-size="12" text-anchor="middle" fill="#111827">where the 3 medians meet</text>
    <text x="112.0" y="250.0" font-size="12" text-anchor="middle" fill="#6b7280">splits each median 2 : 1</text>
    <rect x="225.0" y="38.0" width="205.0" height="220.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="327.0" y="58.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">② Circumcenter O</text>
    <polygon points="327.0,90.0 265.9,162.8 370.8,195.8" fill="#2563eb" fill-opacity="0.08" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="327.0" cy="152.0" r="62.0" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 4"/>
    <line x1="318.4" y1="179.3" x2="327.0" y2="152.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <polyline points="324.1,181.1 325.9,175.4 320.2,173.6" fill="none" stroke="#111827" stroke-width="1.2"/>
    <circle cx="318.4" cy="179.3" r="2.5" fill="#6b7280" stroke="#6b7280" stroke-width="1"/>
    <line x1="348.9" y1="142.9" x2="327.0" y2="152.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <polyline points="351.2,148.5 345.7,150.8 343.4,145.2" fill="none" stroke="#111827" stroke-width="1.2"/>
    <circle cx="348.9" cy="142.9" r="2.5" fill="#6b7280" stroke="#6b7280" stroke-width="1"/>
    <line x1="296.5" y1="126.4" x2="327.0" y2="152.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <polyline points="292.6,131.0 297.2,134.8 301.1,130.2" fill="none" stroke="#111827" stroke-width="1.2"/>
    <circle cx="296.5" cy="126.4" r="2.5" fill="#6b7280" stroke="#6b7280" stroke-width="1"/>
    <circle cx="327.0" cy="152.0" r="4.0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
    <text x="314.0" y="168.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">O</text>
    <text x="327.0" y="82.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">A</text>
    <text x="254.1" y="168.8" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">B</text>
    <text x="379.3" y="208.3" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <text x="327.0" y="234.0" font-size="12" text-anchor="middle" fill="#111827">where the side bisectors meet</text>
    <text x="327.0" y="250.0" font-size="12" text-anchor="middle" fill="#6b7280">center of circle through A, B, C</text>
    <rect x="10.0" y="268.0" width="205.0" height="220.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="112.0" y="288.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">③ Orthocenter H</text>
    <polygon points="112.0,320.0 50.9,392.8 155.8,425.8" fill="#2563eb" fill-opacity="0.08" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <line x1="112.0" y1="320.0" x2="85.6" y2="403.7" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <polyline points="87.4,398.0 93.1,399.8 91.3,405.5" fill="none" stroke="#111827" stroke-width="1.2"/>
    <line x1="50.9" y1="392.8" x2="128.8" y2="360.5" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <polyline points="123.2,362.8 125.5,368.4 131.1,366.1" fill="none" stroke="#111827" stroke-width="1.2"/>
    <line x1="155.8" y1="425.8" x2="78.0" y2="360.5" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <polyline points="82.6,364.4 78.7,369.0 74.1,365.1" fill="none" stroke="#111827" stroke-width="1.2"/>
    <circle cx="94.8" cy="374.6" r="4.0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
    <text x="105.8" y="369.6" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">H</text>
    <text x="112.0" y="312.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">A</text>
    <text x="39.1" y="398.8" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">B</text>
    <text x="164.3" y="438.3" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <text x="112.0" y="464.0" font-size="12" text-anchor="middle" fill="#111827">where the 3 altitudes meet</text>
    <text x="112.0" y="480.0" font-size="12" text-anchor="middle" fill="#6b7280">(each ⟂ to the opposite side)</text>
    <rect x="225.0" y="268.0" width="205.0" height="220.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="327.0" y="288.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">④ Incenter I</text>
    <polygon points="327.0,320.0 265.9,392.8 370.8,425.8" fill="#2563eb" fill-opacity="0.08" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="318.1" cy="377.6" r="30.2" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="1.8"/>
    <line x1="327.0" y1="320.0" x2="313.5" y2="407.8" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <line x1="265.9" y1="392.8" x2="347.3" y2="369.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <line x1="370.8" y1="425.8" x2="295.8" y2="357.1" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <circle cx="318.1" cy="377.6" r="4.0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
    <text x="331.1" y="393.6" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">I</text>
    <line x1="318.1" y1="377.6" x2="309.1" y2="406.4" stroke="#111827" stroke-width="1.3" stroke-dasharray="3 2" stroke-linecap="round"/>
    <text x="322.6" y="395.0" font-size="12" text-anchor="middle" fill="#111827" font-style="italic">r</text>
    <text x="327.0" y="312.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">A</text>
    <text x="254.1" y="398.8" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">B</text>
    <text x="379.3" y="438.3" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <text x="327.0" y="464.0" font-size="12" text-anchor="middle" fill="#111827">where the angle bisectors meet</text>
    <text x="327.0" y="480.0" font-size="12" text-anchor="middle" fill="#6b7280">center of the incircle (radius r)</text>
    <text x="220.0" y="509.0" font-size="12.5" text-anchor="middle" fill="#6b7280">Only the centroid and incenter are always inside the triangle.</text>
  </g>
</svg>
