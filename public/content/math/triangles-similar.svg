<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 372" role="img" aria-labelledby="t d">
  <title id="t">Angle bisector and similar triangles</title>
  <desc id="d">Left: triangle ABC with AB 6, AC 10, BC 12; the bisector from A meets BC at D with BD 4.5 and DC 7.5. Right: DE parallel to BC makes triangle ADE similar to ABC.</desc>
  <rect x="0" y="0" width="440" height="372" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="17" text-anchor="middle" fill="#111827" font-weight="bold">Side ratios: two big ideas</text>
    <rect x="8.0" y="40.0" width="206.0" height="316.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="111.0" y="62.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">Angle bisector theorem</text>
    <polygon points="74.0,130.2 24.0,205.0 204.0,205.0" fill="#2563eb" fill-opacity="0.1" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <line x1="74.0" y1="130.2" x2="91.5" y2="205.0" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>
    <text x="74.0" y="120.2" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">A</text>
    <text x="14.0" y="219.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">B</text>
    <text x="214.0" y="219.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <text x="91.5" y="223.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">D</text>
    <circle cx="91.5" cy="205.0" r="3.0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
    <text x="37.0" y="163.6" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">6</text>
    <text x="153.0" y="163.6" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">10</text>
    <text x="57.8" y="247.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">BD = 4.5</text>
    <text x="155.8" y="247.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">DC = 7.5</text>
    <text x="111.0" y="285.0" font-size="13" text-anchor="middle" fill="#111827">BD : DC = AB : AC = 6 : 10</text>
    <text x="111.0" y="305.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">→ BD = 12 · 6/16 = 4.5</text>
    <text x="111.0" y="328.0" font-size="12" text-anchor="middle" fill="#6b7280">The bisector cuts side BC</text>
    <text x="111.0" y="344.0" font-size="12" text-anchor="middle" fill="#6b7280">in the ratio of the two other sides.</text>
    <rect x="226.0" y="40.0" width="206.0" height="316.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <polygon points="280.0,92.0 240.0,225.0 418.0,225.0" fill="#2563eb" fill-opacity="0.07" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="280.0,92.0 253.3,180.7 372.0,180.7" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="280.0" y="82.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">A</text>
    <text x="230.0" y="239.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">B</text>
    <text x="428.0" y="239.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">C</text>
    <text x="240.3" y="184.7" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">D</text>
    <text x="385.0" y="184.7" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">E</text>
    <text x="329.0" y="62.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">Similar triangles</text>
    <text x="329.0" y="266.0" font-size="13" text-anchor="middle" fill="#111827">DE ∥ BC  ⇒  △ADE ~ △ABC</text>
    <text x="329.0" y="286.0" font-size="13" text-anchor="middle" fill="#111827">AD/AB = AE/AC = DE/BC = k</text>
    <text x="329.0" y="306.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">Example k = 2/3:  area × 4/9</text>
    <text x="329.0" y="328.0" font-size="12" text-anchor="middle" fill="#6b7280">length ratio k,</text>
    <text x="329.0" y="344.0" font-size="12" text-anchor="middle" fill="#6b7280">area ratio k²</text>
  </g>
</svg>
