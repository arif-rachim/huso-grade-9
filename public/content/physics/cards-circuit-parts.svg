<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Series circuit with a battery and two resistors">
<title>Series circuit with a battery and two resistors</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
</defs>
<rect width="400" height="250" fill="#ffffff"/>
<rect x="60" y="60" width="280" height="130" fill="none" stroke="#111827" stroke-width="3"/>
<rect x="45" y="100" width="30" height="50" fill="#ffffff" stroke="none"/>
<line x1="52" y1="112" x2="52" y2="138" stroke="#111827" stroke-width="4"/>
<line x1="68" y1="100" x2="68" y2="150" stroke="#111827" stroke-width="4"/>
<rect x="110" y="45" width="60" height="30" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
<rect x="230" y="45" width="60" height="30" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
<text x="140" y="65" font-family="sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">R₁</text><text x="260" y="65" font-family="sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">R₂</text>
<g data-label="battery"><text x="82" y="130" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="start">battery</text></g>
<g data-label="resistor R₁"><text x="140" y="32" font-family="sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">resistor</text></g>
<g data-label="resistor R₂"><text x="260" y="32" font-family="sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">resistor</text></g>
<line x1="150" y1="190" x2="250" y2="190" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/>
<g data-label="current I"><text x="200" y="216" font-family="sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">current I</text></g>
<text x="40" y="108" font-family="sans-serif" font-size="16" fill="#111827" text-anchor="middle">+</text><text x="40" y="154" font-family="sans-serif" font-size="16" fill="#111827" text-anchor="middle">−</text>
<text x="200" y="238" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">In series the current is the same everywhere.</text>
</svg>
