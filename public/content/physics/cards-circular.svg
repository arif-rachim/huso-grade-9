<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Circular motion with velocity and centripetal force">
<title>Circular motion with velocity and centripetal force</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
</defs>
<rect width="400" height="260" fill="#ffffff"/>
<circle cx="170" cy="130" r="80" fill="none" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="170" cy="130" r="4" fill="#111827"/>
<line x1="170" y1="130" x2="250" y2="130" stroke="#6b7280" stroke-width="2"/>
<circle cx="250" cy="130" r="12" fill="#dc2626"/>
<line x1="250" y1="116" x2="250" y2="45" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/>
<line x1="236" y1="130" x2="180" y2="130" stroke="#374151" stroke-width="3" marker-end="url(#ahd)"/>
<g data-label="radius r"><text x="190" y="152" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="start">radius r</text></g>
<g data-label="velocity v"><text x="262" y="70" font-family="sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">velocity v</text></g>
<g data-label="centripetal force"><text x="100" y="108" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="start" font-weight="bold">net force Fc</text></g>
<g data-label="center"><text x="142" y="152" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="start">center</text></g>
<text x="262" y="88" font-family="sans-serif" font-size="13" fill="#dc2626" text-anchor="start">(tangent)</text><text x="100" y="166" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="start">(points inward)</text>
</svg>
