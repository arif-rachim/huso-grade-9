<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 255" role="img" aria-label="Temperature versus heat added with two plateaus">
<title>Temperature versus heat added with two plateaus</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
</defs>
<rect width="400" height="255" fill="#ffffff"/>
<line x1="50" y1="220" x2="380" y2="220" stroke="#111827" stroke-width="2"/>
<line x1="50" y1="220" x2="50" y2="20" stroke="#111827" stroke-width="2"/>
<polyline points="50,200 100,150 150,150 220,95 260,95 340,40" fill="none" stroke="#dc2626" stroke-width="4"/>
<g data-label="temperature T"><text x="12" y="18" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="start">T</text></g><g data-label="heat added Q"><text x="380" y="244" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="end">heat added Q</text></g>
<g data-label="solid warming"><text x="58" y="190" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">ice warms</text></g>
<g data-label="melting plateau"><text x="125" y="172" font-family="sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">melting (0 °C)</text></g>
<g data-label="liquid warming"><text x="168" y="134" font-family="sans-serif" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold">water warms</text></g>
<g data-label="boiling plateau"><text x="240" y="84" font-family="sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">boiling (100 °C)</text></g>
<g data-label="steam warming"><text x="290" y="34" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">steam warms</text></g>
</svg>
