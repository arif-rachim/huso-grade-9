<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Forces on a block on an incline">
<title>Forces on a block on an incline</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
</defs>
<rect width="400" height="260" fill="#ffffff"/>
<polygon points="40,220 340,220 340,100" fill="#d1d5db" fill-opacity="0.5" stroke="#111827" stroke-width="2"/>
<g transform="translate(190,160) rotate(-21.8)">
<rect x="-25" y="-40" width="50" height="40" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="2"/>
<line x1="0" y1="-20" x2="0" y2="-85" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/>
<line x1="25" y1="-20" x2="85" y2="-20" stroke="#374151" stroke-width="3" marker-end="url(#ahd)"/>
</g>
<line x1="183" y1="141" x2="183" y2="196" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/>
<g data-label="angle θ"><text x="100" y="214" font-family="sans-serif" font-size="15" fill="#111827" text-anchor="start">θ</text></g>
<g data-label="normal force N"><text x="168" y="78" font-family="sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">normal N</text></g>
<g data-label="friction f"><text x="268" y="108" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="start" font-weight="bold">friction f</text></g>
<g data-label="weight mg"><text x="192" y="214" font-family="sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">weight mg</text></g>
</svg>
