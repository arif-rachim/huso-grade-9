<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Velocity–time graph with slope and area">
<title>Velocity–time graph with slope and area</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
</defs>
<rect width="400" height="260" fill="#ffffff"/>
<line x1="60" y1="210" x2="380" y2="210" stroke="#111827" stroke-width="2"/>
<line x1="60" y1="210" x2="60" y2="30" stroke="#111827" stroke-width="2"/>
<polygon points="60,210 170,90 280,90 340,210" fill="#dc2626" fill-opacity="0.15" stroke="none"/>
<polyline points="60,210 170,90 280,90 340,210" fill="none" stroke="#dc2626" stroke-width="4"/>
<g data-label="velocity v"><text x="14" y="40" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="start">v</text></g><g data-label="time t"><text x="360" y="232" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle">time t</text></g>
<g data-label="slope = acceleration"><text x="70" y="120" font-family="sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">slope = a</text></g>
<g data-label="area = displacement"><text x="225" y="160" font-family="sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">area = Δx</text></g>
<text x="225" y="82" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">constant v</text>
</svg>
