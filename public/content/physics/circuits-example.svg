<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" role="img">
  <title id="t">A mixed circuit: series plus parallel</title>
  <desc id="d">A 12 V battery, a 6 ohm resistor in series with a parallel pair of 6 ohm and 3 ohm. Total resistance 8 ohm, total current 1.5 A, 0.5 A in the 6 ohm branch and 1.0 A in the 3 ohm branch.</desc>
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect x="0" y="0" width="440" height="360" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="22.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Example 1: solve it from the outside in</text>
    <polyline points="60.0,90.0 60.0,150.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="43.0" y1="150.0" x2="77.0" y2="150.0" stroke="#111827" stroke-width="2.6"/>
    <line x1="51.0" y1="160.0" x2="69.0" y2="160.0" stroke="#111827" stroke-width="5"/>
    <polyline points="60.0,160.0 60.0,230.0 360.0,230.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="36.0" y="153.0" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">12 V</text>
    <text x="68.0" y="146.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">+</text>
    <polyline points="60.0,90.0 112.0,90.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="112.0,90.0 118.0,90.0 121.7,98.0 129.0,82.0 136.3,98.0 143.7,82.0 151.0,98.0 158.3,82.0 162.0,90.0 168.0,90.0" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="168.0,90.0 360.0,90.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="140.0" y="70.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">R₁ = 6 Ω</text>
    <polyline points="250.0,90.0 250.0,132.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="250.0,132.0 250.0,138.0 258.0,141.7 242.0,149.0 258.0,156.3 242.0,163.7 258.0,171.0 242.0,178.3 250.0,182.0 250.0,188.0" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="250.0,188.0 250.0,230.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="250" cy="90" r="3.5" fill="#111827"/>
    <circle cx="250" cy="230" r="3.5" fill="#111827"/>
    <text x="236.0" y="164.0" font-size="12" text-anchor="end" fill="#111827" font-weight="bold">R₂ = 6 Ω</text>
    <polyline points="340.0,90.0 340.0,132.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="340.0,132.0 340.0,138.0 348.0,141.7 332.0,149.0 348.0,156.3 332.0,163.7 348.0,171.0 332.0,178.3 340.0,182.0 340.0,188.0" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="340.0,188.0 340.0,230.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="340" cy="90" r="3.5" fill="#111827"/>
    <circle cx="340" cy="230" r="3.5" fill="#111827"/>
    <text x="326.0" y="164.0" font-size="12" text-anchor="end" fill="#111827" font-weight="bold">R₃ = 3 Ω</text>
    <line x1="76.0" y1="90.0" x2="104.0" y2="90.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arR)"/>
    <text x="90.0" y="76.0" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">1.5 A</text>
    <text x="258.0" y="124.0" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">0.5 A</text>
    <text x="348.0" y="124.0" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">1.0 A</text>
    <text x="140.0" y="118.0" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">9 V</text>
    <text x="295.0" y="252.0" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="bold">3 V across each branch</text>
    <text x="220.0" y="288.0" font-size="13" text-anchor="middle" fill="#111827">1. parallel part: 1/R = 1/6 + 1/3 = 1/2 → 2 Ω</text>
    <text x="220.0" y="308.0" font-size="13" text-anchor="middle" fill="#111827">2. whole circuit: 6 + 2 = 8 Ω → I = 12 ÷ 8 = 1.5 A</text>
    <text x="220.0" y="328.0" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">3. voltage left for the pair: 12 − 6·1.5 = 3 V → I₃ = 3 ÷ 3 = 1.0 A</text>
  </g>
</svg>
