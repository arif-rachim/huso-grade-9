<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 430" role="img" aria-labelledby="t d">
  <title id="t">A kitchen socket: appliances in parallel</title>
  <desc id="d">A 220 V socket with a toaster of 880 W and a kettle of 1760 W in parallel, behind a 10 A breaker. The toaster draws 4 A and the kettle 8 A. Together 12 A, more than the breaker allows.</desc>
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect x="0" y="0" width="440" height="430" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="22.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">One socket, two appliances = parallel</text>
    <text x="220.0" y="42.0" font-size="12" text-anchor="middle" fill="#6b7280">(suppose the breaker allows 10 A)</text>
    <circle cx="60" cy="175" r="26" fill="#dc2626" fill-opacity="0.1" stroke="#111827" stroke-width="2.4"/>
    <path d="M 46 175 q 7 -14 14 0 t 14 0" fill="none" stroke="#111827" stroke-width="2.2"/>
    <text x="96.0" y="172.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">220 V</text>
    <text x="96.0" y="190.0" font-size="12" text-anchor="start" fill="#6b7280">socket</text>
    <polyline points="60.0,149.0 60.0,100.0 118.0,100.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="60.0,201.0 60.0,250.0 410.0,250.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="118.0,100.0 130.0,100.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="166.0,100.0 410.0,100.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="130" y="92" width="36" height="16" fill="#ffffff" stroke="#111827" stroke-width="2.2"/>
    <line x1="130.0" y1="100.0" x2="166.0" y2="100.0" stroke="#111827" stroke-width="1.6"/>
    <text x="148.0" y="130.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">10 A breaker</text>
    <polyline points="250.0,100.0 250.0,147.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="250.0,147.0 250.0,153.0 258.0,156.7 242.0,164.0 258.0,171.3 242.0,178.7 258.0,186.0 242.0,193.3 250.0,197.0 250.0,203.0" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="250.0,203.0 250.0,250.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="250" cy="100" r="3.5" fill="#111827"/>
    <text x="234.0" y="170.0" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">toaster</text>
    <text x="234.0" y="187.0" font-size="12" text-anchor="end" fill="#6b7280">880 W</text>
    <text x="260.0" y="134.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">4 A</text>
    <polyline points="352.0,100.0 352.0,147.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="352.0,147.0 352.0,153.0 360.0,156.7 344.0,164.0 360.0,171.3 344.0,178.7 360.0,186.0 344.0,193.3 352.0,197.0 352.0,203.0" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="352.0,203.0 352.0,250.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="352" cy="100" r="3.5" fill="#111827"/>
    <text x="336.0" y="170.0" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">kettle</text>
    <text x="336.0" y="187.0" font-size="12" text-anchor="end" fill="#6b7280">1760 W</text>
    <text x="362.0" y="134.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">8 A</text>
    <line x1="172.0" y1="100.1" x2="216.0" y2="100.1" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arR)"/>
    <text x="194.0" y="90.0" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">12 A</text>
    <line x1="268.0" y1="100.1" x2="316.0" y2="100.1" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arR)"/>
    <text x="292.0" y="90.0" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">8 A</text>
    <text x="220.0" y="290.0" font-size="13" text-anchor="middle" fill="#6b7280">Same 220 V on every appliance. Currents add up.</text>
    <text x="220.0" y="318.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">I = P ÷ V</text>
    <text x="220.0" y="342.0" font-size="13" text-anchor="middle" fill="#111827">toaster: 880 ÷ 220 = 4 A</text>
    <text x="220.0" y="362.0" font-size="13" text-anchor="middle" fill="#111827">kettle: 1760 ÷ 220 = 8 A</text>
    <text x="220.0" y="390.0" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">4 A + 8 A = 12 A  > 10 A   →  click! the breaker trips</text>
    <text x="220.0" y="414.0" font-size="12" text-anchor="middle" fill="#6b7280">Energy bill: E = P·t  (1.76 kW for 3 minutes ≈ 0.088 kWh)</text>
  </g>
</svg>
