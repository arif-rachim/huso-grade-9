<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 464" role="img" aria-labelledby="t d">
  <title id="t">Torque and lever arm</title>
  <desc id="d">Three doors pushed at the same distance from the hinge: force perpendicular gives full torque, force at 30 degrees gives half, force along the door gives zero. A seesaw balances when torques match.</desc>
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect x="0" y="0" width="440" height="464" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="22.0" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Torque: τ = r · F · sin θ</text>
    <text x="66.0" y="52.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">F ⟂ door</text>
    <rect x="16" y="144" width="60" height="12" rx="3" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="2"/>
    <circle cx="16" cy="150" r="6" fill="#111827"/>
    <text x="16.0" y="178.0" font-size="12" text-anchor="middle" fill="#6b7280">pivot</text>
    <line x1="76.0" y1="150.0" x2="76.0" y2="104.0" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arR)"/>
    <text x="84.0" y="106.0" font-size="15" text-anchor="start" fill="#dc2626" font-weight="bold">F</text>
    <text x="66.0" y="218.0" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">τ = rF</text>
    <text x="66.0" y="238.0" font-size="12" text-anchor="middle" fill="#6b7280">full torque</text>
    <text x="200.0" y="52.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">F at 30° to door</text>
    <rect x="150" y="144" width="60" height="12" rx="3" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="2"/>
    <circle cx="150" cy="150" r="6" fill="#111827"/>
    <text x="150.0" y="178.0" font-size="12" text-anchor="middle" fill="#6b7280">pivot</text>
    <line x1="210.0" y1="150.0" x2="249.8" y2="127.0" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arR)"/>
    <text x="257.8" y="129.0" font-size="15" text-anchor="start" fill="#dc2626" font-weight="bold">F</text>
    <line x1="210.0" y1="150.0" x2="249.8" y2="150.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="249.8" y1="150.0" x2="249.8" y2="127.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="232.0" y="167.0" font-size="12" text-anchor="middle" fill="#6b7280">30°</text>
    <text x="254.8" y="144.0" font-size="12" text-anchor="start" fill="#6b7280">F sin θ</text>
    <text x="200.0" y="218.0" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">τ = ½ rF</text>
    <text x="200.0" y="238.0" font-size="12" text-anchor="middle" fill="#6b7280">sin 30° = ½</text>
    <text x="350.0" y="52.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">F along door</text>
    <rect x="300" y="144" width="60" height="12" rx="3" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="2"/>
    <circle cx="300" cy="150" r="6" fill="#111827"/>
    <text x="300.0" y="178.0" font-size="12" text-anchor="middle" fill="#6b7280">pivot</text>
    <line x1="404.0" y1="150.0" x2="362.0" y2="150.0" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arR)"/>
    <text x="386.0" y="134.0" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">F</text>
    <text x="350.0" y="218.0" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">τ = 0</text>
    <text x="350.0" y="238.0" font-size="12" text-anchor="middle" fill="#6b7280">it only pushes the hinge</text>
    <text x="220.0" y="268.0" font-size="12" text-anchor="middle" fill="#6b7280">Lever arm = the perpendicular distance from the pivot to the line of the force.</text>
    <text x="220.0" y="296.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Balance: torques cancel  →  m₁·d₁ = m₂·d₂</text>
    <polygon points="220,366 204,396 236,396" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="2"/>
    <rect x="40" y="358" width="360" height="8" rx="3" fill="#d1d5db" stroke="#6b7280" stroke-width="1.5"/>
    <rect x="38" y="322" width="44" height="36" rx="4" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="2"/>
    <text x="60.0" y="344.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">30 kg</text>
    <rect x="278" y="322" width="44" height="36" rx="4" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="2"/>
    <text x="300.0" y="344.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">60 kg</text>
    <line x1="218.0" y1="408.0" x2="62.0" y2="408.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arG)"/>
    <line x1="62.0" y1="408.0" x2="218.0" y2="408.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arG)"/>
    <text x="140.0" y="426.0" font-size="12" text-anchor="middle" fill="#6b7280">d₁ = 2.0 m</text>
    <line x1="222.0" y1="408.0" x2="298.0" y2="408.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arG)"/>
    <line x1="298.0" y1="408.0" x2="222.0" y2="408.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arG)"/>
    <text x="260.0" y="426.0" font-size="12" text-anchor="middle" fill="#6b7280">d₂ = 1.0 m</text>
    <text x="220.0" y="452.0" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">30 × 2.0 = 60 × 1.0  ✓</text>
  </g>
</svg>
