<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 480" role="img" aria-labelledby="t d">
  <title id="t">Work, energy and power</title>
  <desc id="d">Work W = F d cos theta: pulling along the motion gives plus 500 J, 60 degrees gives 250 J, at 90 degrees zero, against the motion minus 500 J. Formulas for kinetic, gravitational and spring energy and for power.</desc>
  <rect x="0" y="0" width="440" height="480" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Work: only the part of the force ALONG the motion counts</text>
    <rect x="15.0" y="40.0" width="200.0" height="120.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="115.0" y="58.0" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">θ = 0°</text>
    <line x1="29.0" y1="140.0" x2="201.0" y2="140.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    <rect x="75.0" y="116.0" width="34.0" height="24.0" rx="2" fill="#dc2626" fill-opacity="0.2" stroke="#111827" stroke-width="1.5"/>
    <line x1="92.0" y1="128.0" x2="118.0" y2="128.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <polygon points="126.0,128.0 117.0,132.1 117.0,124.0" fill="#dc2626"/>
    <line x1="115.0" y1="150.0" x2="177.0" y2="150.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    <polygon points="185.0,150.0 176.0,154.1 176.0,145.9" fill="#111827"/>
    <text x="150.0" y="162.0" font-size="12" text-anchor="middle" fill="#111827"></text>
    <text x="115.0" y="82.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">W = +500 J</text>
    <rect x="225.0" y="40.0" width="200.0" height="120.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="325.0" y="58.0" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">θ = 60°</text>
    <line x1="239.0" y1="140.0" x2="411.0" y2="140.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    <rect x="285.0" y="116.0" width="34.0" height="24.0" rx="2" fill="#dc2626" fill-opacity="0.2" stroke="#111827" stroke-width="1.5"/>
    <line x1="302.0" y1="128.0" x2="315.0" y2="105.5" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <polygon points="319.0,98.6 318.0,108.4 311.0,104.3" fill="#dc2626"/>
    <line x1="325.0" y1="150.0" x2="387.0" y2="150.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    <polygon points="395.0,150.0 386.0,154.1 386.0,145.9" fill="#111827"/>
    <text x="360.0" y="162.0" font-size="12" text-anchor="middle" fill="#111827"></text>
    <text x="325.0" y="82.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">W = +250 J</text>
    <path d="M 324 128 A 22 22 0 0 0 313.0 108.9" fill="none" stroke="#111827" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="15.0" y="168.0" width="200.0" height="120.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="115.0" y="186.0" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">θ = 90°</text>
    <line x1="29.0" y1="268.0" x2="201.0" y2="268.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    <rect x="75.0" y="244.0" width="34.0" height="24.0" rx="2" fill="#dc2626" fill-opacity="0.2" stroke="#111827" stroke-width="1.5"/>
    <line x1="92.0" y1="256.0" x2="92.0" y2="230.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <polygon points="92.0,222.0 96.0,231.0 88.0,231.0" fill="#dc2626"/>
    <line x1="115.0" y1="278.0" x2="177.0" y2="278.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    <polygon points="185.0,278.0 176.0,282.1 176.0,273.9" fill="#111827"/>
    <text x="150.0" y="290.0" font-size="12" text-anchor="middle" fill="#111827"></text>
    <text x="115.0" y="210.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">W = 0 J</text>
    <rect x="225.0" y="168.0" width="200.0" height="120.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="325.0" y="186.0" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">θ = 180°</text>
    <line x1="239.0" y1="268.0" x2="411.0" y2="268.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    <rect x="285.0" y="244.0" width="34.0" height="24.0" rx="2" fill="#dc2626" fill-opacity="0.2" stroke="#111827" stroke-width="1.5"/>
    <line x1="302.0" y1="256.0" x2="276.0" y2="256.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <polygon points="268.0,256.0 277.0,251.9 277.0,260.1" fill="#dc2626"/>
    <line x1="325.0" y1="278.0" x2="387.0" y2="278.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    <polygon points="395.0,278.0 386.0,282.1 386.0,273.9" fill="#111827"/>
    <text x="360.0" y="290.0" font-size="12" text-anchor="middle" fill="#111827"></text>
    <text x="325.0" y="210.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">W = −500 J</text>
    <text x="220.0" y="166.0" font-size="12" text-anchor="middle" fill="#111827"></text>
    <text x="220.0" y="306.0" font-size="12" text-anchor="middle" fill="#6b7280">F = 50 N, d = 10 m  ·  black arrow = displacement d  ·  W = F d cos θ</text>
    <rect x="10.0" y="322.0" width="420.0" height="142.0" rx="8" fill="#dc2626" fill-opacity="0.07"/>
    <text x="26.0" y="346.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Work: W = Fd cos θ  (joules; 1 J = 1 N·m)</text>
    <text x="26.0" y="368.0" font-size="13" text-anchor="start" fill="#111827">Kinetic energy: KE = ½mv²</text>
    <text x="26.0" y="390.0" font-size="13" text-anchor="start" fill="#111827">Gravity energy: PE = mgh  (h above your zero level)</text>
    <text x="26.0" y="412.0" font-size="13" text-anchor="start" fill="#111827">Spring energy: PE = ½kx²  (x = stretch or squeeze)</text>
    <text x="26.0" y="434.0" font-size="13" text-anchor="start" fill="#111827">Power: P = W ÷ t  (watts; 1 W = 1 J/s)</text>
    <text x="26.0" y="456.0" font-size="13" text-anchor="start" fill="#111827">Work–energy: net work = change in KE</text>
  </g>
</svg>
