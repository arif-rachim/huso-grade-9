<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" role="img" aria-labeledby="t d">
  <title id="t">A free body diagram</title>
  <desc id="d">A crate pushed along the floor: draw it as a dot, then weight down, normal force up, push forward and friction backward. A hanging pot has tension up and weight down. Four steps to draw any free body diagram.</desc>
  <rect x="0" y="0" width="440" height="420" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Free body diagram: one dot, only the forces ON it</text>
    <rect x="10.0" y="40.0" width="250.0" height="210.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <rect x="270.0" y="40.0" width="160.0" height="210.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="135.0" y="62.0" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">Crate pushed along the floor</text>
    <rect x="105.0" y="126.0" width="60.0" height="48.0" rx="2" fill="#dc2626" fill-opacity="0.1" stroke="#111827" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="135.0" cy="150.0" r="5" fill="#111827" stroke="#111827" stroke-width="1.5"/>
    <line x1="135.0" y1="150.0" x2="135.0" y2="86.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <polygon points="135.0,78.0 139.1,87.0 130.9,87.0" fill="#dc2626"/>
    <text x="143.0" y="78.0" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">N (normal)</text>
    <line x1="135.0" y1="150.0" x2="135.0" y2="214.0" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <polygon points="135.0,222.0 130.9,213.0 139.1,213.0" fill="#111827"/>
    <text x="143.0" y="208.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">W = mg</text>
    <line x1="135.0" y1="150.0" x2="197.0" y2="150.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <polygon points="205.0,150.0 196.0,154.1 196.0,145.9" fill="#dc2626"/>
    <text x="207.0" y="142.0" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">push</text>
    <line x1="135.0" y1="150.0" x2="73.0" y2="150.0" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <polygon points="65.0,150.0 74.0,145.9 74.0,154.1" fill="#111827"/>
    <text x="63.0" y="142.0" font-size="12" text-anchor="end" fill="#111827" font-weight="bold">friction f</text>
    <text x="135.0" y="240.0" font-size="12" text-anchor="middle" fill="#6b7280">steady speed: the arrows balance</text>
    <text x="350.0" y="62.0" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">Hanging pot</text>
    <circle cx="350.0" cy="150.0" r="5" fill="#111827" stroke="#111827" stroke-width="1.5"/>
    <line x1="350.0" y1="150.0" x2="350.0" y2="94.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <polygon points="350.0,86.0 354.1,95.0 345.9,95.0" fill="#dc2626"/>
    <text x="358.0" y="92.0" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">T (tension)</text>
    <line x1="350.0" y1="150.0" x2="350.0" y2="206.0" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <polygon points="350.0,214.0 345.9,205.0 354.1,205.0" fill="#111827"/>
    <text x="358.0" y="222.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">W = mg</text>
    <rect x="10.0" y="262.0" width="420.0" height="148.0" rx="8" fill="#dc2626" fill-opacity="0.07"/>
    <text x="24.0" y="284.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">Four steps</text>
    <text x="24.0" y="306.0" font-size="12" text-anchor="start" fill="#111827">1. Pick ONE object. Draw it as a dot.</text>
    <text x="24.0" y="326.0" font-size="12" text-anchor="start" fill="#111827">2. Draw every force ON it, from the dot: weight (down), normal (⟂ surface),</text>
    <text x="24.0" y="342.0" font-size="12" text-anchor="start" fill="#111827">    friction (along surface, against sliding), tension (along rope), push.</text>
    <text x="24.0" y="362.0" font-size="12" text-anchor="start" fill="#111827">3. Label each arrow. Longer arrow = bigger force.</text>
    <text x="24.0" y="382.0" font-size="12" text-anchor="start" fill="#111827">4. Pick axes, add forces along each axis: F_net = ma.</text>
    <text x="24.0" y="400.0" font-size="12" text-anchor="start" fill="#6b7280">Never draw forces the object exerts on others.</text>
  </g>
</svg>
