<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" role="img" aria-labeledby="t d">
  <title id="t">Friction versus push</title>
  <desc id="d">A 10 kg crate on a floor with static coefficient 0.5 and kinetic coefficient 0.4. Friction equals the push until 49 N, then the crate slides and friction drops to 39.2 N.</desc>
  <rect x="0" y="0" width="440" height="360" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Friction on a 10 kg crate (μₛ = 0.5, μₖ = 0.4)</text>
    <line x1="70.0" y1="250.0" x2="406.0" y2="250.0" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="70.0" y1="46.0" x2="70.0" y2="250.0" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="70.0" y1="250.0" x2="70.0" y2="254.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
    <text x="70.0" y="268.0" font-size="12" text-anchor="middle" fill="#6b7280">0</text>
    <line x1="117.1" y1="250.0" x2="117.1" y2="254.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
    <text x="117.1" y="268.0" font-size="12" text-anchor="middle" fill="#6b7280">10</text>
    <line x1="164.3" y1="250.0" x2="164.3" y2="254.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
    <text x="164.3" y="268.0" font-size="12" text-anchor="middle" fill="#6b7280">20</text>
    <line x1="211.4" y1="250.0" x2="211.4" y2="254.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
    <text x="211.4" y="268.0" font-size="12" text-anchor="middle" fill="#6b7280">30</text>
    <line x1="258.6" y1="250.0" x2="258.6" y2="254.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
    <text x="258.6" y="268.0" font-size="12" text-anchor="middle" fill="#6b7280">40</text>
    <line x1="305.7" y1="250.0" x2="305.7" y2="254.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
    <text x="305.7" y="268.0" font-size="12" text-anchor="middle" fill="#6b7280">50</text>
    <line x1="352.9" y1="250.0" x2="352.9" y2="254.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
    <text x="352.9" y="268.0" font-size="12" text-anchor="middle" fill="#6b7280">60</text>
    <line x1="400.0" y1="250.0" x2="400.0" y2="254.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
    <text x="400.0" y="268.0" font-size="12" text-anchor="middle" fill="#6b7280">70</text>
    <line x1="66.0" y1="250.0" x2="70.0" y2="250.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
    <text x="62.0" y="254.0" font-size="12" text-anchor="end" fill="#6b7280">0</text>
    <line x1="66.0" y1="192.9" x2="70.0" y2="192.9" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
    <text x="62.0" y="196.9" font-size="12" text-anchor="end" fill="#6b7280">20</text>
    <line x1="66.0" y1="135.7" x2="70.0" y2="135.7" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
    <text x="62.0" y="139.7" font-size="12" text-anchor="end" fill="#6b7280">40</text>
    <line x1="66.0" y1="78.6" x2="70.0" y2="78.6" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
    <text x="62.0" y="82.6" font-size="12" text-anchor="end" fill="#6b7280">60</text>
    <text x="235.0" y="288.0" font-size="12" text-anchor="middle" fill="#111827">your push F (N)</text>
    <text x="62.0" y="40.0" font-size="12" text-anchor="end" fill="#6b7280">friction f (N)</text>
    <rect x="70.0" y="50.0" width="231.0" height="200.0" rx="0" fill="#dc2626" fill-opacity="0.07"/>
    <polyline points="70.0,250.0 301.0,110.0" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="301.0" y1="110.0" x2="301.0" y2="138.0" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/>
    <polyline points="301.0,138.0 400.0,138.0" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="301.0" cy="110.0" r="5" fill="#dc2626"/>
    <circle cx="301.0" cy="138.0" r="5" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
    <text x="295.0" y="100.0" font-size="12" text-anchor="end" fill="#111827" font-weight="bold">max static = μₛN = 49 N</text>
    <text x="400.0" y="160.0" font-size="12" text-anchor="end" fill="#111827" font-weight="bold">sliding: f = μₖN = 39.2 N</text>
    <text x="239.7" y="210.0" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="bold">not moving:</text>
    <text x="239.7" y="226.0" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="bold">f = your push</text>
    <rect x="10.0" y="300.0" width="420.0" height="50.0" rx="8" fill="#dc2626" fill-opacity="0.07"/>
    <text x="220.0" y="320.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">N = mg = 10 · 9.8 = 98 N   ·   f = μN</text>
    <text x="220.0" y="340.0" font-size="12" text-anchor="middle" fill="#6b7280">Friction does not depend on speed or on the contact area.</text>
  </g>
</svg>
