<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-labelledby="t d">
  <title id="t">Forces on a slope</title>
  <desc id="d">A 2 kg block on a 30 degree smooth slope: weight 19.6 N splits into 9.8 N along the slope and 17.0 N into the slope. The normal force is 17.0 N and the acceleration is g sin 30 = 4.9 m/s2.</desc>
  <rect x="0" y="0" width="440" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Block on a slope (θ = 30°, m = 2 kg)</text>
    <polygon points="60.0,330.0 293.8,330.0 293.8,195.0" fill="#d1d5db" fill-opacity="0.35" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <polygon points="174.3,264.0 205.5,246.0 191.5,221.8 160.3,239.8" fill="#dc2626" fill-opacity="0.18" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="182.9" cy="242.9" r="4" fill="#111827" stroke="#111827" stroke-width="1.5"/>
    <line x1="182.9" y1="242.9" x2="182.9" y2="313.3" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <polygon points="182.9,321.3 178.9,312.3 187.0,312.3" fill="#111827"/>
    <text x="188.9" y="325.3" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">W = mg = 19.6 N</text>
    <line x1="182.9" y1="242.9" x2="155.9" y2="258.5" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="149.0,262.5 154.7,254.5 158.8,261.5" fill="#dc2626"/>
    <text x="143.0" y="278.5" font-size="12" text-anchor="end" fill="#dc2626" font-weight="bold">mg sin θ = 9.8 N</text>
    <line x1="182.9" y1="242.9" x2="152.9" y2="190.9" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="148.9,184.0 156.9,189.8 149.9,193.8" fill="#dc2626"/>
    <text x="142.9" y="178.0" font-size="12" text-anchor="end" fill="#dc2626" font-weight="bold">N = mg cos θ = 17.0 N</text>
    <line x1="182.9" y1="242.9" x2="216.9" y2="301.8" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
    <line x1="149.0" y1="262.5" x2="182.9" y2="321.3" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
    <line x1="216.9" y1="301.8" x2="182.9" y2="321.3" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
    <path d="M 120 330 A 60 60 0 0 0 112.0 300.0" fill="none" stroke="#111827" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="138.0" y="322.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">30°</text>
    <rect x="250.0" y="38.0" width="180.0" height="150.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="340.0" y="60.0" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">Smooth slope</text>
    <text x="340.0" y="82.0" font-size="13" text-anchor="middle" fill="#111827">N = mg cos θ</text>
    <text x="340.0" y="104.0" font-size="12" text-anchor="middle" fill="#111827">net = mg sin θ (down slope)</text>
    <text x="340.0" y="126.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">a = g sin θ = 4.9 m/s²</text>
    <text x="340.0" y="154.0" font-size="12" text-anchor="middle" fill="#6b7280">With friction (sliding down):</text>
    <text x="340.0" y="174.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">a = g(sin θ − μ cos θ)</text>
    <text x="220.0" y="386.0" font-size="12" text-anchor="middle" fill="#6b7280">Split the weight along the slope and across it, not up and sideways.</text>
  </g>
</svg>
