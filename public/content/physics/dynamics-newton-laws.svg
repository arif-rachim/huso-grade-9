<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 462" role="img" aria-labeledby="t d">
  <title id="t">Newton's three laws</title>
  <desc id="d">Law 1: a plate on a tablecloth stays put when the cloth is yanked. Law 2: the same 10 N gives a 1 kg cart 10 m/s2 and a 2 kg cart 5 m/s2. Law 3: you push the wall, the wall pushes you, equal and opposite, on different objects.</desc>
  <rect x="0" y="0" width="440" height="462" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="17" text-anchor="middle" fill="#111827" font-weight="bold">Newton's three laws</text>
    <rect x="10.0" y="40.0" width="420.0" height="126.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <rect x="10.0" y="172.0" width="420.0" height="138.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <rect x="10.0" y="322.0" width="420.0" height="128.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="24.0" y="60.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">1st: no net force ⇒ no change in motion</text>
    <line x1="40.0" y1="140.0" x2="260.0" y2="140.0" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <rect x="70.0" y="128.0" width="150.0" height="12.0" rx="0" fill="#dc2626" fill-opacity="0.18"/>
    <rect x="110.0" y="114.0" width="40.0" height="14.0" rx="3" fill="none" stroke="#111827" stroke-width="1.8"/>
    <rect x="170.0" y="100.0" width="22.0" height="28.0" rx="3" fill="none" stroke="#111827" stroke-width="1.8"/>
    <line x1="222.0" y1="134.0" x2="292.0" y2="134.0" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="300.0,134.0 291.0,138.1 291.0,129.9" fill="#dc2626"/>
    <text x="262.0" y="122.0" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="bold">yank!</text>
    <text x="300.0" y="104.0" font-size="12" text-anchor="start" fill="#111827">Fast yank: the cloth</text>
    <text x="300.0" y="120.0" font-size="12" text-anchor="start" fill="#111827">slides out; plate and</text>
    <text x="300.0" y="136.0" font-size="12" text-anchor="start" fill="#111827">glass stay put.</text>
    <text x="150.0" y="160.0" font-size="12" text-anchor="middle" fill="#6b7280">Inertia: things keep doing what they were doing</text>
    <text x="24.0" y="192.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">2nd: F = ma  (same push, double mass, half the a)</text>
    <rect x="40.0" y="240.0" width="60.0" height="40.0" rx="2" fill="#dc2626" fill-opacity="0.2" stroke="#111827" stroke-width="1.8"/>
    <text x="70.0" y="265.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">1 kg</text>
    <line x1="100.0" y1="260.0" x2="162.0" y2="260.0" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="170.0,260.0 161.0,264.1 161.0,255.9" fill="#dc2626"/>
    <text x="135.0" y="250.0" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="bold">10 N</text>
    <line x1="40.0" y1="226.0" x2="102.0" y2="226.0" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="110.0,226.0 101.0,230.1 101.0,221.9" fill="#111827"/>
    <text x="116.0" y="230.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">a = 10 m/s²</text>
    <rect x="250.0" y="240.0" width="100.0" height="40.0" rx="2" fill="#dc2626" fill-opacity="0.2" stroke="#111827" stroke-width="1.8"/>
    <text x="300.0" y="265.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">2 kg</text>
    <line x1="350.0" y1="260.0" x2="412.0" y2="260.0" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="420.0,260.0 411.0,264.1 411.0,255.9" fill="#dc2626"/>
    <text x="385.0" y="250.0" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="bold">10 N</text>
    <line x1="250.0" y1="226.0" x2="277.0" y2="226.0" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="285.0,226.0 276.0,230.1 276.0,221.9" fill="#111827"/>
    <text x="292.0" y="230.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">a = 5 m/s²</text>
    <text x="220.0" y="300.0" font-size="12" text-anchor="middle" fill="#6b7280">a = F ÷ m   ·   1 N = 1 kg·m/s²</text>
    <text x="24.0" y="342.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">3rd: the two forces of a pair act on DIFFERENT objects</text>
    <rect x="20.0" y="354.0" width="40.0" height="84.0" rx="0" fill="#d1d5db" stroke="#111827" stroke-width="1.5"/>
    <text x="40.0" y="400.0" font-size="12" text-anchor="middle" fill="#6b7280">wall</text>
    <polygon points="66.0,420.0 150.0,420.0 162.0,414.0 150.0,408.0 66.0,408.0" fill="#dc2626" fill-opacity="0.25" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="174.0" cy="414.0" r="10" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="120.0" y="436.0" font-size="12" text-anchor="middle" fill="#6b7280">you</text>
    <line x1="66.0" y1="390.0" x2="128.0" y2="390.0" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="136.0,390.0 127.0,394.1 127.0,385.9" fill="#dc2626"/>
    <line x1="58.0" y1="430.0" x2="32.0" y2="430.0" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="24.0,430.0 33.0,425.9 33.0,434.1" fill="#6b7280"/>
    <text x="210.0" y="386.0" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">wall pushes you: 200 N →</text>
    <text x="210.0" y="404.0" font-size="12" text-anchor="start" fill="#dc2626">(this force acts on YOU)</text>
    <text x="210.0" y="426.0" font-size="12" text-anchor="start" fill="#6b7280" font-weight="bold">you push wall: 200 N ←</text>
    <text x="210.0" y="444.0" font-size="12" text-anchor="start" fill="#6b7280">(this force acts on the WALL)</text>
  </g>
</svg>
