<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-labelledby="t d">
  <title id="t">Two masses on a pulley</title>
  <desc id="d">A 3 kg and a 2 kg mass hang on a light rope over a pulley. Same tension both sides. Acceleration 1.96 m/s2, tension 23.5 N.</desc>
  <rect x="0" y="0" width="440" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">Two hanging masses (3 kg and 2 kg)</text>
    <circle cx="170.0" cy="70.0" r="24" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <circle cx="170.0" cy="70.0" r="3" fill="#111827" stroke="#111827" stroke-width="1.5"/>
    <line x1="146.0" y1="70.0" x2="146.0" y2="196.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    <line x1="194.0" y1="70.0" x2="194.0" y2="246.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    <rect x="120.0" y="196.0" width="52.0" height="52.0" rx="3" fill="#dc2626" fill-opacity="0.22" stroke="#111827" stroke-width="1.8"/>
    <text x="146.0" y="228.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">3 kg</text>
    <rect x="174.0" y="246.0" width="40.0" height="40.0" rx="3" fill="#dc2626" fill-opacity="0.12" stroke="#111827" stroke-width="1.8"/>
    <text x="194.0" y="272.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">2 kg</text>
    <line x1="94.0" y1="200.0" x2="94.0" y2="242.0" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <polygon points="94.0,250.0 90.0,241.0 98.0,241.0" fill="#111827"/>
    <text x="88.0" y="232.0" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">a</text>
    <line x1="228.0" y1="280.0" x2="228.0" y2="238.0" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <polygon points="228.0,230.0 232.1,239.0 223.9,239.0" fill="#111827"/>
    <text x="234.0" y="258.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">a</text>
    <line x1="146.0" y1="196.0" x2="146.0" y2="175.8" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <polygon points="146.0,167.8 150.1,176.8 141.9,176.8" fill="#dc2626"/>
    <text x="140.0" y="184.0" font-size="13" text-anchor="end" fill="#dc2626" font-weight="bold">T</text>
    <line x1="194.0" y1="246.0" x2="194.0" y2="225.8" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <polygon points="194.0,217.8 198.1,226.8 189.9,226.8" fill="#dc2626"/>
    <text x="202.0" y="234.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">T</text>
    <line x1="138.0" y1="248.0" x2="138.0" y2="275.3" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <polygon points="138.0,283.3 133.9,274.3 142.1,274.3" fill="#111827"/>
    <line x1="194.0" y1="286.0" x2="194.0" y2="301.5" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <polygon points="194.0,309.5 189.9,300.5 198.1,300.5" fill="#111827"/>
    <text x="146.0" y="286.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">3g</text>
    <text x="202.0" y="308.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">2g</text>
    <rect x="300.0" y="50.0" width="130.0" height="150.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="365.0" y="72.0" font-size="12" text-anchor="middle" fill="#6b7280">Same rope,</text>
    <text x="365.0" y="88.0" font-size="12" text-anchor="middle" fill="#6b7280">same T on both</text>
    <text x="365.0" y="104.0" font-size="12" text-anchor="middle" fill="#6b7280">sides (light rope,</text>
    <text x="365.0" y="120.0" font-size="12" text-anchor="middle" fill="#6b7280">smooth pulley).</text>
    <text x="365.0" y="146.0" font-size="12" text-anchor="middle" fill="#6b7280">Heavier one goes</text>
    <text x="365.0" y="162.0" font-size="12" text-anchor="middle" fill="#6b7280">down, lighter up,</text>
    <text x="365.0" y="178.0" font-size="12" text-anchor="middle" fill="#6b7280">same size a.</text>
    <rect x="10.0" y="320.0" width="420.0" height="70.0" rx="8" fill="#dc2626" fill-opacity="0.07"/>
    <text x="24.0" y="340.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">3 kg:  3g − T = 3a   |   2 kg:  T − 2g = 2a</text>
    <text x="24.0" y="360.0" font-size="13" text-anchor="start" fill="#111827">Add them:  a = (3 − 2)g ÷ (3 + 2) = 1.96 m/s²</text>
    <text x="24.0" y="380.0" font-size="13" text-anchor="start" fill="#111827">Then T = 2(g + a) = 23.5 N  (more than 2g = 19.6 N!)</text>
  </g>
</svg>
