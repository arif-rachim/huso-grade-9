<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-labelledby="t d">
  <title id="t">Inverse-square law of gravity</title>
  <desc id="d">Gravity spreads like light: at twice the distance the same pull is spread over four times the area, so the force is a quarter. At three times the distance it is one ninth.</desc>
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect x="0" y="0" width="440" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="17" text-anchor="middle" fill="#dc2626" font-weight="bold">F = G·m₁·m₂ / r²</text>
    <text x="220.0" y="44.0" font-size="12" text-anchor="middle" fill="#6b7280">r = distance between the centers</text>
    <line x1="52.0" y1="128.0" x2="320.0" y2="83.0" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="52.0" y1="128.0" x2="320.0" y2="173.0" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="52" cy="128" r="22" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="52.0" y="133.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">M</text>
    <rect x="125.0" y="113.0" width="30" height="30" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="2"/>
    <rect x="200.0" y="98.0" width="60" height="60" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="2"/>
    <line x1="230.0" y1="98.0" x2="230.0" y2="158.0" stroke="#dc2626" stroke-width="1"/>
    <line x1="200.0" y1="128.0" x2="260.0" y2="128.0" stroke="#dc2626" stroke-width="1"/>
    <rect x="275.0" y="83.0" width="90" height="90" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="2"/>
    <line x1="305.0" y1="83.0" x2="305.0" y2="173.0" stroke="#dc2626" stroke-width="1"/>
    <line x1="275.0" y1="113.0" x2="365.0" y2="113.0" stroke="#dc2626" stroke-width="1"/>
    <line x1="335.0" y1="83.0" x2="335.0" y2="173.0" stroke="#dc2626" stroke-width="1"/>
    <line x1="275.0" y1="143.0" x2="365.0" y2="143.0" stroke="#dc2626" stroke-width="1"/>
    <text x="140.0" y="200.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">r</text>
    <text x="140.0" y="218.0" font-size="12" text-anchor="middle" fill="#6b7280">1 cell</text>
    <text x="140.0" y="238.0" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">force F</text>
    <text x="230.0" y="200.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">2r</text>
    <text x="230.0" y="218.0" font-size="12" text-anchor="middle" fill="#6b7280">4 cells</text>
    <text x="230.0" y="238.0" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">F ÷ 4</text>
    <text x="320.0" y="200.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">3r</text>
    <text x="320.0" y="218.0" font-size="12" text-anchor="middle" fill="#6b7280">9 cells</text>
    <text x="320.0" y="238.0" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">F ÷ 9</text>
    <text x="220.0" y="266.0" font-size="12" text-anchor="middle" fill="#6b7280">The same pull is spread over more and more area: 1, 4, 9 cells.</text>
    <rect x="20" y="286" width="400" height="100" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="118.0" y="310.0" font-size="13" text-anchor="end" fill="#111827">distance ×2</text>
    <text x="128.0" y="310.0" font-size="13" text-anchor="middle" fill="#6b7280">→</text>
    <text x="140.0" y="310.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">force × ¼</text>
    <text x="118.0" y="336.0" font-size="13" text-anchor="end" fill="#111827">distance ×3</text>
    <text x="128.0" y="336.0" font-size="13" text-anchor="middle" fill="#6b7280">→</text>
    <text x="140.0" y="336.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">force × 1/9</text>
    <text x="118.0" y="362.0" font-size="13" text-anchor="end" fill="#111827">distance × ½</text>
    <text x="128.0" y="362.0" font-size="13" text-anchor="middle" fill="#6b7280">→</text>
    <text x="140.0" y="362.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">force × 4</text>
    <text x="322.0" y="310.0" font-size="13" text-anchor="end" fill="#111827">one mass ×2</text>
    <text x="332.0" y="310.0" font-size="13" text-anchor="middle" fill="#6b7280">→</text>
    <text x="344.0" y="310.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">F ×2</text>
    <text x="322.0" y="336.0" font-size="13" text-anchor="end" fill="#111827">both masses ×2</text>
    <text x="332.0" y="336.0" font-size="13" text-anchor="middle" fill="#6b7280">→</text>
    <text x="344.0" y="336.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">F × 4</text>
  </g>
</svg>
