<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" role="img" aria-labelledby="t d">
  <title id="t">Orbits: gravity is the centripetal force</title>
  <desc id="d">A satellite orbits a planet. Gravity points to the planet and acts as the centripetal force. A satellite on an orbit with four times the radius moves at half the speed.</desc>
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect x="0" y="0" width="440" height="420" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Orbit: gravity does the centripetal job</text>
    <circle cx="125" cy="210" r="120" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
    <circle cx="125" cy="210" r="30" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
    <circle cx="125" cy="210" r="12" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="125.0" y="214.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">M</text>
    <line x1="125.0" y1="180.0" x2="69.0" y2="180.0" stroke="#dc2626" stroke-width="3" marker-end="url(#arR)"/>
    <text x="95.0" y="170.0" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">v</text>
    <line x1="125.0" y1="180.0" x2="125.0" y2="190.0" stroke="#111827" stroke-width="2.5" marker-end="url(#arK)"/>
    <text x="137.0" y="200.0" font-size="14" text-anchor="start" fill="#111827" font-weight="bold">F</text>
    <circle cx="125" cy="180" r="6" fill="#dc2626" stroke="#111827" stroke-width="1.5"/>
    <line x1="245.0" y1="210.0" x2="245.0" y2="182.0" stroke="#dc2626" stroke-width="3" marker-end="url(#arR)"/>
    <text x="235.0" y="196.0" font-size="14" text-anchor="end" fill="#dc2626" font-weight="bold">v/2</text>
    <line x1="245.0" y1="210.0" x2="236.0" y2="210.0" stroke="#111827" stroke-width="2" marker-end="url(#arK)"/>
    <text x="235.0" y="232.0" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">F/16</text>
    <circle cx="245" cy="210" r="6" fill="#dc2626" stroke="#111827" stroke-width="1.5"/>
    <line x1="125.0" y1="210.0" x2="103.8" y2="231.2" stroke="#6b7280" stroke-width="1.2"/>
    <text x="106.5" y="238.5" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">r</text>
    <line x1="125.0" y1="210.0" x2="40.1" y2="294.9" stroke="#6b7280" stroke-width="1.2"/>
    <text x="75.0" y="260.0" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">4r</text>
    <text x="296.0" y="70.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">gravity = centripetal:</text>
    <text x="296.0" y="94.0" font-size="14" text-anchor="start" fill="#dc2626" font-weight="bold">GMm/r² = mv²/r</text>
    <text x="296.0" y="126.0" font-size="12" text-anchor="start" fill="#6b7280">the mass m cancels</text>
    <text x="296.0" y="154.0" font-size="17" text-anchor="start" fill="#dc2626" font-weight="bold">v = √(GM/r)</text>
    <text x="296.0" y="190.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">farther → slower</text>
    <text x="296.0" y="210.0" font-size="12" text-anchor="start" fill="#111827">4× the radius</text>
    <text x="296.0" y="226.0" font-size="12" text-anchor="start" fill="#111827">→ ½ the speed</text>
    <text x="296.0" y="262.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Period: T = 2πr / v</text>
    <text x="296.0" y="282.0" font-size="12" text-anchor="start" fill="#6b7280">gives</text>
    <text x="296.0" y="302.0" font-size="14" text-anchor="start" fill="#dc2626" font-weight="bold">T² = 4π²r³/(GM)</text>
    <text x="220.0" y="392.0" font-size="13" text-anchor="middle" fill="#111827">A satellite is always falling toward the planet,</text>
    <text x="220.0" y="410.0" font-size="13" text-anchor="middle" fill="#111827">but it moves sideways so fast that it keeps missing it.</text>
  </g>
</svg>
