<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 474" role="img" aria-labelledby="t d">
  <title id="t">Weight on other worlds and g far from Earth</title>
  <desc id="d">Top: the weight of a 60 kg person on Earth, the Moon and Mars. Bottom: g at one, two, three and four Earth radii from Earth's center: 9.8, 2.45, 1.09 and 0.61 meters per second squared.</desc>
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect x="0" y="0" width="440" height="474" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Mass stays, weight changes</text>
    <text x="220.0" y="44.0" font-size="13" text-anchor="middle" fill="#6b7280">A 60 kg person: weight = m·g, where g = GM/R²</text>
    <text x="70.0" y="82.0" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">Earth</text>
    <rect x="80" y="66" width="240" height="24" fill="#dc2626" fill-opacity="0.3" stroke="#dc2626" stroke-width="1.5"/>
    <text x="326.0" y="83.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">588 N</text>
    <text x="430.0" y="83.0" font-size="12" text-anchor="end" fill="#6b7280">g ≈ 9.8</text>
    <text x="70.0" y="118.0" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">Mars</text>
    <rect x="80" y="102" width="91" height="24" fill="#dc2626" fill-opacity="0.3" stroke="#dc2626" stroke-width="1.5"/>
    <text x="177.0" y="119.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">223 N</text>
    <text x="430.0" y="119.0" font-size="12" text-anchor="end" fill="#6b7280">g ≈ 3.72</text>
    <text x="70.0" y="154.0" font-size="13" text-anchor="end" fill="#111827" font-weight="bold">Moon</text>
    <rect x="80" y="138" width="40" height="24" fill="#dc2626" fill-opacity="0.3" stroke="#dc2626" stroke-width="1.5"/>
    <text x="125.6" y="155.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">97 N</text>
    <text x="430.0" y="155.0" font-size="12" text-anchor="end" fill="#6b7280">g ≈ 1.62</text>
    <text x="220.0" y="184.0" font-size="12" text-anchor="middle" fill="#6b7280">(g in m/s²; about 1.6 and 3.7 if rounded more)</text>
    <text x="220.0" y="220.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">g far from Earth: g = GM/r² (r from Earth's center)</text>
    <rect x="70" y="260" width="52" height="130" fill="#dc2626" fill-opacity="0.3" stroke="#dc2626" stroke-width="1.5"/>
    <text x="96.0" y="254.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">9.8</text>
    <text x="96.0" y="408.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">R</text>
    <rect x="150" y="358" width="52" height="32" fill="#dc2626" fill-opacity="0.3" stroke="#dc2626" stroke-width="1.5"/>
    <text x="176.0" y="351.5" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">2.45</text>
    <text x="176.0" y="408.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">2R</text>
    <rect x="230" y="376" width="52" height="14" fill="#dc2626" fill-opacity="0.3" stroke="#dc2626" stroke-width="1.5"/>
    <text x="256.0" y="369.5" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">1.09</text>
    <text x="256.0" y="408.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">3R</text>
    <rect x="310" y="382" width="52" height="8" fill="#dc2626" fill-opacity="0.3" stroke="#dc2626" stroke-width="1.5"/>
    <text x="336.0" y="375.9" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">0.61</text>
    <text x="336.0" y="408.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">4R</text>
    <line x1="60.0" y1="390.0" x2="390.0" y2="390.0" stroke="#111827" stroke-width="1.5"/>
    <text x="96.0" y="428.0" font-size="12" text-anchor="middle" fill="#6b7280">surface</text>
    <text x="176.0" y="428.0" font-size="12" text-anchor="middle" fill="#6b7280">h = R</text>
    <text x="300.0" y="250.0" font-size="12" text-anchor="start" fill="#6b7280">1 radius above the</text>
    <text x="300.0" y="266.0" font-size="12" text-anchor="start" fill="#6b7280">surface is r = 2R:</text>
    <text x="300.0" y="284.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">g is only ¼</text>
    <text x="220.0" y="462.0" font-size="12" text-anchor="middle" fill="#6b7280">R = radius of Earth. Double r → g ÷ 4.</text>
  </g>
</svg>
