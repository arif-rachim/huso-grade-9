<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 371" role="img">
  <title>Heating curve of water</title>
  <desc>Temperature against heat added for 1 kg of water from ice at -20 degrees C to steam at 120 degrees C. Slanted parts are warming, flat parts at 0 and 100 degrees C are melting and boiling. Widths are not to scale.</desc>
  <rect x="0" y="0" width="440" height="371" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="16" text-anchor="middle" font-weight="bold">Heating 1 kg of ice until it is steam</text>
    <line x1="64.0" y1="40.0" x2="64.0" y2="200.0" stroke="#111827" stroke-width="1.8"/>
    <line x1="64.0" y1="200.0" x2="428.0" y2="200.0" stroke="#111827" stroke-width="1.8"/>
    <line x1="418.0" y1="200.0" x2="430.0" y2="200.0" stroke="#111827" stroke-width="1.8"/>
    <path d="M421.7 203.5 L430.0 200.0 L421.7 196.5" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="56.0" y="30.0" font-size="12" text-anchor="end">T (°C)</text>
    <text x="428.0" y="218.0" font-size="12" text-anchor="end">heat added →</text>
    <line x1="60.0" y1="200.0" x2="64.0" y2="200.0" stroke="#111827" stroke-width="1.5"/>
    <text x="56.0" y="204.0" font-size="12" text-anchor="end">−20</text>
    <line x1="60.0" y1="178.6" x2="64.0" y2="178.6" stroke="#111827" stroke-width="1.5"/>
    <text x="56.0" y="182.6" font-size="12" text-anchor="end">0</text>
    <line x1="64.0" y1="178.6" x2="414.0" y2="178.6" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="60.0" y1="71.4" x2="64.0" y2="71.4" stroke="#111827" stroke-width="1.5"/>
    <text x="56.0" y="75.4" font-size="12" text-anchor="end">100</text>
    <line x1="64.0" y1="71.4" x2="414.0" y2="71.4" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="60.0" y1="50.0" x2="64.0" y2="50.0" stroke="#111827" stroke-width="1.5"/>
    <text x="56.0" y="54.0" font-size="12" text-anchor="end">120</text>
    <path d="M64.0 200.0 L90.0 178.6 L90.0 178.6 L148.0 178.6 L148.0 178.6 L298.0 71.4 L298.0 71.4 L388.0 71.4 L388.0 71.4 L414.0 50.0" fill="none" stroke="#dc2626" stroke-width="3.5"/>
    <circle cx="79.0" cy="169.3" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="79.0" y="173.8" font-size="12" text-anchor="middle" font-weight="bold" fill="#dc2626">1</text>
    <circle cx="119.0" cy="162.6" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="119.0" y="167.1" font-size="12" text-anchor="middle" font-weight="bold" fill="#dc2626">2</text>
    <circle cx="205.0" cy="135.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="205.0" y="139.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#dc2626">3</text>
    <circle cx="343.0" cy="55.4" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="343.0" y="59.9" font-size="12" text-anchor="middle" font-weight="bold" fill="#dc2626">4</text>
    <circle cx="415.0" cy="74.7" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="415.0" y="79.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#dc2626">5</text>
    <circle cx="24.0" cy="236.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="24.0" y="240.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#dc2626">1</text>
    <text x="40.0" y="240.0" font-size="12" text-anchor="start">ice warms: Q = mcΔT</text>
    <text x="300.0" y="240.0" font-size="12" text-anchor="end" fill="#6b7280">1 × 2100 × 20 =</text>
    <text x="316.0" y="240.0" font-size="12" text-anchor="start" font-weight="bold">42 kJ</text>
    <circle cx="24.0" cy="257.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="24.0" y="261.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#dc2626">2</text>
    <text x="40.0" y="261.0" font-size="12" text-anchor="start">ice melts: Q = mL (flat!)</text>
    <text x="300.0" y="261.0" font-size="12" text-anchor="end" fill="#6b7280">1 × 334 000 =</text>
    <text x="316.0" y="261.0" font-size="12" text-anchor="start" font-weight="bold">334 kJ</text>
    <circle cx="24.0" cy="278.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="24.0" y="282.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#dc2626">3</text>
    <text x="40.0" y="282.0" font-size="12" text-anchor="start">water warms: Q = mcΔT</text>
    <text x="300.0" y="282.0" font-size="12" text-anchor="end" fill="#6b7280">1 × 4186 × 100 =</text>
    <text x="316.0" y="282.0" font-size="12" text-anchor="start" font-weight="bold">419 kJ</text>
    <circle cx="24.0" cy="299.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="24.0" y="303.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#dc2626">4</text>
    <text x="40.0" y="303.0" font-size="12" text-anchor="start">water boils: Q = mL (flat!)</text>
    <text x="300.0" y="303.0" font-size="12" text-anchor="end" fill="#6b7280">1 × 2 260 000 =</text>
    <text x="316.0" y="303.0" font-size="12" text-anchor="start" font-weight="bold">2 260 kJ</text>
    <circle cx="24.0" cy="320.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="24.0" y="324.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#dc2626">5</text>
    <text x="40.0" y="324.0" font-size="12" text-anchor="start">steam warms: Q = mcΔT</text>
    <text x="300.0" y="324.0" font-size="12" text-anchor="end" fill="#6b7280">1 × 2010 × 20 =</text>
    <text x="316.0" y="324.0" font-size="12" text-anchor="start" font-weight="bold">40 kJ</text>
    <text x="220.0" y="355.0" font-size="12" text-anchor="middle" fill="#6b7280">Widths are stretched to fit: segment 4 is really the longest.</text>

  </g>
</svg>
