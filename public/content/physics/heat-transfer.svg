    <text x="220.0" y="76.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#dc2626">warm water rises</text>
    <text x="220.0" y="214.0" font-size="12" text-anchor="middle">Moving fluid carries</text>
    <text x="220.0" y="230.0" font-size="12" text-anchor="middle">the heat. Liquids, gases.</text>
    <text x="364.0" y="62.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#dc2626">Radiation</text>
