    <text x="76.0" y="218.0" font-size="12" text-anchor="middle" fill="#6b7280">Solids, touching</text>
    <text x="76.0" y="234.0" font-size="12" text-anchor="middle" fill="#6b7280">(spoon, pan handle)</text>
