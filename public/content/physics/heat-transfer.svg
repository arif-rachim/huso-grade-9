    <rect x="402.0" y="92.0" width="22.0" height="40.0" rx="0" fill="#6b7280" fill-opacity="0.15" stroke="#6b7280" stroke-width="1.5"/>
    <text x="413.0" y="150.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#6b7280">food</text>
    <text x="322.0" y="150.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#dc2626">burner</text>
    <text x="364.0" y="184.0" font-size="12" text-anchor="middle">Glowing things send out</text>
    <text x="364.0" y="200.0" font-size="12" text-anchor="middle">light waves.</text>
    <text x="364.0" y="218.0" font-size="12" text-anchor="middle" fill="#6b7280">No matter needed</text>
    <text x="364.0" y="234.0" font-size="12" text-anchor="middle" fill="#6b7280">(even through space)</text>

