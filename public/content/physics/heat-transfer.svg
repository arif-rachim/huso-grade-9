<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 256" role="img">
  <title>Conduction, convection and radiation</title>
  <desc>Three panels. Conduction: heat passes along a hot spoon by touching particles. Convection: warm water rises and cool water sinks in a pot. Radiation: a hot burner sends heat as light waves with no matter in between.</desc>
