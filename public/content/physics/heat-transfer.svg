    <rect x="152.0" y="40.0" width="136.0" height="205.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.2"/>
    <rect x="296.0" y="40.0" width="136.0" height="205.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.2"/>
    <text x="76.0" y="62.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#dc2626">Conduction</text>
    <rect x="24.0" y="102.0" width="104.0" height="26.0" rx="0" fill="#dc2626" fill-opacity="0.12" stroke="#6b7280" stroke-width="1.2"/>
