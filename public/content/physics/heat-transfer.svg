    <path d="M205.0 194.0 C194.2 188.6 197.8 174.2 205.0 167.0 C207.7 176.0 215.8 181.4 214.0 190.4 C213.1 194.0 208.6 195.8 205.0 194.0 Z" fill="#dc2626" fill-opacity="0.25" stroke="#dc2626" stroke-width="1.5"/>
