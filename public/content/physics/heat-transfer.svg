    <text x="112.0" y="84.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#6b7280">cooler</text>
    <line x1="44.0" y1="94.0" x2="112.0" y2="94.0" stroke="#dc2626" stroke-width="2"/>
    <path d="M103.7 97.5 L112.0 94.0 L103.7 90.5" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round"/>
