<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 378" role="img">
  <title>A bubble rising from 20 m depth</title>
  <desc>A bubble at 20 m depth has pressure 3 atm and volume 2 cm3. At 10 m it is 2 atm and 3 cm3. At the surface it is 1 atm and 6 cm3. The product P times V stays 6.</desc>
  <rect x="0" y="0" width="440" height="378" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="16" text-anchor="middle" font-weight="bold">A bubble rises (same temperature)</text>
    <rect x="30.0" y="70.0" width="160.0" height="214.0" rx="0" fill="#6b7280" fill-opacity="0.12" stroke="#6b7280" stroke-width="1"/>
    <path d="M30 70 Q40 64 50 70 Q60 64 70 70 Q80 64 90 70 Q100 64 110 70 Q120 64 130 70 Q140 64 150 70 Q160 64 170 70 Q180 64 190 70" fill="none" stroke="#111827" stroke-width="2"/>
    <circle cx="110.0" cy="250.0" r="9.0" fill="#dc2626" fill-opacity="0.25" stroke="#dc2626" stroke-width="1.8"/>
    <circle cx="110.0" cy="160.0" r="10.3" fill="#dc2626" fill-opacity="0.25" stroke="#dc2626" stroke-width="1.8"/>
    <circle cx="110.0" cy="57.0" r="13.0" fill="#dc2626" fill-opacity="0.25" stroke="#dc2626" stroke-width="1.8"/>
    <line x1="110.0" y1="234.0" x2="110.0" y2="174.0" stroke="#6b7280" stroke-width="1.8"/>
    <path d="M113.5 182.3 L110.0 174.0 L106.5 182.3" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="110.0" y1="144.0" x2="110.0" y2="92.0" stroke="#6b7280" stroke-width="1.8"/>
    <path d="M113.5 100.3 L110.0 92.0 L106.5 100.3" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="196.0" y1="250.0" x2="204.0" y2="250.0" stroke="#111827" stroke-width="1.5"/>
    <text x="210.0" y="246.0" font-size="12" text-anchor="start" font-weight="bold">20 m deep</text>
    <text x="210.0" y="262.0" font-size="12" text-anchor="start" font-weight="bold" fill="#dc2626">P = 3 atm</text>
    <text x="210.0" y="278.0" font-size="12" text-anchor="start">V = 2 cm³</text>
    <line x1="196.0" y1="160.0" x2="204.0" y2="160.0" stroke="#111827" stroke-width="1.5"/>
    <text x="210.0" y="156.0" font-size="12" text-anchor="start" font-weight="bold">10 m deep</text>
    <text x="210.0" y="172.0" font-size="12" text-anchor="start" font-weight="bold" fill="#dc2626">P = 2 atm</text>
    <text x="210.0" y="188.0" font-size="12" text-anchor="start">V = 3 cm³</text>
    <line x1="196.0" y1="70.0" x2="204.0" y2="70.0" stroke="#111827" stroke-width="1.5"/>
    <text x="210.0" y="66.0" font-size="12" text-anchor="start" font-weight="bold">surface</text>
    <text x="210.0" y="82.0" font-size="12" text-anchor="start" font-weight="bold" fill="#dc2626">P = 1 atm</text>
    <text x="210.0" y="98.0" font-size="12" text-anchor="start">V = 6 cm³</text>
    <text x="220.0" y="326.0" font-size="13" text-anchor="middle" font-weight="bold">P × V stays 6 (3×2 = 2×3 = 1×6).</text>
    <text x="220.0" y="346.0" font-size="12" text-anchor="middle" fill="#6b7280">Every 10 m of water adds about 1 atm, and the air above adds 1 atm.</text>
    <text x="220.0" y="364.0" font-size="12" text-anchor="middle" fill="#6b7280">The bubble grows as the pressure drops: Boyle.</text>

  </g>
</svg>
