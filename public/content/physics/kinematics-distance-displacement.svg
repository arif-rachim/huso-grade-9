<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" role="img" aria-labeledby="t d">
  <title id="t">Distance versus displacement</title>
  <desc id="d">A swimmer swims one 25 m length: distance 25 m, displacement 25 m. Down and back: distance 50 m, displacement 0. Table of scalars and vectors.</desc>
  <rect x="0" y="0" width="440" height="380" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="17" text-anchor="middle" fill="#111827" font-weight="bold">Distance vs displacement</text>
    <rect x="40.0" y="58.0" width="360.0" height="34.0" rx="3" fill="#dc2626" fill-opacity="0.07" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="112.0" y1="61.0" x2="112.0" y2="89.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 4"/>
    <line x1="184.0" y1="61.0" x2="184.0" y2="89.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 4"/>
    <line x1="256.0" y1="61.0" x2="256.0" y2="89.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 4"/>
    <line x1="328.0" y1="61.0" x2="328.0" y2="89.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 4"/>
    <text x="40.0" y="52.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">One length</text>
    <circle cx="48.0" cy="75.0" r="5" fill="#dc2626"/>
    <line x1="48.0" y1="75.0" x2="384.0" y2="75.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <polygon points="392.0,75.0 383.0,79.0 383.0,71.0" fill="#dc2626"/>
    <text x="220.0" y="114.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">distance 25 m   ·   displacement 25 m →</text>
    <rect x="40.0" y="150.0" width="360.0" height="34.0" rx="3" fill="#dc2626" fill-opacity="0.07" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="112.0" y1="153.0" x2="112.0" y2="181.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 4"/>
    <line x1="184.0" y1="153.0" x2="184.0" y2="181.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 4"/>
    <line x1="256.0" y1="153.0" x2="256.0" y2="181.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 4"/>
    <line x1="328.0" y1="153.0" x2="328.0" y2="181.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 4"/>
    <text x="40.0" y="144.0" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">Down and back (one lap)</text>
    <circle cx="48.0" cy="160.0" r="5" fill="#dc2626"/>
    <line x1="48.0" y1="160.0" x2="384.0" y2="160.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <polygon points="392.0,160.0 383.0,164.1 383.0,155.9" fill="#dc2626"/>
    <line x1="392.0" y1="176.0" x2="66.0" y2="176.0" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <polygon points="58.0,176.0 67.0,171.9 67.0,180.1" fill="#111827"/>
    <circle cx="48.0" cy="176.0" r="5" fill="#111827"/>
    <text x="220.0" y="214.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">distance 25 + 25 = 50 m   ·   displacement 0 m</text>
    <text x="220.0" y="232.0" font-size="12" text-anchor="middle" fill="#6b7280">(you end where you started)</text>
    <rect x="20.0" y="248.0" width="195.0" height="120.0" rx="8" fill="#dc2626" fill-opacity="0.08"/>
    <rect x="225.0" y="248.0" width="195.0" height="120.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="117.0" y="270.0" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">Scalar = size only</text>
    <text x="117.0" y="292.0" font-size="13" text-anchor="middle" fill="#111827">distance (m)</text>
    <text x="117.0" y="312.0" font-size="13" text-anchor="middle" fill="#111827">speed (m/s)</text>
    <text x="117.0" y="332.0" font-size="13" text-anchor="middle" fill="#111827">time, mass, energy</text>
    <text x="117.0" y="354.0" font-size="12" text-anchor="middle" fill="#6b7280">avg speed = distance ÷ time</text>
    <text x="322.0" y="270.0" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">Vector = size + direction</text>
    <text x="322.0" y="292.0" font-size="13" text-anchor="middle" fill="#111827">displacement (m)</text>
    <text x="322.0" y="312.0" font-size="13" text-anchor="middle" fill="#111827">velocity (m/s)</text>
    <text x="322.0" y="332.0" font-size="13" text-anchor="middle" fill="#111827">acceleration (m/s²)</text>
    <text x="322.0" y="354.0" font-size="12" text-anchor="middle" fill="#6b7280">avg velocity = displacement ÷ time</text>
  </g>
</svg>
