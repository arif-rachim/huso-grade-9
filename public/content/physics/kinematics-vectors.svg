<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" role="img" aria-labelledby="t d">
  <title id="t">Adding vectors and components</title>
  <desc id="d">Tip-to-tail: 6 m east plus 8 m north gives a resultant of 10 m by Pythagoras. A 10 m/s velocity at 37 degrees has components 8 m/s horizontal and 6 m/s vertical.</desc>
  <rect x="0" y="0" width="440" height="340" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="17" text-anchor="middle" fill="#111827" font-weight="bold">Adding vectors</text>
    <rect x="8.0" y="40.0" width="206.0" height="292.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <rect x="226.0" y="40.0" width="206.0" height="292.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="111.0" y="62.0" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">Tip to tail</text>
    <text x="111.0" y="84.0" font-size="12" text-anchor="middle" fill="#6b7280">Draw the second arrow</text>
    <text x="111.0" y="100.0" font-size="12" text-anchor="middle" fill="#6b7280">starting at the tip of the first.</text>
    <line x1="58.0" y1="250.0" x2="166.0" y2="250.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
    <line x1="58.0" y1="250.0" x2="122.0" y2="250.0" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <polygon points="130.0,250.0 121.0,254.1 121.0,245.9" fill="#111827"/>
    <line x1="130.0" y1="250.0" x2="130.0" y2="162.0" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <polygon points="130.0,154.0 134.1,163.0 126.0,163.0" fill="#111827"/>
    <line x1="58.0" y1="250.0" x2="125.2" y2="160.4" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="130.0,154.0 127.8,163.6 121.4,158.8" fill="#dc2626"/>
    <text x="94.0" y="268.0" font-size="13" text-anchor="middle" fill="#111827">6 m east</text>
    <text x="138.0" y="206.0" font-size="13" text-anchor="start" fill="#111827">8 m north</text>
    <text x="78.0" y="198.0" font-size="13" text-anchor="end" fill="#dc2626" font-weight="bold">result</text>
    <text x="78.0" y="214.0" font-size="13" text-anchor="end" fill="#dc2626" font-weight="bold">10 m</text>
    <circle cx="58.0" cy="250.0" r="4" fill="#111827"/>
    <text x="111.0" y="300.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">R = √(6² + 8²) = √100 = 10 m</text>
    <text x="111.0" y="320.0" font-size="12" text-anchor="middle" fill="#6b7280">(right angle ⇒ Pythagoras)</text>
    <text x="329.0" y="62.0" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">Components</text>
    <text x="329.0" y="84.0" font-size="12" text-anchor="middle" fill="#6b7280">Split a slanted arrow into a</text>
    <text x="329.0" y="100.0" font-size="12" text-anchor="middle" fill="#6b7280">flat part and an upright part.</text>
    <line x1="244.0" y1="250.0" x2="341.6" y2="176.8" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="348.0,172.0 343.2,180.6 338.4,174.2" fill="#dc2626"/>
    <line x1="244.0" y1="250.0" x2="340.0" y2="250.0" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="348.0,250.0 339.0,254.1 339.0,245.9" fill="#111827"/>
    <line x1="348.0" y1="250.0" x2="348.0" y2="180.0" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="348.0,172.0 352.1,181.0 343.9,181.0" fill="#111827"/>
    <rect x="338.0" y="240.0" width="10.0" height="10.0" rx="0" fill="none" stroke="#6b7280" stroke-width="1.2"/>
    <path d="M 278 250 A 34 34 0 0 0 271.2 229.6" fill="none" stroke="#111827" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="284.0" y="242.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">37°</text>
    <text x="296.0" y="270.0" font-size="13" text-anchor="middle" fill="#111827">vₓ = 8  (v cos θ)</text>
    <text x="356.0" y="213.0" font-size="13" text-anchor="start" fill="#111827">v_y = 6</text>
    <text x="356.0" y="229.0" font-size="12" text-anchor="start" fill="#6b7280">(v sin θ)</text>
    <text x="288.0" y="199.0" font-size="13" text-anchor="end" fill="#dc2626" font-weight="bold">10 m/s</text>
    <text x="329.0" y="300.0" font-size="12" text-anchor="middle" fill="#6b7280">Handy right triangles:</text>
    <text x="329.0" y="320.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">3-4-5   6-8-10   5-12-13</text>
  </g>
</svg>
