<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 388" role="img">
  <title>A heat engine and its efficiency</title>
  <desc>A heat engine takes 1000 J from a hot source at 500 K, delivers 400 J of work and gives 600 J to a cold sink at 300 K. Efficiency is 40 percent, which equals the Carnot limit 1 minus Tc over Th.</desc>
  <rect x="0" y="0" width="440" height="388" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="16" text-anchor="middle" font-weight="bold">A heat engine</text>
    <rect x="120.0" y="40.0" width="200.0" height="44.0" rx="0" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="220.0" y="60.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#dc2626">hot source: T = 500 K</text>
    <text x="220.0" y="76.0" font-size="12" text-anchor="middle" fill="#6b7280">(burning fuel)</text>
    <rect x="120.0" y="262.0" width="200.0" height="44.0" rx="0" fill="#6b7280" fill-opacity="0.2" stroke="#6b7280" stroke-width="1.5"/>
    <text x="220.0" y="282.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#6b7280">cold sink: T = 300 K</text>
    <text x="220.0" y="298.0" font-size="12" text-anchor="middle" fill="#6b7280">(air, river)</text>
    <circle cx="220.0" cy="172.0" r="42.0" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <text x="220.0" y="168.0" font-size="14" text-anchor="middle" font-weight="bold">engine</text>
    <text x="220.0" y="185.0" font-size="12" text-anchor="middle" fill="#6b7280">cycle</text>
    <rect x="210.0" y="88.0" width="20.0" height="28.0" rx="0" fill="#dc2626" fill-opacity="0.5" stroke="#dc2626" stroke-width="0"/>
    <path d="M204.0 116.0 L236.0 116.0 L220.0 128.0 Z" fill="#dc2626" stroke="none"/>
    <text x="246.0" y="110.0" font-size="13" text-anchor="start" font-weight="bold" fill="#dc2626">Q<tspan dy="3" font-size="10">h</tspan><tspan dy="-3">&#8203;</tspan> = 1000 J</text>
    <rect x="214.0" y="214.0" width="12.0" height="28.0" rx="0" fill="#6b7280" fill-opacity="0.5" stroke="#6b7280" stroke-width="0"/>
    <path d="M208.0 242.0 L232.0 242.0 L220.0 258.0 Z" fill="#6b7280" stroke="none"/>
    <text x="240.0" y="238.0" font-size="13" text-anchor="start" font-weight="bold" fill="#6b7280">Q<tspan dy="3" font-size="10">c</tspan><tspan dy="-3">&#8203;</tspan> = 600 J</text>
    <rect x="262.0" y="168.0" width="60.0" height="8.0" rx="0" fill="#111827" fill-opacity="0.5" stroke="#111827" stroke-width="0"/>
    <path d="M322.0 164.0 L322.0 180.0 L372.0 172.0 Z" fill="#111827" stroke="none"/>
    <text x="342.0" y="154.0" font-size="13" text-anchor="middle" font-weight="bold">W = 400 J</text>
    <text x="342.0" y="200.0" font-size="12" text-anchor="middle" fill="#6b7280">useful work</text>
    <text x="220.0" y="332.0" font-size="13" text-anchor="middle" font-weight="bold">Q<tspan dy="3" font-size="10">h</tspan><tspan dy="-3">&#8203;</tspan> = W + Q<tspan dy="3" font-size="10">c</tspan><tspan dy="-3">&#8203;</tspan>     e = W ÷ Q<tspan dy="3" font-size="10">h</tspan><tspan dy="-3">&#8203;</tspan> = 400 ÷ 1000 = 40%</text>
    <text x="220.0" y="354.0" font-size="13" text-anchor="middle">Best possible (Carnot): e = 1 − T<tspan dy="3" font-size="10">c</tspan><tspan dy="-3">&#8203;</tspan>/T<tspan dy="3" font-size="10">h</tspan><tspan dy="-3">&#8203;</tspan> = 1 − 300/500 = 40%</text>
    <text x="220.0" y="374.0" font-size="12" text-anchor="middle" fill="#6b7280">h = hot, c = cold. Kelvin only. A real engine does worse; 100% is impossible.</text>

  </g>
</svg>
