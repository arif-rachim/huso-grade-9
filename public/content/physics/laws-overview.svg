<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 336" role="img">
  <title>The laws of thermodynamics</title>
  <desc>Four cards: zeroth law (A equals B and B equals C so A equals C), first law (change in internal energy equals heat in minus work out), second law (heat flows from hot to cold, entropy does not decrease), third law (absolute zero 0 K = -273 C cannot be reached).</desc>
  <rect x="0" y="0" width="440" height="336" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="24.0" font-size="16" text-anchor="middle" font-weight="bold">The three laws (plus the zeroth)</text>
    <rect x="8.0" y="38.0" width="208.0" height="138.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.2"/>
    <rect x="224.0" y="38.0" width="208.0" height="138.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.2"/>
    <rect x="8.0" y="186.0" width="208.0" height="138.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.2"/>
    <rect x="224.0" y="186.0" width="208.0" height="138.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.2"/>
    <text x="112.0" y="60.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#dc2626">0th: equilibrium</text>
    <circle cx="44.0" cy="96.0" r="15.0" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="1.5"/>
    <text x="44.0" y="101.0" font-size="14" text-anchor="middle" font-weight="bold">A</text>
    <circle cx="112.0" cy="96.0" r="15.0" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="1.5"/>
    <text x="112.0" y="101.0" font-size="14" text-anchor="middle" font-weight="bold">B</text>
    <circle cx="180.0" cy="96.0" r="15.0" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="1.5"/>
    <text x="180.0" y="101.0" font-size="14" text-anchor="middle" font-weight="bold">C</text>
    <text x="78.0" y="100.0" font-size="18" text-anchor="middle" font-weight="bold">=</text>
    <text x="146.0" y="100.0" font-size="18" text-anchor="middle" font-weight="bold">=</text>
    <text x="112.0" y="134.0" font-size="13" text-anchor="middle">A = B and B = C,</text>
    <text x="112.0" y="152.0" font-size="13" text-anchor="middle">so A = C (same temperature)</text>
    <text x="328.0" y="60.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#dc2626">1st: energy is conserved</text>
    <rect x="292.0" y="76.0" width="72.0" height="40.0" rx="0" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="1.5"/>
    <text x="328.0" y="101.0" font-size="16" text-anchor="middle" font-weight="bold">ΔU</text>
    <line x1="244.0" y1="96.0" x2="290.0" y2="96.0" stroke="#dc2626" stroke-width="3"/>
    <path d="M281.7 99.5 L290.0 96.0 L281.7 92.5" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>
    <text x="258.0" y="88.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#dc2626">Q in</text>
    <line x1="366.0" y1="96.0" x2="414.0" y2="96.0" stroke="#6b7280" stroke-width="3"/>
    <path d="M405.7 99.5 L414.0 96.0 L405.7 92.5" fill="none" stroke="#6b7280" stroke-width="3" stroke-linejoin="round"/>
    <text x="392.0" y="88.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#6b7280">W out</text>
    <text x="328.0" y="142.0" font-size="16" text-anchor="middle" font-weight="bold">ΔU = Q − W</text>
    <text x="328.0" y="162.0" font-size="12" text-anchor="middle" fill="#6b7280">heat in, minus work out</text>
    <text x="112.0" y="208.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#dc2626">2nd: heat flows downhill</text>
    <rect x="22.0" y="224.0" width="60.0" height="36.0" rx="0" fill="#dc2626" fill-opacity="0.25" stroke="#dc2626" stroke-width="1.5"/>
    <text x="52.0" y="247.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#dc2626">hot</text>
    <rect x="142.0" y="224.0" width="60.0" height="36.0" rx="0" fill="#6b7280" fill-opacity="0.2" stroke="#6b7280" stroke-width="1.5"/>
    <text x="172.0" y="247.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#6b7280">cold</text>
    <line x1="86.0" y1="236.0" x2="138.0" y2="236.0" stroke="#dc2626" stroke-width="3"/>
    <path d="M129.7 239.5 L138.0 236.0 L129.7 232.5" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>
    <line x1="138.0" y1="252.0" x2="86.0" y2="252.0" stroke="#d1d5db" stroke-width="2"/>
    <path d="M94.3 248.5 L86.0 252.0 L94.3 255.5" fill="none" stroke="#d1d5db" stroke-width="2" stroke-linejoin="round"/>
    <line x1="104.0" y1="246.0" x2="120.0" y2="258.0" stroke="#dc2626" stroke-width="3"/>
    <line x1="120.0" y1="246.0" x2="104.0" y2="258.0" stroke="#dc2626" stroke-width="3"/>
    <text x="112.0" y="286.0" font-size="13" text-anchor="middle">Not by itself the other way.</text>
    <text x="112.0" y="304.0" font-size="13" text-anchor="middle">Entropy (disorder) never drops.</text>
    <text x="328.0" y="208.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#dc2626">3rd: absolute zero</text>
    <rect x="246.0" y="224.0" width="20.0" height="70.0" rx="8" fill="none" stroke="#111827" stroke-width="1.5"/>
    <rect x="251.0" y="270.0" width="10.0" height="22.0" rx="0" fill="#dc2626" fill-opacity="0.6" stroke="#dc2626" stroke-width="0"/>
    <text x="276.0" y="230.0" font-size="12" text-anchor="start">20 °C = 293 K</text>
    <text x="276.0" y="260.0" font-size="12" text-anchor="start">0 °C = 273 K</text>
    <text x="276.0" y="290.0" font-size="12" text-anchor="start" font-weight="bold" fill="#dc2626">0 K = −273 °C</text>
    <text x="328.0" y="314.0" font-size="12" text-anchor="middle" fill="#6b7280">Close, but never exactly 0 K.</text>

  </g>
</svg>
