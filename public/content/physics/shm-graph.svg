    <text x="220.0" y="270.0" font-size="12" text-anchor="middle" fill="#6b7280">one period T = one full back-and-forth</text>
    <circle cx="60" cy="70" r="5" fill="#dc2626"/>
    <text x="70.0" y="60.0" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">peak: v = 0, all PE</text>
    <circle cx="140.0" cy="150" r="5" fill="#111827"/>
    <text x="148.0" y="140.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">crossing 0: fastest, all KE</text>
    <text x="220.0" y="300.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">f = 1/T  (hertz = cycles per second)</text>
    <text x="220.0" y="324.0" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">Smaller or larger swing: the period stays the same.</text>
    <text x="220.0" y="348.0" font-size="13" text-anchor="middle" fill="#6b7280">Total energy ½kA² is constant, it only swaps between PE and KE.</text>
    <text x="220.0" y="372.0" font-size="13" text-anchor="middle" fill="#6b7280">Dashed wave: half the amplitude, same period.</text>
  </g>
</svg>
