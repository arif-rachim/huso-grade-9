<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-labeledby="t d">
  <title id="t">Simple pendulum</title>
  <desc id="d">A pendulum bob on a string of length L swings between two extremes. At the extremes it is highest with all potential energy, at the bottom it is fastest with all kinetic energy. The period depends on L and g, not on the mass.</desc>
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect x="0" y="0" width="440" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="22.0" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Simple pendulum</text>
    <line x1="90.0" y1="54.0" x2="210.0" y2="54.0" stroke="#111827" stroke-width="4"/>
    <line x1="150.0" y1="54.0" x2="75.1" y2="239.4" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="75.1" cy="239.4" r="15" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="150.0" y1="54.0" x2="224.9" y2="239.4" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="224.9" cy="239.4" r="15" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="150.0" y1="54.0" x2="150.0" y2="254.0" stroke="#6b7280" stroke-width="2"/>
    <circle cx="150.0" cy="254.0" r="15" fill="#dc2626" fill-opacity="0.25" stroke="#dc2626" stroke-width="2" stroke-opacity="1"/>
    <circle cx="150" cy="54" r="4" fill="#111827"/>
    <line x1="150.0" y1="54.0" x2="150.0" y2="294.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="141.0" y="154.0" font-size="15" text-anchor="end" fill="#111827" font-weight="bold">L</text>
    <path d="M 150 124 A 70 70 0 0 0 176.2 118.9" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="175.6" y="146.0" font-size="14" text-anchor="start" fill="#111827" font-weight="bold">θ</text>
    <line x1="246.9" y1="239.4" x2="246.9" y2="254.0" stroke="#6b7280" stroke-width="1.2"/>
    <line x1="240.9" y1="239.4" x2="252.9" y2="239.4" stroke="#6b7280" stroke-width="1.2"/>
    <line x1="240.9" y1="254.0" x2="252.9" y2="254.0" stroke="#6b7280" stroke-width="1.2"/>
    <text x="258.9" y="251.7" font-size="14" text-anchor="start" fill="#111827" font-weight="bold">h</text>
    <line x1="160.0" y1="254.0" x2="246.9" y2="254.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="14.0" y="279.4" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">extreme: highest,</text>
    <text x="14.0" y="295.4" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold">v = 0, all PE</text>
    <text x="170.0" y="320.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">bottom: fastest, all KE</text>
    <text x="285.0" y="80.0" font-size="17" text-anchor="start" fill="#dc2626" font-weight="bold">T = 2π√(L/g)</text>
    <text x="285.0" y="108.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Changes T:</text>
    <text x="285.0" y="128.0" font-size="12" text-anchor="start" fill="#111827">• length L (longer → slower)</text>
    <text x="285.0" y="146.0" font-size="12" text-anchor="start" fill="#111827">• gravity g (weaker → slower)</text>
    <text x="285.0" y="176.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">Does NOT change T:</text>
    <text x="285.0" y="196.0" font-size="12" text-anchor="start" fill="#111827">• the mass of the bob</text>
    <text x="285.0" y="214.0" font-size="12" text-anchor="start" fill="#111827">• the size of a small swing</text>
    <text x="285.0" y="244.0" font-size="14" text-anchor="start" fill="#dc2626" font-weight="bold">L × 4  →  T × 2</text>
    <text x="285.0" y="266.0" font-size="12" text-anchor="start" fill="#6b7280">(small angles only, less</text>
    <text x="285.0" y="282.0" font-size="12" text-anchor="start" fill="#6b7280">than about 15°)</text>
    <text x="220.0" y="376.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Energy: mgh at the top turns into ½mv² at the bottom.</text>
  </g>
</svg>
