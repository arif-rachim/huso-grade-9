<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" role="img" aria-labeledby="t d">
  <title id="t">Mass on a spring: force and energy</title>
  <desc id="d">A block on a spring at three positions: stretched, at rest position and compressed. The force always points back to the rest position. Potential energy is largest at the ends, kinetic energy at the middle.</desc>
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect x="0" y="0" width="440" height="420" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="220.0" y="22.0" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold">Spring: the force always points back</text>
    <line x1="200.0" y1="38.0" x2="200.0" y2="346.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4"/>
    <line x1="30.0" y1="48.0" x2="30.0" y2="112.0" stroke="#111827" stroke-width="3"/>
    <polyline points="30.0,80.0 43.4,91.0 54.2,69.0 64.9,91.0 75.7,69.0 86.5,91.0 97.3,69.0 108.1,91.0 118.8,69.0 129.6,91.0 140.4,69.0 151.2,91.0 161.9,69.0 172.7,91.0 183.5,69.0 194.3,91.0 205.1,69.0 215.8,91.0 226.6,69.0 240.0,80.0" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round"/>
    <rect x="240" y="60" width="40" height="40" rx="4" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="2"/>
    <text x="260.0" y="85.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">m</text>
    <text x="36.0" y="44.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">stretched: x = +A</text>
    <line x1="240.0" y1="50.0" x2="195.0" y2="50.0" stroke="#dc2626" stroke-width="3" marker-end="url(#arR)"/>
    <text x="36.0" y="126.0" font-size="12" text-anchor="start" fill="#dc2626">F = −kA  (points left)</text>
    <text x="324.0" y="72.0" font-size="12" text-anchor="end" fill="#6b7280">PE</text>
    <rect x="330" y="62" width="80" height="12" fill="#dc2626" fill-opacity="0.6"/>
    <rect x="330" y="62" width="80" height="12" fill="none" stroke="#d1d5db"/>
    <text x="324.0" y="94.0" font-size="12" text-anchor="end" fill="#6b7280">KE</text>
    <rect x="330" y="84" width="80" height="12" fill="none" stroke="#d1d5db"/>
    <line x1="30.0" y1="158.0" x2="30.0" y2="222.0" stroke="#111827" stroke-width="3"/>
    <polyline points="30.0,190.0 41.7,201.0 49.2,179.0 56.6,201.0 64.1,179.0 71.5,201.0 78.9,179.0 86.4,201.0 93.8,179.0 101.3,201.0 108.7,179.0 116.2,201.0 123.6,179.0 131.1,201.0 138.5,179.0 145.9,201.0 153.4,179.0 160.8,201.0 168.3,179.0 180.0,190.0" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round"/>
    <rect x="180" y="170" width="40" height="40" rx="4" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="2"/>
    <text x="200.0" y="195.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">m</text>
    <text x="36.0" y="154.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">rest position: x = 0</text>
    <text x="36.0" y="236.0" font-size="12" text-anchor="start" fill="#6b7280">F = 0</text>
    <text x="324.0" y="182.0" font-size="12" text-anchor="end" fill="#6b7280">PE</text>
    <rect x="330" y="172" width="80" height="12" fill="none" stroke="#d1d5db"/>
    <text x="324.0" y="204.0" font-size="12" text-anchor="end" fill="#6b7280">KE</text>
    <rect x="330" y="194" width="80" height="12" fill="#111827" fill-opacity="0.6"/>
    <rect x="330" y="194" width="80" height="12" fill="none" stroke="#d1d5db"/>
    <line x1="30.0" y1="268.0" x2="30.0" y2="332.0" stroke="#111827" stroke-width="3"/>
    <polyline points="30.0,300.0 40.1,311.0 44.2,289.0 48.3,311.0 52.4,289.0 56.5,311.0 60.6,289.0 64.7,311.0 68.8,289.0 72.9,311.0 77.1,289.0 81.2,311.0 85.3,289.0 89.4,311.0 93.5,289.0 97.6,311.0 101.7,289.0 105.8,311.0 109.9,289.0 120.0,300.0" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round"/>
    <rect x="120" y="280" width="40" height="40" rx="4" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="2"/>
    <text x="140.0" y="305.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">m</text>
    <text x="36.0" y="264.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">compressed: x = −A</text>
    <line x1="160.0" y1="270.0" x2="205.0" y2="270.0" stroke="#dc2626" stroke-width="3" marker-end="url(#arR)"/>
    <text x="36.0" y="346.0" font-size="12" text-anchor="start" fill="#dc2626">F = +kA  (points right)</text>
    <text x="324.0" y="292.0" font-size="12" text-anchor="end" fill="#6b7280">PE</text>
    <rect x="330" y="282" width="80" height="12" fill="#dc2626" fill-opacity="0.6"/>
    <rect x="330" y="282" width="80" height="12" fill="none" stroke="#d1d5db"/>
    <text x="324.0" y="314.0" font-size="12" text-anchor="end" fill="#6b7280">KE</text>
    <rect x="330" y="304" width="80" height="12" fill="none" stroke="#d1d5db"/>
    <text x="30.0" y="372.0" font-size="14" text-anchor="start" fill="#111827" font-weight="bold">Hooke's law: F = −kx</text>
    <text x="430.0" y="372.0" font-size="14" text-anchor="end" fill="#111827" font-weight="bold">Spring energy: U = ½kx²</text>
    <text x="220.0" y="400.0" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">T = 2π√(m/k):  heavier → slower, stiffer → faster</text>
  </g>
</svg>
